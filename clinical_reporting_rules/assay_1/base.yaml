rule_set:
  name: Demo DNA assay base report text
  version: 1
  analyte: dna
  asp_id: assay_1
  subpanel_id: base

document_rules:
  - rule_id: assay_1_report_introduction
    family: result_text
    section: Report introduction
    priority: 10
    when: []
    template: "{{ aspc.reporting.general_report_summary | dna_report_intro(sample, asp, applied_gene_lists) }}"
    heading: false
    stop: false

analyses:
  SNV:
    enabled: true
    rules:
      - rule_id: assay_1_tiered_snv_summary
        family: result_text
        section: Reportable SNVs and small INDELs
        priority: 90
        when:
          - fact: aggregates.has_tiered_snvs
            operator: eq
            value: true
        template: "{{ aggregates.tier_summaries | tier_summary }}"
        heading: true
        stop: false
      - rule_id: assay_1_no_somatic_snv
        family: result_text
        section: Reportable SNVs and small INDELs
        priority: 100
        when:
          - fact: aggregates.has_tiered_snvs
            operator: eq
            value: false
        template: "No reportable somatic mutations were detected in the analyzed genes."
        heading: true
        stop: false
  CNV: { enabled: false }
  TRANSLOCATION: { enabled: false }
  BIOMARKER: { enabled: false }
  CNV_PROFILE: { enabled: false }
  COVERAGE: { enabled: false }
  FUSION: { enabled: false }
  TMB: { enabled: false }
  PGX: { enabled: false }
