schema_version: 2
rule_set:
  rule_set_id: old_coyote_dna_reporting
  version: "0.1.0-draft"
  title: Established pre-migration DNA reporting wording
  status: draft
  language: sv
  scope:
    analyte: dna
    assay_ids: []
    assay_groups: []
    subpanel_ids: []
    environments: []
  provenance:
    authority: old_coyote
    reference: .design/old_coyote.py
    revision: archived-reference
    content_sha256: 4cfa49e808974c3965fc74ff987a875c3d2e5fd165c654727e341d9dcf3b4c53
    text_policy: verbatim
  validation:
    approval_status: pending
    approval_reference:
    golden_case_ids:
      - old-coyote-dna-no-snv
      - old-coyote-dna-unaccredited-conclusion
  required_facts:
    - aggregates.has_tiered_snvs
    - asp.accredited
  notes: >-
    Verbatim clauses used by assays that remain represented only by the
    archived Coyote implementation. This source cannot be activated until each
    assay identifier and its exact introduction, panel name, control material,
    germline scope, and aggregate finding composition are mapped to typed facts.
rules:
  - rule_id: old_coyote_dna_tiered_snv_summary
    family: result_text
    section: Kliniskt relevanta SNVs och små INDELs
    priority: 90
    description: Established old-Coyote tier composition with grouped genes and VAF values.
    source_locator: .design/old_coyote.py:2468-2573
    when:
      - fact: aggregates.has_tiered_snvs
        operator: eq
        value: true
    template: |-
      {{ aggregates.tier_summaries | tier_summary({
        "first_prefix": "Vid analysen finner man ",
        "next_prefix": "Vidare ses ",
        "final_prefix": "Slutligen ses ",
        "number_gender": "n",
        "finding_singular": "variant",
        "finding_plural_suffix": "er",
        "tier_labels": {
          "1": " av stark klinisk signifikans (Tier I)",
          "2": " av potentiell klinisk signifikans (Tier II)",
          "3": " av oklar klinisk signifikans (Tier III)"
        },
        "single_gene_prefix": " i ",
        "multiple_gene_prefix": ": ",
        "gene_count_joiner": " i ",
        "value_open": " (",
        "value_close": ")",
        "read_context_prefix": "i ",
        "read_context_suffix": " av läsningarna",
        "multiple_gene_read_prefix_tiers": [1],
        "respectively": "respektive",
        "gene_joiner": "och",
        "sentence_suffix": ". ",
        "single_gene_always_read_context": false
      }) }}
    heading: true
    stop: false

  - rule_id: old_coyote_dna_no_somatic_snv
    family: result_text
    section: Kliniskt relevanta SNVs och små INDELs
    priority: 100
    description: Established old-Coyote negative-result sentence.
    source_locator: .design/old_coyote.py:2576
    when:
      - fact: aggregates.has_tiered_snvs
        operator: eq
        value: false
    template: |-
      Vid analysen har inga somatiskt förvärvade varianter i undersökta gener påvisats.
    heading: true
    stop: false

  - rule_id: old_coyote_dna_unaccredited_conclusion
    family: summary_text
    section: Report conclusion
    priority: 100
    description: Established old-Coyote conclusion for a non-accredited assay.
    source_locator: .design/old_coyote.py:2585
    when:
      - fact: asp.accredited
        operator: eq
        value: false
    template: |-
      För ytterligare information om utförd analys och beskrivning av somatiskt förvärvade varianter, var god se bifogad rapport. Analysen omfattas inte av ackrediteringen.
    heading: false
    stop: true

  - rule_id: old_coyote_dna_accredited_conclusion
    family: summary_text
    section: Report conclusion
    priority: 200
    description: Established old-Coyote conclusion for an accredited assay.
    source_locator: .design/old_coyote.py:2585
    when:
      - fact: asp.accredited
        operator: eq
        value: true
    template: "För ytterligare information om utförd analys och beskrivning av somatiskt förvärvade varianter, var god se bifogad rapport.\x20"
    heading: false
    stop: true
deferred_rules:
  - rule_id: old_coyote_myeloid_gmsv1_introduction
    description: Established introduction for the myeloid GMSv1 group without selected gene lists.
    source_locator: .design/old_coyote.py:2460-2462
    template: |-
      DNA har extraherats från insänt prov och analyserats med massivt parallell sekvensering (MPS, även kallat NGS). Sekvensanalysen omfattar exoner i 191 gener som inkluderas i {{ panel_name }} sekvenseringspanel. Analysen avser somatiska varianter (hudbiopsi har använts som kontrollmaterial). För CEBPA undersöks även konstitutionella varianter.
    required_fact_contract:
      - authoritative panel display name
      - exact current ASP or ASPC identity corresponding to old group myeloid_GMSv1
      - absence of selected gene lists
    activation_note: Map the archived group identity to current ASP/ASPC keys without guessing.

  - rule_id: old_coyote_solid_gmsv3_introduction
    description: Established introduction for the solid GMSv3 group without selected gene lists.
    source_locator: .design/old_coyote.py:2462-2464
    template: |-
      DNA har extraherats från insänt prov och analyserats med massivt parallell sekvensering (MPS, även kallat NGS). Sekvensanalysen omfattar exoner i 560 gener som inkluderas i {{ panel_name }} sekvenseringspanel. Analysen avser somatiska varianter (blodprov har använts som kontrollmaterial). För BRCA1 och BRCA2 undersöks även konstitutionella varianter.
    required_fact_contract:
      - authoritative panel display name
      - exact current ASP or ASPC identity corresponding to old group solid_GMSv3
      - absence of selected gene lists
    activation_note: Map the archived group identity to current ASP/ASPC keys without guessing.

  - rule_id: old_coyote_trusight_myeloid_fallback_introduction
    description: Established fallback introduction for the original myeloid assay.
    source_locator: .design/old_coyote.py:2465
    template: |-
      DNA har extraherats från insänt prov och analyserats med massivt parallell sekvensering (MPS, även kallat NGS). Sekvensanalysen omfattar exoner och hotspot-regioner i 54 gener som inkluderas i Illuminas TruSight Myeloid sekvenseringspanel. Analysen avser somatiska varianter (hudbiopsi har använts som kontrollmaterial). För CEBPA undersöks även konstitutionella varianter.
    required_fact_contract:
      - exact current ASP identity corresponding to the archived fallback
      - absence of selected gene lists
    activation_note: Do not use this as a generic fallback; bind it only to the identified assay.

  - rule_id: old_coyote_tumwgs_summary
    description: Established TumWGS report summary.
    source_locator: .design/old_coyote.py:2409
    template: |-
      DNA har extraherats från insänt prov och analyserats med massivt parallell sekvensering (MPS, även kallat NGS). Sekvensanalysen omfattar hela genomet (WGS; whole genome sequencing) med indikationsspecifik analys av somatiska varianter (SNVs, indels, amplifieringar, homozygota deletioner samt större alleliska obalanser (förlust och överskott av genetiskt material). Korresponderande normalprov har använts som kontrollmaterial.

      För ytterligare information om utförd analys och beskrivning av somatiskt förvärvade varianter, var god se bifogad rapport. Analysen omfattas inte av ackrediteringen.
    required_fact_contract:
      - exact current ASP identity corresponding to archived assay tumwgs
    activation_note: Confirm the current TumWGS ASP identifier and report-section contract.
