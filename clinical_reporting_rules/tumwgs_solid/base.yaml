rule_set:
  name: TumWGS Solid base report text
  version: 1
  analyte: dna
  asp_id: tumwgs_solid
  subpanel_id: base
document_rules: []
analyses:
  SNV:
    enabled: true
    rules:
      - rule_id: tumwgs_solid_report_summary
        family: result_text
        section: Report summary
        priority: 100
        when: []
        template: |-
          DNA har extraherats från insänt prov och analyserats med massivt parallell sekvensering (MPS, även kallat NGS). Sekvensanalysen omfattar hela genomet (WGS; whole genome sequencing) med indikationsspecifik analys av somatiska mutationer (SNVs, indels, amplifieringar, homozygota deletioner samt större alleliska obalanser (förlust och överskott av genetiskt material). Korresponderande normalprov har använts som kontrollmaterial.

          För ytterligare information om utförd analys och beskrivning av somatiskt förvärvade mutationer, var god se bifogad rapport. Analysen omfattas inte av ackrediteringen.
        heading: false
        stop: true
  CNV: { enabled: false }
  TRANSLOCATION: { enabled: false }
  BIOMARKER: { enabled: false }
  CNV_PROFILE: { enabled: false }
  COVERAGE: { enabled: false }
  FUSION: { enabled: false }
  TMB: { enabled: false }
  PGX: { enabled: false }
