schema_version: 2
rule_set:
  rule_set_id: old_coyote_rna_reporting
  version: "0.1.0-draft"
  title: Established pre-migration RNA reporting wording
  status: draft
  language: sv
  scope:
    analyte: rna
    assay_ids:
      - fusion
      - fusionrna
      - fusionrnapanel
    assay_groups: []
    subpanel_ids: []
    environments: []
  provenance:
    authority: old_coyote
    reference: .design/old_coyote.py
    revision: archived-reference
    content_sha256: 4cfa49e808974c3965fc74ff987a875c3d2e5fd165c654727e341d9dcf3b4c53
    text_policy: verbatim
  validation:
    approval_status: pending
    approval_reference:
    golden_case_ids:
      - old-coyote-rna-fusion
      - old-coyote-rna-fusionrna
      - old-coyote-rna-fusionrnapanel
  required_facts:
    - sample.assay
  notes: >-
    Verbatim full RNA summary strings from the archived Coyote implementation.
    The source remains draft until current ASP identifiers and report-section
    behavior are confirmed.
rules:
  - rule_id: old_coyote_rna_whole_transcriptome
    family: result_text
    section: Report summary
    priority: 100
    description: Established whole-transcriptome fusion summary.
    source_locator: .design/old_coyote.py:2400
    when:
      - fact: sample.assay
        operator: eq
        value: fusion
    template: |-
      RNA har extraherats från insänt prov och analyserats med massivt parallell sekvensering (MPS, även kallat NGS). Sekvensanalysen omfattar hela mRNA transkriptomet och avser detektion av fusionsgener.

      För ytterligare information om utförd analys och beskrivning av eventuellt funna fusionsgener, var god se bifogad rapport. RNA-seq-analys har gjorts som led i ett utvecklingsarbete och har ej debiterats. Analysen omfattas inte av ackrediteringen.
    heading: false
    stop: true

  - rule_id: old_coyote_rna_known_solid_fusions
    family: result_text
    section: Report summary
    priority: 200
    description: Established solid-tumor known-fusion summary.
    source_locator: .design/old_coyote.py:2403
    when:
      - fact: sample.assay
        operator: eq
        value: fusionrna
    template: |-
      RNA har extraherats från insänt prov och analyserats med massivt parallell sekvensering (MPS, även kallat NGS). Sekvensanalysen omfattar kända fusionsgener vid solid tumörsjukdom, se Analysbeskrivning nedan.

      För ytterligare information om utförd analys och beskrivning av eventuellt funna fusionsgener, var god se bifogad rapport. Analysen omfattas inte av ackrediteringen.
    heading: false
    stop: true

  - rule_id: old_coyote_rna_panel
    family: result_text
    section: Report summary
    priority: 300
    description: Established 160-gene RNA fusion-panel summary.
    source_locator: .design/old_coyote.py:2406
    when:
      - fact: sample.assay
        operator: eq
        value: fusionrnapanel
    template: |-
      RNA har extraherats från insänt prov och analyserats med massivt parallell sekvensering (MPS, även kallat NGS). Sekvensanalysen omfattar 160 kända fusionsgener vid solid tumörsjukdom som inkluderas i RNA fusionspanel (Twist Alliance CeGaT RNA Fusion Panel).

      För ytterligare information om utförd analys och beskrivning av eventuellt funna fusionsgener, var god se bifogad rapport. Analysen omfattas inte av ackrediteringen.
    heading: false
    stop: true
