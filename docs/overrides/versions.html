<div class="rst-versions" role="note" aria-label="Application version and page navigation">
  <div class="rst-current-version docs-sidebar-footer">
    <strong class="docs-sidebar-version">Coyote3 {{ config.extra.app_version | e }}</strong>
    <div class="docs-sidebar-page-links">
      {% if config.repo_url %}
        <a href="{{ config.repo_url }}">{{ config.repo_name or 'Repository' }}</a>
      {% endif %}
      {% if page and page.previous_page %}
        <a href="{{ page.previous_page.url|url }}">&laquo; {% trans %}Previous{% endtrans %}</a>
      {% endif %}
      {% if page and page.next_page %}
        <a href="{{ page.next_page.url|url }}">{% trans %}Next{% endtrans %} &raquo;</a>
      {% endif %}
    </div>
  </div>
</div>
