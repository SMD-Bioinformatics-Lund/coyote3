<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="972" viewBox="0 0 1360 972" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">How an ingested sample acquires its review configuration</title>
  <desc id="figure-description">Configuration resolution, stored filter state, and data availability are separate decisions. A ready bundle does not mean every analysis is present. Resetting filters is an explicit user operation.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <path d="M4 6c0-4 16-4 16 0s-16 4-16 0Zm0 0v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0" class="glyph" />
    </symbol>
    <symbol id="icon-filter" viewBox="0 0 24 24">
      <path d="M2 3h20l-8 9v7l-4 3V12Z" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
    <symbol id="icon-microscope" viewBox="0 0 24 24">
      <path d="m7 2 7 3-3 7-7-3ZM13 9c10 2 7 12-1 12H3M7 21v-4h8M2 14h10M11 3l2-2 4 2-2 3" class="glyph" />
    </symbol>
    <symbol id="icon-sample" viewBox="0 0 24 24">
      <path d="M8 2h8M9 2v7l-5 10c-1 2 0 3 2 3h12c2 0 3-1 2-3L15 9V2M7 15h10M9 18h.01M14 19h.01" class="glyph" />
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6" class="glyph" />
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6Z" class="glyph" />
      <path d="m8 12 3 3 5-6" class="glyph" />
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <path d="M16 6a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM3 22v-3c0-8 18-8 18 0v3" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">How an ingested sample acquires its review configuration</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Configuration resolution, stored filter state, and data availability are separate decisions. A ready bundle does not mean every analysis is present. Resetting filters is</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">an explicit user operation.</text>
  <g class="connections">
    <path d="M275 173H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 173H1085" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M1155 173 L1288 173Q1310 173 1310 195 L1310 388Q1310 410 1288 410 L1129.5 410Q1120 410 1120 419.5 L1120 429" data-source="2" data-target="5" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M1085 464H715" data-source="5" data-target="4" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M645 464H275" data-source="4" data-target="3" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M275 464 L408 464Q430 464 430 486 L430 679Q430 701 408 701 L249.5 701Q240 701 240 710.5 L240 720" data-source="3" data-target="6" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M275 755H645" data-source="6" data-target="7" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 755H1085" data-source="7" data-target="8" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
  </g>
  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="328" class="entity blue">
    <title>Manifest identity</title>
    <use href="#icon-user" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <text x="240" y="229" text-anchor="middle" class="entity-title">Manifest identity</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">Sample name and asp_category</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">asp_family matches the release</text>
    <text x="240" y="290" text-anchor="middle" class="entity-detail">asp_id + requested diagnosis</text>
    <text x="240" y="308" text-anchor="middle" class="entity-detail">Target environment and input files</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="328" class="entity blue">
    <title>Assay and group checks</title>
    <use href="#icon-sample" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <text x="680" y="229" text-anchor="middle" class="entity-title">Assay and group checks</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">Resolve active ASP and parent</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">group</text>
    <text x="680" y="290" text-anchor="middle" class="entity-detail">Validate declared / required files</text>
    <text x="680" y="308" text-anchor="middle" class="entity-detail">Check allowed sample modality</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="346" class="entity purple">
    <title>Resolve active ASPC</title>
    <use href="#icon-settings" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="229" text-anchor="middle" class="entity-title">Resolve active ASPC</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">Exact</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">assay/diagnosis/environment</text>
    <text x="1120" y="290" text-anchor="middle" class="entity-detail">Permitted fallback to assay Base</text>
    <text x="1120" y="308" text-anchor="middle" class="entity-detail">Missing configuration blocks</text>
    <text x="1120" y="326" text-anchor="middle" class="entity-detail">ingest</text>
  </g>
  <g data-node="3" data-left="80" data-top="430" data-right="400" data-bottom="619" class="entity teal">
    <title>Persist sample + findings</title>
    <use href="#icon-database" x="211" y="435" width="58" height="58" aria-hidden="true" />
    <text x="240" y="520" text-anchor="middle" class="entity-title">Persist sample + findings</text>
    <text x="240" y="545" text-anchor="middle" class="entity-detail">One clinical ingest transaction</text>
    <text x="240" y="563" text-anchor="middle" class="entity-detail">Dependent evidence links to sample</text>
    <text x="240" y="581" text-anchor="middle" class="entity-detail">Ready only after successful</text>
    <text x="240" y="599" text-anchor="middle" class="entity-detail">commit</text>
  </g>
  <g data-node="4" data-left="520" data-top="430" data-right="840" data-bottom="601" class="entity purple">
    <title>Record configuration</title>
    <use href="#icon-settings" x="651" y="435" width="58" height="58" aria-hidden="true" />
    <text x="680" y="520" text-anchor="middle" class="entity-title">Bind exact release</text>
    <text x="680" y="545" text-anchor="middle" class="entity-detail">One pointer: current_aspc_id</text>
    <text x="680" y="563" text-anchor="middle" class="entity-detail">Context comes from pinned resources</text>
    <text x="680" y="581" text-anchor="middle" class="entity-detail">Compare diagnoses for Base warning</text>
  </g>
  <g data-node="5" data-left="960" data-top="430" data-right="1280" data-bottom="637" class="entity purple">
    <title>Initialize sample filters</title>
    <use href="#icon-filter" x="1091" y="435" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="520" text-anchor="middle" class="entity-title">Initialize sample filters</text>
    <text x="1120" y="545" text-anchor="middle" class="entity-detail">New sample → pinned ASPC defaults</text>
    <text x="1120" y="563" text-anchor="middle" class="entity-detail">Input manifests cannot override</text>
    <text x="1120" y="581" text-anchor="middle" class="entity-detail">the release or initial filters</text>
    <text x="1120" y="599" text-anchor="middle" class="entity-detail">Selections separated by</text>
    <text x="1120" y="617" text-anchor="middle" class="entity-detail">domain/intent</text>
  </g>
  <g data-node="6" data-left="80" data-top="721" data-right="400" data-bottom="928" class="entity blue">
    <title>Review authorization</title>
    <use href="#icon-shield" x="211" y="726" width="58" height="58" aria-hidden="true" />
    <text x="240" y="811" text-anchor="middle" class="entity-title">Review authorization</text>
    <text x="240" y="836" text-anchor="middle" class="entity-detail">User permission and resource</text>
    <text x="240" y="854" text-anchor="middle" class="entity-detail">scope</text>
    <text x="240" y="872" text-anchor="middle" class="entity-detail">Module availability</text>
    <text x="240" y="890" text-anchor="middle" class="entity-detail">Check before exposing clinical</text>
    <text x="240" y="908" text-anchor="middle" class="entity-detail">data</text>
  </g>
  <g data-node="7" data-left="520" data-top="721" data-right="840" data-bottom="892" class="entity blue">
    <title>Analysis availability</title>
    <use href="#icon-layers" x="651" y="726" width="58" height="58" aria-hidden="true" />
    <text x="680" y="811" text-anchor="middle" class="entity-title">Analysis availability</text>
    <text x="680" y="836" text-anchor="middle" class="entity-detail">Recorded ASPC enables analysis</text>
    <text x="680" y="854" text-anchor="middle" class="entity-detail">Sample has matching ingested data</text>
    <text x="680" y="872" text-anchor="middle" class="entity-detail">Modality and intent must match</text>
  </g>
  <g data-node="8" data-left="960" data-top="721" data-right="1280" data-bottom="928" class="entity purple">
    <title>Effective review state</title>
    <use href="#icon-microscope" x="1091" y="726" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="811" text-anchor="middle" class="entity-title">Effective review state</text>
    <text x="1120" y="836" text-anchor="middle" class="entity-detail">Sample filters + pinned assay</text>
    <text x="1120" y="854" text-anchor="middle" class="entity-detail">eligibility + compiled query rules</text>
    <text x="1120" y="872" text-anchor="middle" class="entity-detail">Pinned ISGLs + ad-hoc genes</text>
    <text x="1120" y="890" text-anchor="middle" class="entity-detail">Report saves configuration</text>
    <text x="1120" y="908" text-anchor="middle" class="entity-detail">provenance</text>
  </g>
  <g data-edge="0" class="relationship blue">
    <text x="460" y="156" text-anchor="middle" class="edge-label">validate</text>
  </g>
  <g data-edge="1" class="relationship purple">
    <text x="900" y="156" text-anchor="middle" class="edge-label">resolve</text>
  </g>
  <g data-edge="2" class="relationship purple">
    <text x="1215" y="402" text-anchor="middle" class="edge-label">seed</text>
  </g>
  <g data-edge="3" class="relationship purple">
    <text x="900" y="447" text-anchor="middle" class="edge-label">record</text>
  </g>
  <g data-edge="4" class="relationship teal">
    <text x="460" y="447" text-anchor="middle" class="edge-label">commit</text>
  </g>
  <g data-edge="5" class="relationship blue">
    <text x="335" y="693" text-anchor="middle" class="edge-label">open</text>
  </g>
  <g data-edge="6" class="relationship blue">
    <text x="460" y="738" text-anchor="middle" class="edge-label">gate</text>
  </g>
  <g data-edge="7" class="relationship purple">
    <text x="900" y="738" text-anchor="middle" class="edge-label">review</text>
  </g>
</svg>
