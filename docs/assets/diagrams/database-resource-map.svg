<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1280" viewBox="0 0 1360 1280" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Storage ownership by resource family</title>
  <desc id="figure-description">Arrows show repository access to logical services, not cross-database transactions. Collection names are application-owned. See collections.toml and the generated MongoDB collection contracts.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <path d="M17 9a7 7 0 1 1-14 0 7 7 0 0 1 14 0ZM15 15l7 7" class="glyph" />
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6Z" class="glyph" />
      <path d="m8 12 3 3 5-6" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Storage ownership by resource family</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Arrows show repository access to logical services, not cross-database transactions. Collection names are application-owned. See collections.toml and the generated MongoDB</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">collection contracts.</text>
  <g class="connections">
    <path d="M715 173 L1288 173Q1310 173 1310 195 L1310 362Q1310 384 1288 384 L469.5 384Q460 384 460 393.5 L460 403" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 173 L1288 173Q1310 173 1310 195 L1310 334Q1310 356 1288 356 L1142 356Q1120 356 1120 378 L1120 403" data-source="0" data-target="2" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M680 139 L680 131Q680 123 688 123 L1301 123Q1323 123 1323 145 L1323 771Q1323 793 1301 793 L249.5 793Q240 793 240 802.5 L240 812" data-source="0" data-target="3" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M680 139 L680 131Q680 123 688 123 L1295 123Q1317 123 1317 145 L1317 743Q1317 765 1295 765 L922 765Q900 765 900 787 L900 812" data-source="0" data-target="4" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
  </g>
  <g data-node="0" data-left="80" data-top="139" data-right="1280" data-bottom="292" class="entity blue">
    <title>Application repositories</title>
    <use href="#icon-layers" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <text x="680" y="229" text-anchor="middle" class="entity-title">Application repositories</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">Explicit primary, identity, knowledgebase and BAM</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">service connections</text>
  </g>
  <g data-node="1" data-left="80" data-top="404" data-right="840" data-bottom="701" class="entity blue">
    <title>Primary · clinical resources</title>
    <use href="#icon-layers" x="431" y="409" width="58" height="58" aria-hidden="true" />
    <text x="460" y="494" text-anchor="middle" class="entity-title">Primary · clinical resources</text>
    <text x="460" y="519" text-anchor="middle" class="entity-detail">Assays, groups, diagnoses and associations</text>
    <text x="460" y="537" text-anchor="middle" class="entity-detail">ASPCs, ISGLs, assay setups and setup revisions</text>
    <text x="460" y="555" text-anchor="middle" class="entity-detail">Clinical rule sets and revision history</text>
    <text x="460" y="573" text-anchor="middle" class="entity-detail">Public catalog, versions and revisions</text>
    <text x="460" y="591" text-anchor="middle" class="entity-detail">Samples and ingest jobs</text>
    <text x="460" y="609" text-anchor="middle" class="entity-detail">Variants, VEP annotations, CNVs, translocations</text>
    <text x="460" y="627" text-anchor="middle" class="entity-detail">Fusions, biomarkers, PGx, coverage and group coverage</text>
    <text x="460" y="645" text-anchor="middle" class="entity-detail">RNA expression, QC and classification</text>
    <text x="460" y="663" text-anchor="middle" class="entity-detail">Annotations, blacklist, sample / finding comments</text>
    <text x="460" y="681" text-anchor="middle" class="entity-detail">Reports, reported findings and notifications</text>
  </g>
  <g data-node="2" data-left="960" data-top="404" data-right="1280" data-bottom="593" class="entity blue">
    <title>Identity · access and audit</title>
    <use href="#icon-shield" x="1091" y="409" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="494" text-anchor="middle" class="entity-title">Identity · access and audit</text>
    <text x="1120" y="519" text-anchor="middle" class="entity-detail">Users, roles and permission</text>
    <text x="1120" y="537" text-anchor="middle" class="entity-detail">catalog</text>
    <text x="1120" y="555" text-anchor="middle" class="entity-detail">API sessions</text>
    <text x="1120" y="573" text-anchor="middle" class="entity-detail">Audit events</text>
  </g>
  <g data-node="3" data-left="80" data-top="813" data-right="400" data-bottom="966" class="entity blue">
    <title>BAM · service records</title>
    <use href="#icon-layers" x="211" y="818" width="58" height="58" aria-hidden="true" />
    <text x="240" y="903" text-anchor="middle" class="entity-title">BAM · service records</text>
    <text x="240" y="928" text-anchor="middle" class="entity-detail">BAM sample records</text>
    <text x="240" y="946" text-anchor="middle" class="entity-detail">Independent URI and database name</text>
  </g>
  <g data-node="4" data-left="520" data-top="813" data-right="1280" data-bottom="1236" class="entity teal">
    <title>Knowledgebase · reference datasets</title>
    <use href="#icon-search" x="871" y="818" width="58" height="58" aria-hidden="true" />
    <text x="900" y="903" text-anchor="middle" class="entity-title">Knowledgebase · reference datasets</text>
    <text x="900" y="928" text-anchor="middle" class="entity-detail">HGNC genes; VEP metadata and consequence diagrams;</text>
    <text x="900" y="946" text-anchor="middle" class="entity-detail">release inventory</text>
    <text x="900" y="964" text-anchor="middle" class="entity-detail">CIViC genes and variants; OncoKB licensed / public</text>
    <text x="900" y="982" text-anchor="middle" class="entity-detail">datasets; ClinPGx public</text>
    <text x="900" y="1000" text-anchor="middle" class="entity-detail">genes</text>
    <text x="900" y="1018" text-anchor="middle" class="entity-detail">BRCA Exchange; IARC TP53; HPA expression</text>
    <text x="900" y="1036" text-anchor="middle" class="entity-detail">COSMIC: coding / noncoding variants, targeted</text>
    <text x="900" y="1054" text-anchor="middle" class="entity-detail">variants, breakpoints and</text>
    <text x="900" y="1072" text-anchor="middle" class="entity-detail">structural variants</text>
    <text x="900" y="1090" text-anchor="middle" class="entity-detail">Copy number, fusions, expression, methylation,</text>
    <text x="900" y="1108" text-anchor="middle" class="entity-detail">classifications and supporting</text>
    <text x="900" y="1126" text-anchor="middle" class="entity-detail">papers</text>
    <text x="900" y="1144" text-anchor="middle" class="entity-detail">Cancer gene census / hallmarks, genes / transcripts,</text>
    <text x="900" y="1162" text-anchor="middle" class="entity-detail">mutant census, resistance</text>
    <text x="900" y="1180" text-anchor="middle" class="entity-detail">mutations</text>
    <text x="900" y="1198" text-anchor="middle" class="entity-detail">Mutation census, SBS / DBS / SV signatures, and</text>
    <text x="900" y="1216" text-anchor="middle" class="entity-detail">actionability</text>
  </g>
  <g data-edge="0" class="relationship blue">
    <text x="885" y="376" text-anchor="middle" class="edge-label">primary</text>
  </g>
  <g data-edge="1" class="relationship blue">
    <text x="1215" y="348" text-anchor="middle" class="edge-label">identity</text>
  </g>
  <g data-edge="2" class="relationship blue">
    <text x="781.5" y="785" text-anchor="middle" class="edge-label">bam</text>
  </g>
  <g data-edge="3" class="relationship teal">
    <text x="1108.5" y="757" text-anchor="middle" class="edge-label">knowledgebase</text>
  </g>
</svg>
