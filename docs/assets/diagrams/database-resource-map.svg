    <text x="1120" y="537" text-anchor="middle" class="entity-detail">catalog</text>
    <text x="1120" y="555" text-anchor="middle" class="entity-detail">API sessions</text>
    <text x="1120" y="573" text-anchor="middle" class="entity-detail">Audit events</text>
