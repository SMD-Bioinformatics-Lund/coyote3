    <text x="900" y="928" text-anchor="middle" class="entity-detail">HGNC genes; VEP metadata and consequence diagrams;</text>
    <text x="900" y="946" text-anchor="middle" class="entity-detail">release inventory</text>
    <text x="900" y="964" text-anchor="middle" class="entity-detail">CIViC genes and variants; OncoKB licensed / public</text>
    <text x="900" y="982" text-anchor="middle" class="entity-detail">datasets; ClinPGx public</text>
    <text x="900" y="1000" text-anchor="middle" class="entity-detail">genes</text>
    <text x="900" y="1018" text-anchor="middle" class="entity-detail">BRCA Exchange; IARC TP53; HPA expression</text>
    <text x="900" y="1036" text-anchor="middle" class="entity-detail">COSMIC: coding / noncoding variants, targeted</text>
    <text x="900" y="1054" text-anchor="middle" class="entity-detail">variants, breakpoints and</text>
    <text x="900" y="1072" text-anchor="middle" class="entity-detail">structural variants</text>
    <text x="900" y="1090" text-anchor="middle" class="entity-detail">Copy number, fusions, expression, methylation,</text>
    <text x="900" y="1108" text-anchor="middle" class="entity-detail">classifications and supporting</text>
    <text x="900" y="1126" text-anchor="middle" class="entity-detail">papers</text>
