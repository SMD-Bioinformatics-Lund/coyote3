    <text x="900" y="1162" text-anchor="middle" class="entity-detail">mutant census, resistance</text>
    <text x="900" y="1180" text-anchor="middle" class="entity-detail">mutations</text>
    <text x="900" y="1198" text-anchor="middle" class="entity-detail">Mutation census, SBS / DBS / SV signatures, and</text>
