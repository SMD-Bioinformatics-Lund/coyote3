    <title>Application repositories</title>
    <use href="#icon-layers" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <text x="680" y="229" text-anchor="middle" class="entity-title">Application repositories</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">Explicit primary, identity, knowledgebase and BAM</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">service connections</text>
  </g>
  <g data-node="1" data-left="80" data-top="404" data-right="840" data-bottom="701" class="entity blue">
    <title>Primary · clinical resources</title>
    <use href="#icon-layers" x="431" y="409" width="58" height="58" aria-hidden="true" />
    <text x="460" y="494" text-anchor="middle" class="entity-title">Primary · clinical resources</text>
    <text x="460" y="519" text-anchor="middle" class="entity-detail">Assays, groups, subpanels and associations</text>
    <text x="460" y="537" text-anchor="middle" class="entity-detail">ASPCs, ISGLs, assay setups and setup revisions</text>
    <text x="460" y="555" text-anchor="middle" class="entity-detail">Clinical rule sets and revision history</text>
    <text x="460" y="573" text-anchor="middle" class="entity-detail">Public catalog, versions and revisions</text>
    <text x="460" y="591" text-anchor="middle" class="entity-detail">Samples and ingest jobs</text>
    <text x="460" y="609" text-anchor="middle" class="entity-detail">Variants, VEP annotations, CNVs, translocations</text>
    <text x="460" y="627" text-anchor="middle" class="entity-detail">Fusions, biomarkers, PGx, coverage and group coverage</text>
    <text x="460" y="645" text-anchor="middle" class="entity-detail">RNA expression, QC and classification</text>
    <text x="460" y="663" text-anchor="middle" class="entity-detail">Annotations, blacklist, sample / finding comments</text>
    <text x="460" y="681" text-anchor="middle" class="entity-detail">Reports, reported findings and notifications</text>
  </g>
