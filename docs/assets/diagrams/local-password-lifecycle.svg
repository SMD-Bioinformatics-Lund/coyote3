  <text x="40" y="34" text-anchor="start" class="figure-title">Local account invitation and password recovery</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Administrative invitation and anonymous recovery have different disclosure rules. Local login verifies the stored password hash. LDAP login continues through directory</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">authentication.</text>
  <g class="connections">
    <path d="M275 237C460 225 460 249 645 237" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M240 203 L240 180Q240 158 262 158 L1098 158Q1120 158 1120 180 L1120 203" data-source="0" data-target="2" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M275 482C460 470 460 494 645 482" data-source="3" data-target="4" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M240 448 L240 433Q240 418 255 418 L1105 418Q1120 418 1120 433 L1120 448" data-source="3" data-target="5" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
  </g>
  <g data-node="0" data-left="80" data-top="203" data-right="400" data-bottom="392" class="entity blue">
    <title>Administrator creates user</title>
    <use href="#icon-user" x="211" y="208" width="58" height="58" aria-hidden="true" />
    <text x="240" y="293" text-anchor="middle" class="entity-title">Administrator creates user</text>
    <text x="240" y="318" text-anchor="middle" class="entity-detail">Create authorized local account</text>
    <text x="240" y="336" text-anchor="middle" class="entity-detail">Issue one-time invitation token</text>
    <text x="240" y="354" text-anchor="middle" class="entity-detail">Attempt configured SMTP</text>
    <text x="240" y="372" text-anchor="middle" class="entity-detail">delivery</text>
  </g>
  <g data-node="1" data-left="520" data-top="203" data-right="840" data-bottom="374" class="entity blue">
    <title>Invitation delivered</title>
    <use href="#icon-layers" x="651" y="208" width="58" height="58" aria-hidden="true" />
    <text x="680" y="293" text-anchor="middle" class="entity-title">Invitation delivered</text>
    <text x="680" y="318" text-anchor="middle" class="entity-detail">User receives setup link</text>
    <text x="680" y="336" text-anchor="middle" class="entity-detail">Validate single-use token</text>
    <text x="680" y="354" text-anchor="middle" class="entity-detail">User sets local password</text>
  </g>
  <g data-node="2" data-left="960" data-top="203" data-right="1280" data-bottom="392" class="entity blue">
    <title>SMTP unavailable / failed</title>
    <use href="#icon-layers" x="1091" y="208" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="293" text-anchor="middle" class="entity-title">SMTP unavailable / failed</text>
    <text x="1120" y="318" text-anchor="middle" class="entity-detail">Return warning to administrator</text>
    <text x="1120" y="336" text-anchor="middle" class="entity-detail">Return setup_url for manual</text>
    <text x="1120" y="354" text-anchor="middle" class="entity-detail">sharing</text>
    <text x="1120" y="372" text-anchor="middle" class="entity-detail">Do not expose it anonymously</text>
  </g>
  <g data-node="3" data-left="80" data-top="448" data-right="400" data-bottom="637" class="entity blue">
    <title>User requests password reset</title>
    <use href="#icon-key" x="211" y="453" width="58" height="58" aria-hidden="true" />
    <text x="240" y="538" text-anchor="middle" class="entity-title">User requests password reset</text>
    <text x="240" y="563" text-anchor="middle" class="entity-detail">Local-account recovery request</text>
    <text x="240" y="581" text-anchor="middle" class="entity-detail">Issue eligible one-time reset</text>
    <text x="240" y="599" text-anchor="middle" class="entity-detail">token</text>
    <text x="240" y="617" text-anchor="middle" class="entity-detail">Attempt SMTP delivery</text>
  </g>
  <g data-node="4" data-left="520" data-top="448" data-right="840" data-bottom="637" class="entity blue">
    <title>Neutral acknowledgement</title>
    <use href="#icon-layers" x="651" y="453" width="58" height="58" aria-hidden="true" />
    <text x="680" y="538" text-anchor="middle" class="entity-title">Neutral acknowledgement</text>
    <text x="680" y="563" text-anchor="middle" class="entity-detail">Same response for account</text>
    <text x="680" y="581" text-anchor="middle" class="entity-detail">availability</text>
    <text x="680" y="599" text-anchor="middle" class="entity-detail">No token or setup URL disclosed</text>
    <text x="680" y="617" text-anchor="middle" class="entity-detail">Protect account discovery</text>
  </g>
  <g data-node="5" data-left="960" data-top="448" data-right="1280" data-bottom="637" class="entity blue">
    <title>User follows reset link</title>
    <use href="#icon-user" x="1091" y="453" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="538" text-anchor="middle" class="entity-title">User follows reset link</text>
    <text x="1120" y="563" text-anchor="middle" class="entity-detail">Validate token and allowed purpose</text>
    <text x="1120" y="581" text-anchor="middle" class="entity-detail">Set password and consume token</text>
    <text x="1120" y="599" text-anchor="middle" class="entity-detail">Continue normal local</text>
    <text x="1120" y="617" text-anchor="middle" class="entity-detail">authentication</text>
  </g>
  <g data-edge="0" class="relationship blue">
    <text x="460" y="220" text-anchor="middle" class="edge-label">SMTP OK</text>
  </g>
  <g data-edge="1" class="relationship blue">
    <text x="680" y="149" text-anchor="middle" class="edge-label">SMTP failure</text>
  </g>
  <g data-edge="2" class="relationship blue">
    <text x="460" y="465" text-anchor="middle" class="edge-label">respond</text>
  </g>
  <g data-edge="3" class="relationship blue">
    <text x="680" y="409" text-anchor="middle" class="edge-label">email link when deliverable</text>
  </g>
</svg>
