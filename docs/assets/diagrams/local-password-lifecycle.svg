<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="860" viewBox="0 0 1360 860" role="img" aria-labelledby="title desc">
<title id="title">Local account invitation and password recovery</title>
<desc id="desc">Administrative invitation and anonymous recovery have different disclosure rules. Local login verifies the stored password hash. LDAP login continues through directory authentication.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#302b38}
.heading{font-size:26px;font-weight:700}.subtitle,.note{font-size:16px;fill:#625a6b}
.card rect{fill:#fff;stroke:#cfc6da;stroke-width:1.5}.name{font-size:19px;font-weight:700;fill:#52366d}
.detail{font-size:16px}.edge{fill:none;stroke:#78638d;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
.optional{stroke-dasharray:6 5}.edge-label rect{fill:#faf9fc;stroke:#e7e1ec}.label{font-size:14px;fill:#52366d}</style><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#78638d"/></marker></defs>
<rect width="1360" height="860" rx="12" fill="#faf9fc"/>
<text x="40" y="44" class="heading">Local account invitation and password recovery</text>
<text x="40" y="84" class="subtitle">Administrative invitation and anonymous recovery have different disclosure rules. Local login verifies the stored password hash. LDAP login</text>
<text x="40" y="108" class="subtitle">continues through directory authentication.</text>
<path d="M400 300 L460 300 L460 280 L520 280" class="edge" data-source="0" data-target="1"/>
<path d="M400 300 L460 300 L460 400 L900 400 L900 300 L960 300" class="edge" data-source="0" data-target="2"/>
<path d="M400 640 L460 640 L460 620 L520 620" class="edge" data-source="3" data-target="4"/>
<path d="M400 640 L460 640 L460 760 L900 760 L900 620 L960 620" class="edge" data-source="3" data-target="5"/>
<g class="card" data-node="0"><rect x="80" y="220" width="320" height="180" rx="10"/>
<text x="100" y="254" class="name">Administrator creates user</text>
<text x="100" y="299" class="detail">Create authorized local account</text>
<text x="100" y="322" class="detail">Issue one-time invitation token</text>
<text x="100" y="345" class="detail">Attempt configured SMTP</text>
<text x="100" y="368" class="detail">delivery</text>
</g>
<g class="card" data-node="1"><rect x="520" y="220" width="320" height="140" rx="10"/>
<text x="540" y="254" class="name">Invitation delivered</text>
<text x="540" y="299" class="detail">User receives setup link</text>
<text x="540" y="322" class="detail">Validate single-use token</text>
<text x="540" y="345" class="detail">User sets local password</text>
</g>
<g class="card" data-node="2"><rect x="960" y="220" width="320" height="180" rx="10"/>
<text x="980" y="254" class="name">SMTP unavailable / failed</text>
<text x="980" y="299" class="detail">Return warning to administrator</text>
<text x="980" y="322" class="detail">Return setup_url for manual</text>
<text x="980" y="345" class="detail">sharing</text>
<text x="980" y="368" class="detail">Do not expose it anonymously</text>
</g>
<g class="card" data-node="3"><rect x="80" y="540" width="320" height="200" rx="10"/>
<text x="100" y="574" class="name">User requests password</text>
<text x="100" y="599" class="name">reset</text>
<text x="100" y="644" class="detail">Local-account recovery request</text>
<text x="100" y="667" class="detail">Issue eligible one-time reset</text>
<text x="100" y="690" class="detail">token</text>
<text x="100" y="713" class="detail">Attempt SMTP delivery</text>
</g>
<g class="card" data-node="4"><rect x="520" y="540" width="320" height="180" rx="10"/>
<text x="540" y="574" class="name">Neutral acknowledgement</text>
<text x="540" y="619" class="detail">Same response for account</text>
<text x="540" y="642" class="detail">availability</text>
<text x="540" y="665" class="detail">No token or setup URL disclosed</text>
<text x="540" y="688" class="detail">Protect account discovery</text>
</g>
<g class="card" data-node="5"><rect x="960" y="540" width="320" height="180" rx="10"/>
<text x="980" y="574" class="name">User follows reset link</text>
<text x="980" y="619" class="detail">Validate token and allowed purpose</text>
<text x="980" y="642" class="detail">Set password and consume token</text>
<text x="980" y="665" class="detail">Continue normal local</text>
<text x="980" y="688" class="detail">authentication</text>
</g>
<g class="edge-label"><rect x="413" y="286" width="81" height="28" rx="5"/>
<text x="421" y="304" class="label">SMTP OK</text>
</g>
<g class="edge-label"><rect x="625" y="386" width="109" height="28" rx="5"/>
<text x="633" y="404" class="label">SMTP failure</text>
</g>
<g class="edge-label"><rect x="412" y="626" width="71" height="28" rx="5"/>
<text x="420" y="644" class="label">respond</text>
</g>
<g class="edge-label"><rect x="619" y="737" width="122" height="46" rx="5"/>
<text x="627" y="755" class="label">email link when</text>
<text x="627" y="773" class="label">deliverable</text>
</g>

</svg>
