<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="956" viewBox="0 0 1360 956" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Identity, access, and traceability</title>
  <desc id="figure-description">Identity records grant permissions; user scope constrains the clinical resources those permissions can reach. Authentication, permission checks, and scope checks are distinct. Audit and notifications have different purposes.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-browser" viewBox="0 0 24 24">
      <path d="M2 3h20v17H2ZM2 8h20M5 5.5h.01M8 5.5h.01M6 12l-2 2 2 2M18 12l2 2-2 2M10 17l4-6" class="glyph" />
    </symbol>
    <symbol id="icon-key" viewBox="0 0 24 24">
      <path d="M13 8a5 5 0 1 0-10 0 5 5 0 0 0 10 0ZM12 12l10 10M17 17l3-3M20 20l3-3M6 6h.01" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
    <symbol id="icon-pen" viewBox="0 0 24 24">
      <path d="m3 17 13-13 4 4L7 21l-5 1ZM13 7l4 4M3 17l4 4M15 3l2-2 4 4-2 2" class="glyph" />
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6Z" class="glyph" />
      <path d="m8 12 3 3 5-6" class="glyph" />
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <path d="M16 6a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM3 22v-3c0-8 18-8 18 0v3" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Identity, access, and traceability</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Identity records grant permissions; user scope constrains the clinical resources those permissions can reach. Authentication, permission checks, and scope checks are</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">distinct. Audit and notifications have different purposes.</text>
  <g class="connections">
    <path d="M275 173H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 173H1085" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M275 173 L408 173Q430 173 430 195 L430 426Q430 448 408 448 L249.5 448Q240 448 240 457.5 L240 467" data-source="0" data-target="3" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 173 L848 173Q870 173 870 195 L870 398Q870 420 848 420 L702 420Q680 420 680 442 L680 467" data-source="1" data-target="4" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M1155 173 L1288 173Q1310 173 1310 195 L1310 370Q1310 392 1288 392 L702 392Q680 392 680 414 L680 467" data-source="2" data-target="4" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M275 502H645" data-source="3" data-target="4" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 502H1085" data-source="4" data-target="5" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 502 L848 502Q870 502 870 524 L870 681Q870 703 848 703 L689.5 703Q680 703 680 712.5 L680 722" data-source="4" data-target="7" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M645 757H275" data-source="7" data-target="6" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 757H1085" data-source="7" data-target="8" data-optional="true" marker-end="url(#arrow-blue)" class="connection blue conditional" />
  </g>
  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="310" class="entity blue">
    <title>Authentication provider</title>
    <use href="#icon-layers" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <text x="240" y="229" text-anchor="middle" class="entity-title">Authentication provider</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">Local username / password</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">or LDAP directory authentication</text>
    <text x="240" y="290" text-anchor="middle" class="entity-detail">Provider must be allowed for user</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="328" class="entity blue">
    <title>User account</title>
    <use href="#icon-user" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <text x="680" y="229" text-anchor="middle" class="entity-title">User account</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">users · active account</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">roles[] reference role identities</text>
    <text x="680" y="290" text-anchor="middle" class="entity-detail">asp_ids / asp_groups /</text>
    <text x="680" y="308" text-anchor="middle" class="entity-detail">environments</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="310" class="entity purple">
    <title>Roles and permissions</title>
    <use href="#icon-key" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="229" text-anchor="middle" class="entity-title">Roles and permissions</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">roles.permissions[]</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">Active permissions catalog</text>
    <text x="1120" y="290" text-anchor="middle" class="entity-detail">Application-owned permission IDs</text>
  </g>
  <g data-node="3" data-left="80" data-top="468" data-right="400" data-bottom="639" class="entity blue">
    <title>API session</title>
    <use href="#icon-browser" x="211" y="473" width="58" height="58" aria-hidden="true" />
    <text x="240" y="558" text-anchor="middle" class="entity-title">API session</text>
    <text x="240" y="583" text-anchor="middle" class="entity-detail">api_sessions · identity database</text>
    <text x="240" y="601" text-anchor="middle" class="entity-detail">Browser cookie or bearer context</text>
    <text x="240" y="619" text-anchor="middle" class="entity-detail">Cookie writes require CSRF token</text>
  </g>
  <g data-node="4" data-left="520" data-top="468" data-right="840" data-bottom="639" class="entity blue">
    <title>API authorization</title>
    <use href="#icon-shield" x="651" y="473" width="58" height="58" aria-hidden="true" />
    <text x="680" y="558" text-anchor="middle" class="entity-title">API authorization</text>
    <text x="680" y="583" text-anchor="middle" class="entity-detail">Authenticated principal</text>
    <text x="680" y="601" text-anchor="middle" class="entity-detail">Required permission + user scope</text>
    <text x="680" y="619" text-anchor="middle" class="entity-detail">Explicit superuser handling</text>
  </g>
  <g data-node="5" data-left="960" data-top="468" data-right="1280" data-bottom="639" class="entity blue">
    <title>Protected resource</title>
    <use href="#icon-layers" x="1091" y="473" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="558" text-anchor="middle" class="entity-title">Protected resource</text>
    <text x="1120" y="583" text-anchor="middle" class="entity-detail">Assay / sample / configuration</text>
    <text x="1120" y="601" text-anchor="middle" class="entity-detail">Typed route and service operation</text>
    <text x="1120" y="619" text-anchor="middle" class="entity-detail">UI visibility is not authorization</text>
  </g>
  <g data-node="6" data-left="80" data-top="723" data-right="400" data-bottom="912" class="entity blue">
    <title>Audit events</title>
    <use href="#icon-layers" x="211" y="728" width="58" height="58" aria-hidden="true" />
    <text x="240" y="813" text-anchor="middle" class="entity-title">Audit events</text>
    <text x="240" y="838" text-anchor="middle" class="entity-detail">audit_events · identity database</text>
    <text x="240" y="856" text-anchor="middle" class="entity-detail">Actor, operation, target, outcome</text>
    <text x="240" y="874" text-anchor="middle" class="entity-detail">Clinical / administrative</text>
    <text x="240" y="892" text-anchor="middle" class="entity-detail">traceability</text>
  </g>
  <g data-node="7" data-left="520" data-top="723" data-right="840" data-bottom="894" class="entity purple">
    <title>Change provenance</title>
    <use href="#icon-pen" x="651" y="728" width="58" height="58" aria-hidden="true" />
    <text x="680" y="813" text-anchor="middle" class="entity-title">Change provenance</text>
    <text x="680" y="838" text-anchor="middle" class="entity-detail">Resource actor and revision</text>
    <text x="680" y="856" text-anchor="middle" class="entity-detail">Sample ingestion provenance</text>
    <text x="680" y="874" text-anchor="middle" class="entity-detail">Report configuration snapshots</text>
  </g>
  <g data-node="8" data-left="960" data-top="723" data-right="1280" data-bottom="894" class="entity blue">
    <title>User notifications</title>
    <use href="#icon-user" x="1091" y="728" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="813" text-anchor="middle" class="entity-title">User notifications</text>
    <text x="1120" y="838" text-anchor="middle" class="entity-detail">notifications · primary database</text>
    <text x="1120" y="856" text-anchor="middle" class="entity-detail">Messages addressed to recipients</text>
    <text x="1120" y="874" text-anchor="middle" class="entity-detail">Separate from audit evidence</text>
  </g>
  <g data-edge="0" class="relationship blue">
    <text x="460" y="156" text-anchor="middle" class="edge-label">verifies</text>
  </g>
  <g data-edge="1" class="relationship purple">
    <text x="900" y="156" text-anchor="middle" class="edge-label">assigned</text>
  </g>
  <g data-edge="2" class="relationship blue">
    <text x="335" y="440" text-anchor="middle" class="edge-label">session</text>
  </g>
  <g data-edge="3" class="relationship blue">
    <text x="775" y="412" text-anchor="middle" class="edge-label">scope</text>
  </g>
  <g data-edge="4" class="relationship blue">
    <text x="995" y="384" text-anchor="middle" class="edge-label">permission grants</text>
  </g>
  <g data-edge="5" class="relationship blue">
    <text x="460" y="485" text-anchor="middle" class="edge-label">principal</text>
  </g>
  <g data-edge="6" class="relationship blue">
    <text x="900" y="485" text-anchor="middle" class="edge-label">permits</text>
  </g>
  <g data-edge="7" class="relationship purple">
    <text x="775" y="695" text-anchor="middle" class="edge-label">writes</text>
  </g>
  <g data-edge="8" class="relationship blue">
    <text x="460" y="740" text-anchor="middle" class="edge-label">records</text>
  </g>
  <g data-edge="9" class="relationship blue">
    <text x="900" y="740" text-anchor="middle" class="edge-label">notifies</text>
  </g>
</svg>
