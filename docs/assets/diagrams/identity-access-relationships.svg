    <text x="1120" y="272" text-anchor="middle" class="entity-detail">Active permissions catalog</text>
    <text x="1120" y="290" text-anchor="middle" class="entity-detail">Application-owned permission IDs</text>
  </g>
  <g data-node="3" data-left="80" data-top="468" data-right="400" data-bottom="639" class="entity blue">
