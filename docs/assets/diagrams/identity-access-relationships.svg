    <text x="1120" y="601" text-anchor="middle" class="entity-detail">Typed route and service operation</text>
    <text x="1120" y="619" text-anchor="middle" class="entity-detail">UI visibility is not authorization</text>
  </g>
  <g data-node="6" data-left="80" data-top="723" data-right="400" data-bottom="912" class="entity blue">
