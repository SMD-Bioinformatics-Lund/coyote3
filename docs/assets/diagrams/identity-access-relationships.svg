  <text x="40" y="34" text-anchor="start" class="figure-title">Identity, access, and traceability</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Identity records grant permissions; user scope constrains the clinical resources those permissions can reach. Authentication, permission checks, and scope checks are</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">distinct. Audit and notifications have different purposes.</text>
