<text x="214" y="454" class="label">session</text>
</g>
<g class="edge-label"><rect x="652" y="456" width="56" height="28" rx="5"/>
<text x="660" y="474" class="label">scope</text>
</g>
<g class="edge-label"><rect x="828" y="466" width="144" height="28" rx="5"/>
<text x="836" y="484" class="label">permission grants</text>
</g>
<g class="edge-label"><rect x="422" y="586" width="76" height="28" rx="5"/>
