    <text x="680" y="558" text-anchor="middle" class="entity-title">API authorization</text>
    <text x="680" y="583" text-anchor="middle" class="entity-detail">Authenticated principal</text>
    <text x="680" y="601" text-anchor="middle" class="entity-detail">Required permission + user scope</text>
    <text x="680" y="619" text-anchor="middle" class="entity-detail">Explicit superuser handling</text>
  </g>
