    <text x="680" y="272" text-anchor="middle" class="entity-detail">roles[] reference role identities</text>
    <text x="680" y="290" text-anchor="middle" class="entity-detail">asp_ids / asp_groups /</text>
    <text x="680" y="308" text-anchor="middle" class="entity-detail">environments</text>
  </g>
