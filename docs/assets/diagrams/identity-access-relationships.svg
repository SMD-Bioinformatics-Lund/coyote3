    <text x="240" y="601" text-anchor="middle" class="entity-detail">Browser cookie or bearer context</text>
    <text x="240" y="619" text-anchor="middle" class="entity-detail">Cookie writes require CSRF token</text>
  </g>
  <g data-node="4" data-left="520" data-top="468" data-right="840" data-bottom="639" class="entity blue">
    <title>API authorization</title>
