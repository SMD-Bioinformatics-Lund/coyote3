  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="310" class="entity blue">
    <title>Authentication provider</title>
    <use href="#icon-layers" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <text x="240" y="229" text-anchor="middle" class="entity-title">Authentication provider</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">Local username / password</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">or LDAP directory authentication</text>
    <text x="240" y="290" text-anchor="middle" class="entity-detail">Provider must be allowed for user</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="328" class="entity blue">
