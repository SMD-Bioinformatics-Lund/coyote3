</g>
<g class="edge-label"><rect x="436" y="866" width="71" height="28" rx="5"/>
<text x="444" y="884" class="label">records</text>
</g>
<g class="edge-label"><rect x="864" y="866" width="72" height="28" rx="5"/>
<text x="872" y="884" class="label">notifies</text>
</g>

</svg>
