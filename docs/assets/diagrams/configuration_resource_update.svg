<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="570" viewBox="0 0 1180 570" role="img" aria-labelledby="title desc">
  <title id="title">ASP, ASPC, and ISGL update flow</title>
  <desc id="desc">An authorized administrator loads a managed form contract, edits an ASP, ASPC, or ISGL, passes canonical identity and document validation, updates the current document, records an audit event, and affects future sample resolution while saved reports remain unchanged.</desc>
  <defs><style>.canvas{fill:#f8fafc}.band{fill:#e2e8f0}.ui{fill:#dbeafe}.policy{fill:#fef3c7}.contract{fill:#e0e7ff}.store{fill:#dcfce7}.audit{fill:#fce7f3}.title{font:700 23px Inter,'Segoe UI',Arial,sans-serif;fill:#0f172a}.label{font:700 13px Inter,'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:11px Inter,'Segoe UI',Arial,sans-serif;fill:#334155}.box{stroke:#64748b;stroke-width:1.5}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.future{stroke:#7c3aed;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#p)}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#475569"/></marker><marker id="p" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#7c3aed"/></marker></defs>
  <rect width="1180" height="570" class="canvas"/><rect x="20" y="18" width="1140" height="48" rx="10" class="band"/><text x="40" y="49" class="title">Managed clinical configuration update</text>
  <rect x="40" y="100" width="180" height="80" rx="11" class="box ui"/><text x="130" y="126" text-anchor="middle" class="label">1 · Open resource</text><text x="130" y="148" text-anchor="middle" class="sub">ASP · ASPC · ISGL</text><text x="130" y="165" text-anchor="middle" class="sub">view or edit route</text>
  <rect x="270" y="100" width="200" height="80" rx="11" class="box policy"/><text x="370" y="126" text-anchor="middle" class="label">2 · Permission check</text><text x="370" y="148" text-anchor="middle" class="sub">resource-specific action</text><text x="370" y="165" text-anchor="middle" class="sub">and assigned scope</text>
  <rect x="520" y="100" width="210" height="80" rx="11" class="box contract"/><text x="625" y="126" text-anchor="middle" class="label">3 · Managed form context</text><text x="625" y="148" text-anchor="middle" class="sub">schema + allowed options</text><text x="625" y="165" text-anchor="middle" class="sub">current document values</text>
  <rect x="780" y="100" width="170" height="80" rx="11" class="box ui"/><text x="865" y="126" text-anchor="middle" class="label">4 · Submit change</text><text x="865" y="148" text-anchor="middle" class="sub">typed API payload</text><text x="865" y="165" text-anchor="middle" class="sub">actor identity</text>
  <path d="M220 140 H270" class="arrow"/><path d="M470 140 H520" class="arrow"/><path d="M730 140 H780" class="arrow"/>

  <rect x="160" y="245" width="230" height="102" rx="11" class="box contract"/><text x="275" y="271" text-anchor="middle" class="label">5 · Normalize and validate</text><text x="275" y="293" text-anchor="middle" class="sub">canonical lowercase identifier</text><text x="275" y="311" text-anchor="middle" class="sub">allowed characters and vocabulary</text><text x="275" y="329" text-anchor="middle" class="sub">Pydantic collection contract</text>
  <rect x="475" y="235" width="230" height="122" rx="11" class="box policy"/><text x="590" y="261" text-anchor="middle" class="label">6 · Cross-resource checks</text><text x="590" y="283" text-anchor="middle" class="sub">ASPC references an active ASP</text><text x="590" y="301" text-anchor="middle" class="sub">ASP-derived group/category/platform</text><text x="590" y="319" text-anchor="middle" class="sub">analysis, filters, report sections</text><text x="590" y="337" text-anchor="middle" class="sub">ISGL associations remain valid</text>
  <rect x="790" y="245" width="230" height="102" rx="11" class="box store"/><text x="905" y="271" text-anchor="middle" class="label">7 · Persist current state</text><text x="905" y="293" text-anchor="middle" class="sub">one active document per key</text><text x="905" y="311" text-anchor="middle" class="sub">created metadata retained</text><text x="905" y="329" text-anchor="middle" class="sub">updated metadata replaced</text>
  <path d="M865 180 L275 245" class="arrow"/><path d="M390 296 H475" class="arrow"/><path d="M705 296 H790" class="arrow"/>

  <rect x="95" y="420" width="260" height="92" rx="11" class="box audit"/><text x="225" y="447" text-anchor="middle" class="label">8 · Record audit event</text><text x="225" y="469" text-anchor="middle" class="sub">actor · action · resource key</text><text x="225" y="489" text-anchor="middle" class="sub">UTC timestamp · outcome · request ID</text>
  <rect x="455" y="410" width="270" height="112" rx="11" class="box store"/><text x="590" y="437" text-anchor="middle" class="label">Future sample resolution</text><text x="590" y="459" text-anchor="middle" class="sub">ASP + requested subpanel + environment</text><text x="590" y="479" text-anchor="middle" class="sub">exact ASPC or explicit base fallback</text><text x="590" y="499" text-anchor="middle" class="sub">sample receives filters and analysis scope</text>
  <rect x="825" y="420" width="260" height="92" rx="11" class="box contract"/><text x="955" y="447" text-anchor="middle" class="label">Saved reports unchanged</text><text x="955" y="469" text-anchor="middle" class="sub">configuration/filter/finding snapshots</text><text x="955" y="489" text-anchor="middle" class="sub">plus static-rule identity and hash</text>
  <path d="M905 347 L225 420" class="arrow"/><path d="M905 347 L590 410" class="future"/><path d="M725 466 H825" class="future"/>
</svg>
