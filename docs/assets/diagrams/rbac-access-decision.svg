<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="982" viewBox="0 0 1360 982" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Database-backed RBAC and scoped access decision</title>
  <desc id="figure-description">An authenticated principal is resolved against active database permissions and roles, then Casbin evaluates action permission and optional assay, assay-group, and environment scope before allowing or denying a request and recording an audit decision.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-key" viewBox="0 0 24 24">
      <path d="M13 8a5 5 0 1 0-10 0 5 5 0 0 0 10 0ZM12 12l10 10M17 17l3-3M20 20l3-3M6 6h.01" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
    <symbol id="icon-reject" viewBox="0 0 24 24">
      <path d="M2 12a10 10 0 1 0 20 0 10 10 0 0 0-20 0Z" class="glyph" />
      <path d="m8 8 8 8M16 8l-8 8" class="glyph" />
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6" class="glyph" />
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6Z" class="glyph" />
      <path d="m8 12 3 3 5-6" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Database-backed RBAC and scoped access decision</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">An authenticated principal is resolved against active database permissions and roles, then Casbin evaluates action permission and optional assay, assay-group, and</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">environment scope before allowing or denying a request and recording an audit decision.</text>
  <g class="connections">
    <path d="M275 173H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M715 173H1085" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M1155 173 L1288 173Q1310 173 1310 195 L1310 388Q1310 410 1288 410 L249.5 410Q240 410 240 419.5 L240 429" data-source="2" data-target="3" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M275 464H645" data-source="3" data-target="4" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M715 464H1085" data-source="4" data-target="5" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 464 L848 464Q870 464 870 486 L870 743Q870 765 848 765 L689.5 765Q680 765 680 774.5 L680 784" data-source="4" data-target="7" data-optional="true" marker-end="url(#arrow-rose)" class="connection rose conditional" />
    <path d="M1155 464 L1288 464Q1310 464 1310 486 L1310 715Q1310 737 1288 737 L262 737Q240 737 240 759 L240 784" data-source="5" data-target="6" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M645 819H275" data-source="7" data-target="6" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
  </g>
  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="310" class="entity blue">
    <title>1 · Authenticated principal</title>
    <use href="#icon-key" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="141.5" text-anchor="middle" class="step-number">1</text>
    <text x="240" y="229" text-anchor="middle" class="entity-title">Authenticated principal</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">session cookie or bearer token</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">user ID + assigned role IDs</text>
    <text x="240" y="290" text-anchor="middle" class="entity-detail">active account required</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="346" class="entity purple">
    <title>2 · Persisted role documents</title>
    <use href="#icon-key" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="141.5" text-anchor="middle" class="step-number">2</text>
    <text x="680" y="229" text-anchor="middle" class="entity-title">Persisted role documents</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">active role · permission IDs</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">role level · display metadata</text>
    <text x="680" y="290" text-anchor="middle" class="entity-detail">scope comes from user account</text>
    <text x="680" y="308" text-anchor="middle" class="entity-detail">system records protected from</text>
    <text x="680" y="326" text-anchor="middle" class="entity-detail">deletion</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="328" class="entity purple">
    <title>3 · Active permissions</title>
    <use href="#icon-key" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="141.5" text-anchor="middle" class="step-number">3</text>
    <text x="1120" y="229" text-anchor="middle" class="entity-title">Active permissions</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">application bootstrap catalog</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">persisted in MongoDB</text>
    <text x="1120" y="290" text-anchor="middle" class="entity-detail">unknown/inactive permission</text>
    <text x="1120" y="308" text-anchor="middle" class="entity-detail">denied</text>
  </g>
  <g data-node="3" data-left="80" data-top="430" data-right="400" data-bottom="637" class="entity blue">
    <title>4 · Route requirement</title>
    <use href="#icon-layers" x="211" y="435" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="429" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="432.5" text-anchor="middle" class="step-number">4</text>
    <text x="240" y="520" text-anchor="middle" class="entity-title">Route requirement</text>
    <text x="240" y="545" text-anchor="middle" class="entity-detail">for example assay.config:edit</text>
    <text x="240" y="563" text-anchor="middle" class="entity-detail">or variant.classification:edit</text>
    <text x="240" y="581" text-anchor="middle" class="entity-detail">resource context loaded where</text>
    <text x="240" y="599" text-anchor="middle" class="entity-detail">needed</text>
    <text x="240" y="617" text-anchor="middle" class="entity-detail">assay · group · environment</text>
  </g>
  <g data-node="4" data-left="520" data-top="430" data-right="840" data-bottom="673" class="entity purple">
    <title>5 · Casbin policy decision</title>
    <use href="#icon-settings" x="651" y="435" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="429" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="432.5" text-anchor="middle" class="step-number">5</text>
    <text x="680" y="520" text-anchor="middle" class="entity-title">Casbin policy decision</text>
    <text x="680" y="545" text-anchor="middle" class="entity-detail">is permission assigned through a</text>
    <text x="680" y="563" text-anchor="middle" class="entity-detail">role?</text>
    <text x="680" y="581" text-anchor="middle" class="entity-detail">is the permission active and</text>
    <text x="680" y="599" text-anchor="middle" class="entity-detail">known?</text>
    <text x="680" y="617" text-anchor="middle" class="entity-detail">does resource fit the user scope?</text>
    <text x="680" y="635" text-anchor="middle" class="entity-detail">superuser bypass is explicit</text>
    <text x="680" y="653" text-anchor="middle" class="entity-detail">default result is deny</text>
  </g>
  <g data-node="5" data-left="960" data-top="430" data-right="1280" data-bottom="583" class="entity blue">
    <title>6A · Allow</title>
    <use href="#icon-layers" x="1091" y="435" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="520" text-anchor="middle" class="entity-title">6A · Allow</text>
    <text x="1120" y="545" text-anchor="middle" class="entity-detail">execute service and return typed</text>
    <text x="1120" y="563" text-anchor="middle" class="entity-detail">response</text>
  </g>
  <g data-node="6" data-left="80" data-top="785" data-right="400" data-bottom="938" class="entity blue">
    <title>Access audit / metrics</title>
    <use href="#icon-shield" x="211" y="790" width="58" height="58" aria-hidden="true" />
    <text x="240" y="875" text-anchor="middle" class="entity-title">Access audit / metrics</text>
    <text x="240" y="900" text-anchor="middle" class="entity-detail">principal · permission · scope ·</text>
    <text x="240" y="918" text-anchor="middle" class="entity-detail">outcome</text>
  </g>
  <g data-node="7" data-left="520" data-top="785" data-right="840" data-bottom="938" class="entity rose">
    <title>6B · Deny</title>
    <use href="#icon-reject" x="651" y="790" width="58" height="58" aria-hidden="true" />
    <text x="680" y="875" text-anchor="middle" class="entity-title">6B · Deny</text>
    <text x="680" y="900" text-anchor="middle" class="entity-detail">403 with structured user-facing</text>
    <text x="680" y="918" text-anchor="middle" class="entity-detail">reason</text>
  </g>
</svg>
