  <text x="40" y="34" text-anchor="start" class="figure-title">Clinical review and reporting flow</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">A ready sample is filtered, reviewed, tiered, snapshotted, previewed, and saved as an immutable report.</text>
  <g class="connections">
    <path d="M275 154C460 142 460 166 645 154" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M715 154C900 142 900 166 1085 154" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M1155 154 L1288 154Q1310 154 1310 176 L1310 297Q1310 319 1288 319 L249.5 319Q240 319 240 328.5 L240 338" data-source="2" data-target="3" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M275 373C460 361 460 385 645 373" data-source="3" data-target="4" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 373C900 361 900 385 1085 373" data-source="4" data-target="5" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M1155 373 L1288 373Q1310 373 1310 395 L1310 534Q1310 556 1288 556 L249.5 556Q240 556 240 565.5 L240 575" data-source="5" data-target="6" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
  </g>
  <g data-node="0" data-left="80" data-top="120" data-right="400" data-bottom="255" class="entity teal">
    <title>Ready sample</title>
    <use href="#icon-check" x="211" y="125" width="58" height="58" aria-hidden="true" />
    <text x="240" y="210" text-anchor="middle" class="entity-title">Ready sample</text>
    <text x="240" y="235" text-anchor="middle" class="entity-detail">available evidence committed</text>
  </g>
  <g data-node="1" data-left="520" data-top="120" data-right="840" data-bottom="255" class="entity purple">
    <title>Effective filters</title>
    <use href="#icon-filter" x="651" y="125" width="58" height="58" aria-hidden="true" />
    <text x="680" y="210" text-anchor="middle" class="entity-title">Effective filters</text>
    <text x="680" y="235" text-anchor="middle" class="entity-detail">ASPC + sample state</text>
  </g>
  <g data-node="2" data-left="960" data-top="120" data-right="1280" data-bottom="255" class="entity purple">
    <title>Clinical review</title>
    <use href="#icon-microscope" x="1091" y="125" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="210" text-anchor="middle" class="entity-title">Clinical review</text>
    <text x="1120" y="235" text-anchor="middle" class="entity-detail">findings + evidence</text>
  </g>
  <g data-node="3" data-left="80" data-top="339" data-right="400" data-bottom="474" class="entity purple">
    <title>Classification</title>
    <use href="#icon-microscope" x="211" y="344" width="58" height="58" aria-hidden="true" />
    <text x="240" y="429" text-anchor="middle" class="entity-title">Classification</text>
    <text x="240" y="454" text-anchor="middle" class="entity-detail">tiers + comments</text>
  </g>
  <g data-node="4" data-left="520" data-top="339" data-right="840" data-bottom="474" class="entity blue">
    <title>Live snapshot</title>
    <use href="#icon-report" x="651" y="344" width="58" height="58" aria-hidden="true" />
    <text x="680" y="429" text-anchor="middle" class="entity-title">Live snapshot</text>
    <text x="680" y="454" text-anchor="middle" class="entity-detail">updates with review state</text>
  </g>
  <g data-node="5" data-left="960" data-top="339" data-right="1280" data-bottom="492" class="entity blue">
    <title>Report preview</title>
    <use href="#icon-report" x="1091" y="344" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="429" text-anchor="middle" class="entity-title">Report preview</text>
    <text x="1120" y="454" text-anchor="middle" class="entity-detail">rules + selected findings + text</text>
    <text x="1120" y="472" text-anchor="middle" class="entity-detail">temporary until confirmed</text>
  </g>
  <g data-node="6" data-left="80" data-top="576" data-right="400" data-bottom="729" class="entity teal">
    <title>Saved report</title>
    <use href="#icon-report" x="211" y="581" width="58" height="58" aria-hidden="true" />
    <text x="240" y="666" text-anchor="middle" class="entity-title">Saved report</text>
    <text x="240" y="691" text-anchor="middle" class="entity-detail">immutable snapshot + artifacts</text>
    <text x="240" y="709" text-anchor="middle" class="entity-detail">searchable provenance</text>
  </g>
  <text x="40" y="763" text-anchor="start" class="figure-note">Filter or curation changes refresh the temporary snapshot; a saved report preserves the confirmed state.</text>
</svg>
