<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 860" width="1120" height="860" role="img" aria-labelledby="title description">
<title id="title">Clinical review: decisions, processing and evidence</title>
<desc id="description">Read across each row. Review actions and saved evidence have different owners.</desc>
<defs>
<style>
:root{--canvas:#f7f9fd;--surface:#fff;--ink:#20324b;--muted:#52647b;--edge:#ccd6e4;--blue:#3564a1;--teal:#137d79;--purple:#7752aa;--amber:#986326;--blue-soft:#edf3fc;--teal-soft:#e9f6f3;--purple-soft:#f2edf9;--amber-soft:#fbf3e6}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:var(--muted)}.heading{font-size:19px;font-weight:650}.body{font-size:17px;fill:var(--muted)}.small{font-size:15px;fill:var(--muted)}.edge{fill:none;stroke:var(--blue);stroke-width:2;marker-end:url(#arrow)}.optional{stroke-dasharray:6 5}.panel{stroke:var(--edge);stroke-width:1.2}
@media(prefers-color-scheme:dark){:root{--canvas:#1d2331;--surface:#293244;--ink:#edf1fa;--muted:#c3cede;--edge:#526079;--blue:#94b9ee;--teal:#82d0bf;--purple:#c8aff3;--amber:#e6be82;--blue-soft:#2a3a52;--teal-soft:#263f40;--purple-soft:#3b304d;--amber-soft:#443c30}}
@media print{:root{--canvas:#fff;--surface:#fff;--ink:#20324b;--muted:#52647b;--edge:#ccd6e4;--blue:#3564a1;--teal:#137d79;--purple:#7752aa;--amber:#986326;--blue-soft:#edf3fc;--teal-soft:#e9f6f3;--purple-soft:#f2edf9;--amber-soft:#fbf3e6}}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="m1 1 8 4-8 4" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
</marker>
</defs>
<rect width="1120" height="860" rx="20" fill="var(--canvas)"/>
<text x="32" y="48" class="title">Clinical review: decisions, processing and evidence</text>
<text x="32" y="80" class="subtitle">Read across each row. Review actions and saved evidence have different owners.</text>
<text x="32" y="128" class="heading">REVIEWER</text>
<text x="400" y="128" class="heading">APPLICATION</text>
<text x="768" y="128" class="heading">PERSISTED EVIDENCE</text>
<g>
<rect class="panel" x="32" y="155" width="320" height="155" rx="14" fill="var(--blue-soft)"/>
<rect x="32" y="173" width="4" height="119" rx="2" fill="var(--blue)"/>
<text x="52" y="189" class="heading">1  Confirm the sample</text>
<text x="52" y="220" class="body">Check case / control identity,</text>
<text x="52" y="245" class="body">assay, diagnosis and readiness.</text>
<text x="52" y="270" class="body">Stop if the context is wrong.</text>
</g>
<g>
<rect class="panel" x="400" y="155" width="320" height="155" rx="14" fill="var(--purple-soft)"/>
<rect x="400" y="173" width="4" height="119" rx="2" fill="var(--purple)"/>
<text x="420" y="189" class="heading">Resolve the workspace</text>
<text x="420" y="220" class="body">Authorize sample access.</text>
<text x="420" y="245" class="body">Load its pinned configuration</text>
<text x="420" y="270" class="body">and available analyses.</text>
</g>
<g>
<rect class="panel" x="768" y="155" width="320" height="155" rx="14" fill="var(--teal-soft)"/>
<rect x="768" y="173" width="4" height="119" rx="2" fill="var(--teal)"/>
<text x="788" y="189" class="heading">Sample context</text>
<text x="788" y="220" class="body">Identity, loaded evidence,</text>
<text x="788" y="245" class="body">configuration revision and</text>
<text x="788" y="270" class="body">effective filter profiles.</text>
</g>
<path class="edge" d="M352 230 H400"/>
<path class="edge" d="M768 230 H720"/>
<g>
<rect class="panel" x="32" y="355" width="320" height="180" rx="14" fill="var(--blue-soft)"/>
<rect x="32" y="373" width="4" height="144" rx="2" fill="var(--blue)"/>
<text x="52" y="389" class="heading">2  Interpret findings</text>
<text x="52" y="420" class="body">Review DNA or RNA evidence.</text>
<text x="52" y="445" class="body">Classify and annotate findings.</text>
<text x="52" y="470" class="body">Review a generated suggestion</text>
<text x="52" y="495" class="body">before saving a sample comment.</text>
</g>
<g>
<rect class="panel" x="400" y="355" width="320" height="180" rx="14" fill="var(--purple-soft)"/>
<rect x="400" y="373" width="4" height="144" rx="2" fill="var(--purple)"/>
<text x="420" y="389" class="heading">Retrieve and annotate</text>
<text x="420" y="420" class="body">Apply filters and query policies.</text>
<text x="420" y="445" class="body">Resolve eligible classifications</text>
<text x="420" y="470" class="body">and text in their clinical scope.</text>
<text x="420" y="495" class="body">Persist authorized review actions.</text>
</g>
<g>
<rect class="panel" x="768" y="355" width="320" height="180" rx="14" fill="var(--teal-soft)"/>
<rect x="768" y="373" width="4" height="144" rx="2" fill="var(--teal)"/>
<text x="788" y="389" class="heading">Review state</text>
<text x="788" y="420" class="body">Finding classifications, comments</text>
<text x="788" y="445" class="body">and sample review markers.</text>
<text x="788" y="470" class="body">A suggestion alone does not</text>
<text x="788" y="495" class="body">create a saved comment.</text>
</g>
<path class="edge" d="M352 440 H400"/>
<path class="edge" d="M720 440 H768"/>
<g>
<rect class="panel" x="32" y="580" width="320" height="180" rx="14" fill="var(--blue-soft)"/>
<rect x="32" y="598" width="4" height="144" rx="2" fill="var(--blue)"/>
<text x="52" y="614" class="heading">3  Verify and save</text>
<text x="52" y="645" class="body">Inspect report preview.</text>
<text x="52" y="670" class="body">Confirm summary and findings.</text>
<text x="52" y="695" class="body">Save, then inspect the saved</text>
<text x="52" y="720" class="body">report and artifact status.</text>
</g>
<g>
<rect class="panel" x="400" y="580" width="320" height="180" rx="14" fill="var(--purple-soft)"/>
<rect x="400" y="598" width="4" height="144" rx="2" fill="var(--purple)"/>
<text x="420" y="614" class="heading">Render and commit</text>
<text x="420" y="645" class="body">Recheck sample/configuration.</text>
<text x="420" y="670" class="body">Stage HTML/PDF artifacts.</text>
<text x="420" y="695" class="body">Commit report, finding snapshots</text>
<text x="420" y="720" class="body">and reported state together.</text>
</g>
<g>
<rect class="panel" x="768" y="580" width="320" height="180" rx="14" fill="var(--teal-soft)"/>
<rect x="768" y="598" width="4" height="144" rx="2" fill="var(--teal)"/>
<text x="788" y="614" class="heading">Report record</text>
<text x="788" y="645" class="body">Resolution receipt and filters,</text>
<text x="788" y="670" class="body">query/rule provenance, finding</text>
<text x="788" y="695" class="body">snapshots, artifact checksums.</text>
<text x="788" y="720" class="body">Pending files publish separately.</text>
</g>
<path class="edge" d="M352 665 H400"/>
<path class="edge" d="M720 665 H768"/>
<path class="edge optional" d="M192 310 V355"/>
<path class="edge optional" d="M192 535 V580"/>
<text x="32" y="813" class="small">Readiness is a prerequisite. Permission, analysis availability and report eligibility are separate checks.</text>
</svg>
