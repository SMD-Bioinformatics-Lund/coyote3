<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 860" width="1360" height="860" role="img" aria-labelledby="title description">
  <title id="title">Clinical review: decisions, processing and evidence</title>
  <desc id="description">Read across each row. Review actions and saved evidence have different owners.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-document" viewBox="0 0 24 24">
      <path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 12h8M8 16h8M8 19h5" class="glyph" />
    </symbol>
    <symbol id="icon-filter" viewBox="0 0 24 24">
      <path d="M2 3h20l-8 9v7l-4 3V12Z" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
    <symbol id="icon-processor" viewBox="0 0 24 24">
      <path d="M5 5h14v14H5ZM9 9h6v6H9ZM8 1v4M16 1v4M8 19v4M16 19v4M1 8h4M1 16h4M19 8h4M19 16h4" class="glyph" />
    </symbol>
    <symbol id="icon-report" viewBox="0 0 24 24">
      <path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 18v-3M12 18v-6M16 18v-4" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="36" class="figure-title">Clinical review: decisions, processing and evidence</text>
  <text x="40" y="68" class="figure-subtitle">Read across each row. Review actions and saved evidence have different owners.</text>
  <text x="38.86" y="128" class="entity-title">REVIEWER</text>
  <text x="485.71" y="128" class="entity-title">APPLICATION</text>
  <text x="932.57" y="128" class="entity-title">PERSISTED EVIDENCE</text>
  <g class="entity blue" data-node="0" data-left="38.86" data-right="427.43" data-top="155.0" data-bottom="310.0">
    <title>1  Confirm the sample</title>
    <use href="#icon-processor" x="212.14" y="158.0" width="42" height="42" aria-hidden="true" />
    <text x="233.14" y="218.0" text-anchor="middle" class="entity-title">1  Confirm the sample</text>
    <text x="233.14" y="240.0" text-anchor="middle" class="entity-detail">Check case / control identity,</text>
    <text x="233.14" y="258.0" text-anchor="middle" class="entity-detail">assay, diagnosis and readiness.</text>
    <text x="233.14" y="276.0" text-anchor="middle" class="entity-detail">Stop if the context is wrong.</text>
  </g>
  <g class="entity purple" data-node="1" data-left="485.71" data-right="874.29" data-top="155.0" data-bottom="310.0">
    <title>Resolve the workspace</title>
    <use href="#icon-layers" x="659.0" y="158.0" width="42" height="42" aria-hidden="true" />
    <text x="680.0" y="218.0" text-anchor="middle" class="entity-title">Resolve the workspace</text>
    <text x="680.0" y="240.0" text-anchor="middle" class="entity-detail">Authorize sample access.</text>
    <text x="680.0" y="258.0" text-anchor="middle" class="entity-detail">Load its pinned configuration</text>
    <text x="680.0" y="276.0" text-anchor="middle" class="entity-detail">and available analyses.</text>
  </g>
  <g class="entity teal" data-node="2" data-left="932.57" data-right="1321.14" data-top="155.0" data-bottom="310.0">
    <title>Sample context</title>
    <use href="#icon-document" x="1105.86" y="158.0" width="42" height="42" aria-hidden="true" />
    <text x="1126.86" y="218.0" text-anchor="middle" class="entity-title">Sample context</text>
    <text x="1126.86" y="240.0" text-anchor="middle" class="entity-detail">Identity, loaded evidence,</text>
    <text x="1126.86" y="258.0" text-anchor="middle" class="entity-detail">configuration revision and</text>
    <text x="1126.86" y="276.0" text-anchor="middle" class="entity-detail">effective filter profiles.</text>
  </g>
  <path class="connection blue" d="M352 230 H400" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <path class="connection blue" d="M768 230 H720" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <g class="entity blue" data-node="3" data-left="38.86" data-right="427.43" data-top="355.0" data-bottom="535.0">
    <title>2  Interpret findings</title>
    <use href="#icon-filter" x="212.14" y="358.0" width="42" height="42" aria-hidden="true" />
    <text x="233.14" y="418.0" text-anchor="middle" class="entity-title">2  Interpret findings</text>
    <text x="233.14" y="440.0" text-anchor="middle" class="entity-detail">Review DNA or RNA evidence.</text>
    <text x="233.14" y="458.0" text-anchor="middle" class="entity-detail">Classify and annotate findings.</text>
    <text x="233.14" y="476.0" text-anchor="middle" class="entity-detail">Review a generated suggestion</text>
    <text x="233.14" y="494.0" text-anchor="middle" class="entity-detail">before saving a sample comment.</text>
  </g>
  <g class="entity purple" data-node="4" data-left="485.71" data-right="874.29" data-top="355.0" data-bottom="535.0">
    <title>Retrieve and annotate</title>
    <use href="#icon-processor" x="659.0" y="358.0" width="42" height="42" aria-hidden="true" />
    <text x="680.0" y="418.0" text-anchor="middle" class="entity-title">Retrieve and annotate</text>
    <text x="680.0" y="440.0" text-anchor="middle" class="entity-detail">Apply filters and query policies.</text>
    <text x="680.0" y="458.0" text-anchor="middle" class="entity-detail">Resolve eligible classifications</text>
    <text x="680.0" y="476.0" text-anchor="middle" class="entity-detail">and text in their clinical scope.</text>
    <text x="680.0" y="494.0" text-anchor="middle" class="entity-detail">Persist authorized review actions.</text>
  </g>
  <g class="entity teal" data-node="5" data-left="932.57" data-right="1321.14" data-top="355.0" data-bottom="535.0">
    <title>Review state</title>
    <use href="#icon-processor" x="1105.86" y="358.0" width="42" height="42" aria-hidden="true" />
    <text x="1126.86" y="418.0" text-anchor="middle" class="entity-title">Review state</text>
    <text x="1126.86" y="440.0" text-anchor="middle" class="entity-detail">Finding classifications, comments</text>
    <text x="1126.86" y="458.0" text-anchor="middle" class="entity-detail">and sample review markers.</text>
    <text x="1126.86" y="476.0" text-anchor="middle" class="entity-detail">A suggestion alone does not</text>
    <text x="1126.86" y="494.0" text-anchor="middle" class="entity-detail">create a saved comment.</text>
  </g>
  <path class="connection blue" d="M352 440 H400" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <path class="connection blue" d="M720 440 H768" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <g class="entity blue" data-node="6" data-left="38.86" data-right="427.43" data-top="580.0" data-bottom="760.0">
    <title>3  Verify and save</title>
    <use href="#icon-document" x="212.14" y="583.0" width="42" height="42" aria-hidden="true" />
    <text x="233.14" y="643.0" text-anchor="middle" class="entity-title">3  Verify and save</text>
    <text x="233.14" y="665.0" text-anchor="middle" class="entity-detail">Inspect report preview.</text>
    <text x="233.14" y="683.0" text-anchor="middle" class="entity-detail">Confirm summary and findings.</text>
    <text x="233.14" y="701.0" text-anchor="middle" class="entity-detail">Save, then inspect the saved</text>
    <text x="233.14" y="719.0" text-anchor="middle" class="entity-detail">report and artifact status.</text>
  </g>
  <g class="entity purple" data-node="7" data-left="485.71" data-right="874.29" data-top="580.0" data-bottom="760.0">
    <title>Render and commit</title>
    <use href="#icon-processor" x="659.0" y="583.0" width="42" height="42" aria-hidden="true" />
    <text x="680.0" y="643.0" text-anchor="middle" class="entity-title">Render and commit</text>
    <text x="680.0" y="665.0" text-anchor="middle" class="entity-detail">Recheck sample/configuration.</text>
    <text x="680.0" y="683.0" text-anchor="middle" class="entity-detail">Stage HTML/PDF artifacts.</text>
    <text x="680.0" y="701.0" text-anchor="middle" class="entity-detail">Commit report, finding snapshots</text>
    <text x="680.0" y="719.0" text-anchor="middle" class="entity-detail">and reported state together.</text>
  </g>
  <g class="entity teal" data-node="8" data-left="932.57" data-right="1321.14" data-top="580.0" data-bottom="760.0">
    <title>Report record</title>
    <use href="#icon-report" x="1105.86" y="583.0" width="42" height="42" aria-hidden="true" />
    <text x="1126.86" y="643.0" text-anchor="middle" class="entity-title">Report record</text>
    <text x="1126.86" y="665.0" text-anchor="middle" class="entity-detail">Resolution receipt and filters,</text>
    <text x="1126.86" y="683.0" text-anchor="middle" class="entity-detail">query/rule provenance, finding</text>
    <text x="1126.86" y="701.0" text-anchor="middle" class="entity-detail">snapshots, artifact checksums.</text>
    <text x="1126.86" y="719.0" text-anchor="middle" class="entity-detail">Pending files publish separately.</text>
  </g>
  <path class="connection blue" d="M352 665 H400" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <path class="connection blue" d="M720 665 H768" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <path class="connection blue conditional" d="M192 310 V355" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <path class="connection blue conditional" d="M192 535 V580" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <text x="38.86" y="813" class="figure-note">Readiness is a prerequisite. Permission, analysis availability and report eligibility are separate checks.</text>
</svg>
