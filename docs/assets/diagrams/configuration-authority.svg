<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="636" viewBox="0 0 1360 636" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Configuration authority and sample resolution</title>
  <desc id="figure-description">Center files, application catalogs, and versioned MongoDB resources combine into a resolved sample analysis context.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-branch" viewBox="0 0 24 24">
      <path d="M6 4v11a4 4 0 0 0 4 4h8M6 9h8a4 4 0 0 0 4-4V3M3 3h6M15 3h6M15 16l3 3-3 3" class="glyph" />
    </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <path d="M4 6c0-4 16-4 16 0s-16 4-16 0Zm0 0v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0" class="glyph" />
    </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
      <path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 12h8M8 16h8M8 19h5" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Configuration authority and sample resolution</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Center files, application catalogs, and versioned MongoDB resources combine into a resolved sample analysis context.</text>
  <g class="connections">
    <path d="M275 182H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M240 421 L240 413Q240 405 248 405 L1307 405Q1329 405 1329 383 L1329 150Q1329 128 1307 128 L689.5 128Q680 128 680 137.5 L680 147" data-source="3" data-target="1" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M715 182H1085" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M1155 182 L1288 182Q1310 182 1310 204 L1310 379Q1310 401 1288 401 L689.5 401Q680 401 680 410.5 L680 420" data-source="2" data-target="4" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
  </g>
  <g data-node="0" data-left="80" data-top="148" data-right="400" data-bottom="301" class="entity blue">
    <title>Center deployment files</title>
    <use href="#icon-document" x="211" y="153" width="58" height="58" aria-hidden="true" />
    <text x="240" y="238" text-anchor="middle" class="entity-title">Center deployment files</text>
    <text x="240" y="263" text-anchor="middle" class="entity-detail">environment + TOML/YAML</text>
    <text x="240" y="281" text-anchor="middle" class="entity-detail">contacts, paths, vocabulary</text>
  </g>
  <g data-node="1" data-left="520" data-top="148" data-right="840" data-bottom="337" class="entity teal">
    <title>Versioned MongoDB resources</title>
    <use href="#icon-database" x="651" y="153" width="58" height="58" aria-hidden="true" />
    <text x="680" y="238" text-anchor="middle" class="entity-title">Versioned MongoDB resources</text>
    <text x="680" y="263" text-anchor="middle" class="entity-detail">ASP: assay definition</text>
    <text x="680" y="281" text-anchor="middle" class="entity-detail">ASPC: filters + analyses +</text>
    <text x="680" y="299" text-anchor="middle" class="entity-detail">reporting</text>
    <text x="680" y="317" text-anchor="middle" class="entity-detail">ISGL: selectable gene scope</text>
  </g>
  <g data-node="2" data-left="960" data-top="148" data-right="1280" data-bottom="319" class="entity purple">
    <title>Resolved sample context</title>
    <use href="#icon-branch" x="1091" y="153" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="238" text-anchor="middle" class="entity-title">Resolved sample context</text>
    <text x="1120" y="263" text-anchor="middle" class="entity-detail">active ASP/ASPC release</text>
    <text x="1120" y="281" text-anchor="middle" class="entity-detail">sample filter state</text>
    <text x="1120" y="299" text-anchor="middle" class="entity-detail">selected/ad hoc gene lists</text>
  </g>
  <g data-node="3" data-left="80" data-top="421" data-right="400" data-bottom="574" class="entity blue">
    <title>Application catalogs</title>
    <use href="#icon-layers" x="211" y="426" width="58" height="58" aria-hidden="true" />
    <text x="240" y="511" text-anchor="middle" class="entity-title">Application catalogs</text>
    <text x="240" y="536" text-anchor="middle" class="entity-detail">permissions + roles</text>
    <text x="240" y="554" text-anchor="middle" class="entity-detail">clinical rule grammar</text>
  </g>
  <g data-node="4" data-left="520" data-top="421" data-right="840" data-bottom="592" class="entity blue">
    <title>Clinical execution</title>
    <use href="#icon-layers" x="651" y="426" width="58" height="58" aria-hidden="true" />
    <text x="680" y="511" text-anchor="middle" class="entity-title">Clinical execution</text>
    <text x="680" y="536" text-anchor="middle" class="entity-detail">query construction, review tabs,</text>
    <text x="680" y="554" text-anchor="middle" class="entity-detail">report sections, audit, and saved</text>
    <text x="680" y="572" text-anchor="middle" class="entity-detail">provenance</text>
  </g>
</svg>
