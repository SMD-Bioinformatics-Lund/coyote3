<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="936" viewBox="0 0 1360 936" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Who can access a sample: permissions and clinical scope</title>
  <desc id="figure-description">Roles answer which actions are allowed. User scope constrains the assays and environments those actions reach. Disabling an assay group blocks new setup/ingest/assignments; existing clinical records retain their access checks.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-key" viewBox="0 0 24 24">
      <path d="M13 8a5 5 0 1 0-10 0 5 5 0 0 0 10 0ZM12 12l10 10M17 17l3-3M20 20l3-3M6 6h.01" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
    <symbol id="icon-sample" viewBox="0 0 24 24">
      <path d="M8 2h8M9 2v7l-5 10c-1 2 0 3 2 3h12c2 0 3-1 2-3L15 9V2M7 15h10M9 18h.01M14 19h.01" class="glyph" />
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6" class="glyph" />
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6Z" class="glyph" />
      <path d="m8 12 3 3 5-6" class="glyph" />
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <path d="M16 6a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM3 22v-3c0-8 18-8 18 0v3" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Who can access a sample: permissions and clinical scope</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Roles answer which actions are allowed. User scope constrains the assays and environments those actions reach. Disabling an assay group blocks new</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">setup/ingest/assignments; existing clinical records retain their access checks.</text>
  <g class="connections">
    <path d="M275 173H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M715 173H1085" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M1155 173 L1288 173Q1310 173 1310 195 L1310 406Q1310 428 1288 428 L1129.5 428Q1120 428 1120 437.5 L1120 447" data-source="2" data-target="5" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M275 482H645" data-source="3" data-target="4" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 482H1085" data-source="4" data-target="5" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M1155 482 L1288 482Q1310 482 1310 504 L1310 679Q1310 701 1288 701 L689.5 701Q680 701 680 710.5 L680 720" data-source="5" data-target="7" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M275 755H645" data-source="6" data-target="7" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 755H1085" data-source="7" data-target="8" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
  </g>
  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="346" class="entity purple">
    <title>Permission catalog</title>
    <use href="#icon-key" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <text x="240" y="229" text-anchor="middle" class="entity-title">Permission catalog</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">Active application permission IDs</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">Defines supported resource</text>
    <text x="240" y="290" text-anchor="middle" class="entity-detail">actions</text>
    <text x="240" y="308" text-anchor="middle" class="entity-detail">Managed through bootstrap</text>
    <text x="240" y="326" text-anchor="middle" class="entity-detail">catalog</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="364" class="entity purple">
    <title>Roles</title>
    <use href="#icon-key" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <text x="680" y="229" text-anchor="middle" class="entity-title">Roles</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">permissions[] reference catalog</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">IDs</text>
    <text x="680" y="290" text-anchor="middle" class="entity-detail">Active role identities assigned to</text>
    <text x="680" y="308" text-anchor="middle" class="entity-detail">user</text>
    <text x="680" y="326" text-anchor="middle" class="entity-detail">Role color is display metadata</text>
    <text x="680" y="344" text-anchor="middle" class="entity-detail">only</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="310" class="entity blue">
    <title>User account</title>
    <use href="#icon-user" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="229" text-anchor="middle" class="entity-title">User account</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">roles[] + active account</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">assay_access[]: assay + environments</text>
    <text x="1120" y="290" text-anchor="middle" class="entity-detail">asp_groups[]: additional restriction</text>
  </g>
  <g data-node="3" data-left="80" data-top="448" data-right="400" data-bottom="637" class="entity blue">
    <title>Assay group registry</title>
    <use href="#icon-sample" x="211" y="453" width="58" height="58" aria-hidden="true" />
    <text x="240" y="538" text-anchor="middle" class="entity-title">Assay group registry</text>
    <text x="240" y="563" text-anchor="middle" class="entity-detail">Stable group identity</text>
    <text x="240" y="581" text-anchor="middle" class="entity-detail">New assignments require active</text>
    <text x="240" y="599" text-anchor="middle" class="entity-detail">group</text>
    <text x="240" y="617" text-anchor="middle" class="entity-detail">Group is not a permission grant</text>
  </g>
  <g data-node="4" data-left="520" data-top="448" data-right="840" data-bottom="619" class="entity blue">
    <title>Assay · ASP</title>
    <use href="#icon-sample" x="651" y="453" width="58" height="58" aria-hidden="true" />
    <text x="680" y="538" text-anchor="middle" class="entity-title">Assay · ASP</text>
    <text x="680" y="563" text-anchor="middle" class="entity-detail">Assay ID and registered group</text>
    <text x="680" y="581" text-anchor="middle" class="entity-detail">Clinical resource context</text>
    <text x="680" y="599" text-anchor="middle" class="entity-detail">Sample belongs to its assay</text>
  </g>
  <g data-node="5" data-left="960" data-top="448" data-right="1280" data-bottom="637" class="entity purple">
    <title>Sample / configuration</title>
    <use href="#icon-settings" x="1091" y="453" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="538" text-anchor="middle" class="entity-title">Sample / configuration</text>
    <text x="1120" y="563" text-anchor="middle" class="entity-detail">Requested action and environment</text>
    <text x="1120" y="581" text-anchor="middle" class="entity-detail">Assay ID and group context</text>
    <text x="1120" y="599" text-anchor="middle" class="entity-detail">Server resolves protected</text>
    <text x="1120" y="617" text-anchor="middle" class="entity-detail">resource</text>
  </g>
  <g data-node="6" data-left="80" data-top="721" data-right="400" data-bottom="892" class="entity purple">
    <title>Explicit policy conditions</title>
    <use href="#icon-settings" x="211" y="726" width="58" height="58" aria-hidden="true" />
    <text x="240" y="811" text-anchor="middle" class="entity-title">Explicit policy conditions</text>
    <text x="240" y="836" text-anchor="middle" class="entity-detail">Known permission and active role</text>
    <text x="240" y="854" text-anchor="middle" class="entity-detail">User scope checked by API policy</text>
    <text x="240" y="872" text-anchor="middle" class="entity-detail">Explicit superuser handling</text>
  </g>
  <g data-node="7" data-left="520" data-top="721" data-right="840" data-bottom="892" class="entity blue">
    <title>Authorization decision</title>
    <use href="#icon-shield" x="651" y="726" width="58" height="58" aria-hidden="true" />
    <text x="680" y="811" text-anchor="middle" class="entity-title">Authorization decision</text>
    <text x="680" y="836" text-anchor="middle" class="entity-detail">Permission + resource scope</text>
    <text x="680" y="854" text-anchor="middle" class="entity-detail">Allow → execute typed operation</text>
    <text x="680" y="872" text-anchor="middle" class="entity-detail">Deny → structured API response</text>
  </g>
  <g data-node="8" data-left="960" data-top="721" data-right="1280" data-bottom="892" class="entity blue">
    <title>UI and traceability</title>
    <use href="#icon-layers" x="1091" y="726" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="811" text-anchor="middle" class="entity-title">UI and traceability</text>
    <text x="1120" y="836" text-anchor="middle" class="entity-detail">UI hides unavailable actions</text>
    <text x="1120" y="854" text-anchor="middle" class="entity-detail">API remains the security boundary</text>
    <text x="1120" y="872" text-anchor="middle" class="entity-detail">Record applicable audit events</text>
  </g>
  <g data-edge="0" class="relationship purple">
    <text x="460" y="156" text-anchor="middle" class="edge-label">grants</text>
  </g>
  <g data-edge="1" class="relationship blue">
    <text x="900" y="156" text-anchor="middle" class="edge-label">assigned</text>
  </g>
  <g data-edge="2" class="relationship purple">
    <text x="1215" y="420" text-anchor="middle" class="edge-label">scope check</text>
  </g>
  <g data-edge="3" class="relationship blue">
    <text x="460" y="465" text-anchor="middle" class="edge-label">groups</text>
  </g>
  <g data-edge="4" class="relationship purple">
    <text x="900" y="465" text-anchor="middle" class="edge-label">context</text>
  </g>
  <g data-edge="5" class="relationship blue">
    <text x="995" y="679" text-anchor="middle" class="edge-label">evaluate action against</text>
    <text x="995" y="693" text-anchor="middle" class="edge-label">principal</text>
  </g>
  <g data-edge="6" class="relationship blue">
    <text x="460" y="738" text-anchor="middle" class="edge-label">enforces</text>
  </g>
  <g data-edge="7" class="relationship blue">
    <text x="900" y="738" text-anchor="middle" class="edge-label">result</text>
  </g>
</svg>
