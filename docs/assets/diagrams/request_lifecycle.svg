<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
  <title id="title">Coyote3 request lifecycle</title>
  <desc id="desc">A supported request passes through proxy routing, frontend API helpers, FastAPI middleware, authentication, module and permission checks, typed routes and services, repositories, MongoDB, response validation, audit, and React Query rendering.</desc>
  <defs><style>.canvas{fill:#f8fafc}.band{fill:#e2e8f0}.lane{fill:#fff;stroke:#94a3b8;stroke-width:1.3}.client{fill:#dbeafe}.guard{fill:#fef3c7}.logic{fill:#e0e7ff}.data{fill:#dcfce7}.deny{fill:#fee2e2}.title{font:700 23px Inter,'Segoe UI',Arial,sans-serif;fill:#0f172a}.lane-title{font:700 12px Inter,'Segoe UI',Arial,sans-serif;fill:#475569}.label{font:700 13px Inter,'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:11px Inter,'Segoe UI',Arial,sans-serif;fill:#334155}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.fail{stroke:#b91c1c;stroke-width:2;fill:none;stroke-dasharray:6 4;marker-end:url(#r)}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#475569"/></marker><marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#b91c1c"/></marker></defs>
  <rect width="1160" height="650" class="canvas"/><rect x="20" y="18" width="1120" height="48" rx="10" class="band"/><text x="40" y="49" class="title">Request lifecycle: browser to persisted response</text>
  <rect x="28" y="86" width="1104" height="94" rx="12" class="lane"/><text x="44" y="107" class="lane-title">CLIENT AND EDGE</text>
  <rect x="60" y="122" width="170" height="42" rx="9" class="client"/><text x="145" y="148" text-anchor="middle" class="label">1 · User action</text>
  <rect x="284" y="114" width="200" height="58" rx="9" class="client"/><text x="384" y="138" text-anchor="middle" class="label">2 · React API helper</text><text x="384" y="157" text-anchor="middle" class="sub">typed payload + query key</text>
  <rect x="545" y="114" width="210" height="58" rx="9" class="client"/><text x="650" y="138" text-anchor="middle" class="label">3 · Reverse proxies</text><text x="650" y="157" text-anchor="middle" class="sub">prefix + /api/v1 routing</text>
  <path d="M230 143 H284" class="arrow"/><path d="M484 143 H545" class="arrow"/>

  <rect x="28" y="198" width="1104" height="180" rx="12" class="lane"/><text x="44" y="219" class="lane-title">FASTAPI BOUNDARY AND POLICY</text>
  <rect x="55" y="252" width="170" height="74" rx="9" class="guard"/><text x="140" y="276" text-anchor="middle" class="label">4 · Middleware</text><text x="140" y="296" text-anchor="middle" class="sub">request ID · CORS</text><text x="140" y="313" text-anchor="middle" class="sub">session/bearer principal</text>
  <rect x="270" y="252" width="170" height="74" rx="9" class="guard"/><text x="355" y="276" text-anchor="middle" class="label">5 · Module gate</text><text x="355" y="296" text-anchor="middle" class="sub">feature enabled?</text><text x="355" y="313" text-anchor="middle" class="sub">disabled → 503</text>
  <rect x="485" y="243" width="190" height="92" rx="9" class="guard"/><text x="580" y="267" text-anchor="middle" class="label">6 · Access policy</text><text x="580" y="287" text-anchor="middle" class="sub">active DB permission</text><text x="580" y="304" text-anchor="middle" class="sub">role assignment + scope</text><text x="580" y="321" text-anchor="middle" class="sub">assay · group · environment</text>
  <rect x="730" y="243" width="190" height="92" rx="9" class="logic"/><text x="825" y="267" text-anchor="middle" class="label">7 · Typed route</text><text x="825" y="287" text-anchor="middle" class="sub">path/query/body validation</text><text x="825" y="304" text-anchor="middle" class="sub">dependency injection</text><text x="825" y="321" text-anchor="middle" class="sub">application service call</text>
  <rect x="968" y="252" width="130" height="74" rx="9" class="deny"/><text x="1033" y="277" text-anchor="middle" class="label">Denied</text><text x="1033" y="297" text-anchor="middle" class="sub">401 · 403 · 404</text><text x="1033" y="314" text-anchor="middle" class="sub">422 · 503</text>
  <path d="M650 172 L140 252" class="arrow"/><path d="M225 289 H270" class="arrow"/><path d="M440 289 H485" class="arrow"/><path d="M675 289 H730" class="arrow"/><path d="M355 252 L968 275" class="fail"/><path d="M580 243 L968 291" class="fail"/>

  <rect x="28" y="396" width="1104" height="138" rx="12" class="lane"/><text x="44" y="417" class="lane-title">APPLICATION AND DATA</text>
  <rect x="68" y="449" width="190" height="58" rx="9" class="logic"/><text x="163" y="473" text-anchor="middle" class="label">8 · Domain workflow</text><text x="163" y="493" text-anchor="middle" class="sub">query, mutation, reporting</text>
  <rect x="328" y="449" width="190" height="58" rx="9" class="logic"/><text x="423" y="473" text-anchor="middle" class="label">9 · Repository</text><text x="423" y="493" text-anchor="middle" class="sub">collection-specific access</text>
  <rect x="588" y="449" width="170" height="58" rx="9" class="data"/><text x="673" y="473" text-anchor="middle" class="label">10 · MongoDB</text><text x="673" y="493" text-anchor="middle" class="sub">validated documents</text>
  <rect x="828" y="449" width="220" height="58" rx="9" class="data"/><text x="938" y="473" text-anchor="middle" class="label">Audit + cache effects</text><text x="938" y="493" text-anchor="middle" class="sub">critical event · invalidation</text>
  <path d="M825 335 L163 449" class="arrow"/><path d="M258 478 H328" class="arrow"/><path d="M518 478 H588" class="arrow"/><path d="M758 478 H828" class="arrow"/>

  <rect x="28" y="552" width="1104" height="72" rx="12" class="lane"/><text x="44" y="573" class="lane-title">RETURN PATH</text>
  <rect x="200" y="578" width="250" height="32" rx="8" class="client"/><text x="325" y="599" text-anchor="middle" class="label">11 · Response-model serialization</text>
  <rect x="535" y="578" width="250" height="32" rx="8" class="client"/><text x="660" y="599" text-anchor="middle" class="label">12 · React Query cache update</text>
  <rect x="870" y="578" width="190" height="32" rx="8" class="client"/><text x="965" y="599" text-anchor="middle" class="label">13 · UI renders state</text>
  <path d="M673 507 L325 578" class="arrow"/><path d="M450 594 H535" class="arrow"/><path d="M785 594 H870" class="arrow"/>
</svg>
