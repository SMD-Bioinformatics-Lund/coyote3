<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 850" width="1120" height="850" role="img" aria-labelledby="title description">
<title id="title">Runtime topology: boundaries and dependencies</title>
<desc id="description">The proxy routes traffic; application services own workflows; repositories own persistence.</desc>
<defs>
<style>
:root{--canvas:#f7f9fd;--surface:#fff;--ink:#20324b;--muted:#52647b;--edge:#ccd6e4;--blue:#3564a1;--teal:#137d79;--purple:#7752aa;--amber:#986326;--blue-soft:#edf3fc;--teal-soft:#e9f6f3;--purple-soft:#f2edf9;--amber-soft:#fbf3e6}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:var(--muted)}.heading{font-size:19px;font-weight:650}.body{font-size:17px;fill:var(--muted)}.small{font-size:15px;fill:var(--muted)}.edge{fill:none;stroke:var(--blue);stroke-width:2;marker-end:url(#arrow)}.optional{stroke-dasharray:6 5}.panel{stroke:var(--edge);stroke-width:1.2}
@media(prefers-color-scheme:dark){:root{--canvas:#1d2331;--surface:#293244;--ink:#edf1fa;--muted:#c3cede;--edge:#526079;--blue:#94b9ee;--teal:#82d0bf;--purple:#c8aff3;--amber:#e6be82;--blue-soft:#2a3a52;--teal-soft:#263f40;--purple-soft:#3b304d;--amber-soft:#443c30}}
@media print{:root{--canvas:#fff;--surface:#fff;--ink:#20324b;--muted:#52647b;--edge:#ccd6e4;--blue:#3564a1;--teal:#137d79;--purple:#7752aa;--amber:#986326;--blue-soft:#edf3fc;--teal-soft:#e9f6f3;--purple-soft:#f2edf9;--amber-soft:#fbf3e6}}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="m1 1 8 4-8 4" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
</marker>
</defs>
<rect width="1120" height="850" rx="20" fill="var(--canvas)"/>
<text x="32" y="48" class="title">Runtime topology: boundaries and dependencies</text>
<text x="32" y="80" class="subtitle">The proxy routes traffic; application services own workflows; repositories own persistence.</text>
<g>
<rect class="panel" x="32" y="130" width="250" height="135" rx="14" fill="var(--blue-soft)"/>
<rect x="32" y="148" width="4" height="99" rx="2" fill="var(--blue)"/>
<text x="52" y="164" class="heading">Browser / client</text>
<text x="52" y="195" class="body">Web UI or authenticated</text>
<text x="52" y="220" class="body">HTTP client. No direct</text>
<text x="52" y="245" class="body">database access.</text>
</g>
<g>
<rect class="panel" x="350" y="130" width="330" height="135" rx="14" fill="var(--purple-soft)"/>
<rect x="350" y="148" width="4" height="99" rx="2" fill="var(--purple)"/>
<text x="370" y="164" class="heading">Nginx reverse proxy</text>
<text x="370" y="195" class="body">Browser-facing entry point.</text>
<text x="370" y="220" class="body">Routes UI, API and docs</text>
<text x="370" y="245" class="body">to their configured services.</text>
</g>
<g>
<rect class="panel" x="770" y="130" width="318" height="135" rx="14" fill="var(--teal-soft)"/>
<rect x="770" y="148" width="4" height="99" rx="2" fill="var(--teal)"/>
<text x="790" y="164" class="heading">Frontend / documentation</text>
<text x="790" y="195" class="body">Built React application</text>
<text x="790" y="220" class="body">and static documentation.</text>
<text x="790" y="245" class="body">The browser calls the API.</text>
</g>
<path class="edge" d="M282 195 H350"/>
<path class="edge" d="M680 195 H770"/>
<text x="32" y="318" class="heading">APPLICATION RUNTIME</text>
<g>
<rect class="panel" x="32" y="345" width="330" height="180" rx="14" fill="var(--purple-soft)"/>
<rect x="32" y="363" width="4" height="144" rx="2" fill="var(--purple)"/>
<text x="52" y="379" class="heading">FastAPI host</text>
<text x="52" y="410" class="body">Session / token authentication,</text>
<text x="52" y="435" class="body">request validation and access.</text>
<text x="52" y="460" class="body">Composes core operations with</text>
<text x="52" y="485" class="body">repositories and integrations.</text>
</g>
<g>
<rect class="panel" x="405" y="345" width="330" height="180" rx="14" fill="var(--purple-soft)"/>
<rect x="405" y="363" width="4" height="144" rx="2" fill="var(--purple)"/>
<text x="425" y="379" class="heading">Celery workers</text>
<text x="425" y="410" class="body">Execute queued ingest and</text>
<text x="425" y="435" class="body">maintenance through services.</text>
<text x="425" y="460" class="body">Initialize explicit runtime</text>
<text x="425" y="485" class="body">configuration and storage.</text>
</g>
<g>
<rect class="panel" x="778" y="345" width="310" height="180" rx="14" fill="var(--purple-soft)"/>
<rect x="778" y="363" width="4" height="144" rx="2" fill="var(--purple)"/>
<text x="798" y="379" class="heading">Celery beat</text>
<text x="798" y="410" class="body">Schedules periodic tasks.</text>
<text x="798" y="435" class="body">Redis carries queued jobs;</text>
<text x="798" y="460" class="body">it is not clinical persistence.</text>
</g>
<path class="edge" d="M515 265 V295 H197 V345"/>
<text x="212" y="290" class="small">API requests</text>
<path class="edge" d="M778 430 H735"/>
<text x="32" y="582" class="heading">PERSISTENCE AND SHARED SERVICES</text>
<g>
<rect class="panel" x="32" y="610" width="198" height="145" rx="14" fill="var(--teal-soft)"/>
<rect x="32" y="628" width="4" height="109" rx="2" fill="var(--teal)"/>
<text x="52" y="644" class="heading">Application DB</text>
<text x="52" y="675" class="body">Samples, findings,</text>
<text x="52" y="700" class="body">configuration</text>
<text x="52" y="725" class="body">and reports.</text>
</g>
<g>
<rect class="panel" x="247" y="610" width="198" height="145" rx="14" fill="var(--teal-soft)"/>
<rect x="247" y="628" width="4" height="109" rx="2" fill="var(--teal)"/>
<text x="267" y="644" class="heading">Identity DB</text>
<text x="267" y="675" class="body">Users, sessions,</text>
<text x="267" y="700" class="body">permissions</text>
<text x="267" y="725" class="body">and audit.</text>
</g>
<g>
<rect class="panel" x="462" y="610" width="198" height="145" rx="14" fill="var(--teal-soft)"/>
<rect x="462" y="628" width="4" height="109" rx="2" fill="var(--teal)"/>
<text x="482" y="644" class="heading">Knowledgebase</text>
<text x="482" y="675" class="body">Versioned local</text>
<text x="482" y="700" class="body">reference data</text>
<text x="482" y="725" class="body">and evidence.</text>
</g>
<g>
<rect class="panel" x="677" y="610" width="198" height="145" rx="14" fill="var(--teal-soft)"/>
<rect x="677" y="628" width="4" height="109" rx="2" fill="var(--teal)"/>
<text x="697" y="644" class="heading">BAM service DB</text>
<text x="697" y="675" class="body">Alignment-service</text>
<text x="697" y="700" class="body">metadata and</text>
<text x="697" y="725" class="body">resource records.</text>
</g>
<g>
<rect class="panel" x="892" y="610" width="196" height="145" rx="14" fill="var(--amber-soft)"/>
<rect x="892" y="628" width="4" height="109" rx="2" fill="var(--amber)"/>
<text x="912" y="644" class="heading">Redis</text>
<text x="912" y="675" class="body">Task broker,</text>
<text x="912" y="700" class="body">task results</text>
<text x="912" y="725" class="body">and caches.</text>
</g>
<path class="edge" d="M197 525 V552 H990 V610"/>
<path class="edge" d="M570 525 V552"/>
<path class="edge" d="M131 552 V610"/>
<path class="edge" d="M346 552 V610"/>
<path class="edge" d="M561 552 V610"/>
<path class="edge" d="M776 552 V610"/>
<text x="32" y="803" class="small">Each MongoDB service has an independent URI/name pair. Shared file mounts carry ingest and report artifacts.</text>
</svg>
