<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1040" viewBox="0 0 1360 1040" role="img" aria-labelledby="title desc">
<title id="title">Clinical resources and saved evidence</title>
<desc id="desc">Arrows identify a dependency or data contribution; dashed arrows identify optional gene-list selection. Logical relationships, not SQL foreign keys. All analysis domains are gated by assay configuration.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#302b38}
.heading{font-size:26px;font-weight:700}.subtitle,.note{font-size:16px;fill:#625a6b}
.card rect{fill:#fff;stroke:#cfc6da;stroke-width:1.5}.name{font-size:19px;font-weight:700;fill:#52366d}
.detail{font-size:16px}.edge{fill:none;stroke:#78638d;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
.optional{stroke-dasharray:6 5}.edge-label rect{fill:#faf9fc;stroke:#e7e1ec}.label{font-size:14px;fill:#52366d}</style><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#78638d"/></marker></defs>
<rect width="1360" height="1040" rx="12" fill="#faf9fc"/>
<text x="40" y="44" class="heading">Clinical resources and saved evidence</text>
<text x="40" y="84" class="subtitle">Arrows identify a dependency or data contribution; dashed arrows identify optional gene-list selection. Logical relationships, not SQL</text>
<text x="40" y="108" class="subtitle">foreign keys. All analysis domains are gated by assay configuration.</text>
