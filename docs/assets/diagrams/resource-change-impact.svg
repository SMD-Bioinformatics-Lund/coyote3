  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="310" class="entity purple">
    <title>Group availability change</title>
    <use href="#icon-pen" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <text x="240" y="229" text-anchor="middle" class="entity-title">Group availability change</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">Disable or reactivate parent group</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">Blocks new governed operations</text>
    <text x="240" y="290" text-anchor="middle" class="entity-detail">Does not rewrite child statuses</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="328" class="entity purple">
    <title>Subpanel availability change</title>
    <use href="#icon-pen" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <text x="680" y="229" text-anchor="middle" class="entity-title">Subpanel availability change</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">Shared definition has global</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">status</text>
    <text x="680" y="290" text-anchor="middle" class="entity-detail">Each assay link has its own status</text>
    <text x="680" y="308" text-anchor="middle" class="entity-detail">Both required for new selection</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="328" class="entity blue">
    <title>Clinical resource revision</title>
    <use href="#icon-layers" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="229" text-anchor="middle" class="entity-title">Clinical resource revision</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">ASP / ASPC / ISGL new revision</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">Validate cross-resource</text>
    <text x="1120" y="290" text-anchor="middle" class="entity-detail">references</text>
    <text x="1120" y="308" text-anchor="middle" class="entity-detail">Record actor and version history</text>
  </g>
  <g data-node="3" data-left="80" data-top="468" data-right="400" data-bottom="657" class="entity blue">
    <title>Existing clinical records</title>
    <use href="#icon-layers" x="211" y="473" width="58" height="58" aria-hidden="true" />
    <text x="240" y="558" text-anchor="middle" class="entity-title">Existing clinical records</text>
    <text x="240" y="583" text-anchor="middle" class="entity-detail">Samples and reports remain</text>
    <text x="240" y="601" text-anchor="middle" class="entity-detail">stored</text>
    <text x="240" y="619" text-anchor="middle" class="entity-detail">Review uses existing access policy</text>
    <text x="240" y="637" text-anchor="middle" class="entity-detail">No cascading clinical deletion</text>
  </g>
  <g data-node="4" data-left="520" data-top="468" data-right="840" data-bottom="657" class="entity teal">
    <title>New scope resolution</title>
    <use href="#icon-scope" x="651" y="473" width="58" height="58" aria-hidden="true" />
    <text x="680" y="558" text-anchor="middle" class="entity-title">New scope resolution</text>
    <text x="680" y="583" text-anchor="middle" class="entity-detail">Exclude inactive named</text>
    <text x="680" y="601" text-anchor="middle" class="entity-detail">associations</text>
    <text x="680" y="619" text-anchor="middle" class="entity-detail">Preserve historic scope identities</text>
    <text x="680" y="637" text-anchor="middle" class="entity-detail">No implicit sibling reactivation</text>
  </g>
  <g data-node="5" data-left="960" data-top="468" data-right="1280" data-bottom="657" class="entity purple">
    <title>Sample configuration state</title>
    <use href="#icon-settings" x="1091" y="473" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="558" text-anchor="middle" class="entity-title">Sample configuration state</text>
    <text x="1120" y="583" text-anchor="middle" class="entity-detail">Read recorded ASPC revision</text>
    <text x="1120" y="601" text-anchor="middle" class="entity-detail">Persist sample filters separately</text>
    <text x="1120" y="619" text-anchor="middle" class="entity-detail">Updates/reset are explicit</text>
    <text x="1120" y="637" text-anchor="middle" class="entity-detail">operations</text>
  </g>
  <g data-node="6" data-left="80" data-top="741" data-right="400" data-bottom="912" class="entity purple">
    <title>Published rule release</title>
    <use href="#icon-settings" x="211" y="746" width="58" height="58" aria-hidden="true" />
    <text x="240" y="831" text-anchor="middle" class="entity-title">Published rule release</text>
    <text x="240" y="856" text-anchor="middle" class="entity-detail">Separate review and publication</text>
    <text x="240" y="874" text-anchor="middle" class="entity-detail">Exact scope then permitted Base</text>
    <text x="240" y="892" text-anchor="middle" class="entity-detail">Version + content hash recorded</text>
  </g>
  <g data-node="7" data-left="520" data-top="741" data-right="840" data-bottom="930" class="entity blue">
    <title>Live report preview</title>
    <use href="#icon-report" x="651" y="746" width="58" height="58" aria-hidden="true" />
    <text x="680" y="831" text-anchor="middle" class="entity-title">Live report preview</text>
    <text x="680" y="856" text-anchor="middle" class="entity-detail">Prepared from current review</text>
    <text x="680" y="874" text-anchor="middle" class="entity-detail">state</text>
    <text x="680" y="892" text-anchor="middle" class="entity-detail">Effective configuration and rules</text>
    <text x="680" y="910" text-anchor="middle" class="entity-detail">Temporary until confirmed</text>
  </g>
  <g data-node="8" data-left="960" data-top="741" data-right="1280" data-bottom="930" class="entity teal">
    <title>Saved report</title>
    <use href="#icon-report" x="1091" y="746" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="831" text-anchor="middle" class="entity-title">Saved report</text>
    <text x="1120" y="856" text-anchor="middle" class="entity-detail">Preserved finding/config</text>
    <text x="1120" y="874" text-anchor="middle" class="entity-detail">snapshots</text>
    <text x="1120" y="892" text-anchor="middle" class="entity-detail">Rule identity and content hash</text>
    <text x="1120" y="910" text-anchor="middle" class="entity-detail">Later changes do not rewrite it</text>
  </g>
  <g data-edge="0" class="relationship blue">
    <text x="335" y="440" text-anchor="middle" class="edge-label">preserves</text>
  </g>
  <g data-edge="1" class="relationship teal">
    <text x="775" y="412" text-anchor="middle" class="edge-label">gates</text>
  </g>
  <g data-edge="2" class="relationship purple">
    <text x="1215" y="384" text-anchor="middle" class="edge-label">versioned context</text>
  </g>
  <g data-edge="3" class="relationship blue">
    <text x="995" y="713" text-anchor="middle" class="edge-label">prepare effective state</text>
  </g>
  <g data-edge="4" class="relationship blue">
    <text x="460" y="758" text-anchor="middle" class="edge-label">evaluates</text>
  </g>
  <g data-edge="5" class="relationship teal">
    <text x="900" y="758" text-anchor="middle" class="edge-label">confirm</text>
  </g>
</svg>
