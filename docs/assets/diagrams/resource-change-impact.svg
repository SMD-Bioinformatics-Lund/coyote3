    <path d="M275 173 L408 173Q430 173 430 195 L430 426Q430 448 408 448 L249.5 448Q240 448 240 457.5 L240 467" data-source="0" data-target="3" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 173 L848 173Q870 173 870 195 L870 398Q870 420 848 420 L702 420Q680 420 680 442 L680 467" data-source="1" data-target="4" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M1155 173 L1288 173Q1310 173 1310 195 L1310 370Q1310 392 1288 392 L1142 392Q1120 392 1120 414 L1120 467" data-source="2" data-target="5" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M1155 502 L1288 502Q1310 502 1310 524 L1310 699Q1310 721 1288 721 L689.5 721Q680 721 680 730.5 L680 740" data-source="5" data-target="7" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
