  <text x="40" y="34" text-anchor="start" class="figure-title">Configuration changes: what changes and what stays historical</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Availability controls, revision changes, sample filter edits, and saved reports have different effects. Historical evidence is not recomputed from a later mutable view.</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">Scope changes require their own validated workflows.</text>
