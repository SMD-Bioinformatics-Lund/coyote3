  <text x="40" y="34" text-anchor="start" class="figure-title">ASP, ASPC, and ISGL update flow</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">An authorized administrator loads a managed form contract, edits an ASP, ASPC, or ISGL, passes canonical identity and document validation, creates a successor revision,</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">retires the previous revision, records a permanent traceability event, and affects future sample resolution while saved reports remain unchanged.</text>
  <g class="connections">
    <path d="M275 173C460 161 460 185 645 173" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M715 173C900 161 900 185 1085 173" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M1155 173 L1288 173Q1310 173 1310 195 L1310 334Q1310 356 1288 356 L249.5 356Q240 356 240 365.5 L240 375" data-source="2" data-target="3" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M275 410C460 398 460 422 645 410" data-source="3" data-target="4" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M715 410C900 398 900 422 1085 410" data-source="4" data-target="5" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M1155 410 L1288 410Q1310 410 1310 432 L1310 625Q1310 647 1288 647 L249.5 647Q240 647 240 656.5 L240 666" data-source="5" data-target="6" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M275 701C460 689 460 713 645 701" data-source="6" data-target="7" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M240 667 L240 641Q240 619 262 619 L1098 619Q1120 619 1120 641 L1120 667" data-source="6" data-target="8" data-optional="true" marker-end="url(#arrow-blue)" class="connection blue conditional" />
    <path d="M1155 701 L1288 701Q1310 701 1310 723 L1310 934Q1310 956 1288 956 L249.5 956Q240 956 240 965.5 L240 975" data-source="8" data-target="9" data-optional="true" marker-end="url(#arrow-teal)" class="connection teal conditional" />
  </g>
  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="292" class="entity blue">
    <title>1 · Open resource</title>
    <use href="#icon-layers" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="141.5" text-anchor="middle" class="step-number">1</text>
    <text x="240" y="229" text-anchor="middle" class="entity-title">Open resource</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">ASP · ASPC · ISGL</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">view or edit route</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="292" class="entity purple">
    <title>2 · Permission check</title>
    <use href="#icon-key" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="141.5" text-anchor="middle" class="step-number">2</text>
    <text x="680" y="229" text-anchor="middle" class="entity-title">Permission check</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">resource-specific action</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">and assigned scope</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="292" class="entity blue">
    <title>3 · Managed form context</title>
    <use href="#icon-layers" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="141.5" text-anchor="middle" class="step-number">3</text>
    <text x="1120" y="229" text-anchor="middle" class="entity-title">Managed form context</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">schema + allowed options</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">current document values</text>
  </g>
  <g data-node="3" data-left="80" data-top="376" data-right="400" data-bottom="529" class="entity blue">
    <title>4 · Submit change</title>
    <use href="#icon-upload" x="211" y="381" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="375" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="378.5" text-anchor="middle" class="step-number">4</text>
    <text x="240" y="466" text-anchor="middle" class="entity-title">Submit change</text>
    <text x="240" y="491" text-anchor="middle" class="entity-detail">typed API payload</text>
    <text x="240" y="509" text-anchor="middle" class="entity-detail">actor identity</text>
  </g>
  <g data-node="4" data-left="520" data-top="376" data-right="840" data-bottom="547" class="entity teal">
    <title>5 · Normalize and validate</title>
    <use href="#icon-check" x="651" y="381" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="375" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="378.5" text-anchor="middle" class="step-number">5</text>
    <text x="680" y="466" text-anchor="middle" class="entity-title">Normalize and validate</text>
    <text x="680" y="491" text-anchor="middle" class="entity-detail">canonical lowercase identifier</text>
    <text x="680" y="509" text-anchor="middle" class="entity-detail">allowed characters and vocabulary</text>
    <text x="680" y="527" text-anchor="middle" class="entity-detail">Pydantic collection contract</text>
  </g>
  <g data-node="5" data-left="960" data-top="376" data-right="1280" data-bottom="583" class="entity blue">
    <title>6 · Cross-resource checks</title>
    <use href="#icon-layers" x="1091" y="381" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="375" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="378.5" text-anchor="middle" class="step-number">6</text>
    <text x="1120" y="466" text-anchor="middle" class="entity-title">Cross-resource checks</text>
    <text x="1120" y="491" text-anchor="middle" class="entity-detail">ASPC references an active ASP</text>
    <text x="1120" y="509" text-anchor="middle" class="entity-detail">ASP-derived</text>
    <text x="1120" y="527" text-anchor="middle" class="entity-detail">group/category/platform</text>
    <text x="1120" y="545" text-anchor="middle" class="entity-detail">analysis, filters, report sections</text>
    <text x="1120" y="563" text-anchor="middle" class="entity-detail">ISGL associations remain valid</text>
  </g>
  <g data-node="6" data-left="80" data-top="667" data-right="400" data-bottom="838" class="entity blue">
    <title>7 · Rotate revision</title>
    <use href="#icon-layers" x="211" y="672" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="666" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="669.5" text-anchor="middle" class="step-number">7</text>
    <text x="240" y="757" text-anchor="middle" class="entity-title">Rotate revision</text>
    <text x="240" y="782" text-anchor="middle" class="entity-detail">insert version + 1 as active</text>
    <text x="240" y="800" text-anchor="middle" class="entity-detail">retire previous active revision</text>
    <text x="240" y="818" text-anchor="middle" class="entity-detail">preserve stable business key</text>
  </g>
  <g data-node="7" data-left="520" data-top="667" data-right="840" data-bottom="838" class="entity blue">
    <title>8 · Record traceability event</title>
    <use href="#icon-layers" x="651" y="672" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="666" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="669.5" text-anchor="middle" class="step-number">8</text>
    <text x="680" y="757" text-anchor="middle" class="entity-title">Record traceability event</text>
    <text x="680" y="782" text-anchor="middle" class="entity-detail">actor · old/new revision ·</text>
    <text x="680" y="800" text-anchor="middle" class="entity-detail">resource key</text>
    <text x="680" y="818" text-anchor="middle" class="entity-detail">immutable · no expiry timestamp</text>
  </g>
  <g data-node="8" data-left="960" data-top="667" data-right="1280" data-bottom="892" class="entity blue">
    <title>Future sample resolution</title>
    <use href="#icon-sample" x="1091" y="672" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="757" text-anchor="middle" class="entity-title">Future sample resolution</text>
    <text x="1120" y="782" text-anchor="middle" class="entity-detail">ASP + requested subpanel +</text>
    <text x="1120" y="800" text-anchor="middle" class="entity-detail">environment</text>
    <text x="1120" y="818" text-anchor="middle" class="entity-detail">exact ASPC or explicit base</text>
    <text x="1120" y="836" text-anchor="middle" class="entity-detail">fallback</text>
    <text x="1120" y="854" text-anchor="middle" class="entity-detail">sample receives filters and</text>
    <text x="1120" y="872" text-anchor="middle" class="entity-detail">analysis scope</text>
  </g>
  <g data-node="9" data-left="80" data-top="976" data-right="400" data-bottom="1165" class="entity teal">
    <title>Saved reports unchanged</title>
    <use href="#icon-report" x="211" y="981" width="58" height="58" aria-hidden="true" />
    <text x="240" y="1066" text-anchor="middle" class="entity-title">Saved reports unchanged</text>
    <text x="240" y="1091" text-anchor="middle" class="entity-detail">configuration/filter/finding</text>
    <text x="240" y="1109" text-anchor="middle" class="entity-detail">snapshots</text>
    <text x="240" y="1127" text-anchor="middle" class="entity-detail">plus clinical-rule identity and</text>
    <text x="240" y="1145" text-anchor="middle" class="entity-detail">hash</text>
  </g>
</svg>
