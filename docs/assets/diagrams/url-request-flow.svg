<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="573" viewBox="0 0 1360 573" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">URL and Request Flow</title>
  <desc id="figure-description">A browser URL selects the React page. Its API request passes through FastAPI validation and permissions, application services, and persistence before the response updates the interface.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-browser" viewBox="0 0 24 24">
      <path d="M2 3h20v17H2ZM2 8h20M5 5.5h.01M8 5.5h.01M6 12l-2 2 2 2M18 12l2 2-2 2M10 17l4-6" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">URL and Request Flow</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">A browser URL selects the React page. Its API request passes through FastAPI validation and permissions, application services, and persistence before the response updates</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">the interface.</text>
  <g class="connections">
    <path d="M275 173H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 173H1085" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M1155 173 L1288 173Q1310 173 1310 195 L1310 334Q1310 356 1288 356 L249.5 356Q240 356 240 365.5 L240 375" data-source="2" data-target="3" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M275 410H645" data-source="3" data-target="4" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 410H1085" data-source="4" data-target="5" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
  </g>
  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="292" class="entity blue">
    <title>1 · Open URL</title>
    <use href="#icon-layers" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="141.5" text-anchor="middle" class="step-number">1</text>
    <text x="240" y="229" text-anchor="middle" class="entity-title">Open URL</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">Browser navigation</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">/variants/search?...</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="292" class="entity blue">
    <title>2 · React route / page</title>
    <use href="#icon-layers" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="141.5" text-anchor="middle" class="step-number">2</text>
    <text x="680" y="229" text-anchor="middle" class="entity-title">React route / page</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">Prepare query and UI state</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">Frontend API request</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="292" class="entity blue">
    <title>3 · FastAPI router</title>
    <use href="#icon-browser" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="141.5" text-anchor="middle" class="step-number">3</text>
    <text x="1120" y="229" text-anchor="middle" class="entity-title">FastAPI router</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">Validate request</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">Enforce permissions</text>
  </g>
  <g data-node="3" data-left="80" data-top="376" data-right="400" data-bottom="529" class="entity blue">
    <title>4 · Service and repository</title>
    <use href="#icon-layers" x="211" y="381" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="375" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="378.5" text-anchor="middle" class="step-number">4</text>
    <text x="240" y="466" text-anchor="middle" class="entity-title">Service and repository</text>
    <text x="240" y="491" text-anchor="middle" class="entity-detail">Application workflow</text>
    <text x="240" y="509" text-anchor="middle" class="entity-detail">MongoDB query and Redis cache</text>
  </g>
  <g data-node="4" data-left="520" data-top="376" data-right="840" data-bottom="511" class="entity blue">
    <title>5 · API response</title>
    <use href="#icon-browser" x="651" y="381" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="375" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="378.5" text-anchor="middle" class="step-number">5</text>
    <text x="680" y="466" text-anchor="middle" class="entity-title">API response</text>
    <text x="680" y="491" text-anchor="middle" class="entity-detail">Validated JSON payload</text>
  </g>
  <g data-node="5" data-left="960" data-top="376" data-right="1280" data-bottom="529" class="entity blue">
    <title>6 · React render</title>
    <use href="#icon-layers" x="1091" y="381" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="375" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="378.5" text-anchor="middle" class="step-number">6</text>
    <text x="1120" y="466" text-anchor="middle" class="entity-title">React render</text>
    <text x="1120" y="491" text-anchor="middle" class="entity-detail">Tables, cards, and messages</text>
    <text x="1120" y="509" text-anchor="middle" class="entity-detail">Updated query state</text>
  </g>
</svg>
