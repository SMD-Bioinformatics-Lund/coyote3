    <circle cx="272.0" cy="1142" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="1145.5" text-anchor="middle" class="step-number">11</text>
    <text x="240" y="1233" text-anchor="middle" class="entity-title">Response-model serialization</text>
  </g>
  <g data-node="13" data-left="520" data-top="1143" data-right="840" data-bottom="1260" class="entity purple">
    <title>12 · React Query cache update</title>
    <use href="#icon-branch" x="651" y="1148" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="1142" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="1145.5" text-anchor="middle" class="step-number">12</text>
    <text x="680" y="1233" text-anchor="middle" class="entity-title">React Query cache update</text>
  </g>
  <g data-node="14" data-left="960" data-top="1143" data-right="1280" data-bottom="1260" class="entity blue">
