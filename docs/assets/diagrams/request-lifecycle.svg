    <path d="M715 392 L848 392Q870 392 870 414 L870 599Q870 621 848 621 L702 621Q680 621 680 643 L680 668" data-source="4" data-target="7" data-optional="true" marker-end="url(#arrow-blue)" class="connection blue conditional" />
    <path d="M1155 392 L1288 392Q1310 392 1310 414 L1310 571Q1310 593 1288 593 L702 593Q680 593 680 615 L680 668" data-source="5" data-target="7" data-optional="true" marker-end="url(#arrow-blue)" class="connection blue conditional" />
    <path d="M240 669 L240 587Q240 565 262 565 L1098 565Q1120 565 1120 587 L1120 669" data-source="6" data-target="8" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M1155 703 L1288 703Q1310 703 1310 725 L1310 882Q1310 904 1288 904 L249.5 904Q240 904 240 913.5 L240 923" data-source="8" data-target="9" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M275 958H645" data-source="9" data-target="10" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M715 958H1085" data-source="10" data-target="11" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 958 L848 958Q870 958 870 980 L870 1101Q870 1123 848 1123 L249.5 1123Q240 1123 240 1132.5 L240 1142" data-source="10" data-target="12" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M275 1177H645" data-source="12" data-target="13" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M715 1177H1085" data-source="13" data-target="14" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
  </g>
  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="256" class="entity blue">
    <title>1 · User action</title>
    <use href="#icon-user" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="141.5" text-anchor="middle" class="step-number">1</text>
    <text x="240" y="229" text-anchor="middle" class="entity-title">User action</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="274" class="entity blue">
    <title>2 · React API helper</title>
    <use href="#icon-browser" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="141.5" text-anchor="middle" class="step-number">2</text>
    <text x="680" y="229" text-anchor="middle" class="entity-title">React API helper</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">typed payload + query key</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="274" class="entity blue">
    <title>3 · Reverse proxies</title>
    <use href="#icon-layers" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="141.5" text-anchor="middle" class="step-number">3</text>
    <text x="1120" y="229" text-anchor="middle" class="entity-title">Reverse proxies</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">prefix + /api/v1 routing</text>
  </g>
  <g data-node="3" data-left="80" data-top="358" data-right="400" data-bottom="511" class="entity blue">
    <title>4 · Middleware</title>
    <use href="#icon-layers" x="211" y="363" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="357" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="360.5" text-anchor="middle" class="step-number">4</text>
    <text x="240" y="448" text-anchor="middle" class="entity-title">Middleware</text>
    <text x="240" y="473" text-anchor="middle" class="entity-detail">request ID · CSRF</text>
    <text x="240" y="491" text-anchor="middle" class="entity-detail">session/bearer principal</text>
  </g>
  <g data-node="4" data-left="520" data-top="358" data-right="840" data-bottom="511" class="entity blue">
    <title>5 · Module gate</title>
    <use href="#icon-shield" x="651" y="363" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="357" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="360.5" text-anchor="middle" class="step-number">5</text>
    <text x="680" y="448" text-anchor="middle" class="entity-title">Module gate</text>
    <text x="680" y="473" text-anchor="middle" class="entity-detail">feature enabled?</text>
    <text x="680" y="491" text-anchor="middle" class="entity-detail">disabled → 503</text>
  </g>
  <g data-node="5" data-left="960" data-top="358" data-right="1280" data-bottom="529" class="entity blue">
    <title>6 · Access policy</title>
    <use href="#icon-shield" x="1091" y="363" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="357" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="360.5" text-anchor="middle" class="step-number">6</text>
    <text x="1120" y="448" text-anchor="middle" class="entity-title">Access policy</text>
    <text x="1120" y="473" text-anchor="middle" class="entity-detail">active DB permission</text>
    <text x="1120" y="491" text-anchor="middle" class="entity-detail">role assignment + scope</text>
    <text x="1120" y="509" text-anchor="middle" class="entity-detail">assay · group · environment</text>
  </g>
  <g data-node="6" data-left="80" data-top="669" data-right="400" data-bottom="840" class="entity blue">
    <title>7 · Typed route</title>
    <use href="#icon-layers" x="211" y="674" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="668" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="671.5" text-anchor="middle" class="step-number">7</text>
    <text x="240" y="759" text-anchor="middle" class="entity-title">Typed route</text>
    <text x="240" y="784" text-anchor="middle" class="entity-detail">path/query/body validation</text>
    <text x="240" y="802" text-anchor="middle" class="entity-detail">dependency injection</text>
    <text x="240" y="820" text-anchor="middle" class="entity-detail">application service call</text>
  </g>
  <g data-node="7" data-left="520" data-top="669" data-right="840" data-bottom="822" class="entity blue">
    <title>Denied</title>
    <use href="#icon-layers" x="651" y="674" width="58" height="58" aria-hidden="true" />
    <text x="680" y="759" text-anchor="middle" class="entity-title">Denied</text>
    <text x="680" y="784" text-anchor="middle" class="entity-detail">401 · 403 · 404</text>
    <text x="680" y="802" text-anchor="middle" class="entity-detail">422 · 503</text>
  </g>
  <g data-node="8" data-left="960" data-top="669" data-right="1280" data-bottom="804" class="entity blue">
    <title>8 · Domain workflow</title>
    <use href="#icon-layers" x="1091" y="674" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="668" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="671.5" text-anchor="middle" class="step-number">8</text>
    <text x="1120" y="759" text-anchor="middle" class="entity-title">Domain workflow</text>
    <text x="1120" y="784" text-anchor="middle" class="entity-detail">query, mutation, reporting</text>
  </g>
  <g data-node="9" data-left="80" data-top="924" data-right="400" data-bottom="1059" class="entity blue">
    <title>9 · Repository</title>
    <use href="#icon-layers" x="211" y="929" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="923" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="926.5" text-anchor="middle" class="step-number">9</text>
    <text x="240" y="1014" text-anchor="middle" class="entity-title">Repository</text>
    <text x="240" y="1039" text-anchor="middle" class="entity-detail">collection-specific access</text>
  </g>
  <g data-node="10" data-left="520" data-top="924" data-right="840" data-bottom="1059" class="entity teal">
    <title>10 · MongoDB</title>
    <use href="#icon-database" x="651" y="929" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="923" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="926.5" text-anchor="middle" class="step-number">10</text>
    <text x="680" y="1014" text-anchor="middle" class="entity-title">MongoDB</text>
    <text x="680" y="1039" text-anchor="middle" class="entity-detail">validated documents</text>
  </g>
  <g data-node="11" data-left="960" data-top="924" data-right="1280" data-bottom="1059" class="entity blue">
    <title>Audit + cache effects</title>
    <use href="#icon-layers" x="1091" y="929" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="1014" text-anchor="middle" class="entity-title">Audit + cache effects</text>
    <text x="1120" y="1039" text-anchor="middle" class="entity-detail">critical event · invalidation</text>
  </g>
  <g data-node="12" data-left="80" data-top="1143" data-right="400" data-bottom="1260" class="entity blue">
    <title>11 · Response-model serialization</title>
