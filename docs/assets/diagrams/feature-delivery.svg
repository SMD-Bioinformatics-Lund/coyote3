  <g data-node="0" data-left="80" data-top="148" data-right="400" data-bottom="301" class="entity blue">
    <title>1 · Define outcome</title>
    <use href="#icon-layers" x="211" y="153" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="147" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="150.5" text-anchor="middle" class="step-number">1</text>
    <text x="240" y="238" text-anchor="middle" class="entity-title">Define outcome</text>
    <text x="240" y="263" text-anchor="middle" class="entity-detail">clinical / user / operational</text>
    <text x="240" y="281" text-anchor="middle" class="entity-detail">acceptance and failure states</text>
  </g>
  <g data-node="1" data-left="520" data-top="148" data-right="840" data-bottom="301" class="entity blue">
    <title>2 · Map impact</title>
    <use href="#icon-layers" x="651" y="153" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="147" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="150.5" text-anchor="middle" class="step-number">2</text>
    <text x="680" y="238" text-anchor="middle" class="entity-title">Map impact</text>
    <text x="680" y="263" text-anchor="middle" class="entity-detail">route · permission · contract</text>
    <text x="680" y="281" text-anchor="middle" class="entity-detail">collection · audit · UI</text>
  </g>
  <g data-node="2" data-left="960" data-top="148" data-right="1280" data-bottom="301" class="entity blue">
    <title>3 · Implement vertically</title>
    <use href="#icon-layers" x="1091" y="153" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="147" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="150.5" text-anchor="middle" class="step-number">3</text>
    <text x="1120" y="238" text-anchor="middle" class="entity-title">Implement vertically</text>
    <text x="1120" y="263" text-anchor="middle" class="entity-detail">schema → repository → service</text>
    <text x="1120" y="281" text-anchor="middle" class="entity-detail">route → client → page</text>
  </g>
  <g data-node="3" data-left="80" data-top="413" data-right="400" data-bottom="566" class="entity blue">
    <title>4 · Verify behavior</title>
    <use href="#icon-layers" x="211" y="418" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="412" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="415.5" text-anchor="middle" class="step-number">4</text>
    <text x="240" y="503" text-anchor="middle" class="entity-title">Verify behavior</text>
    <text x="240" y="528" text-anchor="middle" class="entity-detail">unit · API · component · E2E</text>
    <text x="240" y="546" text-anchor="middle" class="entity-detail">negative + permission paths</text>
  </g>
  <g data-node="4" data-left="520" data-top="413" data-right="840" data-bottom="566" class="entity blue">
    <title>5 · Release</title>
    <use href="#icon-layers" x="651" y="418" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="412" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="415.5" text-anchor="middle" class="step-number">5</text>
    <text x="680" y="503" text-anchor="middle" class="entity-title">Release</text>
    <text x="680" y="528" text-anchor="middle" class="entity-detail">changelog + version</text>
    <text x="680" y="546" text-anchor="middle" class="entity-detail">deploy + observe</text>
  </g>
  <g data-node="5" data-left="960" data-top="413" data-right="1280" data-bottom="584" class="entity blue">
    <title>Architecture gate</title>
    <use href="#icon-shield" x="1091" y="418" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="503" text-anchor="middle" class="entity-title">Architecture gate</text>
    <text x="1120" y="528" text-anchor="middle" class="entity-detail">existing patterns preferred</text>
    <text x="1120" y="546" text-anchor="middle" class="entity-detail">data and permission ownership</text>
    <text x="1120" y="564" text-anchor="middle" class="entity-detail">clear</text>
  </g>
  <g data-node="6" data-left="80" data-top="696" data-right="400" data-bottom="849" class="entity blue">
    <title>Contract gate</title>
    <use href="#icon-shield" x="211" y="701" width="58" height="58" aria-hidden="true" />
    <text x="240" y="786" text-anchor="middle" class="entity-title">Contract gate</text>
    <text x="240" y="811" text-anchor="middle" class="entity-detail">typed reads and writes</text>
    <text x="240" y="829" text-anchor="middle" class="entity-detail">OpenAPI and frontend agree</text>
  </g>
  <g data-node="7" data-left="520" data-top="696" data-right="840" data-bottom="867" class="entity blue">
    <title>Release gate</title>
    <use href="#icon-shield" x="651" y="701" width="58" height="58" aria-hidden="true" />
    <text x="680" y="786" text-anchor="middle" class="entity-title">Release gate</text>
    <text x="680" y="811" text-anchor="middle" class="entity-detail">lint · typecheck · tests · build</text>
    <text x="680" y="829" text-anchor="middle" class="entity-detail">browser + documentation</text>
    <text x="680" y="847" text-anchor="middle" class="entity-detail">validation</text>
  </g>
  <text x="40" y="901" text-anchor="start" class="figure-note">DISCOVER</text>
  <text x="40" y="919" text-anchor="start" class="figure-note">DESIGN</text>
  <text x="40" y="937" text-anchor="start" class="figure-note">BUILD</text>
  <text x="40" y="955" text-anchor="start" class="figure-note">VERIFY</text>
  <text x="40" y="973" text-anchor="start" class="figure-note">RELEASE</text>
  <text x="40" y="991" text-anchor="start" class="figure-note">Production evidence and user feedback return to the next requirement</text>
