  <text x="40" y="34" text-anchor="start" class="figure-title">Coyote3 feature delivery flow</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Feature delivery from clinical or operational requirement through architecture impact, contracts, implementation, tests, documentation, review, release, and monitoring.</text>
