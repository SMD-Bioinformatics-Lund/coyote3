<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="835" viewBox="0 0 1360 835" role="img" aria-labelledby="title description">
  <title id="title">Configuration compilation and reviewed environment promotion</title>
  <desc id="description">Published settings profiles and explicit configuration fields compile into an immutable release. Samples pin that release. A separate author and reviewer approve a hashed candidate for another environment without rebinding existing samples.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="layers" viewBox="0 0 24 24">
      <path class="glyph" d="m2 7 10-5 10 5-10 5ZM2 12l10 5 10-5M2 17l10 5 10-5" />
    </symbol>
    <symbol id="document" viewBox="0 0 24 24">
      <path class="glyph" d="M5 2h10l5 5v15H5ZM15 2v6h5M9 12h7M9 16h7M9 19h4" />
    </symbol>
    <symbol id="review" viewBox="0 0 24 24">
      <path class="glyph" d="M8 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM1 21v-3a7 7 0 0 1 12-5M15 17l3 3 5-7" />
    </symbol>
    <symbol id="pin" viewBox="0 0 24 24">
      <path class="glyph" d="M8 2h8l-1 7 4 5H5l4-5ZM12 14v9" />
    </symbol>
    <symbol id="shield" viewBox="0 0 24 24">
      <path class="glyph" d="M12 2 3 6v6c0 5 4 8 9 10 5-2 9-5 9-10V6ZM8 12l3 3 6-7" />
    </symbol>
  </defs>
  <text x="40" y="36" class="figure-title">Define once · compile precisely · publish deliberately</text>
  <text x="40" y="68" class="figure-subtitle">Resource keys resolve scope; immutable releases preserve the decisions used for analysis.</text>
  <g class="entity blue" data-node="0" data-left="30" data-right="430" data-top="135" data-bottom="285">
    <title>Published profiles</title>
    <use href="#layers" x="201" y="135" width="58" height="58" aria-hidden="true" />
    <text x="230" y="219" text-anchor="middle" class="entity-title">Published profiles</text>
    <text x="230" y="244" text-anchor="middle" class="entity-detail">Center → group → family → diagnosis → assay</text>
    <text x="230" y="262" text-anchor="middle" class="entity-detail">Shared scope, then selected environment</text>
  </g>
  <g class="entity purple" data-node="1" data-left="30" data-right="430" data-top="370" data-bottom="520">
    <title>Explicit configuration fields</title>
    <use href="#document" x="201" y="370" width="58" height="58" aria-hidden="true" />
    <text x="230" y="454" text-anchor="middle" class="entity-title">Explicit configuration fields</text>
    <text x="230" y="479" text-anchor="middle" class="entity-detail">Filter defaults · reporting settings</text>
    <text x="230" y="497" text-anchor="middle" class="entity-detail">Exact fields override inherited defaults</text>
  </g>
  <g class="entity teal" data-node="2" data-left="450" data-right="850" data-top="255" data-bottom="405">
    <title>Compiled release</title>
    <use href="#shield" x="621" y="255" width="58" height="58" aria-hidden="true" />
    <text x="650" y="339" text-anchor="middle" class="entity-title">Compiled release</text>
    <text x="650" y="364" text-anchor="middle" class="entity-detail">ObjectId · source versions · hashes</text>
    <text x="650" y="382" text-anchor="middle" class="entity-detail">Captured lists, settings and templates</text>
  </g>
  <g class="entity blue" data-node="3" data-left="900" data-right="1300" data-top="135" data-bottom="285">
    <title>Existing sample</title>
    <use href="#pin" x="1071" y="135" width="58" height="58" aria-hidden="true" />
    <text x="1100" y="219" text-anchor="middle" class="entity-title">Existing sample</text>
    <text x="1100" y="244" text-anchor="middle" class="entity-detail">Pins its exact configuration ObjectId</text>
    <text x="1100" y="262" text-anchor="middle" class="entity-detail">Reports retain their own evidence snapshot</text>
  </g>
  <g class="entity amber" data-node="4" data-left="900" data-right="1300" data-top="355" data-bottom="505">
    <title>Promotion proposal</title>
    <use href="#document" x="1071" y="355" width="58" height="58" aria-hidden="true" />
    <text x="1100" y="439" text-anchor="middle" class="entity-title">Promotion proposal</text>
    <text x="1100" y="464" text-anchor="middle" class="entity-detail">Target environment · evidence · candidate hash</text>
  </g>
  <g class="entity purple" data-node="5" data-left="900" data-right="1300" data-top="570" data-bottom="720">
    <title>Independent approval</title>
    <use href="#review" x="1071" y="570" width="58" height="58" aria-hidden="true" />
    <text x="1100" y="654" text-anchor="middle" class="entity-title">Independent approval</text>
    <text x="1100" y="679" text-anchor="middle" class="entity-detail">Recheck source and target, then publish atomically</text>
    <text x="1100" y="697" text-anchor="middle" class="entity-detail">New target revision; existing sample pins unchanged</text>
  </g>
  <path d="M390 185H450V280H580" class="connection blue" marker-end="url(#arrow-blue)" />
  <path d="M390 420H450V310H580" class="connection purple" marker-end="url(#arrow-purple)" />
  <path d="M730 280H850V185H950" class="connection teal" marker-end="url(#arrow-teal)" />
  <path d="M730 300H850V400H950" class="connection amber" marker-end="url(#arrow-amber)" />
  <path d="M1100 495V565" class="connection purple" marker-end="url(#arrow-purple)" />
  <text x="40" y="775" class="figure-note">Ambiguous bindings, changed review hashes and incompatible templates stop publication. Previous releases</text>
  <text x="40" y="794" class="figure-note">remain available for traceability.</text>
</svg>
