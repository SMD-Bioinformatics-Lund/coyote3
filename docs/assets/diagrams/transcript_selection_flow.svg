<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" role="img" aria-labelledby="title desc">
  <title id="title">Small-variant transcript selection flow</title>
  <desc id="desc">Variant CSQ rows are resolved to an HGNC gene and evaluated through configured RefSeq-first MANE stages, then VEP canonical protein-coding and fallback stages, with impact used only within a stage.</desc>
  <defs><style>.canvas{fill:#f8fafc}.band{fill:#e2e8f0}.source{fill:#dbeafe}.gene{fill:#dcfce7}.stage{fill:#e0e7ff}.fallback{fill:#fef3c7}.result{fill:#fce7f3}.title{font:700 23px Inter,'Segoe UI',Arial,sans-serif;fill:#0f172a}.label{font:700 13px Inter,'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:11px Inter,'Segoe UI',Arial,sans-serif;fill:#334155}.box{stroke:#64748b;stroke-width:1.5}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.next{stroke:#7c3aed;stroke-width:1.8;fill:none;stroke-dasharray:6 4;marker-end:url(#p)}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#475569"/></marker><marker id="p" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#7c3aed"/></marker></defs>
  <rect width="1160" height="600" class="canvas"/><rect x="20" y="18" width="1120" height="48" rx="10" class="band"/><text x="40" y="49" class="title">Configured RefSeq-first transcript selection</text>
  <rect x="55" y="100" width="220" height="92" rx="11" class="box source"/><text x="165" y="127" text-anchor="middle" class="label">1 · VEP CSQ rows</text><text x="165" y="149" text-anchor="middle" class="sub">native transcript namespaces retained</text><text x="165" y="167" text-anchor="middle" class="sub">NM/NR and ENST rows remain separate</text><text x="165" y="185" text-anchor="middle" class="sub">stored in versioned VEP annotations</text>
  <rect x="355" y="100" width="240" height="92" rx="11" class="box gene"/><text x="475" y="127" text-anchor="middle" class="label">2 · Resolve HGNC gene</text><text x="475" y="149" text-anchor="middle" class="sub">HGNC ID first</text><text x="475" y="167" text-anchor="middle" class="sub">approved symbol, previous symbol, aliases</text><text x="475" y="185" text-anchor="middle" class="sub">displayed source symbol is preserved</text>
  <rect x="675" y="100" width="250" height="92" rx="11" class="box source"/><text x="800" y="127" text-anchor="middle" class="label">3 · Load configured order</text><text x="800" y="149" text-anchor="middle" class="sub">transcript_selection.priority</text><text x="800" y="167" text-anchor="middle" class="sub">from center clinical vocabulary</text><text x="800" y="185" text-anchor="middle" class="sub">selectors are validated at startup</text>
  <path d="M275 146 H355" class="arrow"/><path d="M595 146 H675" class="arrow"/>

  <rect x="55" y="275" width="190" height="92" rx="11" class="box stage"/><text x="150" y="302" text-anchor="middle" class="label">1 · NCBI MANE Plus</text><text x="150" y="324" text-anchor="middle" class="sub">matching NM/NR accession</text><text x="150" y="344" text-anchor="middle" class="sub">from HGNC metadata</text>
  <rect x="285" y="275" width="190" height="92" rx="11" class="box stage"/><text x="380" y="302" text-anchor="middle" class="label">2 · Ensembl MANE Plus</text><text x="380" y="324" text-anchor="middle" class="sub">matching ENST accession</text><text x="380" y="344" text-anchor="middle" class="sub">from HGNC metadata</text>
  <rect x="515" y="275" width="190" height="92" rx="11" class="box stage"/><text x="610" y="302" text-anchor="middle" class="label">3 · NCBI MANE Select</text><text x="610" y="324" text-anchor="middle" class="sub">matching NM/NR accession</text><text x="610" y="344" text-anchor="middle" class="sub">RefSeq remains preferred</text>
  <rect x="745" y="275" width="190" height="92" rx="11" class="box stage"/><text x="840" y="302" text-anchor="middle" class="label">4 · Ensembl MANE Select</text><text x="840" y="324" text-anchor="middle" class="sub">matching ENST accession</text><text x="840" y="344" text-anchor="middle" class="sub">used after RefSeq stages</text>
  <path d="M800 192 L150 275" class="arrow"/><path d="M245 321 H285" class="next"/><path d="M475 321 H515" class="next"/><path d="M705 321 H745" class="next"/>

  <rect x="170" y="440" width="220" height="82" rx="11" class="box fallback"/><text x="280" y="467" text-anchor="middle" class="label">5 · VEP canonical</text><text x="280" y="489" text-anchor="middle" class="sub">protein-coding candidate preferred</text><text x="280" y="507" text-anchor="middle" class="sub">after all MANE stages</text>
  <rect x="470" y="440" width="220" height="82" rx="11" class="box fallback"/><text x="580" y="467" text-anchor="middle" class="label">6 · First protein coding</text><text x="580" y="489" text-anchor="middle" class="sub">native row with coding biotype</text><text x="580" y="507" text-anchor="middle" class="sub">used only if earlier stages miss</text>
  <rect x="770" y="440" width="220" height="82" rx="11" class="box result"/><text x="880" y="467" text-anchor="middle" class="label">7 · First available row</text><text x="880" y="489" text-anchor="middle" class="sub">deterministic final fallback</text><text x="880" y="507" text-anchor="middle" class="sub">saved as selected_CSQ</text>
  <path d="M840 367 L280 440" class="next"/><path d="M390 481 H470" class="next"/><path d="M690 481 H770" class="next"/>
  <rect x="300" y="550" width="560" height="32" rx="8" class="gene"/><text x="580" y="571" text-anchor="middle" class="label">Within one stage only: HIGH → MODERATE → LOW → MODIFIER breaks ties</text>
  <path d="M580 522 V550" class="arrow"/>
</svg>
