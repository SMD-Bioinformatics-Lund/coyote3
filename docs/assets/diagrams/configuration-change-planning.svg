<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="663" viewBox="0 0 1360 663" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Plan a configuration change across its dependencies</title>
  <desc id="figure-description">Use the resource-specific validation and governance workflow; do not bypass it with direct database changes. Setup, clinical rules, and public catalog have separate publication workflows; one approval does not publish all three.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M2 12a10 10 0 1 0 20 0 10 10 0 0 0-20 0Z" class="glyph" />
      <path d="m7 12 3 3 7-7" class="glyph" />
    </symbol>
    <symbol id="icon-dna" viewBox="0 0 24 24">
      <path d="M6 2c0 10 12 10 12 20M18 2C18 12 6 12 6 22M7 4h10M8 8h8M8 16h8M7 20h10" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Plan a configuration change across its dependencies</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Use the resource-specific validation and governance workflow; do not bypass it with direct database changes. Setup, clinical rules, and public catalog have separate</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">publication workflows; one approval does not publish all three.</text>
  <g class="connections">
    <path d="M275 173H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 173H1085" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M1155 173 L1288 173Q1310 173 1310 195 L1310 370Q1310 392 1288 392 L1129.5 392Q1120 392 1120 401.5 L1120 411" data-source="2" data-target="5" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M1085 446H715" data-source="5" data-target="4" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M645 446H275" data-source="4" data-target="3" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
  </g>
  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="292" class="entity blue">
    <title>1 · Identify the owner</title>
    <use href="#icon-layers" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="141.5" text-anchor="middle" class="step-number">1</text>
    <text x="240" y="229" text-anchor="middle" class="entity-title">Identify the owner</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">ASP, ASPC, ISGL, diagnosis, rules</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">Public catalog or identity/access</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="328" class="entity blue">
    <title>2 · Record the impact</title>
    <use href="#icon-layers" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="141.5" text-anchor="middle" class="step-number">2</text>
    <text x="680" y="229" text-anchor="middle" class="entity-title">Record the impact</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">Stable IDs + inspected revisions</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">Assays, scopes, environments</text>
    <text x="680" y="290" text-anchor="middle" class="entity-detail">New ingest versus existing</text>
    <text x="680" y="308" text-anchor="middle" class="entity-detail">samples</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="310" class="entity teal">
    <title>3 · Validate in context</title>
    <use href="#icon-check" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="141.5" text-anchor="middle" class="step-number">3</text>
    <text x="1120" y="229" text-anchor="middle" class="entity-title">Validate in context</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">Approved synthetic examples</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">Affected and unaffected scopes</text>
    <text x="1120" y="290" text-anchor="middle" class="entity-detail">Analysis, filters, reports, access</text>
  </g>
  <g data-node="3" data-left="80" data-top="412" data-right="400" data-bottom="601" class="entity blue">
    <title>6 · Correct through governance</title>
    <use href="#icon-dna" x="211" y="417" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="411" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="414.5" text-anchor="middle" class="step-number">6</text>
    <text x="240" y="502" text-anchor="middle" class="entity-title">Correct through governance</text>
    <text x="240" y="527" text-anchor="middle" class="entity-detail">Use supported revision workflows</text>
    <text x="240" y="545" text-anchor="middle" class="entity-detail">Resolve conflicts by reloading</text>
    <text x="240" y="563" text-anchor="middle" class="entity-detail">Preserve historical report</text>
    <text x="240" y="581" text-anchor="middle" class="entity-detail">evidence</text>
  </g>
  <g data-node="4" data-left="520" data-top="412" data-right="840" data-bottom="619" class="entity blue">
    <title>5 · Verify the outcome</title>
    <use href="#icon-layers" x="651" y="417" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="411" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="414.5" text-anchor="middle" class="step-number">5</text>
    <text x="680" y="502" text-anchor="middle" class="entity-title">Verify the outcome</text>
    <text x="680" y="527" text-anchor="middle" class="entity-detail">Active revision / publication</text>
    <text x="680" y="545" text-anchor="middle" class="entity-detail">Applicable audit and error</text>
    <text x="680" y="563" text-anchor="middle" class="entity-detail">evidence</text>
    <text x="680" y="581" text-anchor="middle" class="entity-detail">Existing history remains</text>
    <text x="680" y="599" text-anchor="middle" class="entity-detail">accessible</text>
  </g>
  <g data-node="5" data-left="960" data-top="412" data-right="1280" data-bottom="601" class="entity teal">
    <title>4 · Complete required review</title>
    <use href="#icon-check" x="1091" y="417" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="411" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="414.5" text-anchor="middle" class="step-number">4</text>
    <text x="1120" y="502" text-anchor="middle" class="entity-title">Complete required review</text>
    <text x="1120" y="527" text-anchor="middle" class="entity-detail">Resource-specific approval</text>
    <text x="1120" y="545" text-anchor="middle" class="entity-detail">Independent reviewer where</text>
    <text x="1120" y="563" text-anchor="middle" class="entity-detail">required</text>
    <text x="1120" y="581" text-anchor="middle" class="entity-detail">Publish each governed resource</text>
  </g>
</svg>
