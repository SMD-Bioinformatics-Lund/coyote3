<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="608" viewBox="0 0 1360 608" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">First-deployment bootstrap data flow</title>
  <desc id="figure-description">Fresh setup creates accounts and all selected seed modules. Later changes require administrator API login.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-branch" viewBox="0 0 24 24">
      <path d="M6 4v11a4 4 0 0 0 4 4h8M6 9h8a4 4 0 0 0 4-4V3M3 3h6M15 3h6M15 16l3 3-3 3" class="glyph" />
    </symbol>
    <symbol id="icon-browser" viewBox="0 0 24 24">
      <path d="M2 3h20v17H2ZM2 8h20M5 5.5h.01M8 5.5h.01M6 12l-2 2 2 2M18 12l2 2-2 2M10 17l4-6" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M3 15v7h18v-7M12 17V2M6 8l6-6 6 6" class="glyph" />
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <path d="M16 6a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM3 22v-3c0-8 18-8 18 0v3" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">First-deployment bootstrap data flow</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Fresh setup installs selected modules with system provenance. Later additions and repairs require administrator API login.</text>
  <g class="connections">
    <path d="M275 154H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M715 154H1085" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M1155 154 L1288 154Q1310 154 1310 176 L1310 333Q1310 355 1288 355 L689.5 355Q680 355 680 364.5 L680 374" data-source="2" data-target="4" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M645 409H275" data-source="4" data-target="3" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
  </g>
  <g data-node="0" data-left="80" data-top="120" data-right="400" data-bottom="255" class="entity blue">
    <title>Initial account bootstrap</title>
    <use href="#icon-user" x="211" y="125" width="58" height="58" aria-hidden="true" />
    <text x="240" y="210" text-anchor="middle" class="entity-title">Initial account bootstrap</text>
    <text x="240" y="235" text-anchor="middle" class="entity-detail">two accounts + RBAC only</text>
  </g>
  <g data-node="1" data-left="520" data-top="120" data-right="840" data-bottom="255" class="entity purple">
    <title>Selected default modules</title>
    <use href="#icon-branch" x="651" y="125" width="58" height="58" aria-hidden="true" />
    <text x="680" y="210" text-anchor="middle" class="entity-title">Selected default modules</text>
    <text x="680" y="235" text-anchor="middle" class="entity-detail">catalogs + knowledgebase + demo</text>
  </g>
  <g data-node="2" data-left="960" data-top="120" data-right="1280" data-bottom="291" class="entity blue">
    <title>Fresh data installation</title>
    <use href="#icon-upload" x="1091" y="125" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="210" text-anchor="middle" class="entity-title">Fresh data installation</text>
    <text x="1120" y="235" text-anchor="middle" class="entity-detail">new accounts in this invocation</text>
    <text x="1120" y="253" text-anchor="middle" class="entity-detail">preserve populated references</text>
    <text x="1120" y="271" text-anchor="middle" class="entity-detail">system creation provenance</text>
  </g>
  <g data-node="3" data-left="80" data-top="375" data-right="400" data-bottom="546" class="entity blue">
    <title>API data maintenance</title>
    <use href="#icon-browser" x="211" y="380" width="58" height="58" aria-hidden="true" />
    <text x="240" y="465" text-anchor="middle" class="entity-title">API data maintenance</text>
    <text x="240" y="490" text-anchor="middle" class="entity-detail">administrator login + password setup</text>
    <text x="240" y="508" text-anchor="middle" class="entity-detail">explicit modules + optional force</text>
    <text x="240" y="526" text-anchor="middle" class="entity-detail">preserve unrelated data and history</text>
  </g>
  <g data-node="4" data-left="520" data-top="375" data-right="840" data-bottom="528" class="entity blue">
    <title>Start application services</title>
    <use href="#icon-layers" x="651" y="380" width="58" height="58" aria-hidden="true" />
    <text x="680" y="465" text-anchor="middle" class="entity-title">Start application services</text>
    <text x="680" y="490" text-anchor="middle" class="entity-detail">existing targets skip all bootstrap</text>
    <text x="680" y="508" text-anchor="middle" class="entity-detail">later changes use the API only</text>
  </g>
  <text x="40" y="580" text-anchor="start" class="figure-note">Initial modules can be disabled with skip flags. Maintenance never deploys services or resets existing accounts.</text>
</svg>
