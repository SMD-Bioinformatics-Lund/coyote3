<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="755" viewBox="0 0 1360 755" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Sample anchor and dependent evidence</title>
  <desc id="figure-description">Analysis documents belong to the sample through SAMPLE_ID; configuration controls which analyses apply. Findings remain separate collections. Review metadata and reports use their own typed reference contracts.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-document" viewBox="0 0 24 24">
      <path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 12h8M8 16h8M8 19h5" class="glyph" />
    </symbol>
    <symbol id="icon-report" viewBox="0 0 24 24">
      <path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 18v-3M12 18v-6M16 18v-4" class="glyph" />
    </symbol>
    <symbol id="icon-sample" viewBox="0 0 24 24">
      <path d="M8 2h8M9 2v7l-5 10c-1 2 0 3 2 3h12c2 0 3-1 2-3L15 9V2M7 15h10M9 18h.01M14 19h.01" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Sample anchor and dependent evidence</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Analysis documents belong to the sample through SAMPLE_ID; configuration controls which analyses apply. Findings remain separate collections. Review metadata and reports</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">use their own typed reference contracts.</text>
  <g class="connections">
    <path d="M715 173 L1288 173Q1310 173 1310 195 L1310 408Q1310 430 1288 430 L249.5 430Q240 430 240 439.5 L240 449" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 173 L1288 173Q1310 173 1310 195 L1310 380Q1310 402 1288 402 L702 402Q680 402 680 424 L680 449" data-source="0" data-target="2" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 173 L1288 173Q1310 173 1310 195 L1310 352Q1310 374 1288 374 L1142 374Q1120 374 1120 396 L1120 449" data-source="0" data-target="3" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
  </g>
  <g data-node="0" data-left="80" data-top="139" data-right="1280" data-bottom="310" class="entity blue">
    <title>Sample anchor</title>
    <use href="#icon-sample" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <text x="680" y="229" text-anchor="middle" class="entity-title">Sample anchor</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">samples._id + stable name</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">Assay / environment + filters</text>
    <text x="680" y="290" text-anchor="middle" class="entity-detail">Ingest status + configuration revision</text>
  </g>
  <g data-node="1" data-left="80" data-top="450" data-right="400" data-bottom="657" class="entity blue">
    <title>DNA analysis documents</title>
    <use href="#icon-document" x="211" y="455" width="58" height="58" aria-hidden="true" />
    <text x="240" y="540" text-anchor="middle" class="entity-title">DNA analysis documents</text>
    <text x="240" y="565" text-anchor="middle" class="entity-detail">variants</text>
    <text x="240" y="583" text-anchor="middle" class="entity-detail">cnvs</text>
    <text x="240" y="601" text-anchor="middle" class="entity-detail">translocations</text>
    <text x="240" y="619" text-anchor="middle" class="entity-detail">d4_coverage</text>
    <text x="240" y="637" text-anchor="middle" class="entity-detail">biomarkers / pgx where ingested</text>
  </g>
  <g data-node="2" data-left="520" data-top="450" data-right="840" data-bottom="675" class="entity blue">
    <title>RNA analysis documents</title>
    <use href="#icon-document" x="651" y="455" width="58" height="58" aria-hidden="true" />
    <text x="680" y="540" text-anchor="middle" class="entity-title">RNA analysis documents</text>
    <text x="680" y="565" text-anchor="middle" class="entity-detail">fusions</text>
    <text x="680" y="583" text-anchor="middle" class="entity-detail">rna_expression</text>
    <text x="680" y="601" text-anchor="middle" class="entity-detail">rna_qc</text>
    <text x="680" y="619" text-anchor="middle" class="entity-detail">rna_classification</text>
    <text x="680" y="637" text-anchor="middle" class="entity-detail">Other declared supported</text>
    <text x="680" y="655" text-anchor="middle" class="entity-detail">resources</text>
  </g>
  <g data-node="3" data-left="960" data-top="450" data-right="1280" data-bottom="711" class="entity blue">
    <title>Review and reporting</title>
    <use href="#icon-report" x="1091" y="455" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="540" text-anchor="middle" class="entity-title">Review and reporting</text>
    <text x="1120" y="565" text-anchor="middle" class="entity-detail">sample_comments /</text>
    <text x="1120" y="583" text-anchor="middle" class="entity-detail">finding_comments</text>
    <text x="1120" y="601" text-anchor="middle" class="entity-detail">Annotations and finding actions</text>
    <text x="1120" y="619" text-anchor="middle" class="entity-detail">reports preserve confirmed</text>
    <text x="1120" y="637" text-anchor="middle" class="entity-detail">evidence</text>
    <text x="1120" y="655" text-anchor="middle" class="entity-detail">reported_variants store</text>
    <text x="1120" y="673" text-anchor="middle" class="entity-detail">snapshots</text>
    <text x="1120" y="691" text-anchor="middle" class="entity-detail">Use each contract for exact links</text>
  </g>
  <g data-edge="0" class="relationship blue">
    <text x="775" y="422" text-anchor="middle" class="edge-label">SAMPLE_ID</text>
  </g>
  <g data-edge="1" class="relationship blue">
    <text x="995" y="394" text-anchor="middle" class="edge-label">SAMPLE_ID</text>
  </g>
  <g data-edge="2" class="relationship blue">
    <text x="1215" y="366" text-anchor="middle" class="edge-label">sample / finding references</text>
  </g>
</svg>
