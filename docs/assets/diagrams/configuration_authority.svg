<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Configuration authority and sample resolution</title>
  <desc id="desc">Center files, application catalogs, and versioned MongoDB resources combine into a resolved sample analysis context.</desc>
  <defs><style>.canvas{fill:#f8fafc}.band{fill:#e2e8f0}.title{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.label{font:700 14px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:12px 'Segoe UI',Arial,sans-serif;fill:#334155}.box{stroke:#475569;stroke-width:1.6}.arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#475569"/></marker></defs>
  <rect width="1000" height="480" class="canvas"/><rect x="20" y="18" width="960" height="42" rx="10" class="band"/><text x="38" y="46" class="title">Configuration authority and sample resolution</text>
  <rect x="50" y="95" width="240" height="92" rx="12" class="box" fill="#dbeafe"/><text x="170" y="124" text-anchor="middle" class="label">Center deployment files</text><text x="170" y="148" text-anchor="middle" class="sub">environment + TOML/YAML</text><text x="170" y="168" text-anchor="middle" class="sub">contacts, paths, vocabulary</text>
  <rect x="50" y="250" width="240" height="92" rx="12" class="box" fill="#e0e7ff"/><text x="170" y="279" text-anchor="middle" class="label">Application catalogs</text><text x="170" y="303" text-anchor="middle" class="sub">permissions + roles</text><text x="170" y="323" text-anchor="middle" class="sub">clinical rule grammar</text>
  <rect x="380" y="150" width="250" height="135" rx="12" class="box" fill="#dcfce7"/><text x="505" y="182" text-anchor="middle" class="label">Versioned MongoDB resources</text><text x="505" y="208" text-anchor="middle" class="sub">ASP: assay definition</text><text x="505" y="230" text-anchor="middle" class="sub">ASPC: filters + analyses + reporting</text><text x="505" y="252" text-anchor="middle" class="sub">ISGL: selectable gene scope</text>
  <rect x="720" y="150" width="230" height="135" rx="12" class="box" fill="#fef3c7"/><text x="835" y="182" text-anchor="middle" class="label">Resolved sample context</text><text x="835" y="208" text-anchor="middle" class="sub">active ASP/ASPC release</text><text x="835" y="230" text-anchor="middle" class="sub">sample filter state</text><text x="835" y="252" text-anchor="middle" class="sub">selected/ad hoc gene lists</text>
  <path d="M290 141 L380 190" class="arrow"/><path d="M290 296 L380 250" class="arrow"/><path d="M630 218 L720 218" class="arrow"/>
  <rect x="380" y="350" width="570" height="70" rx="12" class="box" fill="#fce7f3"/><text x="665" y="378" text-anchor="middle" class="label">Clinical execution</text><text x="665" y="400" text-anchor="middle" class="sub">query construction, review tabs, report sections, audit, and saved provenance</text>
  <path d="M835 285 L835 350" class="arrow"/>
</svg>
