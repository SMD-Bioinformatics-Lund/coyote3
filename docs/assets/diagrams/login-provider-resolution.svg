<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1002" viewBox="0 0 1360 1002" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Login provider resolution</title>
  <desc id="figure-description">Login flow from configured provider availability and selected provider through user lookup, per-user authorization, local or LDAP verification, session creation, and failure handling.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-browser" viewBox="0 0 24 24">
      <path d="M2 3h20v17H2ZM2 8h20M5 5.5h.01M8 5.5h.01M6 12l-2 2 2 2M18 12l2 2-2 2M10 17l4-6" class="glyph" />
    </symbol>
    <symbol id="icon-key" viewBox="0 0 24 24">
      <path d="M13 8a5 5 0 1 0-10 0 5 5 0 0 0 10 0ZM12 12l10 10M17 17l3-3M20 20l3-3M6 6h.01" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6" class="glyph" />
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M3 15v7h18v-7M12 17V2M6 8l6-6 6 6" class="glyph" />
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <path d="M16 6a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM3 22v-3c0-8 18-8 18 0v3" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Login provider resolution</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Login flow from configured provider availability and selected provider through user lookup, per-user authorization, local or LDAP verification, session creation, and</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">failure handling.</text>
  <g class="connections">
    <path d="M275 173H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 173H1085" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M1155 173 L1288 173Q1310 173 1310 195 L1310 352Q1310 374 1288 374 L249.5 374Q240 374 240 383.5 L240 393" data-source="2" data-target="3" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M275 428H645" data-source="3" data-target="4" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M240 394 L240 368Q240 346 262 346 L1098 346Q1120 346 1120 368 L1120 394" data-source="3" data-target="5" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 428 L848 428Q870 428 870 450 L870 745Q870 767 848 767 L689.5 767Q680 767 680 776.5 L680 786" data-source="4" data-target="7" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M1155 428 L1288 428Q1310 428 1310 450 L1310 717Q1310 739 1288 739 L702 739Q680 739 680 761 L680 786" data-source="5" data-target="7" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M275 428 L408 428Q430 428 430 450 L430 689Q430 711 408 711 L262 711Q240 711 240 733 L240 786" data-source="3" data-target="6" data-optional="true" marker-end="url(#arrow-blue)" class="connection blue conditional" />
    <path d="M1155 428 L1288 428Q1310 428 1310 450 L1310 661Q1310 683 1288 683 L1142 683Q1120 683 1120 705 L1120 786" data-source="5" data-target="8" data-optional="true" marker-end="url(#arrow-purple)" class="connection purple conditional" />
  </g>
  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="310" class="entity blue">
    <title>1 · Effective providers</title>
    <use href="#icon-layers" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="141.5" text-anchor="middle" class="step-number">1</text>
    <text x="240" y="229" text-anchor="middle" class="entity-title">Effective providers</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">center config, optionally</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">overridden</text>
    <text x="240" y="290" text-anchor="middle" class="entity-detail">by AUTHENTICATION_PROVIDERS</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="310" class="entity blue">
    <title>2 · Login screen</title>
    <use href="#icon-key" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="141.5" text-anchor="middle" class="step-number">2</text>
    <text x="680" y="229" text-anchor="middle" class="entity-title">Login screen</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">shows Local and/or LDAP</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">unconfigured LDAP may remain</text>
    <text x="680" y="290" text-anchor="middle" class="entity-detail">selectable</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="310" class="entity blue">
    <title>3 · Submitted provider</title>
    <use href="#icon-upload" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="141.5" text-anchor="middle" class="step-number">3</text>
    <text x="1120" y="229" text-anchor="middle" class="entity-title">Submitted provider</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">explicit provider from login</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">request</text>
    <text x="1120" y="290" text-anchor="middle" class="entity-detail">plus normalized identifier</text>
  </g>
  <g data-node="3" data-left="80" data-top="394" data-right="400" data-bottom="565" class="entity blue">
    <title>4 · Resolve active user document</title>
    <use href="#icon-user" x="211" y="399" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="393" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="396.5" text-anchor="middle" class="step-number">4</text>
    <text x="240" y="484" text-anchor="middle" class="entity-title">Resolve active user document</text>
    <text x="240" y="509" text-anchor="middle" class="entity-detail">Local: username · LDAP: email</text>
    <text x="240" y="527" text-anchor="middle" class="entity-detail">provider must be listed in</text>
    <text x="240" y="545" text-anchor="middle" class="entity-detail">user.auth_type[]</text>
  </g>
  <g data-node="4" data-left="520" data-top="394" data-right="840" data-bottom="565" class="entity blue">
    <title>5A · Local verification</title>
    <use href="#icon-layers" x="651" y="399" width="58" height="58" aria-hidden="true" />
    <text x="680" y="484" text-anchor="middle" class="entity-title">5A · Local verification</text>
    <text x="680" y="509" text-anchor="middle" class="entity-detail">validate stored password hash</text>
    <text x="680" y="527" text-anchor="middle" class="entity-detail">no LDAP configuration required</text>
    <text x="680" y="545" text-anchor="middle" class="entity-detail">rate limits and audit still apply</text>
  </g>
  <g data-node="5" data-left="960" data-top="394" data-right="1280" data-bottom="619" class="entity blue">
    <title>5B · LDAP verification</title>
    <use href="#icon-layers" x="1091" y="399" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="484" text-anchor="middle" class="entity-title">5B · LDAP verification</text>
    <text x="1120" y="509" text-anchor="middle" class="entity-detail">validate LDAP runtime</text>
    <text x="1120" y="527" text-anchor="middle" class="entity-detail">configuration</text>
    <text x="1120" y="545" text-anchor="middle" class="entity-detail">bind/authenticate against</text>
    <text x="1120" y="563" text-anchor="middle" class="entity-detail">directory</text>
    <text x="1120" y="581" text-anchor="middle" class="entity-detail">configuration error is returned at</text>
    <text x="1120" y="599" text-anchor="middle" class="entity-detail">login</text>
  </g>
  <g data-node="6" data-left="80" data-top="787" data-right="400" data-bottom="940" class="entity blue">
    <title>Structured login failure</title>
    <use href="#icon-key" x="211" y="792" width="58" height="58" aria-hidden="true" />
    <text x="240" y="877" text-anchor="middle" class="entity-title">Structured login failure</text>
    <text x="240" y="902" text-anchor="middle" class="entity-detail">inactive · not allowed · invalid ·</text>
    <text x="240" y="920" text-anchor="middle" class="entity-detail">unavailable</text>
  </g>
  <g data-node="7" data-left="520" data-top="787" data-right="840" data-bottom="940" class="entity blue">
    <title>6 · Create API session</title>
    <use href="#icon-browser" x="651" y="792" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="786" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="789.5" text-anchor="middle" class="step-number">6</text>
    <text x="680" y="877" text-anchor="middle" class="entity-title">Create API session</text>
    <text x="680" y="902" text-anchor="middle" class="entity-detail">roles + permissions + assay scope</text>
    <text x="680" y="920" text-anchor="middle" class="entity-detail">+ last login</text>
  </g>
  <g data-node="8" data-left="960" data-top="787" data-right="1280" data-bottom="922" class="entity purple">
    <title>Provider configuration failure</title>
    <use href="#icon-settings" x="1091" y="792" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="877" text-anchor="middle" class="entity-title">Provider configuration failure</text>
    <text x="1120" y="902" text-anchor="middle" class="entity-detail">application remains available</text>
  </g>
  <text x="40" y="974" text-anchor="start" class="figure-note">ldap</text>
</svg>
