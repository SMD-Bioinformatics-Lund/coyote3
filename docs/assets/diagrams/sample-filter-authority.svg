<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="520" viewBox="0 0 1360 520" role="img" aria-labelledby="title desc">
<title id="title">Which filter state is authoritative?</title>
<desc id="desc">Missing filters, existing filters, and an explicit reset are different operations. Saved reports retain their confirmed filter snapshots even when the current sample filter state changes.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#302b38}
.heading{font-size:26px;font-weight:700}.subtitle,.note{font-size:16px;fill:#625a6b}
.card rect{fill:#fff;stroke:#cfc6da;stroke-width:1.5}.name{font-size:19px;font-weight:700;fill:#52366d}
.detail{font-size:16px}.edge{fill:none;stroke:#78638d;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
.optional{stroke-dasharray:6 5}.edge-label rect{fill:#faf9fc;stroke:#e7e1ec}.label{font-size:14px;fill:#52366d}</style><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#78638d"/></marker></defs>
<rect width="1360" height="520" rx="12" fill="#faf9fc"/>
<text x="40" y="44" class="heading">Which filter state is authoritative?</text>
<text x="40" y="84" class="subtitle">Missing filters, existing filters, and an explicit reset are different operations. Saved reports retain their confirmed filter snapshots</text>
<text x="40" y="108" class="subtitle">even when the current sample filter state changes.</text>

<g class="card" data-node="0"><rect x="80" y="220" width="320" height="140" rx="10"/>
<text x="100" y="254" class="name">No sample filters</text>
<text x="100" y="299" class="detail">Read the resolved ASPC defaults</text>
<text x="100" y="322" class="detail">Normalize per analysis and intent</text>
<text x="100" y="345" class="detail">Initialize sample filter state</text>
</g>
<g class="card" data-node="1"><rect x="520" y="220" width="320" height="180" rx="10"/>
<text x="540" y="254" class="name">Sample filters exist</text>
<text x="540" y="299" class="detail">Use the persisted sample filters</text>
<text x="540" y="322" class="detail">Keep selected IDs and thresholds</text>
<text x="540" y="345" class="detail">Do not silently replace with</text>
<text x="540" y="368" class="detail">defaults</text>
</g>
<g class="card" data-node="2"><rect x="960" y="220" width="320" height="180" rx="10"/>
<text x="980" y="254" class="name">User explicitly resets</text>
<text x="980" y="279" class="name">filters</text>
<text x="980" y="324" class="detail">Resolve configuration defaults</text>
<text x="980" y="347" class="detail">Write reset filter state to sample</text>
<text x="980" y="370" class="detail">Refresh dependent review context</text>
</g>


</svg>
