<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="372" viewBox="0 0 1360 372" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Which filter state is authoritative?</title>
  <desc id="figure-description">Missing filters, existing filters, and an explicit reset are different operations. Saved reports retain their confirmed filter snapshots even when the current sample filter state changes.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-filter" viewBox="0 0 24 24">
      <path d="M2 3h20l-8 9v7l-4 3V12Z" class="glyph" />
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <path d="M16 6a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM3 22v-3c0-8 18-8 18 0v3" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Which filter state is authoritative?</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Missing filters, existing filters, and an explicit reset are different operations. Saved reports retain their confirmed filter snapshots even when the current sample</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">filter state changes.</text>
  <g class="connections" />
  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="310" class="entity purple">
    <title>No sample filters</title>
    <use href="#icon-filter" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <text x="240" y="229" text-anchor="middle" class="entity-title">No sample filters</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">Read the resolved ASPC defaults</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">Normalize per analysis and intent</text>
    <text x="240" y="290" text-anchor="middle" class="entity-detail">Initialize sample filter state</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="328" class="entity purple">
    <title>Sample filters exist</title>
    <use href="#icon-filter" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <text x="680" y="229" text-anchor="middle" class="entity-title">Sample filters exist</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">Use the persisted sample filters</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">Keep selected IDs and thresholds</text>
    <text x="680" y="290" text-anchor="middle" class="entity-detail">Do not silently replace with</text>
    <text x="680" y="308" text-anchor="middle" class="entity-detail">defaults</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="310" class="entity blue">
    <title>User explicitly resets filters</title>
    <use href="#icon-user" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="229" text-anchor="middle" class="entity-title">User explicitly resets filters</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">Resolve configuration defaults</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">Write reset filter state to sample</text>
    <text x="1120" y="290" text-anchor="middle" class="entity-detail">Refresh dependent review context</text>
  </g>
</svg>
