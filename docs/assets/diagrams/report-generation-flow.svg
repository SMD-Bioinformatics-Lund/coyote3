<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 850" width="1120" height="850" role="img" aria-labelledby="title description">
<title id="title">Reporting: prepared facts, preview and saved evidence</title>
<desc id="description">Candidate selection, generated suggestions and saved report artifacts are separate operations.</desc>
<defs>
<style>
:root{--canvas:#f7f9fd;--surface:#fff;--ink:#20324b;--muted:#52647b;--edge:#ccd6e4;--blue:#3564a1;--teal:#137d79;--purple:#7752aa;--amber:#986326;--blue-soft:#edf3fc;--teal-soft:#e9f6f3;--purple-soft:#f2edf9;--amber-soft:#fbf3e6}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:var(--muted)}.heading{font-size:19px;font-weight:650}.body{font-size:17px;fill:var(--muted)}.small{font-size:15px;fill:var(--muted)}.edge{fill:none;stroke:var(--blue);stroke-width:2;marker-end:url(#arrow)}.optional{stroke-dasharray:6 5}.panel{stroke:var(--edge);stroke-width:1.2}
@media(prefers-color-scheme:dark){:root{--canvas:#1d2331;--surface:#293244;--ink:#edf1fa;--muted:#c3cede;--edge:#526079;--blue:#94b9ee;--teal:#82d0bf;--purple:#c8aff3;--amber:#e6be82;--blue-soft:#2a3a52;--teal-soft:#263f40;--purple-soft:#3b304d;--amber-soft:#443c30}}
@media print{:root{--canvas:#fff;--surface:#fff;--ink:#20324b;--muted:#52647b;--edge:#ccd6e4;--blue:#3564a1;--teal:#137d79;--purple:#7752aa;--amber:#986326;--blue-soft:#edf3fc;--teal-soft:#e9f6f3;--purple-soft:#f2edf9;--amber-soft:#fbf3e6}}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="m1 1 8 4-8 4" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
</marker>
</defs>
<rect width="1120" height="850" rx="20" fill="var(--canvas)"/>
<text x="32" y="48" class="title">Reporting: prepared facts, preview and saved evidence</text>
<text x="32" y="80" class="subtitle">Candidate selection, generated suggestions and saved report artifacts are separate operations.</text>
<g>
<rect class="panel" x="32" y="135" width="246" height="150" rx="14" fill="var(--blue-soft)"/>
<rect x="32" y="153" width="4" height="114" rx="2" fill="var(--blue)"/>
<text x="52" y="169" class="heading">Configuration</text>
<text x="52" y="200" class="body">Pinned ASP / ASPC,</text>
<text x="52" y="225" class="body">gene scopes, sections</text>
<text x="52" y="250" class="body">and reference versions.</text>
</g>
<g>
<rect class="panel" x="302" y="135" width="246" height="150" rx="14" fill="var(--blue-soft)"/>
<rect x="302" y="153" width="4" height="114" rx="2" fill="var(--blue)"/>
<text x="322" y="169" class="heading">Eligible findings</text>
<text x="322" y="200" class="body">Current filters and query</text>
<text x="322" y="225" class="body">policies; effective tiers,</text>
<text x="322" y="250" class="body">review and annotations.</text>
</g>
<g>
<rect class="panel" x="572" y="135" width="246" height="150" rx="14" fill="var(--amber-soft)"/>
<rect x="572" y="153" width="4" height="114" rx="2" fill="var(--amber)"/>
<text x="592" y="169" class="heading">Report rules</text>
<text x="592" y="200" class="body">Wording and metadata.</text>
<text x="592" y="225" class="body">Can generate a comment</text>
<text x="592" y="250" class="body">suggestion for review.</text>
</g>
<g>
<rect class="panel" x="842" y="135" width="246" height="150" rx="14" fill="var(--teal-soft)"/>
<rect x="842" y="153" width="4" height="114" rx="2" fill="var(--teal)"/>
<text x="862" y="169" class="heading">Sample comment</text>
<text x="862" y="200" class="body">Latest visible comment</text>
<text x="862" y="225" class="body">supplies the conclusion.</text>
<text x="862" y="250" class="body">Empty if no comment.</text>
</g>
<g>
<rect class="panel" x="160" y="375" width="800" height="145" rx="14" fill="var(--purple-soft)"/>
<rect x="160" y="393" width="4" height="109" rx="2" fill="var(--purple)"/>
<text x="180" y="409" class="heading">Prepare a report context</text>
<text x="180" y="440" class="body">Resolve reportable rows and evaluated rule metadata without changing review decisions.</text>
<text x="180" y="465" class="body">Use reviewed sample text; generating a suggestion does not save it.</text>
<text x="180" y="490" class="body">Capture configuration, filters, query-policy lineage and reporting-rule provenance.</text>
</g>
<path class="edge" d="M155 285 V330 H560 V375"/>
<path class="edge" d="M425 285 V330"/>
<path class="edge" d="M695 285 V330"/>
<path class="edge" d="M965 285 V330 H560"/>
<g>
<rect class="panel" x="32" y="610" width="500" height="165" rx="14" fill="var(--blue-soft)"/>
<rect x="32" y="628" width="4" height="129" rx="2" fill="var(--blue)"/>
<text x="52" y="644" class="heading">Preview</text>
<text x="52" y="675" class="body">Render a temporary view from current state.</text>
<text x="52" y="700" class="body">No report record is saved.</text>
<text x="52" y="725" class="body">Review wording, findings and missing-rule warnings.</text>
<text x="52" y="750" class="body">A changed sample/settings requires a fresh preview.</text>
</g>
<g>
<rect class="panel" x="588" y="610" width="500" height="165" rx="14" fill="var(--teal-soft)"/>
<rect x="588" y="628" width="4" height="129" rx="2" fill="var(--teal)"/>
<text x="608" y="644" class="heading">Confirmed save</text>
<text x="608" y="675" class="body">Stage HTML/PDF files and checksums.</text>
<text x="608" y="700" class="body">Transaction: report, snapshots and reported state.</text>
<text x="608" y="725" class="body">Publish staged artifacts; pending publication is retried.</text>
<text x="608" y="750" class="body">Historical reports retain their saved evidence.</text>
</g>
<path class="edge" d="M560 520 V565 H282 V610"/>
<path class="edge" d="M560 565 H838 V610"/>
<text x="32" y="817" class="small">No reporting-rule publication is required to render a report. Missing automatic wording is shown as a warning.</text>
</svg>
