<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="650" viewBox="0 0 1220 650" role="img" aria-labelledby="title desc">
  <title id="title">Celery sample ingest flow</title>
  <desc id="desc">A watched or manually submitted YAML manifest is queued through Redis, validated and parsed by a Celery worker, staged into MongoDB, committed only when declared resources succeed, audited, and renamed done or failed.</desc>
  <defs><style>.canvas{fill:#f8fafc}.band{fill:#e2e8f0}.source{fill:#dbeafe}.task{fill:#fef3c7}.check{fill:#e0e7ff}.store{fill:#dcfce7}.failbox{fill:#fee2e2}.title{font:700 23px Inter,'Segoe UI',Arial,sans-serif;fill:#0f172a}.label{font:700 13px Inter,'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:11px Inter,'Segoe UI',Arial,sans-serif;fill:#334155}.box{stroke:#64748b;stroke-width:1.5}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.fail{stroke:#b91c1c;stroke-width:2;fill:none;stroke-dasharray:6 4;marker-end:url(#r)}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#475569"/></marker><marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#b91c1c"/></marker></defs>
  <rect width="1220" height="650" class="canvas"/><rect x="20" y="18" width="1180" height="48" rx="10" class="band"/><text x="40" y="49" class="title">Manifest-to-ready sample ingestion</text>
  <rect x="45" y="100" width="210" height="92" rx="11" class="box source"/><text x="150" y="127" text-anchor="middle" class="label">1 · Ingest trigger</text><text x="150" y="149" text-anchor="middle" class="sub">Celery beat watch scan</text><text x="150" y="167" text-anchor="middle" class="sub">or Admin upload / queue action</text><text x="150" y="184" text-anchor="middle" class="sub">module and ingest gates enforced</text>
  <rect x="315" y="110" width="180" height="72" rx="11" class="box task"/><text x="405" y="137" text-anchor="middle" class="label">2 · Redis broker</text><text x="405" y="159" text-anchor="middle" class="sub">ingest queue + task ID</text>
  <rect x="555" y="100" width="220" height="92" rx="11" class="box task"/><text x="665" y="127" text-anchor="middle" class="label">3 · Celery worker</text><text x="665" y="149" text-anchor="middle" class="sub">single bundle orchestration</text><text x="665" y="167" text-anchor="middle" class="sub">task state and structured errors</text><text x="665" y="184" text-anchor="middle" class="sub">source manifest locked per run</text>
  <path d="M255 146 H315" class="arrow"/><path d="M495 146 H555" class="arrow"/>

  <rect x="65" y="255" width="220" height="110" rx="11" class="box check"/><text x="175" y="282" text-anchor="middle" class="label">4 · Parse manifest</text><text x="175" y="304" text-anchor="middle" class="sub">DNA/RNA contract + canonical keys</text><text x="175" y="322" text-anchor="middle" class="sub">host paths preserved in documents</text><text x="175" y="340" text-anchor="middle" class="sub">container paths used for reading</text><text x="175" y="358" text-anchor="middle" class="sub">declared files become required</text>
  <rect x="345" y="255" width="230" height="110" rx="11" class="box check"/><text x="460" y="282" text-anchor="middle" class="label">5 · Resolve configuration</text><text x="460" y="304" text-anchor="middle" class="sub">active ASP file policy</text><text x="460" y="322" text-anchor="middle" class="sub">exact ASPC or base fallback</text><text x="460" y="340" text-anchor="middle" class="sub">analysis types + report sections</text><text x="460" y="358" text-anchor="middle" class="sub">default filters and intents</text>
  <rect x="635" y="245" width="240" height="130" rx="11" class="box check"/><text x="755" y="272" text-anchor="middle" class="label">6 · Parse declared resources</text><text x="755" y="294" text-anchor="middle" class="sub">VCF → variants + versioned CSQs</text><text x="755" y="312" text-anchor="middle" class="sub">CNV · profile · coverage</text><text x="755" y="330" text-anchor="middle" class="sub">translocations · fusions · biomarkers</text><text x="755" y="348" text-anchor="middle" class="sub">counts and references verified</text><text x="755" y="366" text-anchor="middle" class="sub">transcript priority applied</text>
  <rect x="935" y="255" width="220" height="110" rx="11" class="box store"/><text x="1045" y="282" text-anchor="middle" class="label">7 · Staged persistence</text><text x="1045" y="304" text-anchor="middle" class="sub">sample anchor + dependents</text><text x="1045" y="322" text-anchor="middle" class="sub">typed repository writes</text><text x="1045" y="340" text-anchor="middle" class="sub">all declared resources checked</text><text x="1045" y="358" text-anchor="middle" class="sub">before ready state</text>
  <path d="M665 192 L175 255" class="arrow"/><path d="M285 310 H345" class="arrow"/><path d="M575 310 H635" class="arrow"/><path d="M875 310 H935" class="arrow"/>

  <rect x="160" y="455" width="260" height="105" rx="11" class="box store"/><text x="290" y="482" text-anchor="middle" class="label">8A · Commit success</text><text x="290" y="504" text-anchor="middle" class="sub">sample enters samples collection</text><text x="290" y="522" text-anchor="middle" class="sub">ingest_status = ready</text><text x="290" y="540" text-anchor="middle" class="sub">success audit + notification</text><text x="290" y="557" text-anchor="middle" class="sub">manifest renamed *.done</text>
  <rect x="760" y="455" width="290" height="105" rx="11" class="box failbox"/><text x="905" y="482" text-anchor="middle" class="label">8B · Fail gracefully</text><text x="905" y="504" text-anchor="middle" class="sub">rollback staged sample/dependents</text><text x="905" y="522" text-anchor="middle" class="sub">sample absent from clinical list</text><text x="905" y="540" text-anchor="middle" class="sub">sanitized failure audit + notification</text><text x="905" y="557" text-anchor="middle" class="sub">manifest renamed *.failed</text>
  <path d="M1045 365 L290 455" class="arrow"/><path d="M175 365 L905 455" class="fail"/><path d="M460 365 L905 455" class="fail"/><path d="M755 375 L905 455" class="fail"/><path d="M1045 365 L905 455" class="fail"/>
  <rect x="340" y="590" width="540" height="38" rx="9" class="task"/><text x="610" y="614" text-anchor="middle" class="label">Task status is observable through Admin Ingest Workspace and runtime controls</text>
  <path d="M290 560 L480 590" class="arrow"/><path d="M905 560 L740 590" class="arrow"/>
</svg>
