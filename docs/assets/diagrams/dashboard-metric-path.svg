<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="894" viewBox="0 0 1360 894" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Dashboard metric data path</title>
  <desc id="figure-description">Independent dashboard requests read Redis metric entries. Cache misses and stale entries are rebuilt from MongoDB by the service or a Celery background task. Relevant collection writes invalidate only dependent metrics.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-browser" viewBox="0 0 24 24">
      <path d="M2 3h20v17H2ZM2 8h20M5 5.5h.01M8 5.5h.01M6 12l-2 2 2 2M18 12l2 2-2 2M10 17l4-6" class="glyph" />
    </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <path d="M4 6c0-4 16-4 16 0s-16 4-16 0Zm0 0v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0" class="glyph" />
    </symbol>
    <symbol id="icon-graph" viewBox="0 0 24 24">
      <path d="M3 2v20h19M7 17v-5M12 17V6M17 17V9" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
    <symbol id="icon-server" viewBox="0 0 24 24">
      <path d="M3 2h18v6H3ZM3 10h18v6H3ZM3 18h18v4H3ZM6 5h.01M6 13h.01M10 5h8M10 13h8M6 20h.01" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Dashboard metric data path</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Independent dashboard requests read Redis metric entries. Cache misses and stale entries are rebuilt from MongoDB by the service or a Celery background task. Relevant</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">collection writes invalidate only dependent metrics.</text>
  <g class="connections">
    <path d="M275 201H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 201H1085" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M1155 201 L1288 201Q1310 201 1310 223 L1310 428Q1310 450 1288 450 L249.5 450Q240 450 240 459.5 L240 469" data-source="2" data-target="3" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M1155 201 L1288 201Q1310 201 1310 223 L1310 400Q1310 422 1288 422 L1142 422Q1120 422 1120 444 L1120 469" data-source="2" data-target="5" data-optional="true" marker-end="url(#arrow-teal)" class="connection teal conditional" />
    <path d="M1085 504H715" data-source="5" data-target="4" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M680 470 L680 462Q680 454 688 454 L1307 454Q1329 454 1329 432 L1329 169Q1329 147 1307 147 L689.5 147Q680 147 680 156.5 L680 166" data-source="4" data-target="1" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M240 661 L240 653Q240 645 248 645 L1301 645Q1323 645 1323 623 L1323 416Q1323 394 1301 394 L1142 394Q1120 394 1120 416 L1120 469" data-source="6" data-target="5" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M240 661 L240 653Q240 645 248 645 L1295 645Q1317 645 1317 623 L1317 388Q1317 366 1295 366 L262 366Q240 366 240 388 L240 469" data-source="6" data-target="3" data-optional="true" marker-end="url(#arrow-blue)" class="connection blue conditional" />
  </g>
  <g data-node="0" data-left="80" data-top="167" data-right="400" data-bottom="302" class="entity teal">
    <title>Dashboard sections</title>
    <use href="#icon-graph" x="211" y="172" width="58" height="58" aria-hidden="true" />
    <text x="240" y="257" text-anchor="middle" class="entity-title">Dashboard sections</text>
    <text x="240" y="282" text-anchor="middle" class="entity-detail">six independent requests</text>
  </g>
  <g data-node="1" data-left="520" data-top="167" data-right="840" data-bottom="302" class="entity blue">
    <title>Metric API endpoint</title>
    <use href="#icon-browser" x="651" y="172" width="58" height="58" aria-hidden="true" />
    <text x="680" y="257" text-anchor="middle" class="entity-title">Metric API endpoint</text>
    <text x="680" y="282" text-anchor="middle" class="entity-detail">one domain payload</text>
  </g>
  <g data-node="2" data-left="960" data-top="167" data-right="1280" data-bottom="302" class="entity teal">
    <title>Redis metric cache</title>
    <use href="#icon-server" x="1091" y="172" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="257" text-anchor="middle" class="entity-title">Redis metric cache</text>
    <text x="1120" y="282" text-anchor="middle" class="entity-detail">fresh, stale, or missing</text>
  </g>
  <g data-node="3" data-left="80" data-top="470" data-right="400" data-bottom="605" class="entity blue">
    <title>Immediate section render</title>
    <use href="#icon-layers" x="211" y="475" width="58" height="58" aria-hidden="true" />
    <text x="240" y="560" text-anchor="middle" class="entity-title">Immediate section render</text>
    <text x="240" y="585" text-anchor="middle" class="entity-detail">partial failures remain isolated</text>
  </g>
  <g data-node="4" data-left="520" data-top="470" data-right="840" data-bottom="605" class="entity teal">
    <title>Dashboard service</title>
    <use href="#icon-graph" x="651" y="475" width="58" height="58" aria-hidden="true" />
    <text x="680" y="560" text-anchor="middle" class="entity-title">Dashboard service</text>
    <text x="680" y="585" text-anchor="middle" class="entity-detail">build only requested metric</text>
  </g>
  <g data-node="5" data-left="960" data-top="470" data-right="1280" data-bottom="605" class="entity teal">
    <title>MongoDB</title>
    <use href="#icon-database" x="1091" y="475" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="560" text-anchor="middle" class="entity-title">MongoDB</text>
    <text x="1120" y="585" text-anchor="middle" class="entity-detail">authoritative collections</text>
  </g>
  <g data-node="6" data-left="80" data-top="661" data-right="400" data-bottom="796" class="entity teal">
    <title>Celery refresh</title>
    <use href="#icon-server" x="211" y="666" width="58" height="58" aria-hidden="true" />
    <text x="240" y="751" text-anchor="middle" class="entity-title">Celery refresh</text>
    <text x="240" y="776" text-anchor="middle" class="entity-detail">scheduled, stale, or manual</text>
  </g>
  <text x="40" y="830" text-anchor="start" class="figure-note">cache miss</text>
  <text x="40" y="848" text-anchor="start" class="figure-note">stale value returned first</text>
  <text x="40" y="866" text-anchor="start" class="figure-note">Collection writes advance dependency markers; only affected metric entries become stale.</text>
</svg>
