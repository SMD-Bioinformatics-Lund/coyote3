<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Sample analysis context resolution</title>
  <desc id="desc">Sample identity resolves ASP and ASPC configuration, analysis tabs, intent-specific filters, gene scope, query policies, and paginated finding results.</desc>
  <defs><style>.canvas{fill:#f8fafc}.band{fill:#e2e8f0}.source{fill:#dbeafe}.config{fill:#e0e7ff}.policy{fill:#fef3c7}.result{fill:#dcfce7}.warn{fill:#fee2e2}.title{font:700 23px Inter,'Segoe UI',Arial,sans-serif;fill:#0f172a}.label{font:700 13px Inter,'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:11px Inter,'Segoe UI',Arial,sans-serif;fill:#334155}.box{stroke:#64748b;stroke-width:1.5}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.branch{stroke:#7c3aed;stroke-width:2;fill:none;marker-end:url(#p)}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#475569"/></marker><marker id="p" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#7c3aed"/></marker></defs>
  <rect width="1200" height="600" class="canvas"/><rect x="20" y="18" width="1160" height="48" rx="10" class="band"/><text x="40" y="49" class="title">ASPC-driven sample analysis resolution</text>
  <rect x="45" y="100" width="210" height="102" rx="11" class="box source"/><text x="150" y="127" text-anchor="middle" class="label">1 · Sample anchor</text><text x="150" y="149" text-anchor="middle" class="sub">sample.name · asp_id</text><text x="150" y="167" text-anchor="middle" class="sub">requested/resolved subpanel</text><text x="150" y="185" text-anchor="middle" class="sub">environment · omics · paired</text>
  <rect x="325" y="90" width="250" height="122" rx="11" class="box config"/><text x="450" y="117" text-anchor="middle" class="label">2 · Resolved ASPC</text><text x="450" y="139" text-anchor="middle" class="sub">analysis_types control available tabs</text><text x="450" y="157" text-anchor="middle" class="sub">analysis_intents control somatic/germline</text><text x="450" y="175" text-anchor="middle" class="sub">filters grouped by analysis and intent</text><text x="450" y="193" text-anchor="middle" class="sub">report_sections control report domains</text>
  <rect x="645" y="100" width="220" height="102" rx="11" class="box config"/><text x="755" y="127" text-anchor="middle" class="label">3 · Gene scope</text><text x="755" y="149" text-anchor="middle" class="sub">selected typed ISGLs</text><text x="755" y="167" text-anchor="middle" class="sub">sample ad-hoc genes</text><text x="755" y="185" text-anchor="middle" class="sub">effective scope by data type</text>
  <rect x="935" y="100" width="220" height="102" rx="11" class="box source"/><text x="1045" y="127" text-anchor="middle" class="label">4 · User request</text><text x="1045" y="149" text-anchor="middle" class="sub">tab · intent · search</text><text x="1045" y="167" text-anchor="middle" class="sub">multi-sort · page · page size</text><text x="1045" y="185" text-anchor="middle" class="sub">temporary filter changes</text>
  <path d="M255 151 H325" class="arrow"/><path d="M575 151 H645" class="arrow"/><path d="M865 151 H935" class="arrow"/>

  <rect x="75" y="290" width="230" height="112" rx="11" class="box policy"/><text x="190" y="317" text-anchor="middle" class="label">5 · Select domain policy</text><text x="190" y="339" text-anchor="middle" class="sub">SNV · CNV · translocation</text><text x="190" y="357" text-anchor="middle" class="sub">fusion · coverage · biomarker</text><text x="190" y="375" text-anchor="middle" class="sub">somatic/germline only where supported</text><text x="190" y="393" text-anchor="middle" class="sub">module availability enforced</text>
  <rect x="365" y="280" width="250" height="132" rx="11" class="box policy"/><text x="490" y="307" text-anchor="middle" class="label">6 · Build effective query</text><text x="490" y="329" text-anchor="middle" class="sub">baseline evidence and thresholds</text><text x="490" y="347" text-anchor="middle" class="sub">selected-transcript consequence</text><text x="490" y="365" text-anchor="middle" class="sub">population/control frequency policy</text><text x="490" y="383" text-anchor="middle" class="sub">gene scope + released exceptions</text><text x="490" y="401" text-anchor="middle" class="sub">no order-dependent admission</text>
  <rect x="675" y="290" width="220" height="112" rx="11" class="box policy"/><text x="785" y="317" text-anchor="middle" class="label">7 · Repository query</text><text x="785" y="339" text-anchor="middle" class="sub">search and all sort keys</text><text x="785" y="357" text-anchor="middle" class="sub">apply to full result set</text><text x="785" y="375" text-anchor="middle" class="sub">then paginate</text><text x="785" y="393" text-anchor="middle" class="sub">cache by complete query key</text>
  <rect x="955" y="290" width="190" height="112" rx="11" class="box result"/><text x="1050" y="317" text-anchor="middle" class="label">8 · Review payload</text><text x="1050" y="339" text-anchor="middle" class="sub">rows + totals</text><text x="1050" y="357" text-anchor="middle" class="sub">filter metadata</text><text x="1050" y="375" text-anchor="middle" class="sub">table state in URL</text><text x="1050" y="393" text-anchor="middle" class="sub">export context</text>
  <path d="M1045 202 L190 290" class="arrow"/><path d="M305 346 H365" class="arrow"/><path d="M615 346 H675" class="arrow"/><path d="M895 346 H955" class="arrow"/>

  <rect x="170" y="485" width="330" height="72" rx="11" class="box result"/><text x="335" y="511" text-anchor="middle" class="label">Review mutation</text><text x="335" y="532" text-anchor="middle" class="sub">tier · false positive · blacklist · report · comments</text><text x="335" y="549" text-anchor="middle" class="sub">invalidate affected React Query family</text>
  <rect x="700" y="485" width="330" height="72" rx="11" class="box config"/><text x="865" y="511" text-anchor="middle" class="label">Filter or gene-list update</text><text x="865" y="532" text-anchor="middle" class="sub">persist sample effective state when saved</text><text x="865" y="549" text-anchor="middle" class="sub">refresh rows and temporary report snapshot</text>
  <path d="M1050 402 L335 485" class="branch"/><path d="M1050 402 L865 485" class="branch"/>
</svg>
