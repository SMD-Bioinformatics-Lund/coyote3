<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="954" viewBox="0 0 1360 954" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">End-to-end clinical workflow</title>
  <desc id="figure-description">Follow the numbered stages from clinical configuration to preserved reporting evidence. Audit records are produced at applicable operations throughout the workflow, not only at the final stage.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M2 12a10 10 0 1 0 20 0 10 10 0 0 0-20 0Z" class="glyph" />
      <path d="m7 12 3 3 7-7" class="glyph" />
    </symbol>
    <symbol id="icon-filter" viewBox="0 0 24 24">
      <path d="M2 3h20l-8 9v7l-4 3V12Z" class="glyph" />
    </symbol>
    <symbol id="icon-microscope" viewBox="0 0 24 24">
      <path d="m7 2 7 3-3 7-7-3ZM13 9c10 2 7 12-1 12H3M7 21v-4h8M2 14h10M11 3l2-2 4 2-2 3" class="glyph" />
    </symbol>
    <symbol id="icon-report" viewBox="0 0 24 24">
      <path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 18v-3M12 18v-6M16 18v-4" class="glyph" />
    </symbol>
    <symbol id="icon-sample" viewBox="0 0 24 24">
      <path d="M8 2h8M9 2v7l-5 10c-1 2 0 3 2 3h12c2 0 3-1 2-3L15 9V2M7 15h10M9 18h.01M14 19h.01" class="glyph" />
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">End-to-end clinical workflow</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Follow the numbered stages from clinical configuration to preserved reporting evidence. Audit records are produced at applicable operations throughout the workflow, not</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">only at the final stage.</text>
  <g class="connections">
    <path d="M275 173H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 173H1085" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M1155 173 L1288 173Q1310 173 1310 195 L1310 370Q1310 392 1288 392 L1129.5 392Q1120 392 1120 401.5 L1120 411" data-source="2" data-target="5" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M1085 446H715" data-source="5" data-target="4" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M645 446H275" data-source="4" data-target="3" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M275 446 L408 446Q430 446 430 468 L430 661Q430 683 408 683 L249.5 683Q240 683 240 692.5 L240 702" data-source="3" data-target="6" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M275 737H645" data-source="6" data-target="7" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M715 737H1085" data-source="7" data-target="8" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
  </g>
  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="328" class="entity purple">
    <title>1 · Configure the assay</title>
    <use href="#icon-settings" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="141.5" text-anchor="middle" class="step-number">1</text>
    <text x="240" y="229" text-anchor="middle" class="entity-title">Configure the assay</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">ASP physical design + ASPC</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">settings</text>
    <text x="240" y="290" text-anchor="middle" class="entity-detail">Optional selected ISGL gene lists</text>
    <text x="240" y="308" text-anchor="middle" class="entity-detail">Published rules and access policy</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="310" class="entity blue">
    <title>2 · Submit the sample bundle</title>
    <use href="#icon-sample" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="141.5" text-anchor="middle" class="step-number">2</text>
    <text x="680" y="229" text-anchor="middle" class="entity-title">Submit the sample bundle</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">Sample YAML manifest</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">Declared analysis files</text>
    <text x="680" y="290" text-anchor="middle" class="entity-detail">Pipeline-produced metadata</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="310" class="entity teal">
    <title>3 · Validate and ingest</title>
    <use href="#icon-check" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="141.5" text-anchor="middle" class="step-number">3</text>
    <text x="1120" y="229" text-anchor="middle" class="entity-title">Validate and ingest</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">Resolve assay and configuration</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">Validate all required inputs</text>
    <text x="1120" y="290" text-anchor="middle" class="entity-detail">Commit clinical records atomically</text>
  </g>
  <g data-node="3" data-left="80" data-top="412" data-right="400" data-bottom="601" class="entity purple">
    <title>6 · Curate the evidence</title>
    <use href="#icon-microscope" x="211" y="417" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="411" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="414.5" text-anchor="middle" class="step-number">6</text>
    <text x="240" y="502" text-anchor="middle" class="entity-title">Curate the evidence</text>
    <text x="240" y="527" text-anchor="middle" class="entity-detail">Finding decisions and</text>
    <text x="240" y="545" text-anchor="middle" class="entity-detail">classifications</text>
    <text x="240" y="563" text-anchor="middle" class="entity-detail">Sample and finding comments</text>
    <text x="240" y="581" text-anchor="middle" class="entity-detail">Shared review state</text>
  </g>
  <g data-node="4" data-left="520" data-top="412" data-right="840" data-bottom="583" class="entity purple">
    <title>5 · Filter and review</title>
    <use href="#icon-filter" x="651" y="417" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="411" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="414.5" text-anchor="middle" class="step-number">5</text>
    <text x="680" y="502" text-anchor="middle" class="entity-title">Filter and review</text>
    <text x="680" y="527" text-anchor="middle" class="entity-detail">Recorded ASPC + sample filters</text>
    <text x="680" y="545" text-anchor="middle" class="entity-detail">Analysis-specific selected genes</text>
    <text x="680" y="563" text-anchor="middle" class="entity-detail">Authorized DNA / RNA workflows</text>
  </g>
  <g data-node="5" data-left="960" data-top="412" data-right="1280" data-bottom="619" class="entity blue">
    <title>4 · Store sample and findings</title>
    <use href="#icon-sample" x="1091" y="417" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="411" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="414.5" text-anchor="middle" class="step-number">4</text>
    <text x="1120" y="502" text-anchor="middle" class="entity-title">Store sample and findings</text>
    <text x="1120" y="527" text-anchor="middle" class="entity-detail">Sample anchor + analysis</text>
    <text x="1120" y="545" text-anchor="middle" class="entity-detail">collections</text>
    <text x="1120" y="563" text-anchor="middle" class="entity-detail">Dependent findings linked by</text>
    <text x="1120" y="581" text-anchor="middle" class="entity-detail">sample</text>
    <text x="1120" y="599" text-anchor="middle" class="entity-detail">Record ingest source and actor</text>
  </g>
  <g data-node="6" data-left="80" data-top="703" data-right="400" data-bottom="910" class="entity blue">
    <title>7 · Preview the report</title>
    <use href="#icon-report" x="211" y="708" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="702" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="705.5" text-anchor="middle" class="step-number">7</text>
    <text x="240" y="793" text-anchor="middle" class="entity-title">Preview the report</text>
    <text x="240" y="818" text-anchor="middle" class="entity-detail">Prepare current reportable</text>
    <text x="240" y="836" text-anchor="middle" class="entity-detail">findings</text>
    <text x="240" y="854" text-anchor="middle" class="entity-detail">Evaluate published clinical rules</text>
    <text x="240" y="872" text-anchor="middle" class="entity-detail">Inspect temporary rendered</text>
    <text x="240" y="890" text-anchor="middle" class="entity-detail">report</text>
  </g>
  <g data-node="7" data-left="520" data-top="703" data-right="840" data-bottom="892" class="entity teal">
    <title>8 · Confirm and save</title>
    <use href="#icon-report" x="651" y="708" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="702" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="705.5" text-anchor="middle" class="step-number">8</text>
    <text x="680" y="793" text-anchor="middle" class="entity-title">Confirm and save</text>
    <text x="680" y="818" text-anchor="middle" class="entity-detail">Report and finding snapshots</text>
    <text x="680" y="836" text-anchor="middle" class="entity-detail">Configuration / rule provenance</text>
    <text x="680" y="854" text-anchor="middle" class="entity-detail">Saved rendered content and</text>
    <text x="680" y="872" text-anchor="middle" class="entity-detail">artifacts</text>
  </g>
  <g data-node="8" data-left="960" data-top="703" data-right="1280" data-bottom="874" class="entity purple">
    <title>9 · Review history and cohorts</title>
    <use href="#icon-microscope" x="1091" y="708" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="702" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="705.5" text-anchor="middle" class="step-number">9</text>
    <text x="1120" y="793" text-anchor="middle" class="entity-title">Review history and cohorts</text>
    <text x="1120" y="818" text-anchor="middle" class="entity-detail">Retrieve saved reports</text>
    <text x="1120" y="836" text-anchor="middle" class="entity-detail">Search reported findings</text>
    <text x="1120" y="854" text-anchor="middle" class="entity-detail">Inspect applicable audit events</text>
  </g>
</svg>
