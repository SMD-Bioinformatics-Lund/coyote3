<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" width="1120" height="820" role="img" aria-labelledby="title description">
<title id="title">Missing results: diagnose the symptom first</title>
<desc id="description">Visibility, ingest completion, analysis availability and finding selection are different boundaries.</desc>
<defs>
<style>
:root{--canvas:#f7f9fd;--surface:#fff;--ink:#20324b;--muted:#52647b;--edge:#ccd6e4;--blue:#3564a1;--teal:#137d79;--purple:#7752aa;--amber:#986326;--blue-soft:#edf3fc;--teal-soft:#e9f6f3;--purple-soft:#f2edf9;--amber-soft:#fbf3e6}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:var(--muted)}.heading{font-size:19px;font-weight:650}.body{font-size:17px;fill:var(--muted)}.small{font-size:15px;fill:var(--muted)}.edge{fill:none;stroke:var(--blue);stroke-width:2;marker-end:url(#arrow)}.optional{stroke-dasharray:6 5}.panel{stroke:var(--edge);stroke-width:1.2}
@media(prefers-color-scheme:dark){:root{--canvas:#1d2331;--surface:#293244;--ink:#edf1fa;--muted:#c3cede;--edge:#526079;--blue:#94b9ee;--teal:#82d0bf;--purple:#c8aff3;--amber:#e6be82;--blue-soft:#2a3a52;--teal-soft:#263f40;--purple-soft:#3b304d;--amber-soft:#443c30}}
@media print{:root{--canvas:#fff;--surface:#fff;--ink:#20324b;--muted:#52647b;--edge:#ccd6e4;--blue:#3564a1;--teal:#137d79;--purple:#7752aa;--amber:#986326;--blue-soft:#edf3fc;--teal-soft:#e9f6f3;--purple-soft:#f2edf9;--amber-soft:#fbf3e6}}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="m1 1 8 4-8 4" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
</marker>
</defs>
<rect width="1120" height="820" rx="20" fill="var(--canvas)"/>
<text x="32" y="48" class="title">Missing results: diagnose the symptom first</text>
<text x="32" y="80" class="subtitle">Visibility, ingest completion, analysis availability and finding selection are different boundaries.</text>
<g>
<rect class="panel" x="360" y="135" width="400" height="125" rx="14" fill="var(--purple-soft)"/>
<rect x="360" y="153" width="4" height="89" rx="2" fill="var(--purple)"/>
<text x="380" y="169" class="heading">What is missing?</text>
<text x="380" y="200" class="body">Identify the symptom before</text>
<text x="380" y="225" class="body">changing clinical filters.</text>
</g>
<g>
<rect class="panel" x="32" y="330" width="496" height="175" rx="14" fill="var(--blue-soft)"/>
<rect x="32" y="348" width="4" height="139" rx="2" fill="var(--blue)"/>
<text x="52" y="364" class="heading">The sample is not visible</text>
<text x="52" y="395" class="body">Check permissions, assay scope and environment.</text>
<text x="52" y="420" class="body">Check date range, search and list filters.</text>
<text x="52" y="445" class="body">Confirm the expected sample identity was submitted.</text>
<text x="52" y="470" class="body">An access problem is not an empty clinical result set.</text>
</g>
<g>
<rect class="panel" x="592" y="330" width="496" height="175" rx="14" fill="var(--amber-soft)"/>
<rect x="592" y="348" width="4" height="139" rx="2" fill="var(--amber)"/>
<text x="612" y="364" class="heading">The sample is not ready</text>
<text x="612" y="395" class="body">Check ingest receipt state and worker progress.</text>
<text x="612" y="420" class="body">Inspect required files, active ASPC and failure details.</text>
<text x="612" y="445" class="body">Resolve the cause before retrying an uncertain job.</text>
<text x="612" y="470" class="body">Do not create placeholder evidence to make it ready.</text>
</g>
<g>
<rect class="panel" x="32" y="565" width="496" height="175" rx="14" fill="var(--blue-soft)"/>
<rect x="32" y="583" width="4" height="139" rx="2" fill="var(--blue)"/>
<text x="52" y="599" class="heading">An analysis tab is missing</text>
<text x="52" y="630" class="body">Check DNA/RNA modality and enabled ASPC analyses.</text>
<text x="52" y="655" class="body">Inspect declared file availability and analysis status.</text>
<text x="52" y="680" class="body">Confirm the sample's pinned configuration revision.</text>
<text x="52" y="705" class="body">Adding a query rule cannot enable a missing analysis.</text>
</g>
<g>
<rect class="panel" x="592" y="565" width="496" height="175" rx="14" fill="var(--teal-soft)"/>
<rect x="592" y="583" width="4" height="139" rx="2" fill="var(--teal)"/>
<text x="612" y="599" class="heading">The analysis or summary is empty</text>
<text x="612" y="630" class="body">Check filters, gene scopes and query policies.</text>
<text x="612" y="655" class="body">Report candidates depend on tier and review state.</text>
<text x="612" y="680" class="body">No reporting rules: automatic wording is unavailable.</text>
<text x="612" y="705" class="body">The saved conclusion uses the latest visible comment.</text>
</g>
<path class="edge" d="M560 260 V650"/>
<path class="edge" d="M560 415 H528"/>
<path class="edge" d="M560 415 H592"/>
<path class="edge" d="M560 650 H528"/>
<path class="edge" d="M560 650 H592"/>
<text x="32" y="790" class="small">Record the failed boundary and its error reference. Change only the configuration or data responsible for that boundary.</text>
</svg>
