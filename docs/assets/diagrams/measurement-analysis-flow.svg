<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1048" viewBox="0 0 1360 1048" role="img" aria-labelledby="title desc">
<title id="title">Independent measurement analyses</title>
<desc id="desc">The ASP declares independent files; the ASPC selects review and report analyses. HRD, MSI, and TMB share storage while retaining separate rule facts and report identities.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#302b38}
.heading{font-size:26px;font-weight:700}.subtitle,.note{font-size:16px;fill:#625a6b}
.card rect{fill:#fff;stroke:#cfc6da;stroke-width:1.5}.name{font-size:19px;font-weight:700;fill:#52366d}
.detail{font-size:16px}.edge{fill:none;stroke:#78638d;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
.optional{stroke-dasharray:6 5}.edge-label rect{fill:#faf9fc;stroke:#e7e1ec}.label{font-size:14px;fill:#52366d}</style><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#78638d"/></marker></defs>
<rect width="1360" height="1048" rx="12" fill="#faf9fc"/>
<text x="40" y="44" class="heading">Independent measurement analyses</text>
<text x="40" y="84" class="subtitle">The ASP declares independent files; the ASPC selects review and report analyses. HRD, MSI, and TMB share storage while retaining separate</text>
<text x="40" y="108" class="subtitle">rule facts and report identities.</text>
<path d="M400 280 L460 280 L460 180 L900 180 L900 280 L960 280" class="edge" data-source="0" data-target="2"/>
<path d="M1120 340 L1120 400 L240 400 L240 500" class="edge" data-source="2" data-target="3"/>
<path d="M680 340 L680 500" class="edge" data-source="1" data-target="4"/>
<path d="M400 560 L520 560" class="edge" data-source="3" data-target="4"/>
<path d="M680 340 L680 400 L700 400 L700 440 L1120 440 L1120 500" class="edge" data-source="1" data-target="5"/>
<path d="M400 560 L460 560 L460 460 L900 460 L900 560 L960 560" class="edge" data-source="3" data-target="5"/>
<path d="M1120 620 L1120 680 L240 680 L240 760" class="edge" data-source="5" data-target="6"/>
<g class="card" data-node="0"><rect x="80" y="220" width="320" height="140" rx="10"/>
<text x="100" y="254" class="name">ASP file policy</text>
<text x="100" y="299" class="detail">hrd · msi · tmb</text>
<text x="100" y="322" class="detail">Expected and required</text>
<text x="100" y="345" class="detail">independently</text>
</g>
<g class="card" data-node="1"><rect x="520" y="220" width="320" height="120" rx="10"/>
<text x="540" y="254" class="name">ASPC selection</text>
<text x="540" y="299" class="detail">HRD · MSI · TMB</text>
<text x="540" y="322" class="detail">Review types and report sections</text>
</g>
<g class="card" data-node="2"><rect x="960" y="220" width="320" height="120" rx="10"/>
<text x="980" y="254" class="name">Raw JSON inputs</text>
<text x="980" y="299" class="detail">Producer values and explicit units</text>
<text x="980" y="322" class="detail">MSIS / MSIP retain their methods</text>
</g>
<g class="card" data-node="3"><rect x="80" y="500" width="320" height="120" rx="10"/>
<text x="100" y="534" class="name">Shared collection</text>
<text x="100" y="579" class="detail">biomarkers with SAMPLE_ID</text>
<text x="100" y="602" class="detail">HRD · MSIS · MSIP · TMB</text>
</g>
<g class="card" data-node="4"><rect x="520" y="500" width="320" height="120" rx="10"/>
<text x="540" y="534" class="name">Review and exports</text>
<text x="540" y="579" class="detail">Selected header measurements</text>
<text x="540" y="602" class="detail">Separate availability and columns</text>
</g>
<g class="card" data-node="5"><rect x="960" y="500" width="320" height="120" rx="10"/>
<text x="980" y="534" class="name">Clinical rules</text>
<text x="980" y="579" class="detail">hrd · msi · tmb collections</text>
<text x="980" y="602" class="detail">Typed values; governed thresholds</text>
</g>
<g class="card" data-node="6"><rect x="80" y="760" width="320" height="120" rx="10"/>
<text x="100" y="794" class="name">Saved reporting evidence</text>
<text x="100" y="839" class="detail">One row per analysis and source</text>
<text x="100" y="862" class="detail">Values and rule provenance frozen</text>
</g>
<g class="edge-label"><rect x="610" y="166" width="140" height="28" rx="5"/>
<text x="618" y="184" class="label">file requirements</text>
</g>
<g class="edge-label"><rect x="616" y="386" width="127" height="28" rx="5"/>
<text x="624" y="404" class="label">validated ingest</text>
</g>
<g class="edge-label"><rect x="614" y="430" width="131" height="28" rx="5"/>
<text x="622" y="448" class="label">enabled analyses</text>
</g>
<g class="edge-label"><rect x="411" y="528" width="97" height="64" rx="5"/>
<text x="419" y="546" class="label">selected</text>
<text x="419" y="564" class="label">measureme</text>
<text x="419" y="582" class="label">nts</text>
</g>
<g class="edge-label"><rect x="846" y="426" width="127" height="28" rx="5"/>
<text x="854" y="444" class="label">report sections</text>
</g>
<g class="edge-label"><rect x="498" y="446" width="99" height="28" rx="5"/>
<text x="506" y="464" class="label">typed facts</text>
</g>
<g class="edge-label"><rect x="604" y="666" width="151" height="28" rx="5"/>
<text x="612" y="684" class="label">reviewed narrative</text>
</g>
<text x="40" y="984" class="note">Zero is a measurement; unavailable input is not a negative result.</text>
<text x="40" y="1008" class="note">Updates replace supplied analyses and preserve other stored measurements.</text>
</svg>
