<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="965" viewBox="0 0 1360 965" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Independent measurement analyses</title>
  <desc id="figure-description">The ASP declares a shared file; the ASPC selects review and report analyses. HRD, MSI, and TMB share storage while retaining separate rule facts and report identities.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <path d="M4 6c0-4 16-4 16 0s-16 4-16 0Zm0 0v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0" class="glyph" />
    </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
      <path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 12h8M8 16h8M8 19h5" class="glyph" />
    </symbol>
    <symbol id="icon-microscope" viewBox="0 0 24 24">
      <path d="m7 2 7 3-3 7-7-3ZM13 9c10 2 7 12-1 12H3M7 21v-4h8M2 14h10M11 3l2-2 4 2-2 3" class="glyph" />
    </symbol>
    <symbol id="icon-report" viewBox="0 0 24 24">
      <path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 18v-3M12 18v-6M16 18v-4" class="glyph" />
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Independent measurement analyses</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">The ASP declares a shared file; the ASPC selects review and report analyses. HRD, MSI, and TMB share storage while retaining separate rule facts and report identities.</text>
  <g class="connections">
    <path d="M240 184 L240 169Q240 154 255 154 L1105 154Q1120 154 1120 169 L1120 184" data-source="0" data-target="2" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M1155 218 L1288 218Q1310 218 1310 240 L1310 453Q1310 475 1288 475 L249.5 475Q240 475 240 484.5 L240 494" data-source="2" data-target="3" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M715 218 L848 218Q870 218 870 240 L870 425Q870 447 848 447 L702 447Q680 447 680 469 L680 494" data-source="1" data-target="4" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M275 529H645" data-source="3" data-target="4" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M715 218 L848 218Q870 218 870 240 L870 397Q870 419 892 419 L1098 419Q1120 419 1120 441 L1120 494" data-source="1" data-target="5" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M240 495 L240 413Q240 391 262 391 L1098 391Q1120 391 1120 413 L1120 495" data-source="3" data-target="5" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M1155 529 L1288 529Q1310 529 1310 551 L1310 690Q1310 712 1288 712 L249.5 712Q240 712 240 721.5 L240 731" data-source="5" data-target="6" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
  </g>
  <g data-node="0" data-left="80" data-top="184" data-right="400" data-bottom="355" class="entity purple">
    <title>ASP file policy</title>
    <use href="#icon-settings" x="211" y="189" width="58" height="58" aria-hidden="true" />
    <text x="240" y="274" text-anchor="middle" class="entity-title">ASP file policy</text>
    <text x="240" y="299" text-anchor="middle" class="entity-detail">biomarkers JSON</text>
    <text x="240" y="317" text-anchor="middle" class="entity-detail">Expected and required</text>
    <text x="240" y="335" text-anchor="middle" class="entity-detail">as one shared resource</text>
  </g>
  <g data-node="1" data-left="520" data-top="184" data-right="840" data-bottom="337" class="entity purple">
    <title>ASPC selection</title>
    <use href="#icon-settings" x="651" y="189" width="58" height="58" aria-hidden="true" />
    <text x="680" y="274" text-anchor="middle" class="entity-title">ASPC selection</text>
    <text x="680" y="299" text-anchor="middle" class="entity-detail">HRD · MSI · TMB</text>
    <text x="680" y="317" text-anchor="middle" class="entity-detail">Review types and report sections</text>
  </g>
  <g data-node="2" data-left="960" data-top="184" data-right="1280" data-bottom="337" class="entity blue">
    <title>Raw JSON inputs</title>
    <use href="#icon-document" x="1091" y="189" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="274" text-anchor="middle" class="entity-title">Raw JSON inputs</text>
    <text x="1120" y="299" text-anchor="middle" class="entity-detail">Producer values and explicit units</text>
    <text x="1120" y="317" text-anchor="middle" class="entity-detail">MSIS / MSIP retain their methods</text>
  </g>
  <g data-node="3" data-left="80" data-top="495" data-right="400" data-bottom="648" class="entity teal">
    <title>Shared collection</title>
    <use href="#icon-database" x="211" y="500" width="58" height="58" aria-hidden="true" />
    <text x="240" y="585" text-anchor="middle" class="entity-title">Shared collection</text>
    <text x="240" y="610" text-anchor="middle" class="entity-detail">biomarkers with SAMPLE_ID</text>
    <text x="240" y="628" text-anchor="middle" class="entity-detail">HRD · MSIS · MSIP · TMB</text>
  </g>
  <g data-node="4" data-left="520" data-top="495" data-right="840" data-bottom="648" class="entity purple">
    <title>Review and exports</title>
    <use href="#icon-microscope" x="651" y="500" width="58" height="58" aria-hidden="true" />
    <text x="680" y="585" text-anchor="middle" class="entity-title">Review and exports</text>
    <text x="680" y="610" text-anchor="middle" class="entity-detail">Selected header measurements</text>
    <text x="680" y="628" text-anchor="middle" class="entity-detail">Separate availability and columns</text>
  </g>
  <g data-node="5" data-left="960" data-top="495" data-right="1280" data-bottom="648" class="entity purple">
    <title>Clinical rules</title>
    <use href="#icon-settings" x="1091" y="500" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="585" text-anchor="middle" class="entity-title">Clinical rules</text>
    <text x="1120" y="610" text-anchor="middle" class="entity-detail">hrd · msi · tmb collections</text>
    <text x="1120" y="628" text-anchor="middle" class="entity-detail">Typed values; governed thresholds</text>
  </g>
  <g data-node="6" data-left="80" data-top="732" data-right="400" data-bottom="885" class="entity teal">
    <title>Saved reporting evidence</title>
    <use href="#icon-report" x="211" y="737" width="58" height="58" aria-hidden="true" />
    <text x="240" y="822" text-anchor="middle" class="entity-title">Saved reporting evidence</text>
    <text x="240" y="847" text-anchor="middle" class="entity-detail">One row per analysis and source</text>
    <text x="240" y="865" text-anchor="middle" class="entity-detail">Values and rule provenance frozen</text>
  </g>
  <g data-edge="0" class="relationship blue">
    <text x="680" y="145" text-anchor="middle" class="edge-label">file requirements</text>
  </g>
  <g data-edge="1" class="relationship teal">
    <text x="775" y="467" text-anchor="middle" class="edge-label">validated ingest</text>
  </g>
  <g data-edge="2" class="relationship purple">
    <text x="775" y="439" text-anchor="middle" class="edge-label">enabled analyses</text>
  </g>
  <g data-edge="3" class="relationship purple">
    <text x="460" y="512" text-anchor="middle" class="edge-label">selected measurements</text>
  </g>
  <g data-edge="4" class="relationship purple">
    <text x="995" y="411" text-anchor="middle" class="edge-label">report sections</text>
  </g>
  <g data-edge="5" class="relationship purple">
    <text x="680" y="382" text-anchor="middle" class="edge-label">typed facts</text>
  </g>
  <g data-edge="6" class="relationship teal">
    <text x="775" y="704" text-anchor="middle" class="edge-label">reviewed narrative</text>
  </g>
  <text x="40" y="919" text-anchor="start" class="figure-note">Zero is a measurement; unavailable input is not a negative result.</text>
  <text x="40" y="937" text-anchor="start" class="figure-note">Updates replace supplied analyses and preserve other stored measurements.</text>
</svg>
