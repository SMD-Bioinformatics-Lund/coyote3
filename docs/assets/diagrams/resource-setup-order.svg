  <text x="40" y="34" text-anchor="start" class="figure-title">What to define first: a new assay to its first sample</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Follow the numbered path. Save drafts as needed; only activation makes staged assay resources operational. Gene lists are optional unless selected by configuration.</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">Public catalog publication follows its own workflow.</text>
