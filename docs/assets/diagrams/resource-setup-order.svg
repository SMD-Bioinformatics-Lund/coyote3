  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="328" class="entity purple">
    <title>1 · Accounts and permissions</title>
    <use href="#icon-key" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="141.5" text-anchor="middle" class="step-number">1</text>
    <text x="240" y="229" text-anchor="middle" class="entity-title">Accounts and permissions</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">Bootstrap permission catalog +</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">roles</text>
    <text x="240" y="290" text-anchor="middle" class="entity-detail">Create / assign authorized users</text>
    <text x="240" y="308" text-anchor="middle" class="entity-detail">Keep author and reviewer distinct</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="310" class="entity blue">
    <title>2 · Active assay group</title>
    <use href="#icon-sample" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="141.5" text-anchor="middle" class="step-number">2</text>
    <text x="680" y="229" text-anchor="middle" class="entity-title">Active assay group</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">Register a stable group identifier</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">Select it in the new assay setup</text>
    <text x="680" y="290" text-anchor="middle" class="entity-detail">Group is not the assay family</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="328" class="entity blue">
    <title>3 · Assay setup draft</title>
    <use href="#icon-sample" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="141.5" text-anchor="middle" class="step-number">3</text>
    <text x="1120" y="229" text-anchor="middle" class="entity-title">Assay setup draft</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">Define ASP identity and modality</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">Physical genes and input file</text>
    <text x="1120" y="290" text-anchor="middle" class="entity-detail">policy</text>
    <text x="1120" y="308" text-anchor="middle" class="entity-detail">Draft ASP is not yet ingest-ready</text>
  </g>
  <g data-node="3" data-left="80" data-top="412" data-right="400" data-bottom="583" class="entity purple">
    <title>6 · Published clinical rules</title>
    <use href="#icon-settings" x="211" y="417" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="411" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="414.5" text-anchor="middle" class="step-number">6</text>
    <text x="240" y="502" text-anchor="middle" class="entity-title">Published clinical rules</text>
    <text x="240" y="527" text-anchor="middle" class="entity-detail">Author, test, review, publish</text>
    <text x="240" y="545" text-anchor="middle" class="entity-detail">Match assay / scope / language</text>
    <text x="240" y="563" text-anchor="middle" class="entity-detail">Separate rule approval lifecycle</text>
  </g>
  <g data-node="4" data-left="520" data-top="412" data-right="840" data-bottom="583" class="entity blue">
    <title>5 · Optional gene lists</title>
    <use href="#icon-dna" x="651" y="417" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="411" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="414.5" text-anchor="middle" class="step-number">5</text>
    <text x="680" y="502" text-anchor="middle" class="entity-title">Optional gene lists</text>
    <text x="680" y="527" text-anchor="middle" class="entity-detail">Stage new compatible ISGLs</text>
    <text x="680" y="545" text-anchor="middle" class="entity-detail">Or select eligible existing lists</text>
    <text x="680" y="563" text-anchor="middle" class="entity-detail">Keep analysis types explicit</text>
  </g>
  <g data-node="5" data-left="960" data-top="412" data-right="1280" data-bottom="583" class="entity teal">
    <title>4 · Scopes and environments</title>
    <use href="#icon-scope" x="1091" y="417" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="411" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="414.5" text-anchor="middle" class="step-number">4</text>
    <text x="1120" y="502" text-anchor="middle" class="entity-title">Scopes and environments</text>
    <text x="1120" y="527" text-anchor="middle" class="entity-detail">Base is always implicit</text>
    <text x="1120" y="545" text-anchor="middle" class="entity-detail">Select optional named diagnoses</text>
    <text x="1120" y="563" text-anchor="middle" class="entity-detail">Choose target environments</text>
  </g>
  <g data-node="6" data-left="80" data-top="667" data-right="400" data-bottom="856" class="entity purple">
    <title>7 · Complete ASPCs</title>
    <use href="#icon-settings" x="211" y="672" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="666" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="669.5" text-anchor="middle" class="step-number">7</text>
    <text x="240" y="757" text-anchor="middle" class="entity-title">Complete ASPCs</text>
    <text x="240" y="782" text-anchor="middle" class="entity-detail">One per scope + environment</text>
    <text x="240" y="800" text-anchor="middle" class="entity-detail">Select analyses and filter</text>
    <text x="240" y="818" text-anchor="middle" class="entity-detail">defaults</text>
    <text x="240" y="836" text-anchor="middle" class="entity-detail">Validate reporting compatibility</text>
  </g>
  <g data-node="7" data-left="520" data-top="667" data-right="840" data-bottom="874" class="entity purple">
    <title>8 · Review and activate</title>
    <use href="#icon-microscope" x="651" y="672" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="666" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="669.5" text-anchor="middle" class="step-number">8</text>
    <text x="680" y="757" text-anchor="middle" class="entity-title">Review and activate</text>
    <text x="680" y="782" text-anchor="middle" class="entity-detail">Submit setup; independent</text>
    <text x="680" y="800" text-anchor="middle" class="entity-detail">approval</text>
    <text x="680" y="818" text-anchor="middle" class="entity-detail">Recheck dependencies and versions</text>
    <text x="680" y="836" text-anchor="middle" class="entity-detail">Commit operational records</text>
    <text x="680" y="854" text-anchor="middle" class="entity-detail">together</text>
  </g>
  <g data-node="8" data-left="960" data-top="667" data-right="1280" data-bottom="838" class="entity purple">
    <title>9 · Ingest and review</title>
    <use href="#icon-microscope" x="1091" y="672" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="666" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="669.5" text-anchor="middle" class="step-number">9</text>
    <text x="1120" y="757" text-anchor="middle" class="entity-title">Ingest and review</text>
    <text x="1120" y="782" text-anchor="middle" class="entity-detail">Validate sample bundle and files</text>
    <text x="1120" y="800" text-anchor="middle" class="entity-detail">Record resolved ASPC and actor</text>
    <text x="1120" y="818" text-anchor="middle" class="entity-detail">Review findings, then save report</text>
  </g>
  <g data-edge="0" class="relationship blue">
    <text x="460" y="156" text-anchor="middle" class="edge-label">authorize</text>
  </g>
  <g data-edge="1" class="relationship blue">
    <text x="900" y="156" text-anchor="middle" class="edge-label">register</text>
  </g>
  <g data-edge="2" class="relationship teal">
    <text x="1215" y="384" text-anchor="middle" class="edge-label">scope</text>
  </g>
  <g data-edge="3" class="relationship blue">
    <text x="900" y="429" text-anchor="middle" class="edge-label">prepare</text>
  </g>
  <g data-edge="4" class="relationship purple">
    <text x="460" y="429" text-anchor="middle" class="edge-label">publish</text>
  </g>
  <g data-edge="5" class="relationship purple">
    <text x="335" y="639" text-anchor="middle" class="edge-label">configure</text>
  </g>
  <g data-edge="6" class="relationship purple">
    <text x="460" y="684" text-anchor="middle" class="edge-label">submit</text>
  </g>
  <g data-edge="7" class="relationship purple">
    <text x="900" y="684" text-anchor="middle" class="edge-label">activate</text>
  </g>
