<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 815" width="1360" height="815" role="img" aria-labelledby="title description">
  <title id="title">Assay readiness: required gates and optional additions</title>
  <desc id="description">Prepare the required scope resources. Optional wording and catalog publication do not block reporting.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-dna" viewBox="0 0 24 24">
      <path d="M6 2c0 10 12 10 12 20M18 2C18 12 6 12 6 22M7 4h10M8 8h8M8 16h8M7 20h10" class="glyph" />
    </symbol>
    <symbol id="icon-processor" viewBox="0 0 24 24">
      <path d="M5 5h14v14H5ZM9 9h6v6H9ZM8 1v4M16 1v4M8 19v4M16 19v4M1 8h4M1 16h4M19 8h4M19 16h4" class="glyph" />
    </symbol>
    <symbol id="icon-report" viewBox="0 0 24 24">
      <path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 18v-3M12 18v-6M16 18v-4" class="glyph" />
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6" class="glyph" />
    </symbol>
    <symbol id="icon-users" viewBox="0 0 24 24">
      <path d="M14 6a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM2 22v-3c0-7 16-7 16 0v3M17 3c6 0 6 8 0 8M19 15c3 1 3 4 3 7" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="36" class="figure-title">Assay readiness: required gates and optional additions</text>
  <text x="40" y="68" class="figure-subtitle">Prepare the required scope resources. Optional wording and catalog publication do not block reporting.</text>
  <text x="38.86" y="132" class="entity-title">REQUIRED FOR THE CLINICAL SCOPE</text>
  <text x="714.0" y="132" class="entity-title">ADD WHEN NEEDED</text>
  <g class="entity blue" data-node="0" data-left="38.86" data-right="646.0" data-top="160.0" data-bottom="300.0">
    <title>People and assay definition</title>
    <use href="#icon-users" x="321.43" y="163.0" width="42" height="42" aria-hidden="true" />
    <text x="342.43" y="223.0" text-anchor="middle" class="entity-title">People and assay definition</text>
    <text x="342.43" y="245.0" text-anchor="middle" class="entity-detail">Resource permissions and an active assay group.</text>
    <text x="342.43" y="263.0" text-anchor="middle" class="entity-detail">Assay identity, modality, family and physical coverage.</text>
    <text x="342.43" y="281.0" text-anchor="middle" class="entity-detail">Reference data required for the enabled analyses.</text>
  </g>
  <g class="entity teal" data-node="1" data-left="714.0" data-right="1321.14" data-top="160.0" data-bottom="300.0">
    <title>Named diagnoses and gene lists</title>
    <use href="#icon-dna" x="996.57" y="163.0" width="42" height="42" aria-hidden="true" />
    <text x="1017.57" y="223.0" text-anchor="middle" class="entity-title">Named diagnoses and gene lists</text>
    <text x="1017.57" y="245.0" text-anchor="middle" class="entity-detail">Base exists without a named diagnosis.</text>
    <text x="1017.57" y="263.0" text-anchor="middle" class="entity-detail">Associate named diagnoses with each eligible assay.</text>
    <text x="1017.57" y="281.0" text-anchor="middle" class="entity-detail">Curated scope is bounded by assay coverage.</text>
  </g>
  <g class="entity purple" data-node="2" data-left="38.86" data-right="646.0" data-top="335.0" data-bottom="485.0">
    <title>Scope configurations</title>
    <use href="#icon-settings" x="321.43" y="338.0" width="42" height="42" aria-hidden="true" />
    <text x="342.43" y="398.0" text-anchor="middle" class="entity-title">Scope configurations</text>
    <text x="342.43" y="420.0" text-anchor="middle" class="entity-detail">One ASPC per selected diagnosis/environment.</text>
    <text x="342.43" y="438.0" text-anchor="middle" class="entity-detail">Enable analyses; set expected and required files.</text>
    <text x="342.43" y="456.0" text-anchor="middle" class="entity-detail">Set initial filters, report sections and reportable tiers.</text>
  </g>
  <g class="entity amber" data-node="3" data-left="714.0" data-right="1321.14" data-top="335.0" data-bottom="485.0">
    <title>Published report wording / catalog</title>
    <use href="#icon-report" x="996.57" y="338.0" width="42" height="42" aria-hidden="true" />
    <text x="1017.57" y="398.0" text-anchor="middle" class="entity-title">Published report wording / catalog</text>
    <text x="1017.57" y="420.0" text-anchor="middle" class="entity-detail">Reporting rules supply optional automatic wording.</text>
    <text x="1017.57" y="438.0" text-anchor="middle" class="entity-detail">No rules: a report remains available with a UI warning.</text>
    <text x="1017.57" y="456.0" text-anchor="middle" class="entity-detail">Catalog offerings have their own publication review.</text>
  </g>
  <g class="entity purple" data-node="4" data-left="194.29" data-right="1165.71" data-top="550.0" data-bottom="660.0">
    <title>Save the configuration</title>
    <use href="#icon-processor" x="659.0" y="553.0" width="42" height="42" aria-hidden="true" />
    <text x="680.0" y="613.0" text-anchor="middle" class="entity-title">Save the configuration</text>
    <text x="680.0" y="635.0" text-anchor="middle" class="entity-detail">Validate the active assay, diagnosis and selected lists.</text>
    <text x="680.0" y="653.0" text-anchor="middle" class="entity-detail">Correct missing configuration and consistency errors before ingest.</text>
  </g>
  <path class="connection blue" d="M282 300 V335" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <path class="connection blue" d="M282 485 V515 H560 V550" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <path class="connection blue conditional" d="M838 300 V320 H560 V410 H532" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <g class="entity teal" data-node="5" data-left="194.29" data-right="1165.71" data-top="705.0" data-bottom="780.0">
    <title>Ready to exercise ingest, clinical review and reporting</title>
    <use href="#icon-report" x="659.0" y="708.0" width="42" height="42" aria-hidden="true" />
    <text x="680.0" y="768.0" text-anchor="middle" class="entity-title">Ready to exercise ingest, clinical review and reporting</text>
  </g>
  <path class="connection blue" d="M560 660 V705" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
</svg>
