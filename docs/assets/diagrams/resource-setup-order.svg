<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 815" width="1120" height="815" role="img" aria-labelledby="title description">
<title id="title">Assay readiness: required gates and optional additions</title>
<desc id="description">Prepare the required scope resources. Optional wording and catalog publication do not block reporting.</desc>
<defs>
<style>
:root{--canvas:#f7f9fd;--surface:#fff;--ink:#20324b;--muted:#52647b;--edge:#ccd6e4;--blue:#3564a1;--teal:#137d79;--purple:#7752aa;--amber:#986326;--blue-soft:#edf3fc;--teal-soft:#e9f6f3;--purple-soft:#f2edf9;--amber-soft:#fbf3e6}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:var(--muted)}.heading{font-size:19px;font-weight:650}.body{font-size:17px;fill:var(--muted)}.small{font-size:15px;fill:var(--muted)}.edge{fill:none;stroke:var(--blue);stroke-width:2;marker-end:url(#arrow)}.optional{stroke-dasharray:6 5}.panel{stroke:var(--edge);stroke-width:1.2}
@media(prefers-color-scheme:dark){:root{--canvas:#1d2331;--surface:#293244;--ink:#edf1fa;--muted:#c3cede;--edge:#526079;--blue:#94b9ee;--teal:#82d0bf;--purple:#c8aff3;--amber:#e6be82;--blue-soft:#2a3a52;--teal-soft:#263f40;--purple-soft:#3b304d;--amber-soft:#443c30}}
@media print{:root{--canvas:#fff;--surface:#fff;--ink:#20324b;--muted:#52647b;--edge:#ccd6e4;--blue:#3564a1;--teal:#137d79;--purple:#7752aa;--amber:#986326;--blue-soft:#edf3fc;--teal-soft:#e9f6f3;--purple-soft:#f2edf9;--amber-soft:#fbf3e6}}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="m1 1 8 4-8 4" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
</marker>
</defs>
<rect width="1120" height="815" rx="20" fill="var(--canvas)"/>
<text x="32" y="48" class="title">Assay readiness: required gates and optional additions</text>
<text x="32" y="80" class="subtitle">Prepare the required scope resources. Optional wording and catalog publication do not block reporting.</text>
<text x="32" y="132" class="heading">REQUIRED FOR THE CLINICAL SCOPE</text>
<text x="588" y="132" class="heading">ADD WHEN NEEDED</text>
<g>
<rect class="panel" x="32" y="160" width="500" height="140" rx="14" fill="var(--blue-soft)"/>
<rect x="32" y="178" width="4" height="104" rx="2" fill="var(--blue)"/>
<text x="52" y="194" class="heading">People and assay definition</text>
<text x="52" y="225" class="body">Authorized authors, reviewers and active group.</text>
<text x="52" y="250" class="body">Assay identity, modality, family and physical coverage.</text>
<text x="52" y="275" class="body">Reference data required for the enabled analyses.</text>
</g>
<g>
<rect class="panel" x="588" y="160" width="500" height="140" rx="14" fill="var(--teal-soft)"/>
<rect x="588" y="178" width="4" height="104" rx="2" fill="var(--teal)"/>
<text x="608" y="194" class="heading">Named diagnoses and gene lists</text>
<text x="608" y="225" class="body">Base exists without a named diagnosis.</text>
<text x="608" y="250" class="body">Associate named diagnoses with each eligible assay.</text>
<text x="608" y="275" class="body">Curated scope is bounded by assay coverage.</text>
</g>
<g>
<rect class="panel" x="32" y="335" width="500" height="150" rx="14" fill="var(--purple-soft)"/>
<rect x="32" y="353" width="4" height="114" rx="2" fill="var(--purple)"/>
<text x="52" y="369" class="heading">Scope configurations</text>
<text x="52" y="400" class="body">One ASPC per selected diagnosis/environment.</text>
<text x="52" y="425" class="body">Enable analyses; set expected and required files.</text>
<text x="52" y="450" class="body">Set initial filters, report sections and reportable tiers.</text>
</g>
<g>
<rect class="panel" x="588" y="335" width="500" height="150" rx="14" fill="var(--amber-soft)"/>
<rect x="588" y="353" width="4" height="114" rx="2" fill="var(--amber)"/>
<text x="608" y="369" class="heading">Published report wording / catalog</text>
<text x="608" y="400" class="body">Reporting rules supply optional automatic wording.</text>
<text x="608" y="425" class="body">No rules: a report remains available with a UI warning.</text>
<text x="608" y="450" class="body">Catalog offerings have their own publication review.</text>
</g>
<g>
<rect class="panel" x="160" y="550" width="800" height="110" rx="14" fill="var(--purple-soft)"/>
<rect x="160" y="568" width="4" height="74" rx="2" fill="var(--purple)"/>
<text x="180" y="584" class="heading">Setup review and activation</text>
<text x="180" y="615" class="body">Validate required resources; independent review precedes activation.</text>
<text x="180" y="640" class="body">Correct missing configuration and consistency errors before ingest.</text>
</g>
<path class="edge" d="M282 300 V335"/>
<path class="edge" d="M282 485 V515 H560 V550"/>
<path class="edge optional" d="M838 300 V320 H560 V410 H532"/>
<g>
<rect class="panel" x="160" y="705" width="800" height="75" rx="14" fill="var(--teal-soft)"/>
<rect x="160" y="723" width="4" height="39" rx="2" fill="var(--teal)"/>
<text x="180" y="739" class="heading">Ready to exercise ingest, clinical review and reporting</text>
</g>
<path class="edge" d="M560 660 V705"/>
</svg>
