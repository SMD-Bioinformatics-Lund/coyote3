<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="581" viewBox="0 0 1360 581" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Test layers and quality gates</title>
  <desc id="figure-description">Each layer checks a different boundary; these are complementary checks, not execution stages. Use the test strategy guide for commands, scope selection, and release validation requirements.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-browser" viewBox="0 0 24 24">
      <path d="M2 3h20v17H2ZM2 8h20M5 5.5h.01M8 5.5h.01M6 12l-2 2 2 2M18 12l2 2-2 2M10 17l4-6" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6Z" class="glyph" />
      <path d="m8 12 3 3 5-6" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Test layers and quality gates</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Each layer checks a different boundary; these are complementary checks, not execution stages. Use the test strategy guide for commands, scope selection, and release</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">validation requirements.</text>
  <g class="connections" />
  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="292" class="entity blue">
    <title>Backend unit tests</title>
    <use href="#icon-layers" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <text x="240" y="229" text-anchor="middle" class="entity-title">Backend unit tests</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">Pure logic, contracts, and helpers</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">Focused clinical regression cases</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="292" class="entity blue">
    <title>API router tests</title>
    <use href="#icon-browser" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <text x="680" y="229" text-anchor="middle" class="entity-title">API router tests</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">Request validation and permissions</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">Response shape and error behavior</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="310" class="entity blue">
    <title>Integration tests</title>
    <use href="#icon-layers" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="229" text-anchor="middle" class="entity-title">Integration tests</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">Selected multi-component seams</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">Architecture and persistence</text>
    <text x="1120" y="290" text-anchor="middle" class="entity-detail">contracts</text>
  </g>
  <g data-node="3" data-left="80" data-top="366" data-right="400" data-bottom="519" class="entity blue">
    <title>Repository quality gates</title>
    <use href="#icon-shield" x="211" y="371" width="58" height="58" aria-hidden="true" />
    <text x="240" y="456" text-anchor="middle" class="entity-title">Repository quality gates</text>
    <text x="240" y="481" text-anchor="middle" class="entity-detail">Lint, typing, coverage, and builds</text>
    <text x="240" y="499" text-anchor="middle" class="entity-detail">Documentation validation and links</text>
  </g>
  <g data-node="4" data-left="520" data-top="366" data-right="840" data-bottom="537" class="entity blue">
    <title>Browser tests</title>
    <use href="#icon-browser" x="651" y="371" width="58" height="58" aria-hidden="true" />
    <text x="680" y="456" text-anchor="middle" class="entity-title">Browser tests</text>
    <text x="680" y="481" text-anchor="middle" class="entity-detail">Chromium route and workflow</text>
    <text x="680" y="499" text-anchor="middle" class="entity-detail">checks</text>
    <text x="680" y="517" text-anchor="middle" class="entity-detail">UI / API contract interactions</text>
  </g>
  <g data-node="5" data-left="960" data-top="366" data-right="1280" data-bottom="537" class="entity blue">
    <title>Frontend unit tests</title>
    <use href="#icon-browser" x="1091" y="371" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="456" text-anchor="middle" class="entity-title">Frontend unit tests</text>
    <text x="1120" y="481" text-anchor="middle" class="entity-detail">Components, formatting, and</text>
    <text x="1120" y="499" text-anchor="middle" class="entity-detail">routing</text>
    <text x="1120" y="517" text-anchor="middle" class="entity-detail">Client state and coverage output</text>
  </g>
</svg>
