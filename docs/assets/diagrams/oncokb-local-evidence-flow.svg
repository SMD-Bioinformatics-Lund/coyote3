<text x="540" y="393" class="detail">records</text>
</g>
<g class="card" data-node="2"><rect x="960" y="220" width="320" height="120" rx="10"/>
<text x="980" y="254" class="name">3 · Fetch public catalogs</text>
<text x="980" y="299" class="detail">Fetch cancer-gene catalog once</text>
<text x="980" y="322" class="detail">Fetch curated-gene catalog once</text>
</g>
<g class="card" data-node="3"><rect x="80" y="560" width="320" height="220" rx="10"/>
