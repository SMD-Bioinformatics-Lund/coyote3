<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="650" viewBox="0 0 1220 650" role="img" aria-labelledby="title desc">
  <title id="title">Clinical report generation and persistence</title>
  <desc id="desc">Filtered analysis domains, ASP and ASPC context, gene lists, curation and comments are prepared into typed report facts; static YAML rules render preview text and saving persists immutable report snapshots and artifacts.</desc>
  <defs><style>.canvas{fill:#f8fafc}.band{fill:#e2e8f0}.source{fill:#dbeafe}.prepare{fill:#e0e7ff}.rules{fill:#fef3c7}.preview{fill:#fce7f3}.save{fill:#dcfce7}.alert{fill:#fee2e2}.title{font:700 23px Inter,'Segoe UI',Arial,sans-serif;fill:#0f172a}.label{font:700 13px Inter,'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:11px Inter,'Segoe UI',Arial,sans-serif;fill:#334155}.box{stroke:#64748b;stroke-width:1.5}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.refresh{stroke:#7c3aed;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#p)}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#475569"/></marker><marker id="p" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#7c3aed"/></marker></defs>
  <rect width="1220" height="650" class="canvas"/><rect x="20" y="18" width="1180" height="48" rx="10" class="band"/><text x="40" y="49" class="title">Prepared findings to immutable clinical report</text>
  <rect x="45" y="100" width="220" height="122" rx="11" class="box source"/><text x="155" y="127" text-anchor="middle" class="label">1 · Current review state</text><text x="155" y="149" text-anchor="middle" class="sub">somatic and germline SNVs</text><text x="155" y="167" text-anchor="middle" class="sub">CNVs · fusions · translocations</text><text x="155" y="185" text-anchor="middle" class="sub">biomarkers · coverage · PGx</text><text x="155" y="203" text-anchor="middle" class="sub">tiers · actions · comments</text>
  <rect x="325" y="100" width="230" height="122" rx="11" class="box source"/><text x="440" y="127" text-anchor="middle" class="label">2 · Clinical configuration</text><text x="440" y="149" text-anchor="middle" class="sub">ASP physical assay context</text><text x="440" y="167" text-anchor="middle" class="sub">ASPC filters + report_sections</text><text x="440" y="185" text-anchor="middle" class="sub">applied typed ISGLs + ad-hoc genes</text><text x="440" y="203" text-anchor="middle" class="sub">sample and reference versions</text>
  <rect x="615" y="90" width="250" height="142" rx="11" class="box prepare"/><text x="740" y="117" text-anchor="middle" class="label">3 · Prepare typed report facts</text><text x="740" y="139" text-anchor="middle" class="sub">filtered reportable findings by domain</text><text x="740" y="157" text-anchor="middle" class="sub">intent-separated tier aggregates</text><text x="740" y="175" text-anchor="middle" class="sub">selected transcripts and HGVS identity</text><text x="740" y="193" text-anchor="middle" class="sub">sample, ASP, ASPC, gene-list context</text><text x="740" y="211" text-anchor="middle" class="sub">missing enabled domain becomes warning fact</text>
  <path d="M265 161 H325" class="arrow"/><path d="M555 161 H615" class="arrow"/>

  <rect x="930" y="100" width="240" height="122" rx="11" class="box rules"/><text x="1050" y="127" text-anchor="middle" class="label">4 · Static YAML rule source</text><text x="1050" y="149" text-anchor="middle" class="sub">asp_id + subpanel_id scope</text><text x="1050" y="167" text-anchor="middle" class="sub">base file is explicit fallback</text><text x="1050" y="185" text-anchor="middle" class="sub">analysis block must permit text</text><text x="1050" y="203" text-anchor="middle" class="sub">app version owns wording changes</text>
  <path d="M865 161 H930" class="arrow"/>

  <rect x="275" y="315" width="260" height="122" rx="11" class="box rules"/><text x="405" y="342" text-anchor="middle" class="label">5 · Rule evaluation</text><text x="405" y="364" text-anchor="middle" class="sub">validate schema and helper whitelist</text><text x="405" y="382" text-anchor="middle" class="sub">evaluate ordered conditions</text><text x="405" y="400" text-anchor="middle" class="sub">render approved Jinja templates</text><text x="405" y="418" text-anchor="middle" class="sub">merge sections deterministically</text>
  <rect x="650" y="315" width="270" height="122" rx="11" class="box preview"/><text x="785" y="342" text-anchor="middle" class="label">6 · Temporary preview</text><text x="785" y="364" text-anchor="middle" class="sub">HTML layout + generated text</text><text x="785" y="382" text-anchor="middle" class="sub">finding snapshot rows</text><text x="785" y="400" text-anchor="middle" class="sub">auto-refreshes after filters/actions</text><text x="785" y="418" text-anchor="middle" class="sub">no report collection write yet</text>
  <path d="M740 232 L405 315" class="arrow"/><path d="M535 376 H650" class="arrow"/>

  <rect x="80" y="515" width="260" height="92" rx="11" class="box alert"/><text x="210" y="542" text-anchor="middle" class="label">Blocking review warning</text><text x="210" y="564" text-anchor="middle" class="sub">ASPC permits a report section but</text><text x="210" y="584" text-anchor="middle" class="sub">the static source cannot generate it</text>
  <rect x="465" y="505" width="290" height="112" rx="11" class="box save"/><text x="610" y="532" text-anchor="middle" class="label">7 · Confirm and save</text><text x="610" y="554" text-anchor="middle" class="sub">reported variants + report document</text><text x="610" y="572" text-anchor="middle" class="sub">filters + gene lists + ASPC resolution</text><text x="610" y="590" text-anchor="middle" class="sub">rule identity/hash + rendered HTML</text><text x="610" y="608" text-anchor="middle" class="sub">audit event and report status</text>
  <rect x="880" y="515" width="260" height="92" rx="11" class="box save"/><text x="1010" y="542" text-anchor="middle" class="label">8 · Stable outputs</text><text x="1010" y="564" text-anchor="middle" class="sub">saved preview · PDF · CSV</text><text x="1010" y="584" text-anchor="middle" class="sub">searchable reported collections</text>
  <path d="M405 437 L210 515" class="arrow"/><path d="M785 437 L610 505" class="arrow"/><path d="M755 561 H880" class="arrow"/><path d="M650 376 C585 465 875 465 785 437" class="refresh"/>
</svg>
