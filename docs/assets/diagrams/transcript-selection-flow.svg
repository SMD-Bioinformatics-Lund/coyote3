<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1201" viewBox="0 0 1360 1201" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Small-variant transcript selection flow</title>
  <desc id="figure-description">Variant CSQ rows are resolved to an HGNC gene and evaluated through configured RefSeq-first MANE stages, then VEP canonical protein-coding and fallback stages, with impact used only within a stage. Dashed arrows advance only when the preceding stage has no eligible transcript.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-branch" viewBox="0 0 24 24">
      <path d="M6 4v11a4 4 0 0 0 4 4h8M6 9h8a4 4 0 0 0 4-4V3M3 3h6M15 3h6M15 16l3 3-3 3" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M3 15v7h18v-7M12 17V2M6 8l6-6 6 6" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Small-variant transcript selection flow</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Variant CSQ rows are resolved to an HGNC gene and evaluated through configured RefSeq-first MANE stages, then VEP canonical protein-coding and fallback stages, with</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">impact used only within a stage. Dashed arrows advance only when the preceding stage has no eligible transcript.</text>
  <g class="connections">
    <path d="M275 173H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M715 173H1085" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M1155 173 L1288 173Q1310 173 1310 195 L1310 406Q1310 428 1288 428 L249.5 428Q240 428 240 437.5 L240 447" data-source="2" data-target="3" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M275 482H645" data-source="3" data-target="4" data-optional="true" marker-end="url(#arrow-blue)" class="connection blue conditional" />
    <path d="M715 482H1085" data-source="4" data-target="5" data-optional="true" marker-end="url(#arrow-purple)" class="connection purple conditional" />
    <path d="M1155 482 L1288 482Q1310 482 1310 504 L1310 643Q1310 665 1288 665 L249.5 665Q240 665 240 674.5 L240 684" data-source="5" data-target="6" data-optional="true" marker-end="url(#arrow-purple)" class="connection purple conditional" />
    <path d="M275 719H645" data-source="6" data-target="7" data-optional="true" marker-end="url(#arrow-blue)" class="connection blue conditional" />
    <path d="M715 719H1085" data-source="7" data-target="8" data-optional="true" marker-end="url(#arrow-blue)" class="connection blue conditional" />
    <path d="M1155 719 L1288 719Q1310 719 1310 741 L1310 926Q1310 948 1288 948 L249.5 948Q240 948 240 957.5 L240 967" data-source="8" data-target="9" data-optional="true" marker-end="url(#arrow-blue)" class="connection blue conditional" />
    <path d="M1155 719 L1288 719Q1310 719 1310 741 L1310 898Q1310 920 1288 920 L702 920Q680 920 680 942 L680 967" data-source="8" data-target="10" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
  </g>
  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="364" class="entity blue">
    <title>1 · VEP CSQ rows</title>
    <use href="#icon-layers" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="141.5" text-anchor="middle" class="step-number">1</text>
    <text x="240" y="229" text-anchor="middle" class="entity-title">VEP CSQ rows</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">native transcript namespaces</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">retained</text>
    <text x="240" y="290" text-anchor="middle" class="entity-detail">NM/NR and ENST rows remain</text>
    <text x="240" y="308" text-anchor="middle" class="entity-detail">separate</text>
    <text x="240" y="326" text-anchor="middle" class="entity-detail">stored in versioned VEP</text>
    <text x="240" y="344" text-anchor="middle" class="entity-detail">annotations</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="346" class="entity purple">
    <title>2 · Resolve HGNC gene</title>
    <use href="#icon-branch" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="141.5" text-anchor="middle" class="step-number">2</text>
    <text x="680" y="229" text-anchor="middle" class="entity-title">Resolve HGNC gene</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">HGNC ID first</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">approved symbol, previous symbol,</text>
    <text x="680" y="290" text-anchor="middle" class="entity-detail">aliases</text>
    <text x="680" y="308" text-anchor="middle" class="entity-detail">displayed source symbol is</text>
    <text x="680" y="326" text-anchor="middle" class="entity-detail">preserved</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="310" class="entity blue">
    <title>3 · Load application order</title>
    <use href="#icon-upload" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="141.5" text-anchor="middle" class="step-number">3</text>
    <text x="1120" y="229" text-anchor="middle" class="entity-title">Load application order</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">Fixed transcript selector order</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">from application capabilities</text>
    <text x="1120" y="290" text-anchor="middle" class="entity-detail">selectors are validated at startup</text>
  </g>
  <g data-node="3" data-left="80" data-top="448" data-right="400" data-bottom="601" class="entity blue">
    <title>1 · NCBI MANE Plus</title>
    <use href="#icon-layers" x="211" y="453" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="447" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="450.5" text-anchor="middle" class="step-number">1</text>
    <text x="240" y="538" text-anchor="middle" class="entity-title">NCBI MANE Plus</text>
    <text x="240" y="563" text-anchor="middle" class="entity-detail">matching NM/NR accession</text>
    <text x="240" y="581" text-anchor="middle" class="entity-detail">from HGNC metadata</text>
  </g>
  <g data-node="4" data-left="520" data-top="448" data-right="840" data-bottom="601" class="entity blue">
    <title>2 · Ensembl MANE Plus</title>
    <use href="#icon-layers" x="651" y="453" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="447" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="450.5" text-anchor="middle" class="step-number">2</text>
    <text x="680" y="538" text-anchor="middle" class="entity-title">Ensembl MANE Plus</text>
    <text x="680" y="563" text-anchor="middle" class="entity-detail">matching ENST accession</text>
    <text x="680" y="581" text-anchor="middle" class="entity-detail">from HGNC metadata</text>
  </g>
  <g data-node="5" data-left="960" data-top="448" data-right="1280" data-bottom="601" class="entity purple">
    <title>3 · NCBI MANE Select</title>
    <use href="#icon-branch" x="1091" y="453" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="447" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="450.5" text-anchor="middle" class="step-number">3</text>
    <text x="1120" y="538" text-anchor="middle" class="entity-title">NCBI MANE Select</text>
    <text x="1120" y="563" text-anchor="middle" class="entity-detail">matching NM/NR accession</text>
    <text x="1120" y="581" text-anchor="middle" class="entity-detail">RefSeq remains preferred</text>
  </g>
  <g data-node="6" data-left="80" data-top="685" data-right="400" data-bottom="838" class="entity purple">
    <title>4 · Ensembl MANE Select</title>
    <use href="#icon-branch" x="211" y="690" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="684" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="687.5" text-anchor="middle" class="step-number">4</text>
    <text x="240" y="775" text-anchor="middle" class="entity-title">Ensembl MANE Select</text>
    <text x="240" y="800" text-anchor="middle" class="entity-detail">matching ENST accession</text>
    <text x="240" y="818" text-anchor="middle" class="entity-detail">used after RefSeq stages</text>
  </g>
  <g data-node="7" data-left="520" data-top="685" data-right="840" data-bottom="856" class="entity blue">
    <title>5 · VEP canonical</title>
    <use href="#icon-layers" x="651" y="690" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="684" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="687.5" text-anchor="middle" class="step-number">5</text>
    <text x="680" y="775" text-anchor="middle" class="entity-title">VEP canonical</text>
    <text x="680" y="800" text-anchor="middle" class="entity-detail">protein-coding candidate</text>
    <text x="680" y="818" text-anchor="middle" class="entity-detail">preferred</text>
    <text x="680" y="836" text-anchor="middle" class="entity-detail">after all MANE stages</text>
  </g>
  <g data-node="8" data-left="960" data-top="685" data-right="1280" data-bottom="838" class="entity blue">
    <title>6 · First protein coding</title>
    <use href="#icon-layers" x="1091" y="690" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="684" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="687.5" text-anchor="middle" class="step-number">6</text>
    <text x="1120" y="775" text-anchor="middle" class="entity-title">First protein coding</text>
    <text x="1120" y="800" text-anchor="middle" class="entity-detail">native row with coding biotype</text>
    <text x="1120" y="818" text-anchor="middle" class="entity-detail">used only if earlier stages miss</text>
  </g>
  <g data-node="9" data-left="80" data-top="968" data-right="400" data-bottom="1121" class="entity blue">
    <title>7 · First available row</title>
    <use href="#icon-layers" x="211" y="973" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="967" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="970.5" text-anchor="middle" class="step-number">7</text>
    <text x="240" y="1058" text-anchor="middle" class="entity-title">First available row</text>
    <text x="240" y="1083" text-anchor="middle" class="entity-detail">deterministic final fallback</text>
    <text x="240" y="1101" text-anchor="middle" class="entity-detail">saved as selected_CSQ</text>
  </g>
  <g data-node="10" data-left="520" data-top="968" data-right="840" data-bottom="1157" class="entity blue">
    <title>Within-stage tie breaking</title>
    <use href="#icon-layers" x="651" y="973" width="58" height="58" aria-hidden="true" />
    <text x="680" y="1058" text-anchor="middle" class="entity-title">Within-stage tie breaking</text>
    <text x="680" y="1083" text-anchor="middle" class="entity-detail">HIGH → MODERATE → LOW →</text>
    <text x="680" y="1101" text-anchor="middle" class="entity-detail">MODIFIER</text>
    <text x="680" y="1119" text-anchor="middle" class="entity-detail">Impact ranks candidates only</text>
    <text x="680" y="1137" text-anchor="middle" class="entity-detail">within the same selection stage.</text>
  </g>
</svg>
