  </g>
  <g data-edge="4" class="relationship teal">
    <text x="460" y="503" text-anchor="middle" class="edge-label">links A</text>
  </g>
  <g data-edge="5" class="relationship teal">
    <text x="775" y="741" text-anchor="middle" class="edge-label">enables</text>
  </g>
  <g data-edge="6" class="relationship teal">
    <text x="1215" y="713" text-anchor="middle" class="edge-label">enables</text>
  </g>
  <g data-edge="7" class="relationship teal">
    <text x="680" y="401" text-anchor="middle" class="edge-label">same definition, links B</text>
  </g>
