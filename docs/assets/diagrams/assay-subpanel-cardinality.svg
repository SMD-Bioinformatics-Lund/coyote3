<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1080" viewBox="0 0 1360 1080" role="img" aria-labelledby="title desc">
<title id="title">Assays, shared subpanels, and independent configurations</title>
<desc id="desc">Synthetic example: a shared subpanel identifier does not share filters, gene lists, or reporting rules. For each selected named scope, create an ASPC per target environment. Base remains a separate assay scope.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#302b38}
.heading{font-size:26px;font-weight:700}.subtitle,.note{font-size:16px;fill:#625a6b}
.card rect{fill:#fff;stroke:#cfc6da;stroke-width:1.5}.name{font-size:19px;font-weight:700;fill:#52366d}
.detail{font-size:16px}.edge{fill:none;stroke:#78638d;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
.optional{stroke-dasharray:6 5}.edge-label rect{fill:#faf9fc;stroke:#e7e1ec}.label{font-size:14px;fill:#52366d}</style><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#78638d"/></marker></defs>
<rect width="1360" height="1080" rx="12" fill="#faf9fc"/>
<text x="40" y="44" class="heading">Assays, shared subpanels, and independent configurations</text>
<text x="40" y="84" class="subtitle">Synthetic example: a shared subpanel identifier does not share filters, gene lists, or reporting rules. For each selected named scope,</text>
<text x="40" y="108" class="subtitle">create an ASPC per target environment. Base remains a separate assay scope.</text>
<path d="M400 280 L520 280" class="edge" data-source="0" data-target="1"/>
<path d="M400 280 L460 280 L460 180 L900 180 L900 280 L960 280" class="edge" data-source="0" data-target="2"/>
<path d="M680 360 L680 500" class="edge" data-source="1" data-target="4"/>
<path d="M1120 360 L1120 500" class="edge" data-source="2" data-target="5"/>
<path d="M400 560 L520 560" class="edge" data-source="3" data-target="4"/>
<path d="M680 640 L680 780" class="edge" data-source="4" data-target="7"/>
<path d="M1120 640 L1120 780" class="edge" data-source="5" data-target="8"/>
<path d="M400 560 L460 560 L460 460 L900 460 L900 560 L960 560" class="edge" data-source="3" data-target="5"/>
<g class="card" data-node="0"><rect x="80" y="220" width="320" height="140" rx="10"/>
<text x="100" y="254" class="name">Assay group</text>
<text x="100" y="299" class="detail">One registered group can contain</text>
<text x="100" y="322" class="detail">multiple ASP assay identities.</text>
<text x="100" y="345" class="detail">Each ASP selects one group.</text>
</g>
<g class="card" data-node="1"><rect x="520" y="220" width="320" height="140" rx="10"/>
<text x="540" y="254" class="name">Assay A · ASP</text>
<text x="540" y="299" class="detail">Physical design A</text>
<text x="540" y="322" class="detail">Assay family and platform</text>
<text x="540" y="345" class="detail">Input files and covered genes</text>
</g>
<g class="card" data-node="2"><rect x="960" y="220" width="320" height="140" rx="10"/>
<text x="980" y="254" class="name">Assay B · ASP</text>
<text x="980" y="299" class="detail">Physical design B</text>
<text x="980" y="322" class="detail">Own file policy and gene coverage</text>
<text x="980" y="345" class="detail">May share a subpanel with A</text>
</g>
<g class="card" data-node="3"><rect x="80" y="500" width="320" height="140" rx="10"/>
<text x="100" y="534" class="name">Shared subpanel S</text>
<text x="100" y="579" class="detail">One named subpanel definition</text>
<text x="100" y="602" class="detail">Identifier + display name + status</text>
<text x="100" y="625" class="detail">No ASPC or gene membership here</text>
</g>
<g class="card" data-node="4"><rect x="520" y="500" width="320" height="140" rx="10"/>
<text x="540" y="534" class="name">Association A ↔ S</text>
<text x="540" y="579" class="detail">One assay/subpanel link</text>
<text x="540" y="602" class="detail">Independent active status</text>
<text x="540" y="625" class="detail">Definition AND link required</text>
</g>
<g class="card" data-node="5"><rect x="960" y="500" width="320" height="140" rx="10"/>
<text x="980" y="534" class="name">Association B ↔ S</text>
<text x="980" y="579" class="detail">A different assay/subpanel link</text>
<text x="980" y="602" class="detail">Independent active status</text>
<text x="980" y="625" class="detail">Disabling A ↔ S does not disable B</text>
</g>
<g class="card" data-node="6"><rect x="80" y="780" width="320" height="140" rx="10"/>
<text x="100" y="814" class="name">Implicit Base scope</text>
<text x="100" y="859" class="detail">No subpanel registry document</text>
<text x="100" y="882" class="detail">No Base association document</text>
<text x="100" y="905" class="detail">Each assay has its own Base ASPC</text>
</g>
<g class="card" data-node="7"><rect x="520" y="780" width="320" height="180" rx="10"/>
<text x="540" y="814" class="name">ASPC A / S / environment</text>
<text x="540" y="859" class="detail">One active release for this tuple</text>
<text x="540" y="882" class="detail">Own filters and reporting language</text>
<text x="540" y="905" class="detail">Optional typed gene-list</text>
<text x="540" y="928" class="detail">selections</text>
</g>
<g class="card" data-node="8"><rect x="960" y="780" width="320" height="140" rx="10"/>
<text x="980" y="814" class="name">ASPC B / S / environment</text>
<text x="980" y="859" class="detail">Different configuration identity</text>
<text x="980" y="882" class="detail">Own filters and compatible rules</text>
<text x="980" y="905" class="detail">No settings inherited from A</text>
</g>
<g class="edge-label"><rect x="422" y="266" width="76" height="28" rx="5"/>
<text x="430" y="284" class="label">contains</text>
</g>
<g class="edge-label"><rect x="626" y="166" width="108" height="28" rx="5"/>
<text x="634" y="184" class="label">also contains</text>
</g>
<g class="edge-label"><rect x="652" y="416" width="56" height="28" rx="5"/>
<text x="660" y="434" class="label">assay</text>
</g>
<g class="edge-label"><rect x="1092" y="416" width="56" height="28" rx="5"/>
<text x="1100" y="434" class="label">assay</text>
</g>
<g class="edge-label"><rect x="429" y="546" width="62" height="28" rx="5"/>
<text x="437" y="564" class="label">links A</text>
</g>
<g class="edge-label"><rect x="646" y="696" width="68" height="28" rx="5"/>
<text x="654" y="714" class="label">enables</text>
</g>
<g class="edge-label"><rect x="1086" y="696" width="68" height="28" rx="5"/>
<text x="1094" y="714" class="label">enables</text>
</g>
<g class="edge-label"><rect x="484" y="437" width="128" height="46" rx="5"/>
<text x="492" y="455" class="label">same definition,</text>
<text x="492" y="473" class="label">links B</text>
</g>

</svg>
