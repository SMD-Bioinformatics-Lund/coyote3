  <text x="40" y="34" text-anchor="start" class="figure-title">Assays, shared subpanels, and independent configurations</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Synthetic example: a shared subpanel identifier does not share filters, gene lists, or reporting rules. For each selected named scope, create an ASPC per target</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">environment. Base remains a separate assay scope.</text>
