  <g data-node="0" data-left="80" data-top="203" data-right="400" data-bottom="374" class="entity blue">
    <title>Assay group</title>
    <use href="#icon-sample" x="211" y="208" width="58" height="58" aria-hidden="true" />
    <text x="240" y="293" text-anchor="middle" class="entity-title">Assay group</text>
    <text x="240" y="318" text-anchor="middle" class="entity-detail">One registered group can contain</text>
    <text x="240" y="336" text-anchor="middle" class="entity-detail">multiple ASP assay identities.</text>
    <text x="240" y="354" text-anchor="middle" class="entity-detail">Each ASP selects one group.</text>
  </g>
  <g data-node="1" data-left="520" data-top="203" data-right="840" data-bottom="374" class="entity blue">
    <title>Assay A · ASP</title>
    <use href="#icon-sample" x="651" y="208" width="58" height="58" aria-hidden="true" />
    <text x="680" y="293" text-anchor="middle" class="entity-title">Assay A · ASP</text>
    <text x="680" y="318" text-anchor="middle" class="entity-detail">Physical design A</text>
    <text x="680" y="336" text-anchor="middle" class="entity-detail">Assay family and platform</text>
    <text x="680" y="354" text-anchor="middle" class="entity-detail">Input files and covered genes</text>
  </g>
  <g data-node="2" data-left="960" data-top="203" data-right="1280" data-bottom="374" class="entity blue">
    <title>Assay B · ASP</title>
    <use href="#icon-sample" x="1091" y="208" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="293" text-anchor="middle" class="entity-title">Assay B · ASP</text>
    <text x="1120" y="318" text-anchor="middle" class="entity-detail">Physical design B</text>
    <text x="1120" y="336" text-anchor="middle" class="entity-detail">Own file policy and gene coverage</text>
    <text x="1120" y="354" text-anchor="middle" class="entity-detail">May share a subpanel with A</text>
  </g>
  <g data-node="3" data-left="80" data-top="486" data-right="400" data-bottom="657" class="entity blue">
    <title>Shared subpanel S</title>
    <use href="#icon-layers" x="211" y="491" width="58" height="58" aria-hidden="true" />
    <text x="240" y="576" text-anchor="middle" class="entity-title">Shared subpanel S</text>
    <text x="240" y="601" text-anchor="middle" class="entity-detail">One named subpanel definition</text>
    <text x="240" y="619" text-anchor="middle" class="entity-detail">Identifier + display name + status</text>
    <text x="240" y="637" text-anchor="middle" class="entity-detail">No ASPC or gene membership here</text>
  </g>
  <g data-node="4" data-left="520" data-top="486" data-right="840" data-bottom="657" class="entity teal">
    <title>Association A ↔ S</title>
    <use href="#icon-link" x="651" y="491" width="58" height="58" aria-hidden="true" />
    <text x="680" y="576" text-anchor="middle" class="entity-title">Association A ↔ S</text>
    <text x="680" y="601" text-anchor="middle" class="entity-detail">One assay/subpanel link</text>
    <text x="680" y="619" text-anchor="middle" class="entity-detail">Independent active status</text>
    <text x="680" y="637" text-anchor="middle" class="entity-detail">Definition AND link required</text>
  </g>
  <g data-node="5" data-left="960" data-top="486" data-right="1280" data-bottom="657" class="entity teal">
    <title>Association B ↔ S</title>
    <use href="#icon-link" x="1091" y="491" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="576" text-anchor="middle" class="entity-title">Association B ↔ S</text>
    <text x="1120" y="601" text-anchor="middle" class="entity-detail">A different assay/subpanel link</text>
    <text x="1120" y="619" text-anchor="middle" class="entity-detail">Independent active status</text>
    <text x="1120" y="637" text-anchor="middle" class="entity-detail">Disabling A ↔ S does not disable B</text>
  </g>
  <g data-node="6" data-left="80" data-top="769" data-right="400" data-bottom="940" class="entity teal">
    <title>Implicit Base scope</title>
    <use href="#icon-scope" x="211" y="774" width="58" height="58" aria-hidden="true" />
    <text x="240" y="859" text-anchor="middle" class="entity-title">Implicit Base scope</text>
    <text x="240" y="884" text-anchor="middle" class="entity-detail">No subpanel registry document</text>
    <text x="240" y="902" text-anchor="middle" class="entity-detail">No Base association document</text>
    <text x="240" y="920" text-anchor="middle" class="entity-detail">Each assay has its own Base ASPC</text>
  </g>
  <g data-node="7" data-left="520" data-top="769" data-right="840" data-bottom="958" class="entity teal">
    <title>ASPC A / S / environment</title>
    <use href="#icon-scope" x="651" y="774" width="58" height="58" aria-hidden="true" />
    <text x="680" y="859" text-anchor="middle" class="entity-title">ASPC A / S / environment</text>
    <text x="680" y="884" text-anchor="middle" class="entity-detail">One active release for this tuple</text>
    <text x="680" y="902" text-anchor="middle" class="entity-detail">Own filters and reporting language</text>
    <text x="680" y="920" text-anchor="middle" class="entity-detail">Optional typed gene-list</text>
    <text x="680" y="938" text-anchor="middle" class="entity-detail">selections</text>
  </g>
  <g data-node="8" data-left="960" data-top="769" data-right="1280" data-bottom="940" class="entity teal">
    <title>ASPC B / S / environment</title>
    <use href="#icon-scope" x="1091" y="774" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="859" text-anchor="middle" class="entity-title">ASPC B / S / environment</text>
    <text x="1120" y="884" text-anchor="middle" class="entity-detail">Different configuration identity</text>
    <text x="1120" y="902" text-anchor="middle" class="entity-detail">Own filters and compatible rules</text>
    <text x="1120" y="920" text-anchor="middle" class="entity-detail">No settings inherited from A</text>
  </g>
