<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="540" viewBox="0 0 1360 540" role="img" aria-labelledby="title desc">
<title id="title">Independent somatic and germline SNV filter state</title>
<desc id="desc">Both views use VCF-derived variants; intent-specific filters and reporting contexts remain separate. The ASPC and sample must enable the intent. Germline settings are not derived from somatic thresholds.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#302b38}
.heading{font-size:26px;font-weight:700}.subtitle,.note{font-size:16px;fill:#625a6b}
.card rect{fill:#fff;stroke:#cfc6da;stroke-width:1.5}.name{font-size:19px;font-weight:700;fill:#52366d}
.detail{font-size:16px}.edge{fill:none;stroke:#78638d;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
.optional{stroke-dasharray:6 5}.edge-label rect{fill:#faf9fc;stroke:#e7e1ec}.label{font-size:14px;fill:#52366d}</style><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#78638d"/></marker></defs>
<rect width="1360" height="540" rx="12" fill="#faf9fc"/>
<text x="40" y="44" class="heading">Independent somatic and germline SNV filter state</text>
<text x="40" y="84" class="subtitle">Both views use VCF-derived variants; intent-specific filters and reporting contexts remain separate. The ASPC and sample must enable the</text>
<text x="40" y="108" class="subtitle">intent. Germline settings are not derived from somatic thresholds.</text>

<g class="card" data-node="0"><rect x="80" y="220" width="320" height="180" rx="10"/>
<text x="100" y="254" class="name">Somatic SNV intent</text>
<text x="100" y="299" class="detail">filters.somatic.snv</text>
<text x="100" y="322" class="detail">Somatic SNV query and review tab</text>
<text x="100" y="345" class="detail">Somatic report facts and selected</text>
<text x="100" y="368" class="detail">findings</text>
</g>
<g class="card" data-node="1"><rect x="520" y="220" width="320" height="200" rx="10"/>
<text x="540" y="254" class="name">Germline SNV intent</text>
<text x="540" y="299" class="detail">filters.germline.snv</text>
<text x="540" y="322" class="detail">Germline SNV query and review</text>
<text x="540" y="345" class="detail">tab</text>
<text x="540" y="368" class="detail">Germline report facts and</text>
<text x="540" y="391" class="detail">selected findings</text>
</g>


</svg>
