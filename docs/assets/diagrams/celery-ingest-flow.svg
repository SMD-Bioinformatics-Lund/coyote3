    <path d="M715 173C900 161 900 185 1085 173" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M1155 173 L1288 173Q1310 173 1310 195 L1310 352Q1310 374 1288 374 L249.5 374Q240 374 240 383.5 L240 393" data-source="2" data-target="3" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
