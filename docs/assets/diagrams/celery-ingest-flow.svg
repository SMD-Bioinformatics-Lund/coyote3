  <text x="40" y="34" text-anchor="start" class="figure-title">Celery sample ingest flow</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">A watched or manually submitted YAML manifest is queued through Redis, validated and parsed by a Celery worker, committed in one MongoDB transaction, audited, and renamed</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">done or failed. Required files must be readable; unavailable optional expected files are recorded. Dashed paths indicate validation or transaction failure.</text>
