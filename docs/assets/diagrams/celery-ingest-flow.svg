    <path d="M715 428 L848 428Q870 428 870 450 L870 689Q870 711 892 711 L1098 711Q1120 711 1120 733 L1120 786" data-source="4" data-target="8" data-optional="true" marker-end="url(#arrow-purple)" class="connection purple conditional" />
    <path d="M1155 428 L1288 428Q1310 428 1310 450 L1310 661Q1310 683 1288 683 L1142 683Q1120 683 1120 705 L1120 786" data-source="5" data-target="8" data-optional="true" marker-end="url(#arrow-purple)" class="connection purple conditional" />
