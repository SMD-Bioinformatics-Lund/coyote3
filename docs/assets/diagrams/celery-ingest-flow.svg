  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="310" class="entity blue">
    <title>1 · Ingest trigger</title>
    <use href="#icon-upload" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="141.5" text-anchor="middle" class="step-number">1</text>
    <text x="240" y="229" text-anchor="middle" class="entity-title">Ingest trigger</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">Celery beat watch scan</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">or Admin upload / queue action</text>
    <text x="240" y="290" text-anchor="middle" class="entity-detail">module and ingest gates enforced</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="274" class="entity amber">
    <title>2 · Durable job</title>
    <use href="#icon-queue" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="141.5" text-anchor="middle" class="step-number">2</text>
    <text x="680" y="229" text-anchor="middle" class="entity-title">Durable job</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">MongoDB receipt + queue ID</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="310" class="entity teal">
    <title>3 · Celery worker</title>
    <use href="#icon-server" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="138" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="141.5" text-anchor="middle" class="step-number">3</text>
    <text x="1120" y="229" text-anchor="middle" class="entity-title">Celery worker</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">single bundle orchestration</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">task state and structured errors</text>
    <text x="1120" y="290" text-anchor="middle" class="entity-detail">tokenized execution lease</text>
  </g>
  <g data-node="3" data-left="80" data-top="394" data-right="400" data-bottom="619" class="entity blue">
    <title>4 · Parse manifest</title>
    <use href="#icon-document" x="211" y="399" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="393" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="396.5" text-anchor="middle" class="step-number">4</text>
    <text x="240" y="484" text-anchor="middle" class="entity-title">Parse manifest</text>
    <text x="240" y="509" text-anchor="middle" class="entity-detail">DNA/RNA contract + canonical</text>
    <text x="240" y="527" text-anchor="middle" class="entity-detail">keys</text>
    <text x="240" y="545" text-anchor="middle" class="entity-detail">host paths preserved in</text>
    <text x="240" y="563" text-anchor="middle" class="entity-detail">documents</text>
    <text x="240" y="581" text-anchor="middle" class="entity-detail">container paths used for reading</text>
    <text x="240" y="599" text-anchor="middle" class="entity-detail">ASP determines required files</text>
  </g>
  <g data-node="4" data-left="520" data-top="394" data-right="840" data-bottom="583" class="entity purple">
    <title>5 · Resolve configuration</title>
    <use href="#icon-settings" x="651" y="399" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="393" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="396.5" text-anchor="middle" class="step-number">5</text>
    <text x="680" y="484" text-anchor="middle" class="entity-title">Resolve configuration</text>
    <text x="680" y="509" text-anchor="middle" class="entity-detail">active ASP file policy</text>
    <text x="680" y="527" text-anchor="middle" class="entity-detail">exact ASPC or base fallback</text>
    <text x="680" y="545" text-anchor="middle" class="entity-detail">analysis types + report sections</text>
    <text x="680" y="563" text-anchor="middle" class="entity-detail">default filters and intents</text>
  </g>
  <g data-node="5" data-left="960" data-top="394" data-right="1280" data-bottom="619" class="entity blue">
    <title>6 · Parse readable resources</title>
    <use href="#icon-layers" x="1091" y="399" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="393" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="396.5" text-anchor="middle" class="step-number">6</text>
    <text x="1120" y="484" text-anchor="middle" class="entity-title">Parse readable resources</text>
    <text x="1120" y="509" text-anchor="middle" class="entity-detail">VCF → variants + versioned CSQs</text>
    <text x="1120" y="527" text-anchor="middle" class="entity-detail">CNV · profile · coverage</text>
    <text x="1120" y="545" text-anchor="middle" class="entity-detail">translocations · fusions ·</text>
    <text x="1120" y="563" text-anchor="middle" class="entity-detail">biomarkers</text>
    <text x="1120" y="581" text-anchor="middle" class="entity-detail">counts and references verified</text>
    <text x="1120" y="599" text-anchor="middle" class="entity-detail">transcript priority applied</text>
  </g>
  <g data-node="6" data-left="80" data-top="787" data-right="400" data-bottom="976" class="entity purple">
    <title>7 · One transaction</title>
    <use href="#icon-pen" x="211" y="792" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="786" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="789.5" text-anchor="middle" class="step-number">7</text>
    <text x="240" y="877" text-anchor="middle" class="entity-title">One transaction</text>
    <text x="240" y="902" text-anchor="middle" class="entity-detail">sample anchor + dependents</text>
    <text x="240" y="920" text-anchor="middle" class="entity-detail">typed repository writes</text>
    <text x="240" y="938" text-anchor="middle" class="entity-detail">evidence + completion receipt</text>
    <text x="240" y="956" text-anchor="middle" class="entity-detail">before ready state</text>
  </g>
  <g data-node="7" data-left="520" data-top="787" data-right="840" data-bottom="994" class="entity blue">
    <title>8A · Commit success</title>
    <use href="#icon-layers" x="651" y="792" width="58" height="58" aria-hidden="true" />
    <text x="680" y="877" text-anchor="middle" class="entity-title">8A · Commit success</text>
    <text x="680" y="902" text-anchor="middle" class="entity-detail">sample enters samples collection</text>
    <text x="680" y="920" text-anchor="middle" class="entity-detail">ingest_status = ready</text>
    <text x="680" y="938" text-anchor="middle" class="entity-detail">post-commit audit delivery</text>
    <text x="680" y="956" text-anchor="middle" class="entity-detail">acknowledgement retried if</text>
    <text x="680" y="974" text-anchor="middle" class="entity-detail">needed</text>
  </g>
  <g data-node="8" data-left="960" data-top="787" data-right="1280" data-bottom="976" class="entity purple">
    <title>8B · Abort transaction</title>
    <use href="#icon-pen" x="1091" y="792" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="877" text-anchor="middle" class="entity-title">8B · Abort transaction</text>
    <text x="1120" y="902" text-anchor="middle" class="entity-detail">no partial clinical writes</text>
    <text x="1120" y="920" text-anchor="middle" class="entity-detail">previous clinical state preserved</text>
    <text x="1120" y="938" text-anchor="middle" class="entity-detail">retryable jobs remain pending</text>
    <text x="1120" y="956" text-anchor="middle" class="entity-detail">permanent failures need review</text>
  </g>
  <g data-node="9" data-left="80" data-top="1106" data-right="400" data-bottom="1259" class="entity blue">
    <title>Ingest status</title>
    <use href="#icon-upload" x="211" y="1111" width="58" height="58" aria-hidden="true" />
    <text x="240" y="1196" text-anchor="middle" class="entity-title">Ingest status</text>
    <text x="240" y="1221" text-anchor="middle" class="entity-detail">Admin Ingest Workspace</text>
    <text x="240" y="1239" text-anchor="middle" class="entity-detail">Task status and runtime controls</text>
  </g>
</svg>
