<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Clinical review and reporting flow</title>
  <desc id="desc">A ready sample is filtered, reviewed, tiered, snapshotted, previewed, and saved as an immutable report.</desc>
  <defs><style>.canvas{fill:#f8fafc}.band{fill:#e2e8f0}.title{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.label{font:700 14px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:12px 'Segoe UI',Arial,sans-serif;fill:#334155}.box{stroke:#475569;stroke-width:1.6}.arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#475569"/></marker></defs>
  <rect width="1000" height="470" class="canvas"/><rect x="20" y="18" width="960" height="42" rx="10" class="band"/><text x="38" y="46" class="title">Clinical review and reporting flow</text>
  <rect x="38" y="105" width="160" height="82" rx="12" class="box" fill="#dbeafe"/><text x="118" y="133" text-anchor="middle" class="label">Ready sample</text><text x="118" y="157" text-anchor="middle" class="sub">all declared data loaded</text>
  <rect x="230" y="105" width="160" height="82" rx="12" class="box" fill="#e0e7ff"/><text x="310" y="133" text-anchor="middle" class="label">Effective filters</text><text x="310" y="157" text-anchor="middle" class="sub">ASPC + sample state</text>
  <rect x="422" y="105" width="160" height="82" rx="12" class="box" fill="#dcfce7"/><text x="502" y="133" text-anchor="middle" class="label">Clinical review</text><text x="502" y="157" text-anchor="middle" class="sub">findings + evidence</text>
  <rect x="614" y="105" width="160" height="82" rx="12" class="box" fill="#fef3c7"/><text x="694" y="133" text-anchor="middle" class="label">Classification</text><text x="694" y="157" text-anchor="middle" class="sub">tiers + comments</text>
  <rect x="806" y="105" width="160" height="82" rx="12" class="box" fill="#fce7f3"/><text x="886" y="133" text-anchor="middle" class="label">Live snapshot</text><text x="886" y="157" text-anchor="middle" class="sub">updates with review state</text>
  <path d="M198 146 L230 146" class="arrow"/><path d="M390 146 L422 146" class="arrow"/><path d="M582 146 L614 146" class="arrow"/><path d="M774 146 L806 146" class="arrow"/>
  <rect x="230" y="270" width="220" height="92" rx="12" class="box" fill="#ede9fe"/><text x="340" y="302" text-anchor="middle" class="label">Report preview</text><text x="340" y="326" text-anchor="middle" class="sub">rules + selected findings + text</text><text x="340" y="346" text-anchor="middle" class="sub">temporary until confirmed</text>
  <rect x="550" y="270" width="220" height="92" rx="12" class="box" fill="#d1fae5"/><text x="660" y="302" text-anchor="middle" class="label">Saved report</text><text x="660" y="326" text-anchor="middle" class="sub">immutable snapshot + artifacts</text><text x="660" y="346" text-anchor="middle" class="sub">searchable provenance</text>
  <path d="M886 187 C886 235 450 220 390 270" class="arrow"/><path d="M450 316 L550 316" class="arrow"/>
  <text x="500" y="425" text-anchor="middle" class="sub">Filter or curation changes refresh the temporary snapshot; a saved report preserves the confirmed state.</text>
</svg>
