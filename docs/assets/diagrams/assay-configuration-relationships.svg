  <text x="40" y="34" text-anchor="start" class="figure-title">Assay configuration and governed publication</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Named diagnoses are shared definitions. Each assay association and configuration has its own identity. Setup activation is transactional. Rule publication and public</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">catalog publication remain separate workflows.</text>
