    <text x="240" y="611" text-anchor="middle" class="entity-detail">Stage ASP, ISGLs, scopes, ASPCs</text>
    <text x="240" y="629" text-anchor="middle" class="entity-detail">Independent approval → activation</text>
  </g>
  <g data-node="4" data-left="520" data-top="478" data-right="840" data-bottom="685" class="entity purple">
