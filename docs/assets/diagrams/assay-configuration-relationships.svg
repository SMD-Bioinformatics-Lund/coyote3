    <text x="240" y="272" text-anchor="middle" class="entity-detail">Groups assays for configuration</text>
    <text x="240" y="290" text-anchor="middle" class="entity-detail">Group availability gates new setup</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="310" class="entity blue">
