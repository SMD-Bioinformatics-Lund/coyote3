<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 840" width="1360" height="840" role="img" aria-labelledby="title description">
  <title id="title">Assay configuration: definitions, releases and consumers</title>
  <desc id="description">Shared definitions are inputs. Setup activation and public catalog publication are separate workflows.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-dna" viewBox="0 0 24 24">
      <path d="M6 2c0 10 12 10 12 20M18 2C18 12 6 12 6 22M7 4h10M8 8h8M8 16h8M7 20h10" class="glyph" />
    </symbol>
    <symbol id="icon-report" viewBox="0 0 24 24">
      <path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 18v-3M12 18v-6M16 18v-4" class="glyph" />
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6" class="glyph" />
    </symbol>
    <symbol id="icon-users" viewBox="0 0 24 24">
      <path d="M14 6a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM2 22v-3c0-7 16-7 16 0v3M17 3c6 0 6 8 0 8M19 15c3 1 3 4 3 7" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="36" class="figure-title">Assay configuration: definitions, releases and consumers</text>
  <text x="40" y="68" class="figure-subtitle">Shared definitions are inputs. Setup activation and public catalog publication are separate workflows.</text>
  <g class="entity blue" data-node="0" data-left="38.86" data-right="337.57" data-top="135.0" data-bottom="295.0">
    <title>Assay group</title>
    <use href="#icon-users" x="167.21" y="138.0" width="42" height="42" aria-hidden="true" />
    <text x="188.21" y="198.0" text-anchor="middle" class="entity-title">Assay group</text>
    <text x="188.21" y="220.0" text-anchor="middle" class="entity-detail">Clinical context and</text>
    <text x="188.21" y="238.0" text-anchor="middle" class="entity-detail">explicit access scope.</text>
    <text x="188.21" y="256.0" text-anchor="middle" class="entity-detail">Parent evidence does not</text>
    <text x="188.21" y="274.0" text-anchor="middle" class="entity-detail">grant assay access.</text>
  </g>
  <g class="entity blue" data-node="1" data-left="366.71" data-right="665.43" data-top="135.0" data-bottom="295.0">
    <title>Assay (ASP)</title>
    <use href="#icon-dna" x="495.07" y="138.0" width="42" height="42" aria-hidden="true" />
    <text x="516.07" y="198.0" text-anchor="middle" class="entity-title">Assay (ASP)</text>
    <text x="516.07" y="220.0" text-anchor="middle" class="entity-detail">Group, DNA/RNA, family,</text>
    <text x="516.07" y="238.0" text-anchor="middle" class="entity-detail">physical coverage and</text>
    <text x="516.07" y="256.0" text-anchor="middle" class="entity-detail">short / full names.</text>
    <text x="516.07" y="274.0" text-anchor="middle" class="entity-detail">Stable assay identity.</text>
  </g>
  <g class="entity blue" data-node="2" data-left="694.57" data-right="993.29" data-top="135.0" data-bottom="295.0">
    <title>Diagnosis</title>
    <use href="#icon-dna" x="822.93" y="138.0" width="42" height="42" aria-hidden="true" />
    <text x="843.93" y="198.0" text-anchor="middle" class="entity-title">Diagnosis</text>
    <text x="843.93" y="220.0" text-anchor="middle" class="entity-detail">Base is implicit.</text>
    <text x="843.93" y="238.0" text-anchor="middle" class="entity-detail">Named definitions are</text>
    <text x="843.93" y="256.0" text-anchor="middle" class="entity-detail">shared; each assay has</text>
    <text x="843.93" y="274.0" text-anchor="middle" class="entity-detail">its own association.</text>
  </g>
  <g class="entity teal" data-node="3" data-left="1022.43" data-right="1321.14" data-top="135.0" data-bottom="295.0">
    <title>Optional gene lists</title>
    <use href="#icon-dna" x="1150.79" y="138.0" width="42" height="42" aria-hidden="true" />
    <text x="1171.79" y="198.0" text-anchor="middle" class="entity-title">Optional gene lists</text>
    <text x="1171.79" y="220.0" text-anchor="middle" class="entity-detail">Analysis-specific genes.</text>
    <text x="1171.79" y="238.0" text-anchor="middle" class="entity-detail">Use stable list IDs.</text>
    <text x="1171.79" y="256.0" text-anchor="middle" class="entity-detail">Effective genes respect</text>
    <text x="1171.79" y="274.0" text-anchor="middle" class="entity-detail">assay coverage.</text>
  </g>
  <g class="entity amber" data-node="4" data-left="38.86" data-right="451.71" data-top="375.0" data-bottom="555.0">
    <title>Reporting rules (optional)</title>
    <use href="#icon-report" x="224.29" y="378.0" width="42" height="42" aria-hidden="true" />
    <text x="245.29" y="438.0" text-anchor="middle" class="entity-title">Reporting rules (optional)</text>
    <text x="245.29" y="460.0" text-anchor="middle" class="entity-detail">Draft, review and publish</text>
    <text x="245.29" y="478.0" text-anchor="middle" class="entity-detail">wording for the clinical scope.</text>
    <text x="245.29" y="496.0" text-anchor="middle" class="entity-detail">Missing rules: report remains</text>
    <text x="245.29" y="514.0" text-anchor="middle" class="entity-detail">available, without automatic text.</text>
  </g>
  <g class="entity purple" data-node="5" data-left="534.29" data-right="1321.14" data-top="375.0" data-bottom="555.0">
    <title>Assay configuration (ASPC)</title>
    <use href="#icon-dna" x="906.71" y="378.0" width="42" height="42" aria-hidden="true" />
    <text x="927.71" y="438.0" text-anchor="middle" class="entity-title">Assay configuration (ASPC)</text>
    <text x="927.71" y="460.0" text-anchor="middle" class="entity-detail">One assay × diagnosis × environment scope.</text>
    <text x="927.71" y="478.0" text-anchor="middle" class="entity-detail">Enables analyses, expected/required files and report sections.</text>
    <text x="927.71" y="496.0" text-anchor="middle" class="entity-detail">Defines initial filter profiles and reportable tiers.</text>
    <text x="927.71" y="514.0" text-anchor="middle" class="entity-detail">Activated revisions provide the configuration used by samples.</text>
  </g>
  <path class="connection blue" d="M155 295 V328 H425 V295" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <path class="connection blue" d="M425 295 V340 H620 V375" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <path class="connection blue" d="M695 295 V375" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <path class="connection blue conditional" d="M965 295 V375" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <path class="connection blue conditional" d="M372 465 H440" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <text x="459.0" y="449" class="figure-note">text</text>
  <g class="entity purple" data-node="6" data-left="38.86" data-right="646.0" data-top="630.0" data-bottom="770.0">
    <title>Activate the assay setup</title>
    <use href="#icon-dna" x="321.43" y="633.0" width="42" height="42" aria-hidden="true" />
    <text x="342.43" y="693.0" text-anchor="middle" class="entity-title">Activate the assay setup</text>
    <text x="342.43" y="715.0" text-anchor="middle" class="entity-detail">Validate configurations and required resources.</text>
    <text x="342.43" y="733.0" text-anchor="middle" class="entity-detail">Review is optional before activation.</text>
    <text x="342.43" y="751.0" text-anchor="middle" class="entity-detail">Reporting-rule publication is optional.</text>
  </g>
  <g class="entity teal" data-node="7" data-left="714.0" data-right="1321.14" data-top="630.0" data-bottom="770.0">
    <title>Consume released configuration</title>
    <use href="#icon-settings" x="996.57" y="633.0" width="42" height="42" aria-hidden="true" />
    <text x="1017.57" y="693.0" text-anchor="middle" class="entity-title">Consume released configuration</text>
    <text x="1017.57" y="715.0" text-anchor="middle" class="entity-detail">Ingest resolves an active ASPC and pins its revision.</text>
    <text x="1017.57" y="733.0" text-anchor="middle" class="entity-detail">Review uses persisted sample filters after initialization.</text>
    <text x="1017.57" y="751.0" text-anchor="middle" class="entity-detail">The catalog freezes its own reviewed offering.</text>
  </g>
  <path class="connection blue" d="M765 555 V590 H282 V630" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <path class="connection blue" d="M532 700 H588" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <text x="38.86" y="813" class="figure-note">Solid connectors: dependency / use. Dashed connectors: optional configuration contribution.</text>
</svg>
