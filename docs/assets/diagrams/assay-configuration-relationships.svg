<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 840" width="1120" height="840" role="img" aria-labelledby="title description">
<title id="title">Assay configuration: definitions, releases and consumers</title>
<desc id="description">Shared definitions are inputs. Setup activation and public catalog publication are separate workflows.</desc>
<defs>
<style>
:root{--canvas:#f7f9fd;--surface:#fff;--ink:#20324b;--muted:#52647b;--edge:#ccd6e4;--blue:#3564a1;--teal:#137d79;--purple:#7752aa;--amber:#986326;--blue-soft:#edf3fc;--teal-soft:#e9f6f3;--purple-soft:#f2edf9;--amber-soft:#fbf3e6}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:var(--muted)}.heading{font-size:19px;font-weight:650}.body{font-size:17px;fill:var(--muted)}.small{font-size:15px;fill:var(--muted)}.edge{fill:none;stroke:var(--blue);stroke-width:2;marker-end:url(#arrow)}.optional{stroke-dasharray:6 5}.panel{stroke:var(--edge);stroke-width:1.2}
@media(prefers-color-scheme:dark){:root{--canvas:#1d2331;--surface:#293244;--ink:#edf1fa;--muted:#c3cede;--edge:#526079;--blue:#94b9ee;--teal:#82d0bf;--purple:#c8aff3;--amber:#e6be82;--blue-soft:#2a3a52;--teal-soft:#263f40;--purple-soft:#3b304d;--amber-soft:#443c30}}
@media print{:root{--canvas:#fff;--surface:#fff;--ink:#20324b;--muted:#52647b;--edge:#ccd6e4;--blue:#3564a1;--teal:#137d79;--purple:#7752aa;--amber:#986326;--blue-soft:#edf3fc;--teal-soft:#e9f6f3;--purple-soft:#f2edf9;--amber-soft:#fbf3e6}}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="m1 1 8 4-8 4" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
</marker>
</defs>
<rect width="1120" height="840" rx="20" fill="var(--canvas)"/>
<text x="32" y="48" class="title">Assay configuration: definitions, releases and consumers</text>
<text x="32" y="80" class="subtitle">Shared definitions are inputs. Setup activation and public catalog publication are separate workflows.</text>
<g>
<rect class="panel" x="32" y="135" width="246" height="160" rx="14" fill="var(--blue-soft)"/>
<rect x="32" y="153" width="4" height="124" rx="2" fill="var(--blue)"/>
<text x="52" y="169" class="heading">Assay group</text>
<text x="52" y="200" class="body">Clinical context and</text>
<text x="52" y="225" class="body">explicit access scope.</text>
<text x="52" y="250" class="body">Parent evidence does not</text>
<text x="52" y="275" class="body">grant assay access.</text>
</g>
<g>
<rect class="panel" x="302" y="135" width="246" height="160" rx="14" fill="var(--blue-soft)"/>
<rect x="302" y="153" width="4" height="124" rx="2" fill="var(--blue)"/>
<text x="322" y="169" class="heading">Assay (ASP)</text>
<text x="322" y="200" class="body">Group, DNA/RNA, family,</text>
<text x="322" y="225" class="body">physical coverage and</text>
<text x="322" y="250" class="body">short / full names.</text>
<text x="322" y="275" class="body">Stable assay identity.</text>
</g>
<g>
<rect class="panel" x="572" y="135" width="246" height="160" rx="14" fill="var(--blue-soft)"/>
<rect x="572" y="153" width="4" height="124" rx="2" fill="var(--blue)"/>
<text x="592" y="169" class="heading">Diagnosis</text>
<text x="592" y="200" class="body">Base is implicit.</text>
<text x="592" y="225" class="body">Named definitions are</text>
<text x="592" y="250" class="body">shared; each assay has</text>
<text x="592" y="275" class="body">its own association.</text>
</g>
<g>
<rect class="panel" x="842" y="135" width="246" height="160" rx="14" fill="var(--teal-soft)"/>
<rect x="842" y="153" width="4" height="124" rx="2" fill="var(--teal)"/>
<text x="862" y="169" class="heading">Optional gene lists</text>
<text x="862" y="200" class="body">Analysis-specific genes.</text>
<text x="862" y="225" class="body">Use stable list IDs.</text>
<text x="862" y="250" class="body">Effective genes respect</text>
<text x="862" y="275" class="body">assay coverage.</text>
</g>
<g>
<rect class="panel" x="32" y="375" width="340" height="180" rx="14" fill="var(--amber-soft)"/>
<rect x="32" y="393" width="4" height="144" rx="2" fill="var(--amber)"/>
<text x="52" y="409" class="heading">Reporting rules (optional)</text>
<text x="52" y="440" class="body">Draft, review and publish</text>
<text x="52" y="465" class="body">wording for the clinical scope.</text>
<text x="52" y="490" class="body">Missing rules: report remains</text>
<text x="52" y="515" class="body">available, without automatic text.</text>
</g>
<g>
<rect class="panel" x="440" y="375" width="648" height="180" rx="14" fill="var(--purple-soft)"/>
<rect x="440" y="393" width="4" height="144" rx="2" fill="var(--purple)"/>
<text x="460" y="409" class="heading">Assay configuration (ASPC)</text>
<text x="460" y="440" class="body">One assay × diagnosis × environment scope.</text>
<text x="460" y="465" class="body">Enables analyses, expected/required files and report sections.</text>
<text x="460" y="490" class="body">Defines initial filter profiles and reportable tiers.</text>
<text x="460" y="515" class="body">Activated revisions provide the configuration used by samples.</text>
</g>
<path class="edge" d="M155 295 V328 H425 V295"/>
<path class="edge" d="M425 295 V340 H620 V375"/>
<path class="edge" d="M695 295 V375"/>
<path class="edge optional" d="M965 295 V375"/>
<path class="edge optional" d="M372 465 H440"/>
<text x="378" y="449" class="small">text</text>
<g>
<rect class="panel" x="32" y="630" width="500" height="140" rx="14" fill="var(--purple-soft)"/>
<rect x="32" y="648" width="4" height="104" rx="2" fill="var(--purple)"/>
<text x="52" y="664" class="heading">Activate the assay setup</text>
<text x="52" y="695" class="body">Validate configurations and required resources.</text>
<text x="52" y="720" class="body">Independent review precedes activation.</text>
<text x="52" y="745" class="body">Reporting-rule publication is optional.</text>
</g>
<g>
<rect class="panel" x="588" y="630" width="500" height="140" rx="14" fill="var(--teal-soft)"/>
<rect x="588" y="648" width="4" height="104" rx="2" fill="var(--teal)"/>
<text x="608" y="664" class="heading">Consume released configuration</text>
<text x="608" y="695" class="body">Ingest resolves an active ASPC and pins its revision.</text>
<text x="608" y="720" class="body">Review uses persisted sample filters after initialization.</text>
<text x="608" y="745" class="body">The catalog freezes its own reviewed offering.</text>
</g>
<path class="edge" d="M765 555 V590 H282 V630"/>
<path class="edge" d="M532 700 H588"/>
<text x="32" y="813" class="small">Solid connectors: dependency / use. Dashed connectors: optional configuration contribution.</text>
</svg>
