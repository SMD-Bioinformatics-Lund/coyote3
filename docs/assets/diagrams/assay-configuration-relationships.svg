    <text x="680" y="290" text-anchor="middle" class="entity-detail">Physical design and required files</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="310" class="entity blue">
    <title>Shared diagnosis</title>
    <use href="#icon-layers" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="229" text-anchor="middle" class="entity-title">Shared diagnosis</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">diagnoses · named definitions</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">Reusable across multiple assays</text>
    <text x="1120" y="290" text-anchor="middle" class="entity-detail">Base is implicit; no Base document</text>
  </g>
  <g data-node="3" data-left="80" data-top="478" data-right="400" data-bottom="649" class="entity purple">
