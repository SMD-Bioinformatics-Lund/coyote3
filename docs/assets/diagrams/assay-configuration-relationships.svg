    <text x="680" y="593" text-anchor="middle" class="entity-detail">asp_configs · ASPC</text>
    <text x="680" y="611" text-anchor="middle" class="entity-detail">One active scope/environment</text>
    <text x="680" y="629" text-anchor="middle" class="entity-detail">tuple</text>
    <text x="680" y="647" text-anchor="middle" class="entity-detail">Filters, analyses, reporting</text>
    <text x="680" y="665" text-anchor="middle" class="entity-detail">language</text>
