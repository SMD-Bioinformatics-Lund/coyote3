<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1280" viewBox="0 0 1360 1280" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Sample analysis context resolution</title>
  <desc id="figure-description">Sample identity resolves ASP and ASPC configuration, analysis tabs, intent-specific filters, gene scope, query policies, and paginated finding results.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-branch" viewBox="0 0 24 24">
      <path d="M6 4v11a4 4 0 0 0 4 4h8M6 9h8a4 4 0 0 0 4-4V3M3 3h6M15 3h6M15 16l3 3-3 3" class="glyph" />
    </symbol>
    <symbol id="icon-filter" viewBox="0 0 24 24">
      <path d="M2 3h20l-8 9v7l-4 3V12Z" class="glyph" />
    </symbol>
    <symbol id="icon-microscope" viewBox="0 0 24 24">
      <path d="m7 2 7 3-3 7-7-3ZM13 9c10 2 7 12-1 12H3M7 21v-4h8M2 14h10M11 3l2-2 4 2-2 3" class="glyph" />
    </symbol>
    <symbol id="icon-sample" viewBox="0 0 24 24">
      <path d="M8 2h8M9 2v7l-5 10c-1 2 0 3 2 3h12c2 0 3-1 2-3L15 9V2M7 15h10M9 18h.01M14 19h.01" class="glyph" />
    </symbol>
    <symbol id="icon-scope" viewBox="0 0 24 24">
      <path d="M2 12a10 10 0 1 0 20 0 10 10 0 0 0-20 0ZM2 12h20M12 2c-6 6-6 14 0 20 6-6 6-14 0-20Z" class="glyph" />
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6" class="glyph" />
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <path d="M16 6a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM3 22v-3c0-8 18-8 18 0v3" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Sample analysis context resolution</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Sample identity resolves ASP and ASPC configuration, analysis tabs, intent-specific filters, gene scope, query policies, and paginated finding results.</text>
  <g class="connections">
    <path d="M275 154H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M715 154H1085" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M1155 154 L1288 154Q1310 154 1310 176 L1310 423Q1310 445 1288 445 L249.5 445Q240 445 240 454.5 L240 464" data-source="2" data-target="3" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M275 499H645" data-source="3" data-target="4" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M715 499H1085" data-source="4" data-target="5" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M1155 499 L1288 499Q1310 499 1310 521 L1310 732Q1310 754 1288 754 L249.5 754Q240 754 240 763.5 L240 773" data-source="5" data-target="6" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M275 808H645" data-source="6" data-target="7" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M715 808H1085" data-source="7" data-target="8" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M715 808 L848 808Q870 808 870 830 L870 1005Q870 1027 848 1027 L249.5 1027Q240 1027 240 1036.5 L240 1046" data-source="7" data-target="9" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
  </g>
  <g data-node="0" data-left="80" data-top="120" data-right="400" data-bottom="291" class="entity blue">
    <title>1 · Sample anchor</title>
    <use href="#icon-sample" x="211" y="125" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="119" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="122.5" text-anchor="middle" class="step-number">1</text>
    <text x="240" y="210" text-anchor="middle" class="entity-title">Sample anchor</text>
    <text x="240" y="235" text-anchor="middle" class="entity-detail">sample.name · asp_id</text>
    <text x="240" y="253" text-anchor="middle" class="entity-detail">requested/resolved diagnosis</text>
    <text x="240" y="271" text-anchor="middle" class="entity-detail">environment · omics · paired</text>
  </g>
  <g data-node="1" data-left="520" data-top="120" data-right="840" data-bottom="381" class="entity purple">
    <title>2 · Resolved ASPC</title>
    <use href="#icon-settings" x="651" y="125" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="119" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="122.5" text-anchor="middle" class="step-number">2</text>
    <text x="680" y="210" text-anchor="middle" class="entity-title">Exact saved ASPC revision</text>
    <text x="680" y="235" text-anchor="middle" class="entity-detail">analysis_types control available</text>
    <text x="680" y="253" text-anchor="middle" class="entity-detail">tabs</text>
    <text x="680" y="271" text-anchor="middle" class="entity-detail">analysis_intents control</text>
    <text x="680" y="289" text-anchor="middle" class="entity-detail">somatic/germline</text>
    <text x="680" y="307" text-anchor="middle" class="entity-detail">filters grouped by analysis and</text>
    <text x="680" y="325" text-anchor="middle" class="entity-detail">intent</text>
    <text x="680" y="343" text-anchor="middle" class="entity-detail">report_sections control report</text>
    <text x="680" y="361" text-anchor="middle" class="entity-detail">domains</text>
  </g>
  <g data-node="2" data-left="960" data-top="120" data-right="1280" data-bottom="291" class="entity teal">
    <title>3 · Gene scope</title>
    <use href="#icon-scope" x="1091" y="125" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="119" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="122.5" text-anchor="middle" class="step-number">3</text>
    <text x="1120" y="210" text-anchor="middle" class="entity-title">Gene scope</text>
    <text x="1120" y="235" text-anchor="middle" class="entity-detail">selected pinned ISGL revisions</text>
    <text x="1120" y="253" text-anchor="middle" class="entity-detail">sample ad-hoc genes</text>
    <text x="1120" y="271" text-anchor="middle" class="entity-detail">intersect pinned assay eligibility</text>
    <text x="1120" y="289" text-anchor="middle" class="entity-detail">Resolved genes · empty scope</text>
  </g>
  <g data-node="3" data-left="80" data-top="465" data-right="400" data-bottom="636" class="entity blue">
    <title>4 · User request</title>
    <use href="#icon-user" x="211" y="470" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="464" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="467.5" text-anchor="middle" class="step-number">4</text>
    <text x="240" y="555" text-anchor="middle" class="entity-title">User request</text>
    <text x="240" y="580" text-anchor="middle" class="entity-detail">tab · intent · search</text>
    <text x="240" y="598" text-anchor="middle" class="entity-detail">multi-sort · page · page size</text>
    <text x="240" y="616" text-anchor="middle" class="entity-detail">temporary filter changes</text>
  </g>
  <g data-node="4" data-left="520" data-top="465" data-right="840" data-bottom="672" class="entity purple">
    <title>5 · Select domain policy</title>
    <use href="#icon-settings" x="651" y="470" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="464" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="467.5" text-anchor="middle" class="step-number">5</text>
    <text x="680" y="555" text-anchor="middle" class="entity-title">Load compiled domain policy</text>
    <text x="680" y="580" text-anchor="middle" class="entity-detail">SNV · CNV · translocation</text>
    <text x="680" y="598" text-anchor="middle" class="entity-detail">fusion · coverage · biomarker</text>
    <text x="680" y="616" text-anchor="middle" class="entity-detail">somatic/germline only where</text>
    <text x="680" y="634" text-anchor="middle" class="entity-detail">supported</text>
    <text x="680" y="652" text-anchor="middle" class="entity-detail">module availability enforced</text>
  </g>
  <g data-node="5" data-left="960" data-top="465" data-right="1280" data-bottom="690" class="entity purple">
    <title>6 · Build effective query</title>
    <use href="#icon-branch" x="1091" y="470" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="464" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="467.5" text-anchor="middle" class="step-number">6</text>
    <text x="1120" y="555" text-anchor="middle" class="entity-title">Build effective query</text>
    <text x="1120" y="580" text-anchor="middle" class="entity-detail">baseline evidence and thresholds</text>
    <text x="1120" y="598" text-anchor="middle" class="entity-detail">selected-transcript consequence</text>
    <text x="1120" y="616" text-anchor="middle" class="entity-detail">population/control frequency</text>
    <text x="1120" y="634" text-anchor="middle" class="entity-detail">policy</text>
    <text x="1120" y="652" text-anchor="middle" class="entity-detail">gene scope + released exceptions</text>
    <text x="1120" y="670" text-anchor="middle" class="entity-detail">no order-dependent admission</text>
  </g>
  <g data-node="6" data-left="80" data-top="774" data-right="400" data-bottom="963" class="entity purple">
    <title>7 · Repository query</title>
    <use href="#icon-branch" x="211" y="779" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="773" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="776.5" text-anchor="middle" class="step-number">7</text>
    <text x="240" y="864" text-anchor="middle" class="entity-title">Repository query</text>
    <text x="240" y="889" text-anchor="middle" class="entity-detail">search and all sort keys</text>
    <text x="240" y="907" text-anchor="middle" class="entity-detail">apply to full result set</text>
    <text x="240" y="925" text-anchor="middle" class="entity-detail">then paginate</text>
    <text x="240" y="943" text-anchor="middle" class="entity-detail">cache by complete query key</text>
  </g>
  <g data-node="7" data-left="520" data-top="774" data-right="840" data-bottom="963" class="entity purple">
    <title>8 · Review payload</title>
    <use href="#icon-microscope" x="651" y="779" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="773" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="776.5" text-anchor="middle" class="step-number">8</text>
    <text x="680" y="864" text-anchor="middle" class="entity-title">Review payload</text>
    <text x="680" y="889" text-anchor="middle" class="entity-detail">rows + totals</text>
    <text x="680" y="907" text-anchor="middle" class="entity-detail">filter metadata</text>
    <text x="680" y="925" text-anchor="middle" class="entity-detail">table state in URL</text>
    <text x="680" y="943" text-anchor="middle" class="entity-detail">export context</text>
  </g>
  <g data-node="8" data-left="960" data-top="774" data-right="1280" data-bottom="963" class="entity purple">
    <title>Review mutation</title>
    <use href="#icon-microscope" x="1091" y="779" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="864" text-anchor="middle" class="entity-title">Review mutation</text>
    <text x="1120" y="889" text-anchor="middle" class="entity-detail">tier · false positive · blacklist</text>
    <text x="1120" y="907" text-anchor="middle" class="entity-detail">· report · comments</text>
    <text x="1120" y="925" text-anchor="middle" class="entity-detail">invalidate affected React Query</text>
    <text x="1120" y="943" text-anchor="middle" class="entity-detail">family</text>
  </g>
  <g data-node="9" data-left="80" data-top="1047" data-right="400" data-bottom="1236" class="entity purple">
    <title>Filter or gene-list update</title>
    <use href="#icon-filter" x="211" y="1052" width="58" height="58" aria-hidden="true" />
    <text x="240" y="1137" text-anchor="middle" class="entity-title">Filter or gene-list update</text>
    <text x="240" y="1162" text-anchor="middle" class="entity-detail">persist sample effective state</text>
    <text x="240" y="1180" text-anchor="middle" class="entity-detail">version guard + before/after audit</text>
    <text x="240" y="1198" text-anchor="middle" class="entity-detail">refresh rows and temporary</text>
    <text x="240" y="1216" text-anchor="middle" class="entity-detail">report snapshot</text>
  </g>
</svg>
