<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="765" viewBox="0 0 1360 765" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Durable ingest receipt states and recovery</title>
  <desc id="figure-description">Read the existing receipt before interpreting a client timeout or missing file acknowledgement. Only pending, running, succeeded, and failed are receipt states. The other symbols describe recovery conditions.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-clock" viewBox="0 0 24 24">
      <path d="M2 12a10 10 0 1 0 20 0 10 10 0 0 0-20 0ZM12 6v6l4 3" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Durable ingest receipt states and recovery</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Read the existing receipt before interpreting a client timeout or missing file acknowledgement. Only pending, running, succeeded, and failed are receipt states. The other</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">symbols describe recovery conditions.</text>
  <g class="connections">
    <path d="M275 201H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 201H1085" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 201 L848 201Q870 201 870 223 L870 472Q870 494 848 494 L689.5 494Q680 494 680 503.5 L680 513" data-source="1" data-target="4" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 201 L848 201Q870 201 870 223 L870 444Q870 466 848 466 L262 466Q240 466 240 488 L240 513" data-source="1" data-target="3" data-optional="false" marker-end="url(#arrow-amber)" class="connection amber" />
    <path d="M240 514 L240 506Q240 498 248 498 L1313 498Q1335 498 1335 476 L1335 169Q1335 147 1313 147 L249.5 147Q240 147 240 156.5 L240 166" data-source="3" data-target="0" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M1155 201 L1288 201Q1310 201 1310 223 L1310 416Q1310 438 1288 438 L1142 438Q1120 438 1120 460 L1120 513" data-source="2" data-target="5" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
  </g>
  <g data-node="0" data-left="80" data-top="167" data-right="400" data-bottom="338" class="entity blue">
    <title>pending</title>
    <use href="#icon-layers" x="211" y="172" width="58" height="58" aria-hidden="true" />
    <text x="240" y="257" text-anchor="middle" class="entity-title">pending</text>
    <text x="240" y="282" text-anchor="middle" class="entity-detail">Request durably accepted</text>
    <text x="240" y="300" text-anchor="middle" class="entity-detail">Await worker claim / delivery</text>
    <text x="240" y="318" text-anchor="middle" class="entity-detail">Check family, beat, worker, Redis</text>
  </g>
  <g data-node="1" data-left="520" data-top="167" data-right="840" data-bottom="356" class="entity blue">
    <title>running</title>
    <use href="#icon-layers" x="651" y="172" width="58" height="58" aria-hidden="true" />
    <text x="680" y="257" text-anchor="middle" class="entity-title">running</text>
    <text x="680" y="282" text-anchor="middle" class="entity-detail">Tokenized worker lease</text>
    <text x="680" y="300" text-anchor="middle" class="entity-detail">Only lease owner can commit</text>
    <text x="680" y="318" text-anchor="middle" class="entity-detail">Inspect progress before</text>
    <text x="680" y="336" text-anchor="middle" class="entity-detail">intervening</text>
  </g>
  <g data-node="2" data-left="960" data-top="167" data-right="1280" data-bottom="374" class="entity blue">
    <title>succeeded</title>
    <use href="#icon-layers" x="1091" y="172" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="257" text-anchor="middle" class="entity-title">succeeded</text>
    <text x="1120" y="282" text-anchor="middle" class="entity-detail">Data + receipt committed</text>
    <text x="1120" y="300" text-anchor="middle" class="entity-detail">together</text>
    <text x="1120" y="318" text-anchor="middle" class="entity-detail">Stored result is replay-safe</text>
    <text x="1120" y="336" text-anchor="middle" class="entity-detail">Verify sample visibility and</text>
    <text x="1120" y="354" text-anchor="middle" class="entity-detail">evidence</text>
  </g>
  <g data-node="3" data-left="80" data-top="514" data-right="400" data-bottom="703" class="entity amber">
    <title>Retryable interruption</title>
    <use href="#icon-clock" x="211" y="519" width="58" height="58" aria-hidden="true" />
    <text x="240" y="604" text-anchor="middle" class="entity-title">Retryable interruption</text>
    <text x="240" y="629" text-anchor="middle" class="entity-detail">Transient connection /</text>
    <text x="240" y="647" text-anchor="middle" class="entity-detail">transaction</text>
    <text x="240" y="665" text-anchor="middle" class="entity-detail">Expired lease permits redelivery</text>
    <text x="240" y="683" text-anchor="middle" class="entity-detail">Keep receipt and source inputs</text>
  </g>
  <g data-node="4" data-left="520" data-top="514" data-right="840" data-bottom="721" class="entity blue">
    <title>failed</title>
    <use href="#icon-layers" x="651" y="519" width="58" height="58" aria-hidden="true" />
    <text x="680" y="604" text-anchor="middle" class="entity-title">failed</text>
    <text x="680" y="629" text-anchor="middle" class="entity-detail">Terminal validation / write</text>
    <text x="680" y="647" text-anchor="middle" class="entity-detail">failure</text>
    <text x="680" y="665" text-anchor="middle" class="entity-detail">Investigate and correct the input</text>
    <text x="680" y="683" text-anchor="middle" class="entity-detail">Submit corrected input as a new</text>
    <text x="680" y="701" text-anchor="middle" class="entity-detail">job</text>
  </g>
  <g data-node="5" data-left="960" data-top="514" data-right="1280" data-bottom="703" class="entity blue">
    <title>Post-commit acknowledgement</title>
    <use href="#icon-layers" x="1091" y="519" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="604" text-anchor="middle" class="entity-title">Post-commit acknowledgement</text>
    <text x="1120" y="629" text-anchor="middle" class="entity-detail">Watched marker or client</text>
    <text x="1120" y="647" text-anchor="middle" class="entity-detail">response</text>
    <text x="1120" y="665" text-anchor="middle" class="entity-detail">Failure does not undo the commit</text>
    <text x="1120" y="683" text-anchor="middle" class="entity-detail">Use receipt to resolve uncertainty</text>
  </g>
  <g data-edge="0" class="relationship blue">
    <text x="460" y="184" text-anchor="middle" class="edge-label">claim</text>
  </g>
  <g data-edge="1" class="relationship blue">
    <text x="900" y="184" text-anchor="middle" class="edge-label">commit</text>
  </g>
  <g data-edge="2" class="relationship blue">
    <text x="775" y="486" text-anchor="middle" class="edge-label">terminal failure</text>
  </g>
  <g data-edge="3" class="relationship amber">
    <text x="555" y="458" text-anchor="middle" class="edge-label">retryable</text>
  </g>
  <g data-edge="4" class="relationship blue">
    <text x="787.5" y="139" text-anchor="middle" class="edge-label">redispatch</text>
  </g>
  <g data-edge="5" class="relationship blue">
    <text x="1215" y="430" text-anchor="middle" class="edge-label">acknowledge</text>
  </g>
</svg>
