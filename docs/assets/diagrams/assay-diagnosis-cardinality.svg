<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1002" viewBox="0 0 1360 1002" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Assays, shared diagnoses, and independent configurations</title>
  <desc id="figure-description">Synthetic example: a shared diagnosis identifier does not share filters, gene lists, or reporting rules. For each selected named scope, create an ASPC per target environment. Base remains a separate assay scope.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
    <symbol id="icon-link" viewBox="0 0 24 24">
      <path d="m9 15-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0M15 9l2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0M8 16l8-8" class="glyph" />
    </symbol>
    <symbol id="icon-sample" viewBox="0 0 24 24">
      <path d="M8 2h8M9 2v7l-5 10c-1 2 0 3 2 3h12c2 0 3-1 2-3L15 9V2M7 15h10M9 18h.01M14 19h.01" class="glyph" />
    </symbol>
    <symbol id="icon-scope" viewBox="0 0 24 24">
      <path d="M2 12a10 10 0 1 0 20 0 10 10 0 0 0-20 0ZM2 12h20M12 2c-6 6-6 14 0 20 6-6 6-14 0-20Z" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Assays, shared diagnoses, and independent configurations</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Synthetic example: a shared diagnosis identifier does not share filters, gene lists, or reporting rules. For each selected named scope, create an ASPC per target</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">environment. Base remains a separate assay scope.</text>
  <g class="connections">
    <path d="M275 237H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M240 203 L240 180Q240 158 262 158 L1098 158Q1120 158 1120 180 L1120 203" data-source="0" data-target="2" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 237 L848 237Q870 237 870 259 L870 444Q870 466 848 466 L689.5 466Q680 466 680 475.5 L680 485" data-source="1" data-target="4" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M1155 237 L1288 237Q1310 237 1310 259 L1310 416Q1310 438 1288 438 L1142 438Q1120 438 1120 460 L1120 485" data-source="2" data-target="5" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M275 520H645" data-source="3" data-target="4" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M715 520 L848 520Q870 520 870 542 L870 727Q870 749 848 749 L689.5 749Q680 749 680 758.5 L680 768" data-source="4" data-target="7" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M1155 520 L1288 520Q1310 520 1310 542 L1310 699Q1310 721 1288 721 L1142 721Q1120 721 1120 743 L1120 768" data-source="5" data-target="8" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M240 486 L240 432Q240 410 262 410 L1098 410Q1120 410 1120 432 L1120 486" data-source="3" data-target="5" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
  </g>
  <g data-node="0" data-left="80" data-top="203" data-right="400" data-bottom="374" class="entity blue">
    <title>Assay group</title>
    <use href="#icon-sample" x="211" y="208" width="58" height="58" aria-hidden="true" />
    <text x="240" y="293" text-anchor="middle" class="entity-title">Assay group</text>
    <text x="240" y="318" text-anchor="middle" class="entity-detail">One registered group can contain</text>
    <text x="240" y="336" text-anchor="middle" class="entity-detail">multiple ASP assay identities.</text>
    <text x="240" y="354" text-anchor="middle" class="entity-detail">Each ASP selects one group.</text>
  </g>
  <g data-node="1" data-left="520" data-top="203" data-right="840" data-bottom="374" class="entity blue">
    <title>Assay A · ASP</title>
    <use href="#icon-sample" x="651" y="208" width="58" height="58" aria-hidden="true" />
    <text x="680" y="293" text-anchor="middle" class="entity-title">Assay A · ASP</text>
    <text x="680" y="318" text-anchor="middle" class="entity-detail">Physical design A</text>
    <text x="680" y="336" text-anchor="middle" class="entity-detail">Assay family and platform</text>
    <text x="680" y="354" text-anchor="middle" class="entity-detail">Input files and covered genes</text>
  </g>
  <g data-node="2" data-left="960" data-top="203" data-right="1280" data-bottom="374" class="entity blue">
    <title>Assay B · ASP</title>
    <use href="#icon-sample" x="1091" y="208" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="293" text-anchor="middle" class="entity-title">Assay B · ASP</text>
    <text x="1120" y="318" text-anchor="middle" class="entity-detail">Physical design B</text>
    <text x="1120" y="336" text-anchor="middle" class="entity-detail">Own file policy and gene coverage</text>
    <text x="1120" y="354" text-anchor="middle" class="entity-detail">May share a diagnosis with A</text>
  </g>
  <g data-node="3" data-left="80" data-top="486" data-right="400" data-bottom="657" class="entity blue">
    <title>Shared diagnosis S</title>
    <use href="#icon-layers" x="211" y="491" width="58" height="58" aria-hidden="true" />
    <text x="240" y="576" text-anchor="middle" class="entity-title">Shared diagnosis S</text>
    <text x="240" y="601" text-anchor="middle" class="entity-detail">One named diagnosis definition</text>
    <text x="240" y="619" text-anchor="middle" class="entity-detail">Identifier + display name + status</text>
    <text x="240" y="637" text-anchor="middle" class="entity-detail">No ASPC or gene membership here</text>
  </g>
  <g data-node="4" data-left="520" data-top="486" data-right="840" data-bottom="657" class="entity teal">
    <title>Association A ↔ S</title>
    <use href="#icon-link" x="651" y="491" width="58" height="58" aria-hidden="true" />
    <text x="680" y="576" text-anchor="middle" class="entity-title">Association A ↔ S</text>
    <text x="680" y="601" text-anchor="middle" class="entity-detail">One assay/diagnosis link</text>
    <text x="680" y="619" text-anchor="middle" class="entity-detail">Independent active status</text>
    <text x="680" y="637" text-anchor="middle" class="entity-detail">Definition AND link required</text>
  </g>
  <g data-node="5" data-left="960" data-top="486" data-right="1280" data-bottom="657" class="entity teal">
    <title>Association B ↔ S</title>
    <use href="#icon-link" x="1091" y="491" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="576" text-anchor="middle" class="entity-title">Association B ↔ S</text>
    <text x="1120" y="601" text-anchor="middle" class="entity-detail">A different assay/diagnosis link</text>
    <text x="1120" y="619" text-anchor="middle" class="entity-detail">Independent active status</text>
    <text x="1120" y="637" text-anchor="middle" class="entity-detail">Disabling A ↔ S does not disable B</text>
  </g>
  <g data-node="6" data-left="80" data-top="769" data-right="400" data-bottom="940" class="entity teal">
    <title>Implicit Base scope</title>
    <use href="#icon-scope" x="211" y="774" width="58" height="58" aria-hidden="true" />
    <text x="240" y="859" text-anchor="middle" class="entity-title">Implicit Base scope</text>
    <text x="240" y="884" text-anchor="middle" class="entity-detail">No diagnosis registry document</text>
    <text x="240" y="902" text-anchor="middle" class="entity-detail">No Base association document</text>
    <text x="240" y="920" text-anchor="middle" class="entity-detail">Each assay has its own Base ASPC</text>
  </g>
  <g data-node="7" data-left="520" data-top="769" data-right="840" data-bottom="958" class="entity teal">
    <title>ASPC A / S / environment</title>
    <use href="#icon-scope" x="651" y="774" width="58" height="58" aria-hidden="true" />
    <text x="680" y="859" text-anchor="middle" class="entity-title">ASPC A / S / environment</text>
    <text x="680" y="884" text-anchor="middle" class="entity-detail">One active release for this tuple</text>
    <text x="680" y="902" text-anchor="middle" class="entity-detail">Own filters and reporting language</text>
    <text x="680" y="920" text-anchor="middle" class="entity-detail">Optional typed gene-list</text>
    <text x="680" y="938" text-anchor="middle" class="entity-detail">selections</text>
  </g>
  <g data-node="8" data-left="960" data-top="769" data-right="1280" data-bottom="940" class="entity teal">
    <title>ASPC B / S / environment</title>
    <use href="#icon-scope" x="1091" y="774" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="859" text-anchor="middle" class="entity-title">ASPC B / S / environment</text>
    <text x="1120" y="884" text-anchor="middle" class="entity-detail">Different configuration identity</text>
    <text x="1120" y="902" text-anchor="middle" class="entity-detail">Own filters and compatible rules</text>
    <text x="1120" y="920" text-anchor="middle" class="entity-detail">No settings inherited from A</text>
  </g>
  <g data-edge="0" class="relationship blue">
    <text x="460" y="220" text-anchor="middle" class="edge-label">contains</text>
  </g>
  <g data-edge="1" class="relationship blue">
    <text x="680" y="149" text-anchor="middle" class="edge-label">also contains</text>
  </g>
  <g data-edge="2" class="relationship teal">
    <text x="775" y="458" text-anchor="middle" class="edge-label">assay</text>
  </g>
  <g data-edge="3" class="relationship teal">
    <text x="1215" y="430" text-anchor="middle" class="edge-label">assay</text>
  </g>
  <g data-edge="4" class="relationship teal">
    <text x="460" y="503" text-anchor="middle" class="edge-label">links A</text>
  </g>
  <g data-edge="5" class="relationship teal">
    <text x="775" y="741" text-anchor="middle" class="edge-label">enables</text>
  </g>
  <g data-edge="6" class="relationship teal">
    <text x="1215" y="713" text-anchor="middle" class="edge-label">enables</text>
  </g>
  <g data-edge="7" class="relationship teal">
    <text x="680" y="401" text-anchor="middle" class="edge-label">same definition, links B</text>
  </g>
</svg>
