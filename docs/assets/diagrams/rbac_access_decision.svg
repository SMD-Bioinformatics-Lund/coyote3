<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="570" viewBox="0 0 1160 570" role="img" aria-labelledby="title desc">
  <title id="title">Database-backed RBAC and scoped access decision</title>
  <desc id="desc">An authenticated principal is resolved against active database permissions and roles, then Casbin evaluates action permission and optional assay, assay-group, and environment scope before allowing or denying a request and recording an audit decision.</desc>
  <defs><style>.canvas{fill:#f8fafc}.band{fill:#e2e8f0}.principal{fill:#dbeafe}.db{fill:#dcfce7}.policy{fill:#fef3c7}.allow{fill:#d1fae5}.deny{fill:#fee2e2}.audit{fill:#fce7f3}.title{font:700 23px Inter,'Segoe UI',Arial,sans-serif;fill:#0f172a}.label{font:700 13px Inter,'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:11px Inter,'Segoe UI',Arial,sans-serif;fill:#334155}.box{stroke:#64748b;stroke-width:1.5}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.fail{stroke:#b91c1c;stroke-width:2;fill:none;marker-end:url(#r)}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#475569"/></marker><marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#b91c1c"/></marker></defs>
  <rect width="1160" height="570" class="canvas"/><rect x="20" y="18" width="1120" height="48" rx="10" class="band"/><text x="40" y="49" class="title">Permission and clinical-scope enforcement</text>
  <rect x="55" y="105" width="210" height="92" rx="11" class="box principal"/><text x="160" y="132" text-anchor="middle" class="label">1 · Authenticated principal</text><text x="160" y="154" text-anchor="middle" class="sub">session cookie or bearer token</text><text x="160" y="172" text-anchor="middle" class="sub">user ID + assigned role IDs</text><text x="160" y="190" text-anchor="middle" class="sub">active account required</text>
  <rect x="335" y="95" width="230" height="112" rx="11" class="box db"/><text x="450" y="122" text-anchor="middle" class="label">2 · Persisted role documents</text><text x="450" y="144" text-anchor="middle" class="sub">active role · permission IDs</text><text x="450" y="162" text-anchor="middle" class="sub">assays · assay groups</text><text x="450" y="180" text-anchor="middle" class="sub">environments · role level</text><text x="450" y="198" text-anchor="middle" class="sub">system records protected from deletion</text>
  <rect x="635" y="105" width="220" height="92" rx="11" class="box db"/><text x="745" y="132" text-anchor="middle" class="label">3 · Active permissions</text><text x="745" y="154" text-anchor="middle" class="sub">application bootstrap catalog</text><text x="745" y="172" text-anchor="middle" class="sub">persisted in MongoDB</text><text x="745" y="190" text-anchor="middle" class="sub">unknown/inactive permission denied</text>
  <path d="M265 151 H335" class="arrow"/><path d="M565 151 H635" class="arrow"/>

  <rect x="170" y="285" width="260" height="112" rx="11" class="box policy"/><text x="300" y="312" text-anchor="middle" class="label">4 · Route requirement</text><text x="300" y="334" text-anchor="middle" class="sub">for example assay.config:edit</text><text x="300" y="352" text-anchor="middle" class="sub">or variant.classification:edit</text><text x="300" y="370" text-anchor="middle" class="sub">resource context loaded where needed</text><text x="300" y="388" text-anchor="middle" class="sub">assay · group · environment</text>
  <rect x="535" y="275" width="280" height="132" rx="11" class="box policy"/><text x="675" y="302" text-anchor="middle" class="label">5 · Casbin policy decision</text><text x="675" y="324" text-anchor="middle" class="sub">is permission assigned through a role?</text><text x="675" y="342" text-anchor="middle" class="sub">is the permission active and known?</text><text x="675" y="360" text-anchor="middle" class="sub">does resource scope fit role scope?</text><text x="675" y="378" text-anchor="middle" class="sub">superuser bypass is explicit</text><text x="675" y="396" text-anchor="middle" class="sub">default result is deny</text>
  <path d="M745 197 L300 285" class="arrow"/><path d="M430 341 H535" class="arrow"/>

  <rect x="165" y="475" width="250" height="68" rx="11" class="box allow"/><text x="290" y="502" text-anchor="middle" class="label">6A · Allow</text><text x="290" y="523" text-anchor="middle" class="sub">execute service and return typed response</text>
  <rect x="745" y="475" width="250" height="68" rx="11" class="box deny"/><text x="870" y="502" text-anchor="middle" class="label">6B · Deny</text><text x="870" y="523" text-anchor="middle" class="sub">403 with structured user-facing reason</text>
  <rect x="455" y="475" width="250" height="68" rx="11" class="box audit"/><text x="580" y="502" text-anchor="middle" class="label">Access audit / metrics</text><text x="580" y="523" text-anchor="middle" class="sub">principal · permission · scope · outcome</text>
  <path d="M625 407 L290 475" class="arrow"/><path d="M725 407 L870 475" class="fail"/><path d="M290 543 H455" class="arrow"/><path d="M870 543 H705" class="arrow"/>
</svg>
