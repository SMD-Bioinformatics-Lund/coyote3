<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="430" viewBox="0 0 1240 430" role="img" aria-labelledby="title desc">
  <title id="title">Coyote3 feature delivery flow</title>
  <desc id="desc">Feature delivery from clinical or operational requirement through architecture impact, contracts, implementation, tests, documentation, review, release, and monitoring.</desc>
  <defs><style>.canvas{fill:#f8fafc}.band{fill:#e2e8f0}.discover{fill:#dbeafe}.design{fill:#e0e7ff}.build{fill:#dcfce7}.verify{fill:#fef3c7}.release{fill:#fce7f3}.title{font:700 23px Inter,'Segoe UI',Arial,sans-serif;fill:#0f172a}.phase{font:700 12px Inter,'Segoe UI',Arial,sans-serif;fill:#475569}.label{font:700 13px Inter,'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:11px Inter,'Segoe UI',Arial,sans-serif;fill:#334155}.box{stroke:#64748b;stroke-width:1.5}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.feedback{stroke:#7c3aed;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#p)}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#475569"/></marker><marker id="p" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#7c3aed"/></marker></defs>
  <rect width="1240" height="430" class="canvas"/><rect x="20" y="18" width="1200" height="48" rx="10" class="band"/><text x="40" y="49" class="title">Feature delivery with clinical and contract gates</text>
  <text x="45" y="101" class="phase">DISCOVER</text><text x="300" y="101" class="phase">DESIGN</text><text x="560" y="101" class="phase">BUILD</text><text x="820" y="101" class="phase">VERIFY</text><text x="1080" y="101" class="phase">RELEASE</text>
  <rect x="35" y="122" width="180" height="88" rx="11" class="box discover"/><text x="125" y="149" text-anchor="middle" class="label">1 · Define outcome</text><text x="125" y="171" text-anchor="middle" class="sub">clinical / user / operational</text><text x="125" y="190" text-anchor="middle" class="sub">acceptance and failure states</text>
  <rect x="270" y="122" width="200" height="88" rx="11" class="box design"/><text x="370" y="149" text-anchor="middle" class="label">2 · Map impact</text><text x="370" y="171" text-anchor="middle" class="sub">route · permission · contract</text><text x="370" y="190" text-anchor="middle" class="sub">collection · audit · UI</text>
  <rect x="525" y="122" width="200" height="88" rx="11" class="box build"/><text x="625" y="149" text-anchor="middle" class="label">3 · Implement vertically</text><text x="625" y="171" text-anchor="middle" class="sub">schema → repository → service</text><text x="625" y="190" text-anchor="middle" class="sub">route → client → page</text>
  <rect x="780" y="122" width="200" height="88" rx="11" class="box verify"/><text x="880" y="149" text-anchor="middle" class="label">4 · Verify behavior</text><text x="880" y="171" text-anchor="middle" class="sub">unit · API · component · E2E</text><text x="880" y="190" text-anchor="middle" class="sub">negative + permission paths</text>
  <rect x="1035" y="122" width="170" height="88" rx="11" class="box release"/><text x="1120" y="149" text-anchor="middle" class="label">5 · Release</text><text x="1120" y="171" text-anchor="middle" class="sub">changelog + version</text><text x="1120" y="190" text-anchor="middle" class="sub">deploy + observe</text>
  <path d="M215 166 H270" class="arrow"/><path d="M470 166 H525" class="arrow"/><path d="M725 166 H780" class="arrow"/><path d="M980 166 H1035" class="arrow"/>

  <rect x="270" y="260" width="200" height="92" rx="11" class="box design"/><text x="370" y="287" text-anchor="middle" class="label">Architecture gate</text><text x="370" y="309" text-anchor="middle" class="sub">existing patterns preferred</text><text x="370" y="329" text-anchor="middle" class="sub">data and permission ownership clear</text>
  <rect x="525" y="260" width="200" height="92" rx="11" class="box build"/><text x="625" y="287" text-anchor="middle" class="label">Contract gate</text><text x="625" y="309" text-anchor="middle" class="sub">typed reads and writes</text><text x="625" y="329" text-anchor="middle" class="sub">OpenAPI and frontend agree</text>
  <rect x="780" y="260" width="200" height="92" rx="11" class="box verify"/><text x="880" y="287" text-anchor="middle" class="label">Release gate</text><text x="880" y="309" text-anchor="middle" class="sub">lint · typecheck · tests · build</text><text x="880" y="329" text-anchor="middle" class="sub">browser + documentation validation</text>
  <path d="M370 210 V260" class="arrow"/><path d="M625 210 V260" class="arrow"/><path d="M880 210 V260" class="arrow"/>
  <path d="M1120 210 C1120 395 125 395 125 210" class="feedback"/><text x="620" y="400" text-anchor="middle" class="sub">Production evidence and user feedback return to the next requirement</text>
</svg>
