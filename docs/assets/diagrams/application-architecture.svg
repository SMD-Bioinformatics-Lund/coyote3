<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 840" width="1120" height="840" role="img" aria-labelledby="title description">
<title id="title">Application architecture: ownership and import boundaries</title>
<desc id="description">Outer entry points compose the runtime. Clinical rules and workflows remain inside the core library.</desc>
<defs>
<style>
:root{--canvas:#f7f9fd;--surface:#fff;--ink:#20324b;--muted:#52647b;--edge:#ccd6e4;--blue:#3564a1;--teal:#137d79;--purple:#7752aa;--amber:#986326;--blue-soft:#edf3fc;--teal-soft:#e9f6f3;--purple-soft:#f2edf9;--amber-soft:#fbf3e6}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:var(--muted)}.heading{font-size:19px;font-weight:650}.body{font-size:17px;fill:var(--muted)}.small{font-size:15px;fill:var(--muted)}.edge{fill:none;stroke:var(--blue);stroke-width:2;marker-end:url(#arrow)}.optional{stroke-dasharray:6 5}.panel{stroke:var(--edge);stroke-width:1.2}
@media(prefers-color-scheme:dark){:root{--canvas:#1d2331;--surface:#293244;--ink:#edf1fa;--muted:#c3cede;--edge:#526079;--blue:#94b9ee;--teal:#82d0bf;--purple:#c8aff3;--amber:#e6be82;--blue-soft:#2a3a52;--teal-soft:#263f40;--purple-soft:#3b304d;--amber-soft:#443c30}}
@media print{:root{--canvas:#fff;--surface:#fff;--ink:#20324b;--muted:#52647b;--edge:#ccd6e4;--blue:#3564a1;--teal:#137d79;--purple:#7752aa;--amber:#986326;--blue-soft:#edf3fc;--teal-soft:#e9f6f3;--purple-soft:#f2edf9;--amber-soft:#fbf3e6}}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="m1 1 8 4-8 4" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
</marker>
</defs>
<rect width="1120" height="840" rx="20" fill="var(--canvas)"/>
<text x="32" y="48" class="title">Application architecture: ownership and import boundaries</text>
<text x="32" y="80" class="subtitle">Outer entry points compose the runtime. Clinical rules and workflows remain inside the core library.</text>
<g>
<rect class="panel" x="32" y="135" width="310" height="150" rx="14" fill="var(--teal-soft)"/>
<rect x="32" y="153" width="4" height="114" rx="2" fill="var(--teal)"/>
<text x="52" y="169" class="heading">Independent HTTP client</text>
<text x="52" y="200" class="body">clients/python/</text>
<text x="52" y="225" class="body">Calls authenticated HTTP routes.</text>
<text x="52" y="250" class="body">Imports neither core nor API.</text>
</g>
<g>
<rect class="panel" x="410" y="135" width="678" height="150" rx="14" fill="var(--purple-soft)"/>
<rect x="410" y="153" width="4" height="114" rx="2" fill="var(--purple)"/>
<text x="430" y="169" class="heading">Application host</text>
<text x="430" y="200" class="body">api/app, api/interfaces/http, api/security and Celery entry points.</text>
<text x="430" y="225" class="body">Authenticate callers, bind permissions and validate transport.</text>
<text x="430" y="250" class="body">Compose repositories and integrations; delegate workflows.</text>
</g>
<path class="edge" d="M342 210 H410"/>
<text x="352" y="194" class="small">HTTP</text>
<text x="32" y="339" class="heading">CORE LIBRARY - src/coyote3/</text>
<g>
<rect class="panel" x="32" y="365" width="330" height="210" rx="14" fill="var(--purple-soft)"/>
<rect x="32" y="383" width="4" height="174" rx="2" fill="var(--purple)"/>
<text x="52" y="399" class="heading">Application operations</text>
<text x="52" y="430" class="body">application/</text>
<text x="52" y="455" class="body">Use cases and workflow services.</text>
<text x="52" y="480" class="body">Explicit access and state checks.</text>
<text x="52" y="505" class="body">Use repository protocols;</text>
<text x="52" y="530" class="body">no FastAPI or api.app imports.</text>
</g>
<g>
<rect class="panel" x="405" y="365" width="330" height="210" rx="14" fill="var(--blue-soft)"/>
<rect x="405" y="383" width="4" height="174" rx="2" fill="var(--blue)"/>
<text x="425" y="399" class="heading">Domain</text>
<text x="425" y="430" class="body">domain/</text>
<text x="425" y="455" class="body">Clinical and identity rules,</text>
<text x="425" y="480" class="body">query construction and</text>
<text x="425" y="505" class="body">repository protocols.</text>
<text x="425" y="530" class="body">No framework or host imports.</text>
</g>
<g>
<rect class="panel" x="778" y="365" width="310" height="210" rx="14" fill="var(--teal-soft)"/>
<rect x="778" y="383" width="4" height="174" rx="2" fill="var(--teal)"/>
<text x="798" y="399" class="heading">Contracts and config</text>
<text x="798" y="430" class="body">contracts/ and config/</text>
<text x="798" y="455" class="body">Typed request/data boundaries,</text>
<text x="798" y="480" class="body">validated vocabulary and</text>
<text x="798" y="505" class="body">application-owned constants.</text>
<text x="798" y="530" class="body">Select center profile explicitly.</text>
</g>
<path class="edge" d="M749 285 V315 H197 V365"/>
<path class="edge" d="M362 470 H405"/>
<path class="edge" d="M735 470 H778"/>
<text x="32" y="630" class="heading">HOST ADAPTERS IMPLEMENT THE CORE'S PROTOCOLS</text>
<g>
<rect class="panel" x="32" y="660" width="330" height="125" rx="14" fill="var(--teal-soft)"/>
<rect x="32" y="678" width="4" height="89" rx="2" fill="var(--teal)"/>
<text x="52" y="694" class="heading">MongoDB repositories</text>
<text x="52" y="725" class="body">api/infra/mongo/repositories</text>
<text x="52" y="750" class="body">Driver operations and indexes.</text>
<text x="52" y="775" class="body">No database calls in routes.</text>
</g>
<g>
<rect class="panel" x="405" y="660" width="330" height="125" rx="14" fill="var(--teal-soft)"/>
<rect x="405" y="678" width="4" height="89" rx="2" fill="var(--teal)"/>
<text x="425" y="694" class="heading">Integrations</text>
<text x="425" y="725" class="body">api/infra/</text>
<text x="425" y="750" class="body">External APIs, cache, storage,</text>
<text x="425" y="775" class="body">delivery and observability.</text>
</g>
<g>
<rect class="panel" x="778" y="660" width="310" height="125" rx="14" fill="var(--amber-soft)"/>
<rect x="778" y="678" width="4" height="89" rx="2" fill="var(--amber)"/>
<text x="798" y="694" class="heading">Report presentation</text>
<text x="798" y="725" class="body">Packaged Jinja + CSS assets.</text>
<text x="798" y="750" class="body">Host selects presentation;</text>
<text x="798" y="775" class="body">rules own clinical wording.</text>
</g>
<path class="edge" d="M197 660 V610 H570 V575"/>
<path class="edge" d="M570 660 V575"/>
<text x="32" y="821" class="small">Code dependencies point inward. Runtime adapters are supplied explicitly; the wheel's API extra adds server dependencies.</text>
</svg>
