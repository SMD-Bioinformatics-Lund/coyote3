  <g data-node="0" data-left="25" data-top="341" data-right="255" data-bottom="531" class="entity blue">
    <title>Frontend · React / TypeScript</title>
    <use href="#icon-browser" x="111" y="346" width="58" height="58" aria-hidden="true" />
    <text x="140" y="431" text-anchor="middle" class="entity-title">Frontend · React /</text>
    <text x="140" y="450" text-anchor="middle" class="entity-title">TypeScript</text>
    <text x="140" y="475" text-anchor="middle" class="entity-detail">Pages → shared components →</text>
    <text x="140" y="493" text-anchor="middle" class="entity-detail">typed API client and query</text>
    <text x="140" y="511" text-anchor="middle" class="entity-detail">cache</text>
  </g>
  <g data-node="1" data-left="325" data-top="341" data-right="555" data-bottom="548" class="entity blue">
    <title>HTTP boundary · FastAPI</title>
    <use href="#icon-browser" x="411" y="346" width="58" height="58" aria-hidden="true" />
    <text x="440" y="431" text-anchor="middle" class="entity-title">HTTP boundary · FastAPI</text>
    <text x="440" y="456" text-anchor="middle" class="entity-detail">Session / CSRF or dedicated</text>
    <text x="440" y="474" text-anchor="middle" class="entity-detail">ingest authentication</text>
    <text x="440" y="492" text-anchor="middle" class="entity-detail">Active permission catalog →</text>
    <text x="440" y="510" text-anchor="middle" class="entity-detail">role grants → assay and</text>
    <text x="440" y="528" text-anchor="middle" class="entity-detail">environment scope</text>
  </g>
  <g data-node="2" data-left="625" data-top="341" data-right="855" data-bottom="512" class="entity blue">
    <title>Application workflows</title>
    <use href="#icon-processor" x="711" y="346" width="58" height="58" aria-hidden="true" />
    <text x="740" y="431" text-anchor="middle" class="entity-title">Application workflows</text>
    <text x="740" y="456" text-anchor="middle" class="entity-detail">Ingestion · finding review ·</text>
    <text x="740" y="474" text-anchor="middle" class="entity-detail">classification · reporting ·</text>
    <text x="740" y="492" text-anchor="middle" class="entity-detail">administration</text>
  </g>
  <g data-node="3" data-left="925" data-top="120" data-right="1155" data-bottom="309" class="entity purple">
    <title>Domain and contracts</title>
    <use href="#icon-dna" x="1011" y="125" width="58" height="58" aria-hidden="true" />
    <text x="1040" y="210" text-anchor="middle" class="entity-title">Domain and contracts</text>
    <text x="1040" y="235" text-anchor="middle" class="entity-detail">Clinical rules, identity and</text>
    <text x="1040" y="253" text-anchor="middle" class="entity-detail">filter semantics</text>
    <text x="1040" y="271" text-anchor="middle" class="entity-detail">Validated transport and</text>
    <text x="1040" y="289" text-anchor="middle" class="entity-detail">collection documents</text>
  </g>
  <g data-node="4" data-left="925" data-top="341" data-right="1155" data-bottom="512" class="entity teal">
    <title>Infrastructure</title>
    <use href="#icon-server" x="1011" y="346" width="58" height="58" aria-hidden="true" />
    <text x="1040" y="431" text-anchor="middle" class="entity-title">Infrastructure</text>
    <text x="1040" y="456" text-anchor="middle" class="entity-detail">MongoDB repositories</text>
    <text x="1040" y="474" text-anchor="middle" class="entity-detail">Transactions and durable</text>
    <text x="1040" y="492" text-anchor="middle" class="entity-detail">audit outbox</text>
  </g>
  <g data-node="5" data-left="1225" data-top="120" data-right="1455" data-bottom="273" class="entity teal">
    <title>Application database</title>
    <use href="#icon-database" x="1311" y="125" width="58" height="58" aria-hidden="true" />
    <text x="1340" y="210" text-anchor="middle" class="entity-title">Application database</text>
    <text x="1340" y="235" text-anchor="middle" class="entity-detail">Samples, findings, reports</text>
    <text x="1340" y="253" text-anchor="middle" class="entity-detail">and rules</text>
  </g>
  <g data-node="6" data-left="1225" data-top="341" data-right="1455" data-bottom="513" class="entity teal">
    <title>Identity / security database</title>
    <use href="#icon-database" x="1311" y="346" width="58" height="58" aria-hidden="true" />
    <text x="1340" y="431" text-anchor="middle" class="entity-title">Identity / security</text>
    <text x="1340" y="450" text-anchor="middle" class="entity-title">database</text>
    <text x="1340" y="475" text-anchor="middle" class="entity-detail">Accounts, roles, sessions and</text>
    <text x="1340" y="493" text-anchor="middle" class="entity-detail">audit</text>
  </g>
  <g data-node="7" data-left="1225" data-top="580" data-right="1455" data-bottom="733" class="entity teal">
    <title>Knowledgebase database</title>
    <use href="#icon-database" x="1311" y="585" width="58" height="58" aria-hidden="true" />
    <text x="1340" y="670" text-anchor="middle" class="entity-title">Knowledgebase database</text>
    <text x="1340" y="695" text-anchor="middle" class="entity-detail">Reference releases and</text>
    <text x="1340" y="713" text-anchor="middle" class="entity-detail">annotations</text>
  </g>
  <g data-node="8" data-left="25" data-top="120" data-right="255" data-bottom="309" class="entity blue">
    <title>Installation commands</title>
    <use href="#icon-upload" x="111" y="125" width="58" height="58" aria-hidden="true" />
    <text x="140" y="210" text-anchor="middle" class="entity-title">Installation commands</text>
    <text x="140" y="235" text-anchor="middle" class="entity-detail">Initial bootstrap /</text>
    <text x="140" y="253" text-anchor="middle" class="entity-detail">maintenance</text>
    <text x="140" y="271" text-anchor="middle" class="entity-detail">CLI orchestration stays</text>
    <text x="140" y="289" text-anchor="middle" class="entity-detail">outside the API</text>
  </g>
  <g data-node="9" data-left="325" data-top="120" data-right="555" data-bottom="291" class="entity teal">
    <title>Shared seed loaders</title>
    <use href="#icon-folder" x="411" y="125" width="58" height="58" aria-hidden="true" />
    <text x="440" y="210" text-anchor="middle" class="entity-title">Shared seed loaders</text>
    <text x="440" y="235" text-anchor="middle" class="entity-detail">api/infra/seed</text>
    <text x="440" y="253" text-anchor="middle" class="entity-detail">Catalogs, query rules and</text>
    <text x="440" y="271" text-anchor="middle" class="entity-detail">diagram assets</text>
  </g>
  <text x="40" y="767" text-anchor="start" class="figure-note">Arrows show request or dependency direction. Each database uses its configured connection.</text>
  <text x="40" y="785" text-anchor="start" class="figure-note">A transaction must never share a session between independent MongoDB clients.</text>
</svg>
