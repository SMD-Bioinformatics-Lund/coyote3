  <text x="40" y="34" text-anchor="start" class="figure-title">Coyote3 · request and data flow</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Boundaries separate presentation, authorization, clinical decisions and persistence.</text>
