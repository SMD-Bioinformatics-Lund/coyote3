<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1130" width="1360" height="1130" role="img" aria-labelledby="title description">
  <title id="title">Application architecture: ownership and import boundaries</title>
  <desc id="description">Outer entry points compose the runtime. Clinical rules, RBAC catalogs and VEP interpretation remain inside the core library. The server distribution contains API and MongoDB components. Optional packages own ingestion transport and workers, HGNC/VEP reference bundles, and isolated synthetic demonstration resources. Hosts supply persistence and explicit installation pathways.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-browser" viewBox="0 0 24 24">
      <path d="M2 3h20v17H2ZM2 8h20M5 5.5h.01M8 5.5h.01M6 12l-2 2 2 2M18 12l2 2-2 2M10 17l4-6" class="glyph" />
    </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <path d="M4 6c0-4 16-4 16 0s-16 4-16 0Zm0 0v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
    <symbol id="icon-processor" viewBox="0 0 24 24">
      <path d="M5 5h14v14H5ZM9 9h6v6H9ZM8 1v4M16 1v4M8 19v4M16 19v4M1 8h4M1 16h4M19 8h4M19 16h4" class="glyph" />
    </symbol>
    <symbol id="icon-report" viewBox="0 0 24 24">
      <path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 18v-3M12 18v-6M16 18v-4" class="glyph" />
    </symbol>
    <symbol id="icon-server" viewBox="0 0 24 24">
      <path d="M3 2h18v6H3ZM3 10h18v6H3ZM3 18h18v4H3ZM6 5h.01M6 13h.01M10 5h8M10 13h8M6 20h.01" class="glyph" />
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="36" class="figure-title">Application architecture: ownership and import boundaries</text>
  <text x="40" y="68" class="figure-subtitle">Outer entry points compose the runtime. Clinical rules and workflows remain inside the core library.</text>
  <g class="entity teal" data-node="0" data-left="38.86" data-right="415.29" data-top="135.0" data-bottom="285.0">
    <title>Independent HTTP client</title>
    <use href="#icon-browser" x="206.07" y="138.0" width="42" height="42" aria-hidden="true" />
    <text x="227.07" y="198.0" text-anchor="middle" class="entity-title">Independent HTTP client</text>
    <text x="227.07" y="220.0" text-anchor="middle" class="entity-detail">External repository</text>
    <text x="227.07" y="238.0" text-anchor="middle" class="entity-detail">Calls authenticated HTTP routes.</text>
    <text x="227.07" y="256.0" text-anchor="middle" class="entity-detail">Imports neither core nor API.</text>
  </g>
  <g class="entity purple" data-node="1" data-left="497.86" data-right="1321.14" data-top="135.0" data-bottom="285.0">
    <title>Application host</title>
    <use href="#icon-server" x="888.5" y="138.0" width="42" height="42" aria-hidden="true" />
    <text x="909.5" y="198.0" text-anchor="middle" class="entity-title">Application host</text>
    <text x="909.5" y="220.0" text-anchor="middle" class="entity-detail">coyote_api: HTTP routes, security and maintenance tasks.</text>
    <text x="909.5" y="238.0" text-anchor="middle" class="entity-detail">Authenticate callers, bind permissions and validate transport.</text>
    <text x="909.5" y="256.0" text-anchor="middle" class="entity-detail">Compose repositories and integrations; delegate workflows.</text>
    <text x="909.5" y="274.0" text-anchor="middle" class="entity-detail">Own application catalogs; discover optional package providers.</text>
  </g>
  <path class="connection blue" d="M342 210 H410" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <text x="427.43" y="194" class="figure-note">HTTP</text>
  <text x="500" y="339" class="entity-title">CORE LIBRARY - core/src/coyote/</text>
  <g class="entity purple" data-node="2" data-left="38.86" data-right="439.57" data-top="365.0" data-bottom="575.0">
    <title>Application operations</title>
    <use href="#icon-layers" x="218.21" y="368.0" width="42" height="42" aria-hidden="true" />
    <text x="239.21" y="428.0" text-anchor="middle" class="entity-title">Application operations</text>
    <text x="239.21" y="450.0" text-anchor="middle" class="entity-detail">application/</text>
    <text x="239.21" y="468.0" text-anchor="middle" class="entity-detail">Use cases and workflow services.</text>
    <text x="239.21" y="486.0" text-anchor="middle" class="entity-detail">Explicit access and state checks.</text>
    <text x="239.21" y="504.0" text-anchor="middle" class="entity-detail">Use repository protocols;</text>
    <text x="239.21" y="522.0" text-anchor="middle" class="entity-detail">no FastAPI or</text>
    <text x="239.21" y="540.0" text-anchor="middle" class="entity-detail">coyote_api imports.</text>
  </g>
  <g class="entity blue" data-node="3" data-left="491.79" data-right="892.5" data-top="365.0" data-bottom="575.0">
    <title>Domain</title>
    <use href="#icon-layers" x="671.14" y="368.0" width="42" height="42" aria-hidden="true" />
    <text x="692.14" y="428.0" text-anchor="middle" class="entity-title">Domain</text>
    <text x="692.14" y="450.0" text-anchor="middle" class="entity-detail">domain/</text>
    <text x="692.14" y="468.0" text-anchor="middle" class="entity-detail">Clinical and identity rules,</text>
    <text x="692.14" y="486.0" text-anchor="middle" class="entity-detail">query construction and</text>
    <text x="692.14" y="504.0" text-anchor="middle" class="entity-detail">repository protocols.</text>
    <text x="692.14" y="522.0" text-anchor="middle" class="entity-detail">No framework or host imports.</text>
  </g>
  <g class="entity teal" data-node="4" data-left="944.71" data-right="1321.14" data-top="365.0" data-bottom="575.0">
    <title>Contracts and config</title>
    <use href="#icon-settings" x="1111.93" y="368.0" width="42" height="42" aria-hidden="true" />
    <text x="1132.93" y="428.0" text-anchor="middle" class="entity-title">Contracts and config</text>
    <text x="1132.93" y="450.0" text-anchor="middle" class="entity-detail">contracts/ and config/</text>
    <text x="1132.93" y="468.0" text-anchor="middle" class="entity-detail">Typed request/data boundaries,</text>
    <text x="1132.93" y="486.0" text-anchor="middle" class="entity-detail">validated vocabulary and</text>
    <text x="1132.93" y="504.0" text-anchor="middle" class="entity-detail">application-owned constants.</text>
    <text x="1132.93" y="522.0" text-anchor="middle" class="entity-detail">Select center profile explicitly.</text>
    <text x="1132.93" y="540.0" text-anchor="middle" class="entity-detail">Own RBAC and VEP interpretation policy.</text>
  </g>
  <path class="connection blue" d="M749 285 V315 H197 V365" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <path class="connection blue" d="M362 470 H405" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <path class="connection blue" d="M735 470 H778" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <text x="38.86" y="600" class="entity-title">HOST ADAPTERS IMPLEMENT THE CORE'S PROTOCOLS</text>
  <g class="entity teal" data-node="5" data-left="38.86" data-right="439.57" data-top="660.0" data-bottom="805.0">
    <title>MongoDB repositories</title>
    <use href="#icon-database" x="218.21" y="663.0" width="42" height="42" aria-hidden="true" />
    <text x="239.21" y="723.0" text-anchor="middle" class="entity-title">MongoDB repositories</text>
    <text x="239.21" y="745.0" text-anchor="middle" class="entity-detail">coyote_mongo.repositories</text>
    <text x="239.21" y="763.0" text-anchor="middle" class="entity-detail">Driver operations and indexes.</text>
    <text x="239.21" y="781.0" text-anchor="middle" class="entity-detail">No database calls in routes.</text>
  </g>
  <g class="entity teal" data-node="6" data-left="491.79" data-right="892.5" data-top="660.0" data-bottom="805.0">
    <title>Integrations</title>
    <use href="#icon-processor" x="671.14" y="663.0" width="42" height="42" aria-hidden="true" />
    <text x="692.14" y="723.0" text-anchor="middle" class="entity-title">Integrations</text>
    <text x="692.14" y="745.0" text-anchor="middle" class="entity-detail">coyote_api.infra</text>
    <text x="692.14" y="763.0" text-anchor="middle" class="entity-detail">External APIs, cache, storage,</text>
    <text x="692.14" y="781.0" text-anchor="middle" class="entity-detail">delivery and observability.</text>
  </g>
  <g class="entity amber" data-node="7" data-left="944.71" data-right="1321.14" data-top="660.0" data-bottom="805.0">
    <title>Report presentation</title>
    <use href="#icon-report" x="1111.93" y="663.0" width="42" height="42" aria-hidden="true" />
    <text x="1132.93" y="723.0" text-anchor="middle" class="entity-title">Report presentation</text>
    <text x="1132.93" y="745.0" text-anchor="middle" class="entity-detail">smd-reports HTML/PDF assets.</text>
    <text x="1132.93" y="763.0" text-anchor="middle" class="entity-detail">Host selects presentation;</text>
    <text x="1132.93" y="781.0" text-anchor="middle" class="entity-detail">rules own clinical wording.</text>
  </g>
  <path class="connection blue" d="M197 660 V610 H570 V575" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <path class="connection blue" d="M570 660 V575" marker-end="url(#arrow-blue)" transform="scale(1.2142857142857142 1)" />
  <text x="38.86" y="821" class="figure-note">API and MongoDB share coyote-server. The independent coyote-core accepts repository implementations supplied by hosts.</text>
  <text x="38.86" y="876" class="entity-title">OPTIONAL PACKAGES OWN THEIR RESOURCES AND ENTRY POINTS</text>
  <g class="blue" data-node="8" data-left="38.86" data-right="439.57" data-top="907.0" data-bottom="1070.0">
    <use href="#icon-processor" x="218.21" y="910" width="42" height="42" aria-hidden="true" />
    <text x="239.21" y="970" text-anchor="middle" class="entity-title">Coyote Relay</text>
    <text x="239.21" y="992" text-anchor="middle" class="entity-detail">services/relay/</text>
    <text x="239.21" y="1010" text-anchor="middle" class="entity-detail">Submission tools, HTTP routes and workers.</text>
    <text x="239.21" y="1028" text-anchor="middle" class="entity-detail">Shared parsing and workflow rules remain in core.</text>
    <text x="239.21" y="1046" text-anchor="middle" class="entity-detail">API and workers use server composition.</text>
  </g>
  <g class="purple" data-node="9" data-left="491.79" data-right="892.5" data-top="907.0" data-bottom="1070.0">
    <use href="#icon-layers" x="671.14" y="910" width="42" height="42" aria-hidden="true" />
    <text x="692.14" y="970" text-anchor="middle" class="entity-title">Coyote Atlas</text>
    <text x="692.14" y="992" text-anchor="middle" class="entity-detail">services/atlas/</text>
    <text x="692.14" y="1010" text-anchor="middle" class="entity-detail">HGNC/VEP snapshots, diagrams and provenance.</text>
    <text x="692.14" y="1028" text-anchor="middle" class="entity-detail">Inspect and validate reference bundles offline.</text>
    <text x="692.14" y="1046" text-anchor="middle" class="entity-detail">Install explicitly through the authorized API.</text>
  </g>
  <g class="amber" data-node="10" data-left="944.71" data-right="1321.14" data-top="907.0" data-bottom="1070.0">
    <use href="#icon-layers" x="1111.93" y="910" width="42" height="42" aria-hidden="true" />
    <text x="1132.93" y="970" text-anchor="middle" class="entity-title">Coyote Demo</text>
    <text x="1132.93" y="992" text-anchor="middle" class="entity-detail">services/demo/</text>
    <text x="1132.93" y="1010" text-anchor="middle" class="entity-detail">Synthetic catalogs and raw workflow inputs.</text>
    <text x="1132.93" y="1028" text-anchor="middle" class="entity-detail">Explicitly enabled isolated deployments only.</text>
    <text x="1132.93" y="1046" text-anchor="middle" class="entity-detail">Excluded from ordinary server bootstrap.</text>
  </g>
  <text x="38.86" y="1103" class="figure-note">Optional API routes use installed entry points. Discovering or importing a package does not install its data.</text>
</svg>
