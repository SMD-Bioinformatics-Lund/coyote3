<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" role="img" aria-labelledby="title desc">
<title id="title">Collection configuration to application access</title>
<desc id="desc">Collection names are configuration; repositories own database access. Database names and connection URIs remain independent; no cross-client MongoDB sessions.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#302b38}
.heading{font-size:26px;font-weight:700}.subtitle,.note{font-size:16px;fill:#625a6b}
.card rect{fill:#fff;stroke:#cfc6da;stroke-width:1.5}.name{font-size:19px;font-weight:700;fill:#52366d}
.detail{font-size:16px}.edge{fill:none;stroke:#78638d;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
.optional{stroke-dasharray:6 5}.edge-label rect{fill:#faf9fc;stroke:#e7e1ec}.label{font-size:14px;fill:#52366d}</style><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#78638d"/></marker></defs>
<rect width="1360" height="800" rx="12" fill="#faf9fc"/>
<text x="40" y="44" class="heading">Collection configuration to application access</text>
<text x="40" y="84" class="subtitle">Collection names are configuration; repositories own database access. Database names and connection URIs remain independent; no cross-client</text>
<text x="40" y="108" class="subtitle">MongoDB sessions.</text>
<path d="M400 300 L460 300 L460 280 L520 280" class="edge" data-source="0" data-target="1"/>
<path d="M840 280 L960 280" class="edge" data-source="1" data-target="2"/>
<path d="M1120 360 L1120 540" class="edge" data-source="2" data-target="5"/>
<path d="M960 600 L840 600" class="edge" data-source="5" data-target="4"/>
<path d="M520 600 L400 600" class="edge" data-source="4" data-target="3"/>
<g class="card" data-node="0"><rect x="80" y="220" width="320" height="180" rx="10"/>
<text x="100" y="254" class="name">1 · Center collection map</text>
<text x="100" y="299" class="detail">api/config/center/collections.tom</text>
<text x="100" y="322" class="detail">l</text>
<text x="100" y="345" class="detail">Logical services and collection</text>
<text x="100" y="368" class="detail">names</text>
</g>
<g class="card" data-node="1"><rect x="520" y="220" width="320" height="140" rx="10"/>
<text x="540" y="254" class="name">2 · Runtime configuration</text>
<text x="540" y="299" class="detail">DefaultConfig.DB_COLLECTIONS_</text>
<text x="540" y="322" class="detail">CONFIG</text>
<text x="540" y="345" class="detail">Load validated collection mapping</text>
</g>
<g class="card" data-node="2"><rect x="960" y="220" width="320" height="140" rx="10"/>
<text x="980" y="254" class="name">3 · Mongo adapter setup</text>
<text x="980" y="299" class="detail">MongoAdapter.setup()</text>
<text x="980" y="322" class="detail">Bind configured service</text>
<text x="980" y="345" class="detail">collections</text>
</g>
<g class="card" data-node="3"><rect x="80" y="540" width="320" height="120" rx="10"/>
<text x="100" y="574" class="name">6 · Application entry points</text>
<text x="100" y="619" class="detail">Services orchestrate repositories</text>
<text x="100" y="642" class="detail">Routes and tasks call services</text>
</g>
<g class="card" data-node="4"><rect x="520" y="540" width="320" height="140" rx="10"/>
<text x="540" y="574" class="name">5 · Collection repositories</text>
<text x="540" y="619" class="detail">SampleRepository,</text>
<text x="540" y="642" class="detail">VariantsRepository</text>
<text x="540" y="665" class="detail">Typed persistence and queries</text>
</g>
<g class="card" data-node="5"><rect x="960" y="540" width="320" height="140" rx="10"/>
<text x="980" y="574" class="name">4 · Named collection handles</text>
<text x="980" y="619" class="detail">samples_collection,</text>
<text x="980" y="642" class="detail">variants_collection</text>
<text x="980" y="665" class="detail">Each uses its configured database</text>
</g>


</svg>
