<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="608" viewBox="0 0 1360 608" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Collection configuration to application access</title>
  <desc id="figure-description">Collection names are configuration; repositories own database access. Database names and connection URIs remain independent; no cross-client MongoDB sessions.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <path d="M4 6c0-4 16-4 16 0s-16 4-16 0Zm0 0v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Collection configuration to application access</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Collection names are configuration; repositories own database access. Database names and connection URIs remain independent; no cross-client MongoDB sessions.</text>
  <g class="connections">
    <path d="M275 154H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M715 154H1085" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M1155 154 L1288 154Q1310 154 1310 176 L1310 351Q1310 373 1288 373 L1129.5 373Q1120 373 1120 382.5 L1120 392" data-source="2" data-target="5" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M1085 427H715" data-source="5" data-target="4" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M645 427H275" data-source="4" data-target="3" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
  </g>
  <g data-node="0" data-left="80" data-top="120" data-right="400" data-bottom="309" class="entity teal">
    <title>1 · Center collection map</title>
    <use href="#icon-database" x="211" y="125" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="119" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="122.5" text-anchor="middle" class="step-number">1</text>
    <text x="240" y="210" text-anchor="middle" class="entity-title">Center collection map</text>
    <text x="240" y="235" text-anchor="middle" class="entity-detail">coyote/config/collections.toml</text>
    <text x="240" y="253" text-anchor="middle" class="entity-detail">l</text>
    <text x="240" y="271" text-anchor="middle" class="entity-detail">Logical services and collection</text>
    <text x="240" y="289" text-anchor="middle" class="entity-detail">names</text>
  </g>
  <g data-node="1" data-left="520" data-top="120" data-right="840" data-bottom="291" class="entity purple">
    <title>2 · Runtime configuration</title>
    <use href="#icon-settings" x="651" y="125" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="119" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="122.5" text-anchor="middle" class="step-number">2</text>
    <text x="680" y="210" text-anchor="middle" class="entity-title">Runtime configuration</text>
    <text x="680" y="235" text-anchor="middle" class="entity-detail">DefaultConfig.DB_COLLECTIONS_</text>
    <text x="680" y="253" text-anchor="middle" class="entity-detail">CONFIG</text>
    <text x="680" y="271" text-anchor="middle" class="entity-detail">Load validated collection mapping</text>
  </g>
  <g data-node="2" data-left="960" data-top="120" data-right="1280" data-bottom="291" class="entity teal">
    <title>3 · Mongo adapter setup</title>
    <use href="#icon-database" x="1091" y="125" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="119" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="122.5" text-anchor="middle" class="step-number">3</text>
    <text x="1120" y="210" text-anchor="middle" class="entity-title">Mongo adapter setup</text>
    <text x="1120" y="235" text-anchor="middle" class="entity-detail">MongoAdapter.setup()</text>
    <text x="1120" y="253" text-anchor="middle" class="entity-detail">Bind configured service</text>
    <text x="1120" y="271" text-anchor="middle" class="entity-detail">collections</text>
  </g>
  <g data-node="3" data-left="80" data-top="393" data-right="400" data-bottom="546" class="entity blue">
    <title>6 · Application entry points</title>
    <use href="#icon-layers" x="211" y="398" width="58" height="58" aria-hidden="true" />
    <circle cx="272.0" cy="392" r="8" fill="currentColor" aria-hidden="true" />
    <text x="272.0" y="395.5" text-anchor="middle" class="step-number">6</text>
    <text x="240" y="483" text-anchor="middle" class="entity-title">Application entry points</text>
    <text x="240" y="508" text-anchor="middle" class="entity-detail">Services orchestrate repositories</text>
    <text x="240" y="526" text-anchor="middle" class="entity-detail">Routes and tasks call services</text>
  </g>
  <g data-node="4" data-left="520" data-top="393" data-right="840" data-bottom="564" class="entity teal">
    <title>5 · Collection repositories</title>
    <use href="#icon-database" x="651" y="398" width="58" height="58" aria-hidden="true" />
    <circle cx="712.0" cy="392" r="8" fill="currentColor" aria-hidden="true" />
    <text x="712.0" y="395.5" text-anchor="middle" class="step-number">5</text>
    <text x="680" y="483" text-anchor="middle" class="entity-title">Collection repositories</text>
    <text x="680" y="508" text-anchor="middle" class="entity-detail">SampleRepository,</text>
    <text x="680" y="526" text-anchor="middle" class="entity-detail">VariantsRepository</text>
    <text x="680" y="544" text-anchor="middle" class="entity-detail">Typed persistence and queries</text>
  </g>
  <g data-node="5" data-left="960" data-top="393" data-right="1280" data-bottom="564" class="entity teal">
    <title>4 · Named collection handles</title>
    <use href="#icon-database" x="1091" y="398" width="58" height="58" aria-hidden="true" />
    <circle cx="1152.0" cy="392" r="8" fill="currentColor" aria-hidden="true" />
    <text x="1152.0" y="395.5" text-anchor="middle" class="step-number">4</text>
    <text x="1120" y="483" text-anchor="middle" class="entity-title">Named collection handles</text>
    <text x="1120" y="508" text-anchor="middle" class="entity-detail">samples_collection,</text>
    <text x="1120" y="526" text-anchor="middle" class="entity-detail">variants_collection</text>
    <text x="1120" y="544" text-anchor="middle" class="entity-detail">Each uses its configured database</text>
  </g>
</svg>
