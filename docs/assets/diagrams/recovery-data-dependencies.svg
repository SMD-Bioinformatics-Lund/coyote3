<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="737" viewBox="0 0 1360 737" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Recovery coverage: database records are only one part</title>
  <desc id="figure-description">Plan a coordinated recovery set and validate it on a dedicated recovery target. MongoDB archives do not contain report files. Preserve broker/staging state; Redis volumes are not a disposable cache.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M2 12a10 10 0 1 0 20 0 10 10 0 0 0-20 0Z" class="glyph" />
      <path d="m7 12 3 3 7-7" class="glyph" />
    </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <path d="M4 6c0-4 16-4 16 0s-16 4-16 0Zm0 0v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0" class="glyph" />
    </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
      <path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 12h8M8 16h8M8 19h5" class="glyph" />
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Recovery coverage: database records are only one part</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Plan a coordinated recovery set and validate it on a dedicated recovery target. MongoDB archives do not contain report files. Preserve broker/staging state; Redis volumes</text>
  <text x="40" y="87" text-anchor="start" class="figure-subtitle">are not a disposable cache.</text>
  <g class="connections">
    <path d="M275 173 L408 173Q430 173 430 195 L430 444Q430 466 408 466 L249.5 466Q240 466 240 475.5 L240 485" data-source="0" data-target="3" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M715 173 L848 173Q870 173 870 195 L870 416Q870 438 848 438 L702 438Q680 438 680 460 L680 485" data-source="1" data-target="4" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M1155 173 L1288 173Q1310 173 1310 195 L1310 388Q1310 410 1288 410 L1142 410Q1120 410 1120 432 L1120 485" data-source="2" data-target="5" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
  </g>
  <g data-node="0" data-left="80" data-top="139" data-right="400" data-bottom="346" class="entity teal">
    <title>MongoDB services</title>
    <use href="#icon-database" x="211" y="144" width="58" height="58" aria-hidden="true" />
    <text x="240" y="229" text-anchor="middle" class="entity-title">MongoDB services</text>
    <text x="240" y="254" text-anchor="middle" class="entity-detail">Primary clinical/configuration</text>
    <text x="240" y="272" text-anchor="middle" class="entity-detail">data</text>
    <text x="240" y="290" text-anchor="middle" class="entity-detail">Identity, sessions, roles, audit</text>
    <text x="240" y="308" text-anchor="middle" class="entity-detail">Knowledgebase and BAM as</text>
    <text x="240" y="326" text-anchor="middle" class="entity-detail">deployed</text>
  </g>
  <g data-node="1" data-left="520" data-top="139" data-right="840" data-bottom="328" class="entity blue">
    <title>Mounted files and staging</title>
    <use href="#icon-document" x="651" y="144" width="58" height="58" aria-hidden="true" />
    <text x="680" y="229" text-anchor="middle" class="entity-title">Mounted files and staging</text>
    <text x="680" y="254" text-anchor="middle" class="entity-detail">Saved report HTML and PDF</text>
    <text x="680" y="272" text-anchor="middle" class="entity-detail">Pending/failed ingest source</text>
    <text x="680" y="290" text-anchor="middle" class="entity-detail">inputs</text>
    <text x="680" y="308" text-anchor="middle" class="entity-detail">Required registered analysis files</text>
  </g>
  <g data-node="2" data-left="960" data-top="139" data-right="1280" data-bottom="346" class="entity purple">
    <title>Deployment configuration</title>
    <use href="#icon-settings" x="1091" y="144" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="229" text-anchor="middle" class="entity-title">Deployment configuration</text>
    <text x="1120" y="254" text-anchor="middle" class="entity-detail">Exact application release / images</text>
    <text x="1120" y="272" text-anchor="middle" class="entity-detail">Environment, secrets, mounts,</text>
    <text x="1120" y="290" text-anchor="middle" class="entity-detail">routing</text>
    <text x="1120" y="308" text-anchor="middle" class="entity-detail">Center configuration and service</text>
    <text x="1120" y="326" text-anchor="middle" class="entity-detail">URIs</text>
  </g>
  <g data-node="3" data-left="80" data-top="486" data-right="400" data-bottom="693" class="entity teal">
    <title>Validate restored records</title>
    <use href="#icon-check" x="211" y="491" width="58" height="58" aria-hidden="true" />
    <text x="240" y="576" text-anchor="middle" class="entity-title">Validate restored records</text>
    <text x="240" y="601" text-anchor="middle" class="entity-detail">Clinical identities and report</text>
    <text x="240" y="619" text-anchor="middle" class="entity-detail">metadata</text>
    <text x="240" y="637" text-anchor="middle" class="entity-detail">Ingest receipts and reference</text>
    <text x="240" y="655" text-anchor="middle" class="entity-detail">releases</text>
    <text x="240" y="673" text-anchor="middle" class="entity-detail">Do not discard replay protection</text>
  </g>
  <g data-node="4" data-left="520" data-top="486" data-right="840" data-bottom="693" class="entity blue">
    <title>Validate files against records</title>
    <use href="#icon-document" x="651" y="491" width="58" height="58" aria-hidden="true" />
    <text x="680" y="576" text-anchor="middle" class="entity-title">Validate files against records</text>
    <text x="680" y="601" text-anchor="middle" class="entity-detail">Restore paths and subdirectories</text>
    <text x="680" y="619" text-anchor="middle" class="entity-detail">Check referenced HTML/PDF</text>
    <text x="680" y="637" text-anchor="middle" class="entity-detail">access</text>
    <text x="680" y="655" text-anchor="middle" class="entity-detail">Inspect mismatches before</text>
    <text x="680" y="673" text-anchor="middle" class="entity-detail">cleanup</text>
  </g>
  <g data-node="5" data-left="960" data-top="486" data-right="1280" data-bottom="657" class="entity teal">
    <title>Validate application behavior</title>
    <use href="#icon-check" x="1091" y="491" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="576" text-anchor="middle" class="entity-title">Validate application behavior</text>
    <text x="1120" y="601" text-anchor="middle" class="entity-detail">Identity and intended access scope</text>
    <text x="1120" y="619" text-anchor="middle" class="entity-detail">Review and saved report retrieval</text>
    <text x="1120" y="637" text-anchor="middle" class="entity-detail">Worker, beat, broker, and routing</text>
  </g>
  <g data-edge="0" class="relationship teal">
    <text x="335" y="458" text-anchor="middle" class="edge-label">restore + check</text>
  </g>
  <g data-edge="1" class="relationship blue">
    <text x="775" y="430" text-anchor="middle" class="edge-label">restore + reconcile</text>
  </g>
  <g data-edge="2" class="relationship teal">
    <text x="1215" y="402" text-anchor="middle" class="edge-label">configure + verify</text>
  </g>
</svg>
