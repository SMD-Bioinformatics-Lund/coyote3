<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1140" viewBox="0 0 1360 1140" role="img" aria-labelledby="title desc">
<title id="title">Clinical rule release lifecycle</title>
<desc id="desc">Clinical approval must be independent of the latest content editor. Every transition records actor, time, reason, rule identity, version, and revision.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#302b38}
.heading{font-size:26px;font-weight:700}.subtitle,.note{font-size:16px;fill:#625a6b}
.card rect{fill:#fff;stroke:#cfc6da;stroke-width:1.5}.name{font-size:19px;font-weight:700;fill:#52366d}
.detail{font-size:16px}.edge{fill:none;stroke:#78638d;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
.optional{stroke-dasharray:6 5}.edge-label rect{fill:#faf9fc;stroke:#e7e1ec}.label{font-size:14px;fill:#52366d}</style><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#78638d"/></marker></defs>
<rect width="1360" height="1140" rx="12" fill="#faf9fc"/>
<text x="40" y="44" class="heading">Clinical rule release lifecycle</text>
<text x="40" y="84" class="subtitle">Clinical approval must be independent of the latest content editor. Every transition records actor, time, reason, rule identity, version,</text>
<text x="40" y="108" class="subtitle">and revision.</text>
<path d="M400 300 L520 300" class="edge" data-source="0" data-target="1"/>
<path d="M840 300 L900 300 L900 280 L960 280" class="edge" data-source="1" data-target="2"/>
<path d="M1120 360 L1120 540" class="edge" data-source="2" data-target="5"/>
<path d="M960 620 L900 620 L900 640 L840 640" class="edge" data-source="5" data-target="4"/>
<path d="M520 640 L400 640" class="edge" data-source="4" data-target="3"/>
<path d="M1120 360 L1120 420 L880 420 L880 820 L240 820 L240 880" class="edge" data-source="2" data-target="6"/>
<g class="card" data-node="0"><rect x="80" y="220" width="320" height="180" rx="10"/>
<text x="100" y="254" class="name">Draft</text>
<text x="100" y="299" class="detail">Author, edit, validate, test</text>
<text x="100" y="322" class="detail">Only drafts may be discarded</text>
<text x="100" y="345" class="detail">Private revisions retained until</text>
<text x="100" y="368" class="detail">discard</text>
</g>
<g class="card" data-node="1"><rect x="520" y="220" width="320" height="180" rx="10"/>
<text x="540" y="254" class="name">Submitted</text>
<text x="540" y="299" class="detail">Validated content submitted</text>
<text x="540" y="322" class="detail">Content locked for review</text>
<text x="540" y="345" class="detail">Submitted versions cannot be</text>
<text x="540" y="368" class="detail">deleted</text>
</g>
<g class="card" data-node="2"><rect x="960" y="220" width="320" height="140" rx="10"/>
<text x="980" y="254" class="name">In clinical review</text>
<text x="980" y="299" class="detail">Qualified reviewer checks content</text>
<text x="980" y="322" class="detail">Approve or reject with reason</text>
<text x="980" y="345" class="detail">Record reviewer and revision</text>
</g>
<g class="card" data-node="3"><rect x="80" y="540" width="320" height="200" rx="10"/>
<text x="100" y="574" class="name">Retired</text>
<text x="100" y="619" class="detail">No longer an active published</text>
<text x="100" y="642" class="detail">release</text>
<text x="100" y="665" class="detail">Keep historical identity and</text>
<text x="100" y="688" class="detail">evidence</text>
<text x="100" y="711" class="detail">Retirement requires a reason</text>
</g>
<g class="card" data-node="4"><rect x="520" y="540" width="320" height="200" rx="10"/>
<text x="540" y="574" class="name">Published</text>
<text x="540" y="619" class="detail">Immutable release and content</text>
<text x="540" y="642" class="detail">hash</text>
<text x="540" y="665" class="detail">Eligible for matching report</text>
<text x="540" y="688" class="detail">scopes</text>
<text x="540" y="711" class="detail">Can seed a new draft version</text>
</g>
<g class="card" data-node="5"><rect x="960" y="540" width="320" height="180" rx="10"/>
<text x="980" y="574" class="name">Approved</text>
<text x="980" y="619" class="detail">Independent approval recorded</text>
<text x="980" y="642" class="detail">Ready for authorized publication</text>
<text x="980" y="665" class="detail">Publication is a separate</text>
<text x="980" y="688" class="detail">permission</text>
</g>
<g class="card" data-node="6"><rect x="80" y="880" width="320" height="140" rx="10"/>
<text x="100" y="914" class="name">Rejected</text>
<text x="100" y="959" class="detail">Review records why approval</text>
<text x="100" y="982" class="detail">failed</text>
<text x="100" y="1005" class="detail">May seed a new draft version</text>
</g>
<g class="edge-label"><rect x="427" y="286" width="65" height="28" rx="5"/>
<text x="435" y="304" class="label">submit</text>
</g>
<g class="edge-label"><rect x="855" y="286" width="65" height="28" rx="5"/>
<text x="863" y="304" class="label">review</text>
</g>
<g class="edge-label"><rect x="1084" y="436" width="71" height="28" rx="5"/>
<text x="1092" y="454" class="label">approve</text>
</g>
<g class="edge-label"><rect x="880" y="606" width="64" height="28" rx="5"/>
<text x="888" y="624" class="label">publish</text>
</g>
<g class="edge-label"><rect x="430" y="626" width="60" height="28" rx="5"/>
<text x="438" y="644" class="label">retire</text>
</g>
<g class="edge-label"><rect x="528" y="806" width="64" height="28" rx="5"/>
<text x="536" y="824" class="label">reject</text>
</g>

</svg>
