<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="899" viewBox="0 0 1360 899" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Clinical rule release lifecycle</title>
  <desc id="figure-description">Clinical approval must be independent of the latest content editor. Every transition records actor, time, reason, rule identity, version, and revision.</desc>
  <defs>
    <style>:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--ink);text-rendering:optimizeLegibility}
.figure-title{font-size:23px;font-weight:650;letter-spacing:-.45px}
.figure-subtitle{font-size:13px;fill:var(--muted)}
.entity-title{font-size:14px;font-weight:650}
.entity-detail{font-size:12.5px;fill:var(--muted)}
.edge-label{font-size:11.5px;font-weight:550;fill:currentColor}
.figure-note{font-size:12px;fill:var(--muted)}
.blue{color:var(--blue)}.teal{color:var(--teal)}.purple{color:var(--purple)}.amber{color:var(--amber)}.rose{color:var(--rose)}
.glyph{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.connection{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.network,.conditional{stroke-dasharray:5 5}
.step-number{font-size:10px;font-weight:700;fill:var(--badge-ink)}
@media(prefers-color-scheme:dark){:root{--ink:#e2ecf8;--muted:#afc2d9;--blue:#77b7f0;--teal:#63cdae;--purple:#baa3ed;--amber:#edb46b;--rose:#f390a7;--badge-ink:#112235}}
@media print{:root{--ink:#213951;--muted:#49617a;--blue:#2875b8;--teal:#17846b;--purple:#7960b2;--amber:#9d5b12;--rose:#c04a65;--badge-ink:#fff}}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--teal)" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--purple)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--amber)" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9 3 5Z" fill="var(--rose)" />
    </marker>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M2 12a10 10 0 1 0 20 0 10 10 0 0 0-20 0Z" class="glyph" />
      <path d="m7 12 3 3 7-7" class="glyph" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="m12 2 11 5-11 5L1 7ZM1 12l11 5 11-5M1 17l11 5 11-5" class="glyph" />
    </symbol>
    <symbol id="icon-microscope" viewBox="0 0 24 24">
      <path d="m7 2 7 3-3 7-7-3ZM13 9c10 2 7 12-1 12H3M7 21v-4h8M2 14h10M11 3l2-2 4 2-2 3" class="glyph" />
    </symbol>
    <symbol id="icon-reject" viewBox="0 0 24 24">
      <path d="M2 12a10 10 0 1 0 20 0 10 10 0 0 0-20 0Z" class="glyph" />
      <path d="m8 8 8 8M16 8l-8 8" class="glyph" />
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M3 15v7h18v-7M12 17V2M6 8l6-6 6 6" class="glyph" />
    </symbol>
  </defs>
  <text x="40" y="34" text-anchor="start" class="figure-title">Clinical rule release lifecycle</text>
  <text x="40" y="68" text-anchor="start" class="figure-subtitle">Clinical approval must be independent of the latest content editor. Every transition records actor, time, reason, rule identity, version, and revision.</text>
  <g class="connections">
    <path d="M275 154H645" data-source="0" data-target="1" data-optional="false" marker-end="url(#arrow-blue)" class="connection blue" />
    <path d="M715 154H1085" data-source="1" data-target="2" data-optional="false" marker-end="url(#arrow-purple)" class="connection purple" />
    <path d="M1155 154 L1288 154Q1310 154 1310 176 L1310 351Q1310 373 1288 373 L1129.5 373Q1120 373 1120 382.5 L1120 392" data-source="2" data-target="5" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M1085 427H715" data-source="5" data-target="4" data-optional="false" marker-end="url(#arrow-teal)" class="connection teal" />
    <path d="M645 427H275" data-source="4" data-target="3" data-optional="false" marker-end="url(#arrow-rose)" class="connection rose" />
    <path d="M1120 120 L1120 112Q1120 104 1128 104 L1307 104Q1329 104 1329 126 L1329 642Q1329 664 1307 664 L249.5 664Q240 664 240 673.5 L240 683" data-source="2" data-target="6" data-optional="false" marker-end="url(#arrow-rose)" class="connection rose" />
  </g>
  <g data-node="0" data-left="80" data-top="120" data-right="400" data-bottom="309" class="entity blue">
    <title>Draft</title>
    <use href="#icon-layers" x="211" y="125" width="58" height="58" aria-hidden="true" />
    <text x="240" y="210" text-anchor="middle" class="entity-title">Draft</text>
    <text x="240" y="235" text-anchor="middle" class="entity-detail">Author, edit, validate, test</text>
    <text x="240" y="253" text-anchor="middle" class="entity-detail">Only drafts may be discarded</text>
    <text x="240" y="271" text-anchor="middle" class="entity-detail">Private revisions retained until</text>
    <text x="240" y="289" text-anchor="middle" class="entity-detail">discard</text>
  </g>
  <g data-node="1" data-left="520" data-top="120" data-right="840" data-bottom="309" class="entity blue">
    <title>Submitted</title>
    <use href="#icon-upload" x="651" y="125" width="58" height="58" aria-hidden="true" />
    <text x="680" y="210" text-anchor="middle" class="entity-title">Submitted</text>
    <text x="680" y="235" text-anchor="middle" class="entity-detail">Validated content submitted</text>
    <text x="680" y="253" text-anchor="middle" class="entity-detail">Content locked for review</text>
    <text x="680" y="271" text-anchor="middle" class="entity-detail">Submitted versions cannot be</text>
    <text x="680" y="289" text-anchor="middle" class="entity-detail">deleted</text>
  </g>
  <g data-node="2" data-left="960" data-top="120" data-right="1280" data-bottom="291" class="entity purple">
    <title>In clinical review</title>
    <use href="#icon-microscope" x="1091" y="125" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="210" text-anchor="middle" class="entity-title">In clinical review</text>
    <text x="1120" y="235" text-anchor="middle" class="entity-detail">Qualified reviewer checks content</text>
    <text x="1120" y="253" text-anchor="middle" class="entity-detail">Approve or reject with reason</text>
    <text x="1120" y="271" text-anchor="middle" class="entity-detail">Record reviewer and revision</text>
  </g>
  <g data-node="3" data-left="80" data-top="393" data-right="400" data-bottom="600" class="entity rose">
    <title>Retired</title>
    <use href="#icon-reject" x="211" y="398" width="58" height="58" aria-hidden="true" />
    <text x="240" y="483" text-anchor="middle" class="entity-title">Retired</text>
    <text x="240" y="508" text-anchor="middle" class="entity-detail">No longer an active published</text>
    <text x="240" y="526" text-anchor="middle" class="entity-detail">release</text>
    <text x="240" y="544" text-anchor="middle" class="entity-detail">Keep historical identity and</text>
    <text x="240" y="562" text-anchor="middle" class="entity-detail">evidence</text>
    <text x="240" y="580" text-anchor="middle" class="entity-detail">Retirement requires a reason</text>
  </g>
  <g data-node="4" data-left="520" data-top="393" data-right="840" data-bottom="600" class="entity teal">
    <title>Published</title>
    <use href="#icon-check" x="651" y="398" width="58" height="58" aria-hidden="true" />
    <text x="680" y="483" text-anchor="middle" class="entity-title">Published</text>
    <text x="680" y="508" text-anchor="middle" class="entity-detail">Immutable release and content</text>
    <text x="680" y="526" text-anchor="middle" class="entity-detail">hash</text>
    <text x="680" y="544" text-anchor="middle" class="entity-detail">Eligible for matching report</text>
    <text x="680" y="562" text-anchor="middle" class="entity-detail">scopes</text>
    <text x="680" y="580" text-anchor="middle" class="entity-detail">Can seed a new draft version</text>
  </g>
  <g data-node="5" data-left="960" data-top="393" data-right="1280" data-bottom="582" class="entity teal">
    <title>Approved</title>
    <use href="#icon-check" x="1091" y="398" width="58" height="58" aria-hidden="true" />
    <text x="1120" y="483" text-anchor="middle" class="entity-title">Approved</text>
    <text x="1120" y="508" text-anchor="middle" class="entity-detail">Independent approval recorded</text>
    <text x="1120" y="526" text-anchor="middle" class="entity-detail">Ready for authorized publication</text>
    <text x="1120" y="544" text-anchor="middle" class="entity-detail">Publication is a separate</text>
    <text x="1120" y="562" text-anchor="middle" class="entity-detail">permission</text>
  </g>
  <g data-node="6" data-left="80" data-top="684" data-right="400" data-bottom="855" class="entity rose">
    <title>Rejected</title>
    <use href="#icon-reject" x="211" y="689" width="58" height="58" aria-hidden="true" />
    <text x="240" y="774" text-anchor="middle" class="entity-title">Rejected</text>
    <text x="240" y="799" text-anchor="middle" class="entity-detail">Review records why approval</text>
    <text x="240" y="817" text-anchor="middle" class="entity-detail">failed</text>
    <text x="240" y="835" text-anchor="middle" class="entity-detail">May seed a new draft version</text>
  </g>
  <g data-edge="0" class="relationship blue">
    <text x="460" y="137" text-anchor="middle" class="edge-label">submit</text>
  </g>
  <g data-edge="1" class="relationship purple">
    <text x="900" y="137" text-anchor="middle" class="edge-label">review</text>
  </g>
  <g data-edge="2" class="relationship teal">
    <text x="1215" y="365" text-anchor="middle" class="edge-label">approve</text>
  </g>
  <g data-edge="3" class="relationship teal">
    <text x="900" y="410" text-anchor="middle" class="edge-label">publish</text>
  </g>
  <g data-edge="4" class="relationship rose">
    <text x="460" y="410" text-anchor="middle" class="edge-label">retire</text>
  </g>
  <g data-edge="5" class="relationship rose">
    <text x="784.5" y="656" text-anchor="middle" class="edge-label">reject</text>
  </g>
</svg>
