[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coyote-pyclient"
version = "1.0.0"
description = "Typed synchronous and asynchronous HTTP clients for the Coyote API"
requires-python = ">=3.12"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt", "COPYRIGHT.txt", "NOTICE.txt"]
authors = [{ name = "Ram Nanduri" }]
dependencies = ["httpx==0.28.1", "pydantic==2.14.3"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "pytest-cov==7.1.0", "pytest-asyncio==1.3.0"]

# Contributor acknowledgments; not part of the package Author metadata.
[tool.coyote4.attribution]
contributors = ["Sailendra Pradhananga", "Viktor Henmyr"]

[tool.setuptools.package-dir]
"" = "."
coyote_pyclient = "src/coyote_pyclient"

[tool.setuptools.packages.find]
where = ["src"]
include = ["coyote_pyclient", "coyote_pyclient.*"]

[tool.setuptools.cmdclass]
build_py = "client_build.CleanClientBuildPy"

[tool.setuptools.package-data]
coyote_pyclient = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
markers = [
  "smoke: fast synthetic checks without external services or artifact builds",
  "unit: isolated behavior with synthetic fixtures",
  "api: HTTP and host-boundary behavior",
  "client: synchronous and asynchronous HTTP client behavior",
  "integration: explicitly configured service integration",
  "contract: schema and architecture contracts",
]
filterwarnings = [
  'ignore:tagMap is deprecated\. Please use TAG_MAP instead\.:DeprecationWarning:ldap3\.utils\.asn1',
  'ignore:typeMap is deprecated\. Please use TYPE_MAP instead\.:DeprecationWarning:ldap3\.utils\.asn1',
]

[tool.coverage.run]
branch = true
source = ["coyote_pyclient"]
data_file = ".coverage"

[tool.coverage.report]
fail_under = 81
show_missing = true
precision = 2
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"
