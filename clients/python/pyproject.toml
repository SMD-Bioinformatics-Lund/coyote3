[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coyote3-client"
version = "2.0.0"
description = "Typed synchronous and asynchronous HTTP clients for the Coyote3 API"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "NOTICE.txt"]
authors = [
    {name = "Ram Nanduri"},
    {name = "Sailendra Pradhananga"},
    {name = "Viktor Henmyr"},
]
dependencies = ["httpx==0.28.1", "pydantic==2.13.5"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "pytest-asyncio==1.3.0"]

[tool.setuptools.package-dir]
"" = "."
coyote3_client = "src/coyote3_client"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.cmdclass]
build_py = "client_build.CleanClientBuildPy"

[tool.setuptools.package-data]
coyote3_client = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
