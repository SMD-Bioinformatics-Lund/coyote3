name: Client quality

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install client and test dependencies
        run: python -m pip install ".[test]"
      - name: Version and changelog consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert f"## {version}" in Path("CHANGELOG.md").read_text().splitlines(), "Add release notes for the package version"
          PY
      - name: Smoke tests
        run: python -m pytest -q tests/smoke
      - name: Build standalone wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
