<table class="variant_table">
  <thead><tr><th>Gen</th><th>Mutation</th><th>Variantfrekvens</th><th>Klassificering</th></tr></thead>
  <tbody>{% for var in variants %}
    <tr{% if var.class == 1 %} class="report-tier-one"{% endif %}>
      <td>{{ var.symbol }}</td>
      <td>{% if var.indel_size > 20 %}{{ var.cdna }}{% else %}{{ var.variant|unesc }}{% endif %}</td>
      <td>{{ var.af|perc_no_dec }}</td><td>{{ var.class_short_desc }}</td>
    </tr>
  {% endfor %}</tbody>
</table>
