# Core library defaults. Shared settings are defined once and reused by model and form contracts.

[capabilities.assay]
categories = ["dna", "rna"]
families = ["panel-dna", "panel-rna", "wes", "wgs", "wts"]
base_diagnosis_id = "base"

[capabilities.assay.family_categories]
panel-dna = "dna"
wes = "dna"
wgs = "dna"
panel-rna = "rna"
wts = "rna"

[capabilities.assay.family_scopes]
panel-dna = "panel"
wes = "wes"
wgs = "wgs"
panel-rna = "panel"
wts = "wts"

[capabilities.environment]
options = ["production", "development", "testing", "validation"]
default = "production"

[capabilities.authentication]
providers = ["local", "ldap"]

[capabilities.genelist]
standard_types = ["snv", "cnv", "fusion", "expression", "pgx"]
adhoc_types = ["adhoc_snv", "adhoc_cnv", "adhoc_fusion", "adhoc_expression", "adhoc_pgx"]

[capabilities.fusion]
callers = ["arriba", "fusioncatcher", "starfusion"]

[capabilities.files.dna]
keys = ["vcf_files", "cnv", "cnvprofile", "cov", "transloc", "biomarkers", "pgx"]

[capabilities.files.rna]
keys = ["fusion_files", "expression_path", "classification_path", "qc"]

[capabilities.analysis.dna]
types = ["SNV", "CNV", "CNV_PROFILE", "TRANSLOCATION", "HRD", "MSI", "COVERAGE", "TMB", "PGX"]

[capabilities.analysis.dna.file_keys]
SNV = ["vcf_files"]
CNV = ["cnv"]
TRANSLOCATION = ["transloc"]
HRD = ["biomarkers"]
MSI = ["biomarkers"]
CNV_PROFILE = ["cnvprofile"]
COVERAGE = ["cov"]
TMB = ["biomarkers"]
PGX = ["pgx"]

[capabilities.analysis.rna]
types = ["FUSION", "EXPRESSION", "CLASSIFICATION", "QC"]

[capabilities.analysis.rna.file_keys]
FUSION = ["fusion_files"]
EXPRESSION = ["expression_path"]
CLASSIFICATION = ["classification_path"]
QC = ["qc"]

[capabilities.analysis.family_overrides]
panel-rna = ["FUSION", "QC"]

[capabilities.reporting]
transcript_selection_order = ["ncbi_mane_plus_clinical", "ensembl_mane_plus_clinical", "ncbi_mane_select", "ensembl_mane_select", "vep_canonical_protein_coding", "first_protein_coding", "first_available"]

[clinical_queries.snv]
default_somatic_policy = "paired"
default_germline_policy = "exception_only"
population_frequency_fields = ["gnomad_frequency", "gnomad_max", "exac_frequency", "thousandG_frequency"]

[contracts]
app_controls_id = "default"
permission_categories = ["Analysis Actions", "Application Control Management", "Assay Configuration Management", "Assay Panel Management", "Audit & Monitoring", "Clinical Reporting Rules", "Query Rules", "Data Downloads", "Gene List Management", "Permission Policy Management", "Reports", "Role Management", "Sample Management", "Schema Management", "User Management", "Variant Curation", "Visualization"]

[contracts.pipeline_manifest]
assay = "asp_id"
diagnosis = "diagnosis_id"
profile = "environment"
sequencing_technology = "platform"

[contracts.notifications]
tones = ["error", "info", "success", "warning"]
categories = ["application", "feature", "maintenance", "security", "warning"]

[contracts.analysis_preload.dna]
SNV = "snvs"
CNV = "cnvs"
TRANSLOCATION = "transloc"
HRD = "biomarkers"
MSI = "biomarkers"
COVERAGE = "cov"
TMB = "biomarkers"
PGX = "pgx"

[contracts.analysis_preload.rna]
FUSION = "fusions"
EXPRESSION = "rna_expr"
CLASSIFICATION = "rna_class"
QC = "rna_qc"

[contracts.non_database_analyses]
dna = ["CNV_PROFILE"]
rna = []

[platforms.illumina]
read_technology = "short_read"
read_modes = ["SE", "PE"]

[platforms.iontorrent]
read_technology = "short_read"
read_modes = []

[platforms.pacbio]
read_technology = "long_read"
read_modes = []

[platforms.nanopore]
read_technology = "long_read"
read_modes = []

[notation]
swedish_small_cardinals_common = ["noll", "en", "två", "tre", "fyra", "fem", "sex", "sju", "åtta", "nio", "tio", "elva", "tolv"]
swedish_small_cardinals_neuter = ["noll", "ett", "två", "tre", "fyra", "fem", "sex", "sju", "åtta", "nio", "tio", "elva", "tolv"]

[notation.amino_acid_three_to_one]
Ala = "A"
Arg = "R"
Asn = "N"
Asp = "D"
Cys = "C"
Gln = "Q"
Glu = "E"
Gly = "G"
His = "H"
Ile = "I"
Leu = "L"
Lys = "K"
Met = "M"
Phe = "F"
Pro = "P"
Ser = "S"
Thr = "T"
Trp = "W"
Tyr = "Y"
Val = "V"
Ter = "*"

[knowledgebases.public_api_urls]
oncokb = "https://public.api.oncokb.org/api/v1"
clinpgx = "https://api.clinpgx.org/v1"

[knowledgebases.external_links]
oncokb_gene = "https://www.oncokb.org/gene"

[records]
system_managed = false
system_installed = false
is_active = true

[assay_defaults]
analysis_intents = ["somatic"]
use_diagnosis_genelist = false
catalog_is_public = true
accredited = false
adhoc = false
genelist_is_public = false

[reporting]
reportable_tiers = [1, 2, 3]
language = "sv"
plots_path = "/tmp"
report_folder = "reports"

[reporting.empty_results]
SNV = "Inga detekterade mutationer"
GERMLINE_SNV = "Inga detekterade germline-varianter"
CNV = "Inga detekterade genspecifika kopietalsförändringar."
FUSION = "Inga detekterade fusioner"
BIOMARKER = "Inga rapporterbara biomarkörresultat"
PGX = "Inga rapporterbara farmakogenomiska resultat"

[filters.snv]
max_freq = 1.0
min_freq = 0.0
max_control_freq = 0.05
max_popfreq = 0.05
min_depth = 100
min_alt_reads = 5

[filters.cnv]
min_cnv_size = 100
max_cnv_size = 50000000
cnv_loss_cutoff = -0.3
cnv_gain_cutoff = 0.3
cnveffects = ["gain", "loss"]

[filters.coverage]
warn_cov = 100
error_cov = 10

[filters.fusion]
min_spanning_pairs = 0
min_spanning_reads = 0

[controls.CeleryControlDoc]
enabled = true
sample_ingest_enabled = true
collection_writes_enabled = true
maintenance_enabled = true

[controls.RetentionControlDoc]
audit_events_days = 730
notification_days = 180
disk_log_days = 30
gzip_disk_logs_after_days = 7

[controls.ModuleControlDoc]
dna_analysis_enabled = true
rna_analysis_enabled = true
reports_enabled = true
variant_search_enabled = true
knowledgebases_enabled = true
ingest_workspace_enabled = true
assay_catalog_enabled = true

[controls.TieringControlDoc]
small_variant_enabled = true
cnv_enabled = true
fusion_enabled = true
translocation_enabled = true

[controls.EmailControlDoc]
enabled = true

[governance_defaults]
must_change_password = false

[starter_defaults]
use_diagnosis_genelist = true

[starter_defaults.snv]
min_freq = 0.03
max_popfreq = 0.01

[starter_defaults.cnv]
max_cnv_size = 1000000

[starter_defaults.coverage]
warn_cov = 500
error_cov = 100

[starter_defaults.fusion]
min_spanning_reads = 5
min_spanning_pairs = 5
fusion_callers = ["arriba", "starfusion"]
fusion_effects = ["in-frame", "out-of-frame"]

[starter_defaults.asp]
platform = "illumina"
read_mode = "PE"
read_length = 150

[starter_defaults.dna]
analyses = ["SNV", "CNV"]
report_header = "Coyote3 DNA Report"
report_method = "NGS panel analysis"

[starter_defaults.rna]
analyses = ["FUSION"]
report_header = "Coyote3 RNA Report"
report_method = "RNA fusion analysis"

[pagination]
max_page_size = 200
