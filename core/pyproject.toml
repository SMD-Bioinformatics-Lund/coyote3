[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coyote-core"
version = "4.0.0"
requires-python = ">=3.12"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt", "COPYRIGHT.txt", "NOTICE.txt", "LICENSING.md", "THIRD_PARTY_NOTICES.md"]
description = "A Bioinformatics Interpretation and Analysis Tool built by bioinformaticians at the Section for Molecular Diagnostics, Region Skåne, Lund, Sweden"
authors = [
    {name = "Ram Nanduri"},
]
maintainers = [
    {name = "Ram Nanduri"},
]
keywords = [
    "bioinformatics",
    "clinical-interpretation",
    "clinical-genomics",
    "genomic-variants",
    "molecular-diagnostics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "bleach==6.4.0",
    "Jinja2==3.1.6",
    "Markdown==3.11.3",
    "pydantic==2.14.3",
    "pysam==0.24.1",
    "PyYAML==6.0.3",
    "smd-reports==0.5.3",
    "weasyprint==70.0",
]

[project.urls]
Homepage = "https://github.com/SMD-Bioinformatics-Lund/coyote3"
Repository = "https://github.com/SMD-Bioinformatics-Lund/coyote3"
Documentation = "https://smd-bioinformatics-lund.github.io/coyote3"
"Bug Tracker" = "https://github.com/SMD-Bioinformatics-Lund/coyote3/issues"
Source = "https://github.com/SMD-Bioinformatics-Lund/coyote3"
Security = "https://github.com/SMD-Bioinformatics-Lund/coyote3/security"
Releases = "https://github.com/SMD-Bioinformatics-Lund/coyote3/releases"

[project.optional-dependencies]
test = ["pytest==9.0.3", "pytest-cov==7.1.0", "pytest-mock==3.15.1", "pytest-asyncio==1.3.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "."
coyote = "src/coyote"

[tool.setuptools.cmdclass]
build_py = "build_support.CoreBuildPy"

[tool.setuptools.packages.find]
where = ["src"]
include = ["coyote", "coyote.*"]
namespaces = true

[tool.setuptools.package-data]
coyote = [
    "py.typed",
    "config/*.toml",
    "config/*.json",
    "config/*.yaml",
    "config/catalogs/rbac/*.ndjson",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "smoke: fast synthetic checks without external services or artifact builds",
    "unit: isolated behavior with synthetic fixtures",
    "api: HTTP and host-boundary behavior",
    "client: synchronous and asynchronous HTTP client behavior",
    "integration: explicitly configured service integration",
    "contract: schema and architecture contracts",
]
filterwarnings = [
    'ignore:tagMap is deprecated\. Please use TAG_MAP instead\.:DeprecationWarning:ldap3\.utils\.asn1',
    'ignore:typeMap is deprecated\. Please use TYPE_MAP instead\.:DeprecationWarning:ldap3\.utils\.asn1',
]

[tool.coverage.run]
branch = true
source = ["coyote"]
data_file = ".coverage"

[tool.coverage.report]
fail_under = 62
show_missing = true
precision = 2
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"
