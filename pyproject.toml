[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coyote-server"
version = "1.0.0"
description = "Coyote HTTP API, worker host and MongoDB adapter"
requires-python = ">=3.12"
readme = "api/README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt", "COPYRIGHT.txt", "NOTICE.txt"]
authors = [{name = "Ram Nanduri"}]
dependencies = [
    "coyote-core[reporting,alignment]==4.0.0",
    "pymongo==4.18.3",
    "pydantic==2.14.3",
    "Jinja2==3.1.6",
    "billiard==4.3.2",
    "defusedxml==0.7.1",
    "python-dotenv==1.2.2",
    "Brotli==1.2.1",
    "celery[redis]==5.6.3",
    "colorlog==6.10.1",
    "cffi==2.0.0",
    "click==8.3.3",
    "cssselect2==0.9.0",
    "dnspython==2.9.0",
    "filelock==4.2.1",
    "fonttools==4.68.0",
    "ldap3==2.9.1",
    "itsdangerous==2.2.0",
    "MarkupSafe==3.0.3",
    "pillow==13.0.0",
    "pydantic_core==2.50.4",
    "casbin==1.36.1",
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "pyasn1==0.6.5",
    "idna==3.19",
    "python-multipart==0.0.31",
    "uvicorn==0.44.0",
    "pydyf==0.12.1",
    "python-dateutil==2.9.0.post0",
    "redis==7.4.0",
    "tinycss2==1.5.1",
    "tinyhtml5==2.1.0",
    "typing_extensions==4.16.0",
    "webencodings==0.5.1",
    "Werkzeug==3.1.9",
    "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==9.0.3", "pytest-cov==7.1.0", "pytest-asyncio==1.3.0", "mongomock==4.3.0"]

[project.scripts]
coyote4-api = "coyote_api.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.cmdclass]
build_py = "package_build.CleanBuildPy"

[tool.setuptools.package-dir]
"" = "."
coyote_api = "api/src/coyote_api"
coyote_mongo = "adapters/mongo/src/coyote_mongo"

[tool.setuptools.packages.find]
where = ["api/src", "adapters/mongo/src"]
include = ["coyote_api", "coyote_api.*", "coyote_mongo", "coyote_mongo.*"]

[tool.setuptools.package-data]
coyote_api = ["py.typed", "app/templates/*", "config/*.toml", "config/assets/*", "config/examples/center/*", "bootstrap/catalogs/**/*"]
coyote_mongo = ["py.typed", "config/*.toml"]

[dependency-groups]
application = ["coyote-relay==1.0.0", "coyote-atlas==1.0.0"]
watch = ["watchdog[watchmedo]==7.1.0"]
dev = [
    {include-group = "watch"},
    "pip==26.2.1",
    "setuptools==84.2.1",
    "wheel==0.48.0",
    "mypy==1.20.1",
    "mypy-extensions==1.1.0",
    "pre-commit==4.5.1",
    "pip-audit==2.10.0",
    "shellcheck-py==0.11.0.1",
    "ruff==0.15.10",
    "types-python-dateutil==2.9.0.20260408",
]
test = [
    "mkdocs==1.6.1",
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.3.0",
    "coverage==7.13.5",
    "mongomock==4.3.0",
]
docs = [
    "mkdocs==1.6.1",
]
load = [
    "locust==2.46.5",
]


[tool.coyote4.attribution]
contributors = ["Sailendra Pradhananga", "Viktor Henmyr"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "TID"]
# D1xx remain excluded here so test fixtures need not document every helper.
# D203/D213: conflict with Google style (D211/D212 selected by convention)
# D400/D401/D415: first-line punctuation - too noisy for existing codebase
ignore = [
    "E501",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D200",
    "D202",
    "D203",
    "D205",
    "D212",
    "D213",
    "D400",
    "D401",
    "D403",
    "D410",
    "D411",
    "D415",
    "D416",
    "D417",
    "D419",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"coyote_api" = { msg = "UI/runtime-adjacent code must not import backend coyote_api.* modules directly; use the HTTP client boundary instead." }
"pymongo" = { msg = "Mongo driver imports are restricted to infra/common/script layers; keep UI and higher-level runtime code storage-agnostic." }
"bson" = { msg = "Mongo BSON helpers are restricted to infra/common/script layers; use owned helper seams outside those layers." }
"motor" = { msg = "Mongo driver imports are restricted to infra/common/script layers; keep UI and higher-level runtime code storage-agnostic." }

[tool.ruff.lint.per-file-ignores]
"api/**/*.py" = ["TID251"]
"adapters/**/*.py" = ["TID251"]
"services/relay/src/coyote_relay/api/**/*.py" = ["TID251"]
"services/relay/tests/**/*.py" = ["TID251"]
"services/relay/src/coyote_relay/celery_app.py" = ["TID251"]
"services/relay/src/coyote_relay/tasks.py" = ["TID251"]
"services/relay/src/coyote_relay/worker.py" = ["TID251"]
"services/demo/src/coyote_demo/api/**/*.py" = ["TID251"]
"services/demo/src/coyote_demo/host.py" = ["TID251"]
"services/demo/tests/**/*.py" = ["TID251"]
"core/src/coyote/**/*.py" = ["TID251"]
"core/tests/**/*.py" = ["TID251"]
"scripts/**/*.py" = ["TID251"]
"deploy/installer/**/*.py" = ["TID251"]
"migrations_scripts/**/*.py" = ["TID251"]
"tests/**/*.py" = ["TID251"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "skip"
ignore_missing_imports = true
files = [
    "core/src/coyote/application/operations",
    "core/src/coyote/application/editing.py",
    "core/src/coyote/application/common/access.py",
    "api/src/coyote_api/app/application_factory.py",
    "api/src/coyote_api/app/deps/application.py",
    "api/src/coyote_api/infra/security/worker_policy.py",
    "core/src/coyote/application/accounts/common.py",
    "core/src/coyote/application/common/managed_records.py",
    "core/src/coyote/application/audit/ports.py",
    "core/src/coyote/application/ingest/translocations.py",
    "core/src/coyote/domain",
    "core/src/coyote/application/accounts/permissions.py",
    "core/src/coyote/application/accounts/roles.py",
    "core/src/coyote/application/accounts/users.py",
    "core/src/coyote/application/audit/service.py",
    "adapters/mongo/src/coyote_mongo/repositories/audit.py",
    "adapters/mongo/src/coyote_mongo/repositories/base.py",
    "adapters/mongo/src/coyote_mongo/repositories/assay_configurations.py",
    "adapters/mongo/src/coyote_mongo/transactions.py",
    "adapters/mongo/tests/integration/test_assay_configuration_port.py",
    "core/src/coyote/application/notifications/access.py",
    "core/src/coyote/application/notifications/service.py",
    "core/src/coyote/application/notifications/activity.py",
    "api/src/coyote_api/services/provisioning/deployment_data.py",
    "services/demo/src/coyote_demo/installation.py",
    "core/src/coyote/application/common/alignment_files.py",
    "core/src/coyote/application/common/change_payload.py",
    "api/src/coyote_api/infra/artifact_paths.py",
    "core/src/coyote/application/common/finding_access.py",
    "core/src/coyote/application/common/pagination.py",
    "core/src/coyote/application/common/protected_records.py",
    "core/src/coyote/application/common/table_state.py",
    "core/src/coyote/application/ingest/analysis_parsers.py",
    "core/src/coyote/application/ingest/helpers.py",
    "core/src/coyote/application/ingest/json_resources.py",
    "core/src/coyote/application/ingest/sample_updates.py",
    "core/src/coyote/application/knowledgebase/gene_markers.py",
    "core/src/coyote/application/knowledgebase/oncokb_refresh.py",
    "api/src/coyote_api/infra/observability/client_errors.py",
    "core/src/coyote/application/reporting/clinical_rules/renderers.py",
    "core/src/coyote/application/reporting/clinical_rules/resolution.py",
    "core/src/coyote/application/reporting/clinical_rules/testing.py",
    "core/src/coyote/application/reporting/report_library.py",
    "core/src/coyote/application/resources/asp.py",
    "core/src/coyote/config/application_modules.py",
    "core/src/coyote/config/constants.py",
    "api/src/coyote_api/infra/notifications/email.py",
    "core/src/coyote/application/common/observability.py",
    "api/src/coyote_api/infra/observability/prometheus_metrics.py",
    "api/src/coyote_api/security",
]

[[tool.mypy.overrides]]
module = ["pydantic", "pydantic.*"]
follow_imports = "normal"

[[tool.mypy.overrides]]
module = ["pymongo", "pymongo.*", "bson", "bson.*", "pytest", "pytest.*", "_pytest", "_pytest.*"]
follow_imports = "normal"

[tool.uv]
# Integrated development uses the local core selected by the workspace.
override-dependencies = ["coyote-core[reporting,alignment]"]
default-groups = ["dev", "application"]

[tool.uv.workspace]
members = ["core", "services/relay", "services/demo"]

[tool.uv.sources]
coyote-core = { workspace = true }
coyote-server = { workspace = true }
coyote-relay = { workspace = true }
coyote-atlas = { git = "https://github.com/SMD-Bioinformatics-Lund/coyote-atlas.git", rev = "06dd19da58969b80e04cd9dfda5080dbf5902bc4" }
coyote-demo = { workspace = true }
