[[tool.mypy.overrides]]
module = ["pydantic", "pydantic.*"]
follow_imports = "normal"

[tool.uv.workspace]
members = ["core", "api", "adapters/mongo", "clients/python"]

[tool.uv.sources]
coyote-core = { workspace = true }
coyote-mongo = { workspace = true }
coyote-api = { workspace = true }
coyote-pyclient = { workspace = true }
