# Application-owned installation criteria for database-managed query rules.
# Loaded by Python bootstrap tools; not part of editable center configuration.
# Manage installed policies through Administration > Query rules.

[snv]

# Analysis-specific policy namespaces. Their exception arrays are empty until
# a reviewed rule is released for that finding type. A rule in one namespace
# can never alter another analysis query.
[cnv]

[translocation]

[fusion]

[pgx]

[[snv.exceptions]]
id = "flt3_svtype"
mode = "extend_consequence"
intents = ["somatic"]
assay_groups = ["hematology", "myeloid", "tumwgs"]

[snv.exceptions.condition]
type = "all"
children = [
  { type = "predicate", field = "genes", operator = "in", value = ["FLT3"] },
  { type = "predicate", field = "INFO.SVTYPE", operator = "exists", value = true },
]

[[snv.exceptions]]
id = "flt3_large_insertion"
mode = "extend_consequence"
intents = ["somatic"]
assay_groups = ["hematology", "myeloid", "tumwgs"]

[snv.exceptions.condition]
type = "all"
children = [
  { type = "predicate", field = "genes", operator = "in", value = ["FLT3"] },
  { type = "predicate", field = "ALT", operator = "regex", value = "[A-Za-z0-9_]{10,200}" },
]

[[snv.exceptions]]
id = "solid_regulatory_tert_nfkbie"
mode = "extend_consequence"
intents = ["somatic"]
assay_groups = ["solid"]

[snv.exceptions.condition]
type = "all"
children = [
  { type = "predicate", field = "genes", operator = "in", value = ["TERT", "NFKBIE"] },
  { type = "predicate", field = "consequence_terms", operator = "in", value = ["regulatory_region_variant", "TF_binding_site_variant"] },
]

[[snv.exceptions]]
id = "germline_myeloid_marker"
mode = "admit"
intents = ["germline"]
assay_groups = ["hematology", "myeloid", "tumwgs"]


[snv.exceptions.condition]
type = "predicate"
field = "INFO.MYELOID_GERMLINE"
operator = "eq"
value = 1

[[snv.exceptions]]
id = "germline_cebpa_filter"
mode = "admit"
intents = ["germline"]
assay_groups = ["hematology", "myeloid", "tumwgs"]

[snv.exceptions.condition]
type = "all"
children = [
  { type = "predicate", field = "genes", operator = "in", value = ["CEBPA"] },
  { type = "predicate", field = "FILTER", operator = "in", value = ["GERMLINE"] },
]

[[snv.exceptions]]
id = "germline_chr1_interval"
mode = "admit"
intents = ["germline"]
assay_groups = ["hematology", "myeloid", "tumwgs"]

[snv.exceptions.condition]
type = "all"
children = [
  { type = "predicate", field = "CHROM", operator = "in", value = ["1"] },
  { type = "predicate", field = "POS", operator = "gte", value = 115256521 },
  { type = "predicate", field = "POS", operator = "lte", value = 115256537 },
]
