[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coyote-api"
version = "1.0.0"
description = "Coyote4 HTTP API and worker host"
requires-python = ">=3.12"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt", "COPYRIGHT.txt", "NOTICE.txt"]
authors = [{name = "Ram Nanduri"}]
dependencies = [
    "coyote-core==4.0.0",
    "coyote-mongo==1.0.0",
    "pymongo==4.18.3",
    "pydantic==2.14.3",
    "Jinja2==3.1.6",
    "billiard==4.3.2",
    "defusedxml==0.7.1",
    "python-dotenv==1.2.2",
    "Brotli==1.2.1",
    "celery[redis]==5.6.3",
    "colorlog==6.10.1",
    "cffi==2.0.0",
    "click==8.3.3",
    "cssselect2==0.9.0",
    "dnspython==2.9.0",
    "filelock==4.2.1",
    "fonttools==4.68.0",
    "ldap3==2.9.1",
    "itsdangerous==2.2.0",
    "MarkupSafe==3.0.3",
    "pillow==13.0.0",
    "pydantic_core==2.50.4",
    "casbin==1.36.1",
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "pyasn1==0.6.5",
    "idna==3.19",
    "python-multipart==0.0.31",
    "uvicorn==0.44.0",
    "pydyf==0.12.1",
    "python-dateutil==2.9.0.post0",
    "redis==7.4.0",
    "tinycss2==1.5.1",
    "tinyhtml5==2.1.0",
    "typing_extensions==4.16.0",
    "webencodings==0.5.1",
    "Werkzeug==3.1.9",
    "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==9.0.3", "pytest-cov==7.1.0", "pytest-asyncio==1.3.0", "mongomock==4.3.0"]

[project.scripts]
coyote4-api = "coyote_api.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.cmdclass]
build_py = "package_build.CleanBuildPy"

[tool.setuptools.package-dir]
"" = "."
coyote_api = "src/coyote_api"

[tool.setuptools.packages.find]
where = ["src"]
include = ["coyote_api", "coyote_api.*"]

[tool.setuptools.package-data]
coyote_api = ["py.typed", "app/templates/*", "config/*.toml", "config/assets/*", "config/examples/center/*", "bootstrap/catalogs/**/*", "bootstrap/demo_data/clinical_workflows/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "smoke: fast synthetic checks without external services or artifact builds",
    "unit: isolated behavior with synthetic fixtures",
    "api: HTTP and host-boundary behavior",
    "client: synchronous and asynchronous HTTP client behavior",
    "integration: explicitly configured service integration",
    "contract: schema and architecture contracts",
]
filterwarnings = [
    'ignore:tagMap is deprecated\. Please use TAG_MAP instead\.:DeprecationWarning:ldap3\.utils\.asn1',
    'ignore:typeMap is deprecated\. Please use TYPE_MAP instead\.:DeprecationWarning:ldap3\.utils\.asn1',
]

[tool.coverage.run]
branch = true
source = ["coyote_api"]
data_file = ".coverage"

[tool.coverage.report]
fail_under = 75
show_missing = true
precision = 2
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"
