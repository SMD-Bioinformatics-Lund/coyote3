# Application-side TLS trust for an independently managed Redis server.
# Certificate creation and setup: docs/operations/redis-tls.md.
# Certificates must already exist on the host.
# The server certificate must include DNS:redis in its subject alternative names.
x-redis-tls-environment: &redis-tls-environment
  CACHE_REDIS_URL: ${CACHE_REDIS_URL:?Set an explicit rediss URL with CA verification}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:?Set an explicit rediss URL with CA verification}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?Set an explicit rediss URL with CA verification}

x-redis-ca: &redis-ca
  type: bind
  source: ${COYOTE4_REDIS_TLS_DIR:?Set the absolute Redis certificate directory}/ca.crt
  target: /run/redis-tls/ca.crt
  read_only: true
  bind:
    create_host_path: false

services:
  api:
    environment: *redis-tls-environment
    volumes: [*redis-ca]
  worker:
    environment: *redis-tls-environment
    volumes: [*redis-ca]
  beat:
    environment: *redis-tls-environment
    volumes: [*redis-ca]
  maintenance-worker:
    environment: *redis-tls-environment
    volumes: [*redis-ca]
  monitor:
    environment: *redis-tls-environment
    volumes: [*redis-ca]
