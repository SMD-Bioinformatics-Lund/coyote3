name: coyote3-prod
# usage:
# COYOTE3_VERSION is read from api/version.py (example):
#   export COYOTE3_VERSION="$(python3 api/version.py)"
# docker compose -f deploy/compose/docker-compose.yml up -d
# docker compose -f deploy/compose/docker-compose.yml down
x-runtime-defaults: &runtime-defaults
  mem_limit: ${COYOTE3_CONTAINER_MEM_LIMIT:-2g}
  cpus: ${COYOTE3_CONTAINER_CPU_LIMIT:-2.0}

services:
  # UI container: React presentation layer. Calls coyote3_api through nginx.
  coyote3_frontend:
    <<: *runtime-defaults
    container_name: coyote3_frontend_${COYOTE3_VERSION:?COYOTE3_VERSION is required for prod}
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build && npm run preview -- --host 0.0.0.0 --port 3000"
    env_file:
      - ../../.coyote3_env
    environment:
      - TZ=${LOCAL_TIME_ZONE:-UTC}
    restart: on-failure:5
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    networks:
      - coyote3-net
    volumes:
      - "../../frontend:/app"
    depends_on:
      coyote3_api:
        condition: service_healthy

  # Standalone docs container (MkDocs static site) for troubleshooting when app services are degraded.
  coyote3_docs:
    <<: *runtime-defaults
    container_name: coyote3_docs_${COYOTE3_VERSION:?COYOTE3_VERSION is required for prod}
    image: coyote3-docs:${COYOTE3_VERSION:?COYOTE3_VERSION is required for prod}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.docs
      network: host
    restart: on-failure:5
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    networks:
      - coyote3-net

  # API container: FastAPI business/policy/data layer.
  coyote3_api:
    <<: *runtime-defaults
    container_name: coyote3_api_${COYOTE3_VERSION:?COYOTE3_VERSION is required for prod}
    image: coyote3-api:${COYOTE3_VERSION:?COYOTE3_VERSION is required for prod}
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: coyote3_api
      network: host
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    env_file:
      - ../../.coyote3_env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CACHE_ENABLED=1
      - CACHE_REQUIRED=1
      - CACHE_REDIS_URL=redis://coyote3_redis:6379/0
      - TZ=${LOCAL_TIME_ZONE:-UTC}
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - BUILD_TIME=${BUILD_TIME:-unknown}
    restart: on-failure:5
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - coyote3-net
    volumes:
      - "/access:/access"
      - "/media:/media"
      - "${COYOTE3_DATA_HOST_ROOT:?COYOTE3_DATA_HOST_ROOT must be set}:/data"
      - "${COYOTE3_DATA_HOST_ROOT}:${COYOTE3_DATA_HOST_ROOT}"
      - "/fs1:/fs1"
    command: "python3 -m uvicorn api.app.main:app --host 0.0.0.0 --port 8001 --workers ${API_WORKERS:-4}"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      - coyote3_redis

  coyote3_worker:
    <<: *runtime-defaults
    container_name: coyote3_worker_${COYOTE3_VERSION:?COYOTE3_VERSION is required for prod}
    image: coyote3-api:${COYOTE3_VERSION:?COYOTE3_VERSION is required for prod}
    env_file:
      - ../../.coyote3_env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CACHE_ENABLED=1
      - CACHE_REQUIRED=1
      - CACHE_REDIS_URL=redis://coyote3_redis:6379/0
      - TZ=${LOCAL_TIME_ZONE:-UTC}
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - BUILD_TIME=${BUILD_TIME:-unknown}
      - CELERY_BROKER_URL=redis://coyote3_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://coyote3_redis:6379/0
      - CELERY_INGEST_QUEUE=${CELERY_INGEST_QUEUE:-ingest}
    restart: on-failure:5
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - coyote3-net
    volumes:
      - "/access:/access"
      - "/media:/media"
      - "${COYOTE3_DATA_HOST_ROOT:?COYOTE3_DATA_HOST_ROOT must be set}:/data"
      - "${COYOTE3_DATA_HOST_ROOT}:${COYOTE3_DATA_HOST_ROOT}"
      - "/fs1:/fs1"
    command: "celery -A api.celery_app:celery_app worker --loglevel=${CELERY_LOG_LEVEL:-INFO} --queues=${CELERY_INGEST_QUEUE:-ingest},default --concurrency=${CELERY_WORKER_CONCURRENCY:-2}"
    depends_on:
      - coyote3_redis

  coyote3_beat:
    <<: *runtime-defaults
    container_name: coyote3_beat_${COYOTE3_VERSION:?COYOTE3_VERSION is required for prod}
    image: coyote3-api:${COYOTE3_VERSION:?COYOTE3_VERSION is required for prod}
    env_file:
      - ../../.coyote3_env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CACHE_ENABLED=1
      - CACHE_REQUIRED=1
      - CACHE_REDIS_URL=redis://coyote3_redis:6379/0
      - TZ=${LOCAL_TIME_ZONE:-UTC}
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - BUILD_TIME=${BUILD_TIME:-unknown}
      - CELERY_BROKER_URL=redis://coyote3_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://coyote3_redis:6379/0
      - CELERY_INGEST_QUEUE=${CELERY_INGEST_QUEUE:-ingest}
    restart: on-failure:5
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - coyote3-net
    volumes:
      - "/access:/access"
      - "/media:/media"
      - "${COYOTE3_DATA_HOST_ROOT:?COYOTE3_DATA_HOST_ROOT must be set}:/data"
      - "${COYOTE3_DATA_HOST_ROOT}:${COYOTE3_DATA_HOST_ROOT}"
      - "/fs1:/fs1"
    command: "celery -A api.celery_app:celery_app beat --loglevel=${CELERY_LOG_LEVEL:-INFO}"
    depends_on:
      - coyote3_redis

  coyote3_first_run:
    <<: *runtime-defaults
    container_name: coyote3_first_run_${COYOTE3_VERSION:?COYOTE3_VERSION is required for prod}
    image: coyote3-api:${COYOTE3_VERSION:?COYOTE3_VERSION is required for prod}
    profiles: ["first-run"]
    env_file:
      - ../../.coyote3_env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - COYOTE3_FIRST_RUN=${COYOTE3_FIRST_RUN:-0}
      - FIRST_RUN_ADMIN_EMAIL=${FIRST_RUN_ADMIN_EMAIL:-}
      - FIRST_RUN_ADMIN_PASSWORD=${FIRST_RUN_ADMIN_PASSWORD:-}
      - FIRST_RUN_API_BASE_URL=${FIRST_RUN_API_BASE_URL:-http://coyote3_api:8001}
      - FIRST_RUN_MONGO_URI=${FIRST_RUN_MONGO_URI:-}
      - FIRST_RUN_DB_NAME=${FIRST_RUN_DB_NAME:-}
      - FIRST_RUN_SEED_FILE=${FIRST_RUN_SEED_FILE:-tests/fixtures/db_dummy/all_collections_dummy}
      - FIRST_RUN_REFERENCE_SEED_DATA=${FIRST_RUN_REFERENCE_SEED_DATA:-}
      - FIRST_RUN_YAML_FILE=${FIRST_RUN_YAML_FILE:-tests/data/ingest_demo/generic_case_control.yaml}
      - FIRST_RUN_ASSAY_GROUP=${FIRST_RUN_ASSAY_GROUP:-hematology}
      - FIRST_RUN_ASSAY=${FIRST_RUN_ASSAY:-assay_1}
      - FIRST_RUN_WITH_OPTIONAL=${FIRST_RUN_WITH_OPTIONAL:-0}
      - FIRST_RUN_SKIP_EXISTING=${FIRST_RUN_SKIP_EXISTING:-1}
      - FIRST_RUN_RUN_SMOKE=${FIRST_RUN_RUN_SMOKE:-1}
    restart: "no"
    networks:
      - coyote3-net
    command: "bash scripts/compose_first_run.sh"
    depends_on:
      coyote3_api:
        condition: service_healthy

  # Shared infrastructure dependency.
  coyote3_redis:
    <<: *runtime-defaults
    container_name: coyote3_redis_${COYOTE3_VERSION:?COYOTE3_VERSION is required for prod}
    image: redis:7.4.3
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    networks:
      - coyote3-net
    restart: on-failure:5
    privileged: true

  # Optional self-hosted Mongo service for environments that do not use managed/external Mongo.
  # Enable with:
  #   ./scripts/compose-with-version.sh -f deploy/compose/docker-compose.yml --profile with-mongo up -d
  # This service is internal to the Docker network. For host MongoDB, set MONGO_URI
  # to host.docker.internal or another external Mongo endpoint instead.
  coyote3_mongo:
    <<: *runtime-defaults
    container_name: coyote3_mongo_${COYOTE3_VERSION:?COYOTE3_VERSION is required for prod}
    image: mongo:7.0
    profiles: ["with-mongo"]
    command: ["--bind_ip_all"]
    restart: on-failure:5
    stop_grace_period: 120s
    networks:
      - coyote3-net
    env_file:
      - ../../.coyote3_env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-coyote3_root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-CHANGE_ME_PROD_ROOT_PASSWORD}
      - COYOTE3_DB=${COYOTE3_DB:-coyote3}
      - MONGO_APP_USER=${MONGO_APP_USER:-coyote3_app}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:-CHANGE_ME_PROD_APP_PASSWORD}
    volumes:
      - prod-mongodb:/data/db
      - /data/coyote3/backups/mongo:/backup
      - ./mongo-init/create-app-user.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro

  # Reverse proxy that exposes one external endpoint for web/api/docs.
  coyote3_proxy:
    <<: *runtime-defaults
    container_name: coyote3_proxy_${COYOTE3_VERSION:?COYOTE3_VERSION is required for prod}
    image: nginx:1.27-alpine
    ports:
      - "${COYOTE3_PORT:-5815}:8088"
    command: ["sh", "-c", "sh /etc/nginx/render-config.sh && nginx -g 'daemon off;'"]
    env_file:
      - ../../.coyote3_env
    environment:
      - COYOTE3_NGINX_FRONTEND_UPSTREAM=http://coyote3_frontend:3000
      - COYOTE3_NGINX_API_UPSTREAM=http://coyote3_api:8001
      - COYOTE3_NGINX_DOCS_UPSTREAM=http://coyote3_docs:8080
    volumes:
      - ./nginx/render-config.sh:/etc/nginx/render-config.sh:ro
    networks:
      - coyote3-net
    depends_on:
      coyote3_frontend:
        condition: service_started
      coyote3_api:
        condition: service_healthy
      coyote3_docs:
        condition: service_started
    restart: on-failure:5

networks:
  coyote3-net:
    driver: bridge

volumes:
  prod-mongodb:
