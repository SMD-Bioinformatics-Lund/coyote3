name: coyote3-stage
# usage:
#   cp deploy/env/example.env .coyote3_stage_env
#   export COYOTE3_VERSION="$(python3 api/version.py)"
#   docker compose --env-file .coyote3_stage_env -f deploy/compose/docker-compose.stage.yml up -d --build
x-runtime-defaults: &runtime-defaults
  mem_limit: ${COYOTE3_CONTAINER_MEM_LIMIT:-2g}
  cpus: ${COYOTE3_CONTAINER_CPU_LIMIT:-2.0}

services:
  coyote3_stage_frontend:
    <<: *runtime-defaults
    container_name: coyote3_stage_frontend_${COYOTE3_VERSION:-local}
    image: coyote3-frontend:${COYOTE3_VERSION:-local}-stage
    build:
      context: ../..
      dockerfile: docker/Dockerfile.frontend
      args:
        SCRIPT_NAME: ${SCRIPT_NAME:-}
        ORGANIZATION_NAME: ${ORGANIZATION_NAME:-Coyote3}
        LOCAL_TIME_ZONE: ${LOCAL_TIME_ZONE:-UTC}
        GENS_URI: ${GENS_URI:-}
        IGV_URI: ${IGV_URI:-}
    env_file:
      - ../../.coyote3_stage_env
    environment:
      - TZ=${LOCAL_TIME_ZONE:-UTC}
    restart: on-failure:5
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    networks:
      - coyote3-stage-net
    depends_on:
      coyote3_stage_api:
        condition: service_healthy

  coyote3_stage_docs:
    <<: *runtime-defaults
    container_name: coyote3_stage_docs_${COYOTE3_VERSION:-local}
    image: coyote3-docs:${COYOTE3_VERSION:-local}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.docs
      network: host
    restart: on-failure:5
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    networks:
      - coyote3-stage-net

  coyote3_stage_api:
    <<: *runtime-defaults
    container_name: coyote3_stage_api_${COYOTE3_VERSION:-local}
    image: coyote3-api:${COYOTE3_VERSION:-local}
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: coyote3_api
      network: host
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        COYOTE3_UID: ${COYOTE3_UID:-10001}
        COYOTE3_GID: ${COYOTE3_GID:-10001}
    env_file:
      - ../../.coyote3_stage_env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CACHE_REDIS_URL=redis://coyote3_redis_stage:6379/0
      - TZ=${LOCAL_TIME_ZONE:-UTC}
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - BUILD_TIME=${BUILD_TIME:-unknown}
    restart: on-failure:5
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - coyote3-stage-net
    volumes:
      - "${COYOTE3_LOGS_HOST_ROOT:?COYOTE3_LOGS_HOST_ROOT must be set}:/app/logs"
      - "/access:/access"
      - "/media:/media"
      - "${COYOTE3_DATA_HOST_ROOT:?COYOTE3_DATA_HOST_ROOT must be set}:/data"
      - "${COYOTE3_DATA_HOST_ROOT}:${COYOTE3_DATA_HOST_ROOT}"
      - "/fs1:/fs1"
    command: "python3 -m uvicorn api.app.main:app --host 0.0.0.0 --port 8001 --workers ${API_WORKERS:-1}"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      coyote3_redis_stage:
        condition: service_started

  coyote3_stage_worker:
    <<: *runtime-defaults
    container_name: coyote3_stage_worker_${COYOTE3_VERSION:-local}
    image: coyote3-api:${COYOTE3_VERSION:-local}
    env_file:
      - ../../.coyote3_stage_env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CACHE_REDIS_URL=redis://coyote3_redis_stage:6379/0
      - TZ=${LOCAL_TIME_ZONE:-UTC}
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - BUILD_TIME=${BUILD_TIME:-unknown}
      - CELERY_BROKER_URL=redis://coyote3_redis_stage:6379/0
      - CELERY_RESULT_BACKEND=redis://coyote3_redis_stage:6379/0
    restart: on-failure:5
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - coyote3-stage-net
    volumes:
      - "${COYOTE3_LOGS_HOST_ROOT:?COYOTE3_LOGS_HOST_ROOT must be set}:/app/logs"
      - "/access:/access"
      - "/media:/media"
      - "${COYOTE3_DATA_HOST_ROOT:?COYOTE3_DATA_HOST_ROOT must be set}:/data"
      - "${COYOTE3_DATA_HOST_ROOT}:${COYOTE3_DATA_HOST_ROOT}"
      - "/fs1:/fs1"
    command: "celery -A api.celery_app:celery_app worker --loglevel=${CELERY_LOG_LEVEL:-INFO} --queues=ingest,default --concurrency=${CELERY_WORKER_CONCURRENCY:-2}"
    healthcheck:
      test: ["CMD-SHELL", "celery -A api.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 3 | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      coyote3_redis_stage:
        condition: service_started

  coyote3_stage_beat:
    <<: *runtime-defaults
    container_name: coyote3_stage_beat_${COYOTE3_VERSION:-local}
    image: coyote3-api:${COYOTE3_VERSION:-local}
    env_file:
      - ../../.coyote3_stage_env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CACHE_REDIS_URL=redis://coyote3_redis_stage:6379/0
      - TZ=${LOCAL_TIME_ZONE:-UTC}
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - BUILD_TIME=${BUILD_TIME:-unknown}
      - CELERY_BROKER_URL=redis://coyote3_redis_stage:6379/0
      - CELERY_RESULT_BACKEND=redis://coyote3_redis_stage:6379/0
    restart: on-failure:5
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - coyote3-stage-net
    volumes:
      - "${COYOTE3_LOGS_HOST_ROOT:?COYOTE3_LOGS_HOST_ROOT must be set}:/app/logs"
      - "/access:/access"
      - "/media:/media"
      - "${COYOTE3_DATA_HOST_ROOT:?COYOTE3_DATA_HOST_ROOT must be set}:/data"
      - "${COYOTE3_DATA_HOST_ROOT}:${COYOTE3_DATA_HOST_ROOT}"
      - "/fs1:/fs1"
    command: "celery -A api.celery_app:celery_app beat --loglevel=${CELERY_LOG_LEVEL:-INFO} --pidfile=/tmp/celerybeat.pid"
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      coyote3_redis_stage:
        condition: service_started

  coyote3_redis_stage:
    <<: *runtime-defaults
    container_name: coyote3_redis_stage_${COYOTE3_VERSION:-local}
    image: redis:7.4.3
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    networks:
      - coyote3-stage-net
    restart: on-failure:5
    privileged: true

  coyote3_stage_proxy:
    <<: *runtime-defaults
    container_name: coyote3_stage_proxy_${COYOTE3_VERSION:-local}
    image: nginx:1.27-alpine
    ports:
      - "${COYOTE3_PORT:-8804}:8088"
    command: ["sh", "-c", "sh /etc/nginx/render-config.sh && nginx -g 'daemon off;'"]
    env_file:
      - ../../.coyote3_stage_env
    environment:
      - COYOTE3_NGINX_FRONTEND_UPSTREAM=http://coyote3_stage_frontend:3000
      - COYOTE3_NGINX_API_UPSTREAM=http://coyote3_stage_api:8001
      - COYOTE3_NGINX_DOCS_UPSTREAM=http://coyote3_stage_docs:8080
    volumes:
      - ./nginx/render-config.sh:/etc/nginx/render-config.sh:ro
    networks:
      - coyote3-stage-net
    depends_on:
      coyote3_stage_frontend:
        condition: service_started
      coyote3_stage_api:
        condition: service_healthy
      coyote3_stage_docs:
        condition: service_started
    restart: on-failure:5

networks:
  coyote3-stage-net:
    driver: bridge
