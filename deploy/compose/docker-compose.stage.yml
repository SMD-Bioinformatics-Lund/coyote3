name: coyote3_stage

services:
  frontend:
    image: coyote3-frontend:${COYOTE3_VERSION:?COYOTE3_VERSION is required}-stage
  docs:
    image: coyote3-docs:${COYOTE3_VERSION:?COYOTE3_VERSION is required}-stage
  api:
    image: coyote3-api:${COYOTE3_VERSION:?COYOTE3_VERSION is required}-stage
  worker:
    image: coyote3-api:${COYOTE3_VERSION:?COYOTE3_VERSION is required}-stage
  beat:
    image: coyote3-api:${COYOTE3_VERSION:?COYOTE3_VERSION is required}-stage
  proxy:
    ports: ["${COYOTE3_PORT:-8804}:8088"]
