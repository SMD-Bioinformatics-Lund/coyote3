name: coyote3-stage
# usage:
#   cp deploy/env/example.env .coyote3_stage_env
#   export COYOTE3_VERSION="$(python3 api/version.py)"
#   docker compose --env-file .coyote3_stage_env -f deploy/compose/docker-compose.stage.yml up -d --build
x-runtime-defaults: &runtime-defaults
  mem_limit: ${COYOTE3_CONTAINER_MEM_LIMIT:-2g}
  cpus: ${COYOTE3_CONTAINER_CPU_LIMIT:-2.0}

services:
  coyote3_stage_frontend:
    <<: *runtime-defaults
    container_name: coyote3_stage_frontend_${COYOTE3_VERSION:-local}
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build && npm run preview -- --host 0.0.0.0 --port 3000"
    env_file:
      - ../../.coyote3_stage_env
    environment:
      - TZ=${LOCAL_TIME_ZONE:-UTC}
    restart: on-failure:5
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    networks:
      - coyote3-stage-net
    volumes:
      - "../../frontend:/app"
    depends_on:
      coyote3_stage_api:
        condition: service_healthy

  coyote3_stage_docs:
    <<: *runtime-defaults
    container_name: coyote3_stage_docs_${COYOTE3_VERSION:-local}
    image: coyote3-docs:${COYOTE3_VERSION:-local}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.docs
      network: host
    restart: on-failure:5
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    networks:
      - coyote3-stage-net

  coyote3_stage_api:
    <<: *runtime-defaults
    container_name: coyote3_stage_api_${COYOTE3_VERSION:-local}
    image: coyote3-api:${COYOTE3_VERSION:-local}
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: coyote3_api
      network: host
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    env_file:
      - ../../.coyote3_stage_env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CACHE_ENABLED=1
      - CACHE_REQUIRED=1
      - CACHE_REDIS_URL=redis://coyote3_redis_stage:6379/0
      - TZ=${LOCAL_TIME_ZONE:-UTC}
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - BUILD_TIME=${BUILD_TIME:-unknown}
    restart: on-failure:5
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - coyote3-stage-net
    volumes:
      - "/access:/access"
      - "/media:/media"
      - "${COYOTE3_DATA_HOST_ROOT:-/data}:/data"
      - "/fs1:/fs1"
    command: "python3 -m uvicorn api.app.main:app --host 0.0.0.0 --port 8001 --workers ${API_WORKERS:-4}"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      coyote3_redis_stage:
        condition: service_started

  coyote3_stage_worker:
    <<: *runtime-defaults
    container_name: coyote3_stage_worker_${COYOTE3_VERSION:-local}
    image: coyote3-api:${COYOTE3_VERSION:-local}
    env_file:
      - ../../.coyote3_stage_env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CACHE_ENABLED=1
      - CACHE_REQUIRED=1
      - CACHE_REDIS_URL=redis://coyote3_redis_stage:6379/0
      - TZ=${LOCAL_TIME_ZONE:-UTC}
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - BUILD_TIME=${BUILD_TIME:-unknown}
      - CELERY_BROKER_URL=redis://coyote3_redis_stage:6379/0
      - CELERY_RESULT_BACKEND=redis://coyote3_redis_stage:6379/0
      - CELERY_INGEST_QUEUE=${CELERY_INGEST_QUEUE:-ingest}
    restart: on-failure:5
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - coyote3-stage-net
    volumes:
      - "/access:/access"
      - "/media:/media"
      - "${COYOTE3_DATA_HOST_ROOT:-/data}:/data"
      - "/fs1:/fs1"
    command: "celery -A api.celery_app:celery_app worker --loglevel=${CELERY_LOG_LEVEL:-INFO} --queues=${CELERY_INGEST_QUEUE:-ingest},default --concurrency=${CELERY_WORKER_CONCURRENCY:-2}"
    depends_on:
      coyote3_redis_stage:
        condition: service_started

  coyote3_stage_beat:
    <<: *runtime-defaults
    container_name: coyote3_stage_beat_${COYOTE3_VERSION:-local}
    image: coyote3-api:${COYOTE3_VERSION:-local}
    env_file:
      - ../../.coyote3_stage_env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CACHE_ENABLED=1
      - CACHE_REQUIRED=1
      - CACHE_REDIS_URL=redis://coyote3_redis_stage:6379/0
      - TZ=${LOCAL_TIME_ZONE:-UTC}
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - BUILD_TIME=${BUILD_TIME:-unknown}
      - CELERY_BROKER_URL=redis://coyote3_redis_stage:6379/0
      - CELERY_RESULT_BACKEND=redis://coyote3_redis_stage:6379/0
      - CELERY_INGEST_QUEUE=${CELERY_INGEST_QUEUE:-ingest}
    restart: on-failure:5
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - coyote3-stage-net
    volumes:
      - "/access:/access"
      - "/media:/media"
      - "${COYOTE3_DATA_HOST_ROOT:-/data}:/data"
      - "/fs1:/fs1"
    command: "celery -A api.celery_app:celery_app beat --loglevel=${CELERY_LOG_LEVEL:-INFO}"
    depends_on:
      coyote3_redis_stage:
        condition: service_started

  coyote3_redis_stage:
    <<: *runtime-defaults
    container_name: coyote3_redis_stage_${COYOTE3_VERSION:-local}
    image: redis:7.4.3
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    networks:
      - coyote3-stage-net
    restart: on-failure:5
    privileged: true

  # Optional local Mongo. Enable with --profile with-mongo.
  coyote3_stage_mongo:
    <<: *runtime-defaults
    container_name: coyote3_stage_mongo_${COYOTE3_VERSION:-local}
    image: mongo:7.0
    profiles: ["with-mongo"]
    command: ["--bind_ip_all"]
    env_file:
      - ../../.coyote3_stage_env
    restart: on-failure:5
    stop_grace_period: 120s
    networks:
      - coyote3-stage-net
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-coyote3_root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-CHANGE_ME_STAGE_ROOT_PASSWORD}
      - COYOTE3_DB=${COYOTE3_DB:-coyote3}
      - MONGO_APP_USER=${MONGO_APP_USER:-coyote3_app}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:-CHANGE_ME_STAGE_APP_PASSWORD}
    volumes:
      - stage-mongodb:/data/db
      - /data/coyote3/stage/backups/mongo:/backup
      - ./mongo-init/create-app-user.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh \"mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@127.0.0.1:27017/admin?authSource=admin\" --quiet --eval \"db.getSiblingDB('$$COYOTE3_DB').runCommand({ usersInfo: '$$MONGO_APP_USER' }).users.length\" | grep 1 >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s

  coyote3_stage_proxy:
    <<: *runtime-defaults
    container_name: coyote3_stage_proxy_${COYOTE3_VERSION:-local}
    image: nginx:1.27-alpine
    ports:
      - "${COYOTE3_PORT:-8804}:8088"
    command: ["sh", "-c", "sh /etc/nginx/render-config.sh && nginx -g 'daemon off;'"]
    env_file:
      - ../../.coyote3_stage_env
    environment:
      - COYOTE3_NGINX_FRONTEND_UPSTREAM=http://coyote3_stage_frontend:3000
      - COYOTE3_NGINX_API_UPSTREAM=http://coyote3_stage_api:8001
      - COYOTE3_NGINX_DOCS_UPSTREAM=http://coyote3_stage_docs:8080
    volumes:
      - ./nginx/render-config.sh:/etc/nginx/render-config.sh:ro
    networks:
      - coyote3-stage-net
    depends_on:
      coyote3_stage_frontend:
        condition: service_started
      coyote3_stage_api:
        condition: service_healthy
      coyote3_stage_docs:
        condition: service_started
    restart: on-failure:5

networks:
  coyote3-stage-net:
    driver: bridge

volumes:
  stage-mongodb:
