name: coyote3_dev

# Compiled application images with development identity and storage from the env file.
services:
  frontend:
    image: coyote3-frontend:${COYOTE3_VERSION:?COYOTE3_VERSION is required}-dev
  docs:
    image: coyote3-docs:${COYOTE3_VERSION:?COYOTE3_VERSION is required}-dev
  api:
    image: coyote3-api:${COYOTE3_VERSION:?COYOTE3_VERSION is required}-dev
  worker:
    image: coyote3-api:${COYOTE3_VERSION:?COYOTE3_VERSION is required}-dev
  beat:
    image: coyote3-api:${COYOTE3_VERSION:?COYOTE3_VERSION is required}-dev
  monitor:
    image: coyote3-api:${COYOTE3_VERSION:?COYOTE3_VERSION is required}-dev
  proxy:
    ports: ["${COYOTE3_PORT:-8801}:8088"]
