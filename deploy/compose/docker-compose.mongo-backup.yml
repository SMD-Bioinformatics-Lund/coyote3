# Optional /backup mount. Load after docker-compose.mongo.yml.
# Omit when backups are managed externally; this does not schedule backups.
services:
  mongo:
    volumes:
      - type: bind
        source: ${COYOTE3_MONGO_BACKUP_HOST_ROOT:?Set COYOTE3_MONGO_BACKUP_HOST_ROOT for the optional backup mount}
        target: /backup
        bind:
          create_host_path: false
