<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:,">
  <title>Service temporarily unavailable | COYOT3</title>
  <style>
    /* Standalone equivalents of the approved application theme: no upstream assets. */
    :root {
      color-scheme: light;
      --background: #e2e5eb;
      --foreground: oklch(0.235 0.006 255);
      --paper-raised: #eff2f6;
      --muted-foreground: oklch(0.405 0.007 255);
      --border: #bdc5d0;
      --primary: oklch(0.45 0.105 302);
      --brand-start: oklch(0.5 0.115 302);
      --brand-end: oklch(0.66 0.13 58);
      --warning: #8a652e;
      --panel-shadow: inset 0 1px 0 rgb(255 255 255 / 65%),
        0 2px 5px rgb(27 33 44 / 9%), 0 12px 32px rgb(27 33 44 / 12%);
      --badge-shadow: inset 0 1px 0 rgb(255 255 255 / 45%),
        0 1px 2px rgb(27 33 44 / 14%), 0 3px 7px rgb(27 33 44 / 8%);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --background: oklch(0.205 0.004 255);
        --foreground: oklch(0.925 0.004 255);
        --paper-raised: oklch(0.265 0.006 255);
        --muted-foreground: oklch(0.74 0.006 255);
        --border: oklch(0.43 0.006 255);
        --primary: oklch(0.70 0.105 302);
        --brand-start: oklch(0.63 0.105 302);
        --brand-end: oklch(0.69 0.12 62);
        --warning: #e2c78c;
        --panel-shadow: inset 0 1px 0 rgb(255 255 255 / 8%),
          0 2px 5px rgb(0 0 0 / 24%), 0 12px 32px rgb(0 0 0 / 30%);
        --badge-shadow: inset 0 1px 0 rgb(255 255 255 / 12%),
          0 1px 2px rgb(0 0 0 / 28%), 0 3px 7px rgb(0 0 0 / 20%);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
        "Helvetica Neue", Arial, sans-serif;
      color: var(--foreground);
      background:
        radial-gradient(ellipse at 12% 30%, color-mix(in srgb, var(--brand-start) 8%, transparent), transparent 60%),
        radial-gradient(ellipse at 90% 90%, color-mix(in srgb, var(--brand-end) 7%, transparent), transparent 55%),
        var(--background);
    }
    .chrome {
      min-height: 4rem;
      display: flex;
      align-items: center;
      padding: 1rem clamp(1.25rem, 4vw, 3rem);
      color: #fff;
      background:
        linear-gradient(105deg, transparent 95%, rgb(255 255 255 / 5%) 100%),
        linear-gradient(105deg, oklch(0.16 0.018 302), oklch(0.28 0.075 302) 48%, oklch(0.12 0.014 302) 95%);
    }
    .brand { display: inline-flex; align-items: center; gap: 0.65rem; font-size: 1.5rem; font-weight: 500; letter-spacing: 0.05em; }
    .brand svg { width: 2.8rem; height: auto; }
    main { display: grid; min-height: calc(100svh - 4rem); place-items: center; padding: 2rem 1rem 4rem; }
    .panel {
      position: relative;
      width: min(100%, 39rem);
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid color-mix(in srgb, var(--primary) 25%, var(--border));
      border-radius: 1rem;
      background: linear-gradient(135deg, color-mix(in srgb, var(--brand-start) 5%, var(--paper-raised)), var(--paper-raised) 65%);
      box-shadow: var(--panel-shadow);
    }
    .panel::before {
      content: "";
      position: absolute;
      inset: 0 1rem auto;
      height: 3px;
      background: linear-gradient(90deg, var(--brand-start), var(--brand-end));
    }
    .status, .retry {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid color-mix(in srgb, var(--warning) 40%, var(--border));
      border-radius: 2rem;
      padding: 0.4rem 0.75rem;
      box-shadow: var(--badge-shadow);
    }
    .status {
      color: var(--warning);
      background: color-mix(in srgb, var(--brand-end) 8%, var(--paper-raised));
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status svg, .retry svg { width: 1rem; height: 1rem; flex: none; }
    h1 { margin: 1.5rem 0 1rem; font-size: clamp(1.7rem, 4vw, 2.2rem); line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; }
    p { margin: 0; font-size: 0.9375rem; line-height: 1.7; }
    .retry {
      margin-top: 1.75rem;
      padding: 0.7rem 1.15rem;
      border-color: color-mix(in srgb, var(--primary) 45%, var(--border));
      background: color-mix(in srgb, var(--primary) 10%, var(--paper-raised));
      color: var(--primary);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
    }
    .retry:hover { background: color-mix(in srgb, var(--primary) 17%, var(--paper-raised)); }
    .retry:focus-visible { outline: 3px solid var(--primary); outline-offset: 4px; }
    .support { margin-top: 1.75rem; color: var(--muted-foreground); font-size: 0.8125rem; }
    @media (forced-colors: active) {
      body, .chrome, .panel, .status, .retry { background: Canvas; color: CanvasText; border-color: CanvasText; box-shadow: none; }
      .panel::before { display: none; }
      .retry { color: LinkText; }
      .retry:focus-visible { outline-color: Highlight; }
    }
  </style>
</head>
