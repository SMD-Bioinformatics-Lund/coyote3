name: coyote3_dev

services:
  frontend:
    image: node:22-alpine
    build: !reset null
    pull_policy: always
    working_dir: /app
    command: node scripts/log-runtime.mjs sh -c "npm install && exec npm run dev -- --port 3000 --host 0.0.0.0"
    environment:
      ENV_NAME: ${ENV_NAME:?ENV_NAME is required}
      SCRIPT_NAME: ${SCRIPT_NAME:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-Coyote3}
      LOCAL_TIME_ZONE: ${LOCAL_TIME_ZONE:-UTC}
      TZ: ${LOCAL_TIME_ZONE:-UTC}
      GENS_URI: ${GENS_URI:-}
      IGV_URI: ${IGV_URI:-}
      IGV_DATA_ROOT: ${IGV_DATA_ROOT:-}
      COYOTE3_API_INTERNAL_URL: http://api:8001
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../../frontend:/app
      - ../../api/version.py:/api/version.py:ro
      - frontend_node_modules:/app/node_modules

  docs:
    image: coyote3-docs:${COYOTE3_IMAGE_TAG:?Run scripts/compose-with-version.sh to select the environment image tag}
    volumes:
      - ../../site:/usr/share/nginx/html:ro
      - ../../docker/nginx/docs.conf:/etc/nginx/conf.d/default.conf:ro

  api:
    image: coyote3-api:${COYOTE3_IMAGE_TAG:?Run scripts/compose-with-version.sh to select the environment image tag}
    build:
      dockerfile: docker/Dockerfile.dev
      target: coyote3_dev_api
    volumes: &dev-app-volumes
      - ../../.git:/app/.git:ro
      - ../../api:/app/api
      - ${COYOTE3_LOGS_HOST_ROOT:?COYOTE3_LOGS_HOST_ROOT is required}:/app/logs
      - ../../docs:/app/docs
      - ../../CHANGELOG.md:/app/CHANGELOG.md:ro
      - ../../README.md:/app/README.md:ro
      - ../../LICENSE.txt:/app/LICENSE.txt:ro
      - ../../NOTICE.txt:/app/NOTICE.txt:ro
      - ${COYOTE3_DATA_HOST_ROOT:?COYOTE3_DATA_HOST_ROOT is required}:/data
    command: python3 -m api.infra.observability.run_service api python3 -m uvicorn api.app.main:app --host 0.0.0.0 --port 8001 --reload --reload-dir /app/api

  worker:
    image: coyote3-api:${COYOTE3_IMAGE_TAG:?Run scripts/compose-with-version.sh to select the environment image tag}
    volumes: *dev-app-volumes

  beat:
    image: coyote3-api:${COYOTE3_IMAGE_TAG:?Run scripts/compose-with-version.sh to select the environment image tag}
    volumes: *dev-app-volumes

  monitor:
    image: coyote3-api:${COYOTE3_IMAGE_TAG:?Run scripts/compose-with-version.sh to select the environment image tag}
    volumes: *dev-app-volumes

  proxy:
    ports: ["${COYOTE3_PORT:-6801}:8088"]

volumes:
  frontend_node_modules:
