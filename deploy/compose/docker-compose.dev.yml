name: coyote4_dev

services:
  frontend:
    image: node:22-alpine
    build: !reset null
    pull_policy: always
    working_dir: /app
    command: node scripts/log-runtime.mjs sh -c "npm install && exec npm run dev -- --port 3000 --host 0.0.0.0"
    environment:
      ENV_NAME: ${ENV_NAME:?ENV_NAME is required}
      SCRIPT_NAME: ${SCRIPT_NAME:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-Coyote4}
      LOCAL_TIME_ZONE: ${LOCAL_TIME_ZONE:-UTC}
      TZ: ${LOCAL_TIME_ZONE:-UTC}
      GENS_URI: ${GENS_URI:-}
      IGV_URI: ${IGV_URI:-}
      IGV_DATA_ROOT: ${IGV_DATA_ROOT:-}
      COYOTE4_API_INTERNAL_URL: http://api:8001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../../frontend:/app
      - ../../release.toml:/release.toml:ro
      - frontend_node_modules:/app/node_modules

  api:
    image: coyote4-api:${COYOTE4_IMAGE_TAG:?Run install.sh compose to select the environment image tag}
    build:
      additional_contexts: !reset {}
      dockerfile: docker/Dockerfile.dev
      network: host
      target: coyote4_dev_api
    volumes: &dev-app-volumes
      - type: bind
        source: ${COYOTE4_CENTER_CONFIG_HOST_DIR:-../../api/src/coyote_api/config/examples/center}
        target: /app/center-config
        read_only: true
        bind:
          create_host_path: false
      - ../../.git:/app/.git:ro
      - ../../api:/app/api
      - ../../adapters/mongo:/app/adapters/mongo
      - ../../core:/app/core
      - ../../services/relay:/app/services/relay
      - ../../services/atlas:/app/services/atlas
      - ../../services/demo:/app/services/demo
      - ../../release.toml:/app/release.toml:ro
      - ${COYOTE4_LOGS_HOST_ROOT:?COYOTE4_LOGS_HOST_ROOT is required}:/app/logs
      - ../../docs:/app/docs
      - ../../CHANGELOG.md:/app/CHANGELOG.md:ro
      - ../../README.md:/app/README.md:ro
      - ../../LICENSE.txt:/app/LICENSE.txt:ro
      - ../../NOTICE.txt:/app/NOTICE.txt:ro
      - ${COYOTE4_DATA_HOST_ROOT:?COYOTE4_DATA_HOST_ROOT is required}:/data
    command: python3 -m deploy.installer watch -- python3 -m coyote_api.infra.observability.run_service api python3 -m uvicorn coyote_api.app.main:app --host 0.0.0.0 --port 8001

  worker:
    command: python3 -m deploy.installer watch -- python3 -m coyote_api.infra.observability.run_service worker coyote-relay-worker --loglevel=${CELERY_LOG_LEVEL:-INFO} --queues=ingest --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    image: coyote4-api:${COYOTE4_IMAGE_TAG:?Run install.sh compose to select the environment image tag}
    volumes: *dev-app-volumes

  beat:
    command: python3 -m deploy.installer watch -- python3 -m coyote_api.infra.observability.run_service beat celery -A coyote_api.celery_app:celery_app beat --loglevel=${CELERY_LOG_LEVEL:-INFO} --pidfile=/tmp/celerybeat.pid
    image: coyote4-api:${COYOTE4_IMAGE_TAG:?Run install.sh compose to select the environment image tag}
    volumes: *dev-app-volumes

  maintenance-worker:
    command: python3 -m deploy.installer watch -- python3 -m coyote_api.infra.observability.run_service worker celery -A coyote_api.celery_app:celery_app worker --loglevel=${CELERY_LOG_LEVEL:-INFO} --queues=default --concurrency=${CELERY_MAINTENANCE_CONCURRENCY:-2}
    volumes: *dev-app-volumes

  monitor:
    command: python3 -m deploy.installer watch -- python3 -m coyote_api.app.monitor
    image: coyote4-api:${COYOTE4_IMAGE_TAG:?Run install.sh compose to select the environment image tag}
    volumes: *dev-app-volumes

  proxy:
    ports: ["${COYOTE4_PORT:-6801}:8088"]

volumes:
  frontend_node_modules:
