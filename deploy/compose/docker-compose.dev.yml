name: coyote3-dev
# usage:
# COYOTE3_VERSION is read from api/version.py (example):
#   export COYOTE3_VERSION="$(python3 api/version.py)"
# docker compose -f deploy/compose/docker-compose.dev.yml up -d
# docker compose -f deploy/compose/docker-compose.dev.yml down
x-runtime-defaults: &runtime-defaults
  mem_limit: ${COYOTE3_DEV_CONTAINER_MEM_LIMIT:-2g}
  cpus: ${COYOTE3_DEV_CONTAINER_CPU_LIMIT:-2.0}

services:
  # UI container: Next.js presentation layer. Calls coyote3_dev_api over HTTP.
  frontend:
    <<: *runtime-defaults
    container_name: coyote3_dev_frontend_${COYOTE3_VERSION:-local}
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --port 3000 --host 0.0.0.0"
    env_file:
      - ../../.coyote3_dev_env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    restart: always
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    networks:
      - coyote3-dev-net
    volumes:
      - "../../frontend:/app"
      - "frontend_node_modules:/app/node_modules"
    depends_on:
      coyote3_dev_api:
        condition: service_healthy

  coyote3_dev_docs:
    <<: *runtime-defaults
    container_name: coyote3_dev_docs_${COYOTE3_VERSION:-local}
    image: coyote3-docs:${COYOTE3_VERSION:-local}-dev
    build:
      context: ../..
      dockerfile: docker/Dockerfile.docs
      network: host
    restart: always
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    networks:
      - coyote3-dev-net
    volumes:
      - "../../site:/usr/share/nginx/html:ro"

  # API container: FastAPI business/policy/data layer.
  coyote3_dev_api:
    <<: *runtime-defaults
    container_name: coyote3_dev_api_${COYOTE3_VERSION:-local}
    image: coyote3-api:${COYOTE3_VERSION:-local}-dev
    build:
      context: ../..
      dockerfile: docker/Dockerfile.dev
      target: coyote3_dev_api
      network: host
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    env_file:
      - ../../.coyote3_dev_env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CACHE_ENABLED=1
      - CACHE_REQUIRED=1
      - TZ=Europe/Stockholm
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - BUILD_TIME=${BUILD_TIME:-unknown}
    restart: always
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    extra_hosts:
      - "mtlucmds1.lund.skane.se:172.17.0.1"
      - "host.docker.internal:host-gateway"
    networks:
      - coyote3-dev-net
    volumes:
      - "../../.git:/app/.git"
      - "../../api:/app/api"
      - "../../config:/app/config"
      - "/data/coyote3/logs:/app/logs"
      - "../../docs:/app/docs"
      - "../../asgi.py:/app/asgi.py"
      - "../../deploy/gunicorn/gunicorn.conf.py:/app/gunicorn.conf.py"
      - "../../CHANGELOG.md:/app/CHANGELOG.md"
      - "../../README.md:/app/README.md"
      - "../../LICENSE.txt:/app/LICENSE.txt"
      - "/access:/access"
      - "/media:/media"
      - "${COYOTE3_DATA_HOST_ROOT:-/data}:${COYOTE3_DATA_CONTAINER_ROOT:-/data}"
      - "/fs1:/fs1"
    command: "python3 -m uvicorn api.app.main:app --host 0.0.0.0 --port 8001 --reload --reload-dir /app/api"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      coyote3_redis_dev:
        condition: service_started

  coyote3_dev_worker:
    <<: *runtime-defaults
    container_name: coyote3_dev_worker_${COYOTE3_VERSION:-local}
    image: coyote3-api:${COYOTE3_VERSION:-local}-dev
    env_file:
      - ../../.coyote3_dev_env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CACHE_ENABLED=1
      - CACHE_REQUIRED=1
      - TZ=Europe/Stockholm
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - BUILD_TIME=${BUILD_TIME:-unknown}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://coyote3_redis_dev:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://coyote3_redis_dev:6379/0}
      - CELERY_INGEST_QUEUE=${CELERY_INGEST_QUEUE:-ingest}
    restart: always
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    extra_hosts:
      - "mtlucmds1.lund.skane.se:172.17.0.1"
      - "host.docker.internal:host-gateway"
    networks:
      - coyote3-dev-net
    volumes:
      - "../../.git:/app/.git"
      - "../../api:/app/api"
      - "../../config:/app/config"
      - "/data/coyote3/logs:/app/logs"
      - "../../docs:/app/docs"
      - "../../asgi.py:/app/asgi.py"
      - "../../deploy/gunicorn/gunicorn.conf.py:/app/gunicorn.conf.py"
      - "../../CHANGELOG.md:/app/CHANGELOG.md"
      - "../../README.md:/app/README.md"
      - "../../LICENSE.txt:/app/LICENSE.txt"
      - "/access:/access"
      - "/media:/media"
      - "${COYOTE3_DATA_HOST_ROOT:-/data}:${COYOTE3_DATA_CONTAINER_ROOT:-/data}"
      - "/fs1:/fs1"
    command: "celery -A api.celery_app:celery_app worker --loglevel=${CELERY_LOG_LEVEL:-INFO} --queues=${CELERY_INGEST_QUEUE:-ingest},default --concurrency=${CELERY_WORKER_CONCURRENCY:-2}"
    depends_on:
      coyote3_redis_dev:
        condition: service_started

  coyote3_dev_beat:
    <<: *runtime-defaults
    container_name: coyote3_dev_beat_${COYOTE3_VERSION:-local}
    image: coyote3-api:${COYOTE3_VERSION:-local}-dev
    env_file:
      - ../../.coyote3_dev_env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CACHE_ENABLED=1
      - CACHE_REQUIRED=1
      - TZ=Europe/Stockholm
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - BUILD_TIME=${BUILD_TIME:-unknown}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://coyote3_redis_dev:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://coyote3_redis_dev:6379/0}
      - CELERY_INGEST_QUEUE=${CELERY_INGEST_QUEUE:-ingest}
    restart: always
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    extra_hosts:
      - "mtlucmds1.lund.skane.se:172.17.0.1"
      - "host.docker.internal:host-gateway"
    networks:
      - coyote3-dev-net
    volumes:
      - "../../.git:/app/.git"
      - "../../api:/app/api"
      - "../../config:/app/config"
      - "/data/coyote3/logs:/app/logs"
      - "../../docs:/app/docs"
      - "../../asgi.py:/app/asgi.py"
      - "../../deploy/gunicorn/gunicorn.conf.py:/app/gunicorn.conf.py"
      - "../../CHANGELOG.md:/app/CHANGELOG.md"
      - "../../README.md:/app/README.md"
      - "../../LICENSE.txt:/app/LICENSE.txt"
      - "/access:/access"
      - "/media:/media"
      - "${COYOTE3_DATA_HOST_ROOT:-/data}:${COYOTE3_DATA_CONTAINER_ROOT:-/data}"
      - "/fs1:/fs1"
    command: "celery -A api.celery_app:celery_app beat --loglevel=${CELERY_LOG_LEVEL:-INFO}"
    depends_on:
      coyote3_redis_dev:
        condition: service_started


  # Shared infrastructure dependency.
  coyote3_redis_dev:
    <<: *runtime-defaults
    container_name: coyote3_redis_dev_${COYOTE3_VERSION:-local}
    image: redis:7.4.3
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    dns:
      - ${APP_DNS:-1.1.1.1}
      - 8.8.8.8
    networks:
      - coyote3-dev-net
    restart: unless-stopped
    privileged: true

  coyote3_dev_proxy:
    <<: *runtime-defaults
    container_name: coyote3_dev_proxy_${COYOTE3_VERSION:-local}
    image: nginx:1.27-alpine
    ports:
      - "${COYOTE3_DEV_PORT:-6801}:8088"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - coyote3-dev-net
    depends_on:
      frontend:
        condition: service_started
      coyote3_dev_api:
        condition: service_healthy
      coyote3_dev_docs:
        condition: service_started
    restart: unless-stopped

  # Optional local Mongo. Enable with --profile with-mongo.
  coyote3_dev_mongo:
    <<: *runtime-defaults
    container_name: coyote3_dev_mongo_${COYOTE3_VERSION:-local}
    image: mongo:7.0
    profiles: ["with-mongo"]
    command: ["--bind_ip_all"]
    ports:
      - "${COYOTE3_DEV_MONGO_PORT:-6804}:27017"
    env_file:
      - ../../.coyote3_dev_env
    restart: unless-stopped
    stop_grace_period: 120s
    networks:
      - coyote3-dev-net
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-coyote3_root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-CHANGE_ME_DEV_ROOT_PASSWORD}
      - COYOTE3_DB=${COYOTE3_DB:-coyote3}
      - MONGO_APP_USER=${MONGO_APP_USER:-coyote3_app}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:-CHANGE_ME_DEV_APP_PASSWORD}
    volumes:
      - dev-mongodb:/data/db
      - /data/coyote3/dev/backups/mongo:/backup
      - ./mongo-init/create-app-user.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh \"mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@127.0.0.1:27017/admin?authSource=admin\" --quiet --eval \"db.getSiblingDB('$$COYOTE3_DB').runCommand({ usersInfo: '$$MONGO_APP_USER' }).users.length\" | grep 1 >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s

networks:
  coyote3-dev-net:
    driver: bridge

volumes:
  frontend_node_modules:
    name: coyote3-frontend-node-modules
  dev-mongodb:
