# Legacy Compose 1.29.2 definition. See README.md before deployment.
# Optional MongoDB services. Include this overlay and enable the required profiles.
# Without --profile mongo / --profile mongo-kb no mongod or initializer is started.
x-mongo-resources: &mongo-resources
  mem_limit: ${MONGO_CONTAINER_MEM_LIMIT:-8g}
  cpus: ${MONGO_CONTAINER_CPU_LIMIT:-4.0}

services:
  mongo:
    <<: *mongo-resources
    profiles: [mongo]
    image: mongo:7.0.41
    security_opt: [seccomp=unconfined]
    entrypoint: ["/bin/sh", "/opt/coyote3/mongo-entrypoint.sh"]
    tmpfs: ["/run/coyote3-mongo"]
    command: ["mongod", "--replSet", "${MONGO_REPLICA_SET_NAME:-coyote3-rs}", "--bind_ip_all", "--keyFile", "/run/coyote3-mongo/keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
      MONGO_SERVICE_SCOPE: app
      HOME: /tmp
      MONGO_UID: ${MONGO_UID:?Set MONGO_UID to the host database owner UID}
      MONGO_GID: ${MONGO_GID:?Set MONGO_GID to the host database owner GID}
      COYOTE3_DB: ${COYOTE3_DB:-}
      IDENTITY_DB: ${IDENTITY_DB:-}
      KNOWLEDGEBASE_DB: ${KNOWLEDGEBASE_DB:-}
      BAM_DB: ${BAM_DB:-}
      MONGO_APP_USER: ${MONGO_APP_USER:-}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-}
    ports:
      - "${COYOTE3_MONGO_BIND_ADDRESS:-127.0.0.1}:${COYOTE3_MONGO_PORT:-27017}:27017"
    volumes:
      - "${COYOTE3_MONGO_DATA_HOST_ROOT:-/srv/coyote3/mongo/data}:/data/db"
      - "${COYOTE3_MONGO_KEYFILE_HOST_PATH:-/srv/coyote3/mongo/keyfile}:/etc/mongo-keyfile/keyfile:ro"
      - ../compose/mongo-init/mongo-entrypoint.sh:/opt/coyote3/mongo-entrypoint.sh:ro
      - ../compose/mongo-init/create-app-user.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro
    healthcheck: &mongo-health
      test: ["CMD-SHELL", "gosu \"$$MONGO_UID:$$MONGO_GID\" mongosh --quiet --host 127.0.0.1 --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping: 1}).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 120s
    restart: unless-stopped
    networks:
      app:
        aliases: [mongo-app]

  mongo_init:
    <<: *mongo-resources
    user: "${MONGO_UID:?Set MONGO_UID}:${MONGO_GID:?Set MONGO_GID}"
    profiles: [mongo]
    image: mongo:7.0.41
    security_opt: [seccomp=unconfined]
    environment:
      MONGO_SERVICE_HOST: mongo
      HOME: /tmp
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
      MONGO_REPLICA_SET_NAME: ${MONGO_REPLICA_SET_NAME:-coyote3-rs}
      MONGO_REPLICA_MEMBER_HOST: ${MONGO_REPLICA_MEMBER_HOST:-mongo-app:27017}
    volumes:
      - ../compose/mongo-init/init-replica-set.sh:/opt/coyote3/init-replica-set.sh:ro
    entrypoint: ["/bin/sh", "/opt/coyote3/init-replica-set.sh"]
    depends_on:
      mongo: {condition: service_healthy}
    restart: "no"
    networks: [app]

  mongo-kb:
    <<: *mongo-resources
    profiles: [mongo-kb]
    image: mongo:7.0.41
    security_opt: [seccomp=unconfined]
    entrypoint: ["/bin/sh", "/opt/coyote3/mongo-entrypoint.sh"]
    tmpfs: ["/run/coyote3-mongo"]
    command: ["mongod", "--replSet", "${KNOWLEDGEBASE_REPLICA_SET_NAME:-coyote3-kb-rs}", "--bind_ip_all", "--keyFile", "/run/coyote3-mongo/keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KNOWLEDGEBASE_MONGO_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${KNOWLEDGEBASE_MONGO_ROOT_PASSWORD:-}
      MONGO_SERVICE_SCOPE: knowledgebase
      HOME: /tmp
      MONGO_UID: ${MONGO_UID:?Set MONGO_UID to the host database owner UID}
      MONGO_GID: ${MONGO_GID:?Set MONGO_GID to the host database owner GID}
      KNOWLEDGEBASE_DB: ${KNOWLEDGEBASE_DB:-}
      MONGO_APP_USER: ${KNOWLEDGEBASE_MONGO_APP_USER:-}
      MONGO_APP_PASSWORD: ${KNOWLEDGEBASE_MONGO_APP_PASSWORD:-}
    ports:
      - "${KNOWLEDGEBASE_MONGO_BIND_ADDRESS:-127.0.0.1}:${KNOWLEDGEBASE_MONGO_PORT:-27018}:27017"
    volumes:
      - "${KNOWLEDGEBASE_MONGO_DATA_HOST_ROOT:-/srv/coyote3/mongo-kb/data}:/data/db"
      - "${KNOWLEDGEBASE_MONGO_KEYFILE_HOST_PATH:-/srv/coyote3/mongo-kb/keyfile}:/etc/mongo-keyfile/keyfile:ro"
      - ../compose/mongo-init/mongo-entrypoint.sh:/opt/coyote3/mongo-entrypoint.sh:ro
      - ../compose/mongo-init/create-app-user.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro
    healthcheck: *mongo-health
    stop_grace_period: 120s
    restart: unless-stopped
    networks: [app]

  mongo_kb_init:
    <<: *mongo-resources
    user: "${MONGO_UID:?Set MONGO_UID}:${MONGO_GID:?Set MONGO_GID}"
    profiles: [mongo-kb]
    image: mongo:7.0.41
    security_opt: [seccomp=unconfined]
    environment:
      MONGO_SERVICE_HOST: mongo-kb
      HOME: /tmp
      MONGO_ROOT_USERNAME: ${KNOWLEDGEBASE_MONGO_ROOT_USERNAME:-}
      MONGO_ROOT_PASSWORD: ${KNOWLEDGEBASE_MONGO_ROOT_PASSWORD:-}
      MONGO_REPLICA_SET_NAME: ${KNOWLEDGEBASE_REPLICA_SET_NAME:-coyote3-kb-rs}
      MONGO_REPLICA_MEMBER_HOST: ${KNOWLEDGEBASE_REPLICA_MEMBER_HOST:-mongo-kb:27017}
    volumes:
      - ../compose/mongo-init/init-replica-set.sh:/opt/coyote3/init-replica-set.sh:ro
    entrypoint: ["/bin/sh", "/opt/coyote3/init-replica-set.sh"]
    depends_on:
      mongo-kb: {condition: service_healthy}
    restart: "no"
    networks: [app]

networks:
  app:
    name: ${COYOTE3_APP_NETWORK:?COYOTE3_APP_NETWORK must be set}
    external: true
