# Combine with docker-compose.yml; select the project with -p.
services:
  frontend:
    image: coyote3-frontend:${COYOTE3_VERSION:-local}-test
    profiles: [with-ui]
  docs:
    image: coyote3-docs:${COYOTE3_VERSION:-local}-test
    profiles: [with-ui]
  api:
    image: coyote3-api:${COYOTE3_VERSION:-local}-test
    build:
      dockerfile: docker/Dockerfile.dev
      target: coyote3_dev_api
  worker:
    image: coyote3-api:${COYOTE3_VERSION:-local}-test
    build:
      context: ../..
      dockerfile: docker/Dockerfile.dev
      target: coyote3_dev_api
      network: host
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim-bullseye
        COYOTE3_UID: ${COYOTE3_UID:-10001}
        COYOTE3_GID: ${COYOTE3_GID:-10001}
  beat:
    image: coyote3-api:${COYOTE3_VERSION:-local}-test
    build:
      context: ../..
      dockerfile: docker/Dockerfile.dev
      target: coyote3_dev_api
      network: host
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim-bullseye
        COYOTE3_UID: ${COYOTE3_UID:-10001}
        COYOTE3_GID: ${COYOTE3_GID:-10001}
  proxy:
    profiles: [with-ui]
    ports: ["${COYOTE3_PORT:-6811}:8088"]
  test_runner:
    image: coyote3-all:${COYOTE3_VERSION:-local}-test
    profiles: [tests]
    build:
      context: ../..
      dockerfile: docker/Dockerfile.dev
      target: coyote3_dev_all
      network: host
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim-bullseye
        COYOTE3_UID: ${COYOTE3_UID:-10001}
        COYOTE3_GID: ${COYOTE3_GID:-10001}
    environment:
      ENV_NAME: ${ENV_NAME:?ENV_NAME is required}
      COYOTE3_MONGO_URI: ${COYOTE3_MONGO_URI:?COYOTE3_MONGO_URI is required}
      IDENTITY_MONGO_URI: ${IDENTITY_MONGO_URI:-}
      KNOWLEDGEBASE_MONGO_URI: ${KNOWLEDGEBASE_MONGO_URI:-}
      BAM_MONGO_URI: ${BAM_MONGO_URI:-}
      COYOTE3_DB: ${COYOTE3_DB:?COYOTE3_DB is required}
      IDENTITY_DB: ${IDENTITY_DB:?IDENTITY_DB is required}
      KNOWLEDGEBASE_DB: ${KNOWLEDGEBASE_DB:?KNOWLEDGEBASE_DB is required}
      BAM_DB: ${BAM_DB:?BAM_DB is required}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: bash -lc 'PYTHONPATH=. pytest -q'
    networks: [app]
    depends_on:
      api: {condition: service_healthy}
