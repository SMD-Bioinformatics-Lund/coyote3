# Combine with docker-compose.yml; select the project with -p.
services:
  frontend:
    image: coyote4-frontend:${COYOTE4_IMAGE_TAG:?Run scripts/deployment/compose-with-version.sh to select the environment image tag}
    profiles: [with-ui]
  docs:
    image: coyote4-docs:${COYOTE4_IMAGE_TAG:?Run scripts/deployment/compose-with-version.sh to select the environment image tag}
    profiles: [with-ui]
  api:
    image: coyote4-api:${COYOTE4_IMAGE_TAG:?Run scripts/deployment/compose-with-version.sh to select the environment image tag}
    build:
      dockerfile: docker/Dockerfile.legacy
      target: coyote4_dev_api
      network: host
  worker:
    image: coyote4-api:${COYOTE4_IMAGE_TAG:?Run scripts/deployment/compose-with-version.sh to select the environment image tag}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.legacy
      target: coyote4_dev_api
      network: host
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim-bullseye
        COYOTE4_UID: ${COYOTE4_UID:-10001}
        COYOTE4_GID: ${COYOTE4_GID:-10001}
  beat:
    image: coyote4-api:${COYOTE4_IMAGE_TAG:?Run scripts/deployment/compose-with-version.sh to select the environment image tag}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.legacy
      target: coyote4_dev_api
      network: host
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim-bullseye
        COYOTE4_UID: ${COYOTE4_UID:-10001}
        COYOTE4_GID: ${COYOTE4_GID:-10001}
  proxy:
    profiles: [with-ui]
    ports: ["${COYOTE4_PORT:-6811}:8088"]
  test_runner:
    image: coyote4-all:${COYOTE4_IMAGE_TAG:?Run scripts/deployment/compose-with-version.sh to select the environment image tag}
    profiles: [tests]
    build:
      context: ../..
      dockerfile: docker/Dockerfile.legacy
      target: coyote4_dev_all
      network: host
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim-bullseye
        COYOTE4_UID: ${COYOTE4_UID:-10001}
        COYOTE4_GID: ${COYOTE4_GID:-10001}
    environment:
      ENV_NAME: ${ENV_NAME:?ENV_NAME is required}
      COYOTE4_MONGO_URI: ${COYOTE4_MONGO_URI:?COYOTE4_MONGO_URI is required}
      IDENTITY_MONGO_URI: ${IDENTITY_MONGO_URI:-}
      KNOWLEDGEBASE_MONGO_URI: ${KNOWLEDGEBASE_MONGO_URI:-}
      BAM_MONGO_URI: ${BAM_MONGO_URI:-}
      COYOTE4_DB: ${COYOTE4_DB:?COYOTE4_DB is required}
      IDENTITY_DB: ${IDENTITY_DB:?IDENTITY_DB is required}
      KNOWLEDGEBASE_DB: ${KNOWLEDGEBASE_DB:?KNOWLEDGEBASE_DB is required}
      BAM_DB: ${BAM_DB:?BAM_DB is required}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: bash -lc 'PYTHONPATH=. pytest -q'
    networks: [app]
    depends_on:
      api: {condition: service_healthy}
