# Standalone legacy dev definition; use instead of docker-compose.yml.
# Matches the modern dev service contract using Compose 1.29.2 syntax.
x-runtime-defaults: &runtime-defaults
  mem_limit: ${COYOTE3_CONTAINER_MEM_LIMIT:-2g}
  cpus: ${COYOTE3_CONTAINER_CPU_LIMIT:-2.0}
  restart: on-failure:5
  networks: [app]
x-app-environment: &app-environment
  ENV_NAME: ${ENV_NAME:?ENV_NAME is required}
  COYOTE3_MONGO_URI: ${COYOTE3_MONGO_URI:?COYOTE3_MONGO_URI is required}
  IDENTITY_MONGO_URI: ${IDENTITY_MONGO_URI:-}
  KNOWLEDGEBASE_MONGO_URI: ${KNOWLEDGEBASE_MONGO_URI:-}
  BAM_MONGO_URI: ${BAM_MONGO_URI:-}
  COYOTE3_DB: ${COYOTE3_DB:?COYOTE3_DB is required}
  IDENTITY_DB: ${IDENTITY_DB:?IDENTITY_DB is required}
  KNOWLEDGEBASE_DB: ${KNOWLEDGEBASE_DB:?KNOWLEDGEBASE_DB is required}
  BAM_DB: ${BAM_DB:?BAM_DB is required}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
  PASSWORD_TOKEN_SALT: ${PASSWORD_TOKEN_SALT:?PASSWORD_TOKEN_SALT is required}
  SCRIPT_NAME: ${SCRIPT_NAME:-}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
  ORGANIZATION_NAME: ${ORGANIZATION_NAME:-Coyote3}
  LOCAL_TIME_ZONE: ${LOCAL_TIME_ZONE:-UTC}
  TZ: ${LOCAL_TIME_ZONE:-UTC}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
  LOG_FILE_ENABLED: ${LOG_FILE_ENABLED:-1}
  LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
  LOG_GZIP_AFTER_DAYS: ${LOG_GZIP_AFTER_DAYS:-1}
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-730}
  NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-180}
  CACHE_REQUIRED: ${CACHE_REQUIRED:-1}
  CACHE_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  CACHE_REDIS_CONNECT_TIMEOUT: ${CACHE_REDIS_CONNECT_TIMEOUT:-1.0}
  CACHE_REDIS_SOCKET_TIMEOUT: ${CACHE_REDIS_SOCKET_TIMEOUT:-1.0}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/2
  CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-INFO}
  CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
  CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-7200}
  CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-6900}
  CELERY_RESULT_EXPIRES: ${CELERY_RESULT_EXPIRES:-86400}
  CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
  COYOTE3_MAINTENANCE_HOUR: ${COYOTE3_MAINTENANCE_HOUR:-2}
  COYOTE3_INGEST_WATCH_ENABLED: ${COYOTE3_INGEST_WATCH_ENABLED:-0}
  COYOTE3_INGEST_WATCH_FILENAME: ${COYOTE3_INGEST_WATCH_FILENAME:-coyote3.yaml}
  COYOTE3_INGEST_DONE_SUFFIX: ${COYOTE3_INGEST_DONE_SUFFIX:-.done}
  COYOTE3_INGEST_FAILED_SUFFIX: ${COYOTE3_INGEST_FAILED_SUFFIX:-.failed}
  COYOTE3_INGEST_WATCH_INTERVAL_SECONDS: ${COYOTE3_INGEST_WATCH_INTERVAL_SECONDS:-30}
  COYOTE3_INGEST_WATCH_UPDATE_EXISTING: ${COYOTE3_INGEST_WATCH_UPDATE_EXISTING:-0}
  COYOTE3_INGEST_WATCH_INCREMENT: ${COYOTE3_INGEST_WATCH_INCREMENT:-0}
  AUTHENTICATION_PROVIDERS: ${AUTHENTICATION_PROVIDERS:-local,ldap}
  LDAP_HOST: ${LDAP_HOST:-}
  LDAP_PORT: ${LDAP_PORT:-}
  LDAP_USE_SSL: ${LDAP_USE_SSL:-0}
  LDAP_USE_TLS: ${LDAP_USE_TLS:-1}
  LDAP_VERIFY_CERT: ${LDAP_VERIFY_CERT:-1}
  LDAP_CONNECT_TIMEOUT: ${LDAP_CONNECT_TIMEOUT:-10}
  LDAP_CA_CERTS_FILE: ${LDAP_CA_CERTS_FILE:-}
  LDAP_BASE_DN: ${LDAP_BASE_DN:-}
  LDAP_USER_LOGIN_ATTR: ${LDAP_USER_LOGIN_ATTR:-mail}
  LDAP_BINDDN: ${LDAP_BINDDN:-}
  LDAP_SECRET: ${LDAP_SECRET:-}
  GENS_URI: ${GENS_URI:-}
  IGV_URI: ${IGV_URI:-}
  ONCOKB_PUBLIC_LOOKUPS_ENABLED: ${ONCOKB_PUBLIC_LOOKUPS_ENABLED:-1}
  ONCOKB_REQUEST_TIMEOUT_SECONDS: ${ONCOKB_REQUEST_TIMEOUT_SECONDS:-3.0}
  CLINPGX_PUBLIC_LOOKUPS_ENABLED: ${CLINPGX_PUBLIC_LOOKUPS_ENABLED:-1}
  CLINPGX_REQUEST_TIMEOUT_SECONDS: ${CLINPGX_REQUEST_TIMEOUT_SECONDS:-3.0}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
  SMTP_USE_SSL: ${SMTP_USE_SSL:-0}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@coyote3.local}
  SMTP_INFO_FROM_EMAIL: ${SMTP_INFO_FROM_EMAIL:-info@coyote3.local}
  SMTP_SECURITY_FROM_EMAIL: ${SMTP_SECURITY_FROM_EMAIL:-security@coyote3.local}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Coyote3}
  PASSWORD_TOKEN_TTL_SECONDS: ${PASSWORD_TOKEN_TTL_SECONDS:-3600}
  API_SESSION_COOKIE_NAME: ${API_SESSION_COOKIE_NAME:-coyote3_api_session}
  API_SESSION_TTL_SECONDS: ${API_SESSION_TTL_SECONDS:-43200}
  API_SESSION_COOKIE_SAMESITE: ${API_SESSION_COOKIE_SAMESITE:-lax}
  API_RATE_LIMIT_ENABLED: ${API_RATE_LIMIT_ENABLED:-1}
  API_RATE_LIMIT_REQUESTS_PER_MINUTE: ${API_RATE_LIMIT_REQUESTS_PER_MINUTE:-600}
  API_RATE_LIMIT_WINDOW_SECONDS: ${API_RATE_LIMIT_WINDOW_SECONDS:-60}
  API_CSRF_ENABLED: ${API_CSRF_ENABLED:-1}
  DASHBOARD_METRIC_CACHE_TTL_SECONDS: ${DASHBOARD_METRIC_CACHE_TTL_SECONDS:-300}
  DASHBOARD_METRIC_CACHE_RETENTION_SECONDS: ${DASHBOARD_METRIC_CACHE_RETENTION_SECONDS:-3600}
  MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-100}
  MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-0}
  MONGO_CONNECT_TIMEOUT_MS: ${MONGO_CONNECT_TIMEOUT_MS:-10000}
  MONGO_SERVER_SELECTION_TIMEOUT_MS: ${MONGO_SERVER_SELECTION_TIMEOUT_MS:-30000}
  MONGO_WAIT_QUEUE_TIMEOUT_MS: ${MONGO_WAIT_QUEUE_TIMEOUT_MS:-10000}
  MONGO_READ_CONCERN_LEVEL: ${MONGO_READ_CONCERN_LEVEL:-majority}
  MONGO_WRITE_CONCERN_W: ${MONGO_WRITE_CONCERN_W:-majority}
  MONGO_WRITE_CONCERN_JOURNAL: ${MONGO_WRITE_CONCERN_JOURNAL:-1}
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  GIT_COMMIT: ${GIT_COMMIT:-unknown}
  BUILD_TIME: ${BUILD_TIME:-unknown}
services:
  frontend:
    image: node:22-alpine
    <<: *runtime-defaults
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --port 3000 --host 0.0.0.0"
    environment:
      ENV_NAME: ${ENV_NAME:?ENV_NAME is required}
      SCRIPT_NAME: ${SCRIPT_NAME:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-Coyote3}
      LOCAL_TIME_ZONE: ${LOCAL_TIME_ZONE:-UTC}
      TZ: ${LOCAL_TIME_ZONE:-UTC}
      GENS_URI: ${GENS_URI:-}
      IGV_URI: ${IGV_URI:-}
      IGV_DATA_ROOT: ${IGV_DATA_ROOT:-}
      COYOTE3_API_INTERNAL_URL: http://api:8001
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    volumes:
    - ../../frontend:/app
    - ../../api/version.py:/api/version.py:ro
    - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
    - app
  docs:
    <<: *runtime-defaults
    image: coyote3-docs:${COYOTE3_VERSION:-local}-dev
    build:
      context: ../..
      dockerfile: docker/Dockerfile.docs
      network: host
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim-bullseye
        ENV_NAME: ${ENV_NAME:?ENV_NAME is required}
    volumes:
    - ../../site:/usr/share/nginx/html:ro
  api:
    image: coyote3-api:${COYOTE3_VERSION:-local}-dev
    <<: *runtime-defaults
    build:
      context: ../..
      dockerfile: docker/Dockerfile.dev
      network: host
      target: coyote3_dev_api
      args:
        PYTHON_BASE_IMAGE: python:3.12-slim-bullseye
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        COYOTE3_UID: ${COYOTE3_UID:-10001}
        COYOTE3_GID: ${COYOTE3_GID:-10001}
    environment: *app-environment
    volumes: &dev-app-volumes
    - ${COYOTE3_LOGS_HOST_ROOT:?COYOTE3_LOGS_HOST_ROOT is required}:/app/logs
    - ${COYOTE3_DATA_HOST_ROOT:?COYOTE3_DATA_HOST_ROOT is required}:/data
    - ../../.git:/app/.git:ro
    - ../../api:/app/api
    - ../../docs:/app/docs
    - ../../CHANGELOG.md:/app/CHANGELOG.md:ro
    - ../../README.md:/app/README.md:ro
    - ../../LICENSE.txt:/app/LICENSE.txt:ro
    - ../../NOTICE.txt:/app/NOTICE.txt:ro
    command: python3 -m uvicorn api.app.main:app --host 0.0.0.0 --port 8001 --reload --reload-dir /app/api
    healthcheck:
      test:
      - CMD-SHELL
      - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
  worker:
    image: coyote3-api:${COYOTE3_VERSION:-local}-dev
    <<: *runtime-defaults
    environment: *app-environment
    volumes: *dev-app-volumes
    command: celery -A api.celery_app:celery_app worker --loglevel=${CELERY_LOG_LEVEL:-INFO} --queues=ingest,default --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    depends_on:
      redis:
        condition: service_healthy
  beat:
    image: coyote3-api:${COYOTE3_VERSION:-local}-dev
    <<: *runtime-defaults
    ipc: none
    environment: *app-environment
    volumes: *dev-app-volumes
    command: celery -A api.celery_app:celery_app beat --loglevel=${CELERY_LOG_LEVEL:-INFO} --pidfile=/tmp/celerybeat.pid
    depends_on:
      redis:
        condition: service_healthy
  redis:
    <<: *runtime-defaults
    image: redis:7.4.3
    security_opt:
    - seccomp=unconfined
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
    - sh
    - -c
    - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync always --maxmemory-policy noeviction
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 10
  proxy:
    <<: *runtime-defaults
    image: nginx:1.27-alpine
    ports:
    - ${COYOTE3_PORT:-6801}:8088
    command:
    - sh
    - -c
    - sh /etc/nginx/render-config.sh && nginx -g 'daemon off;'
    environment:
      SCRIPT_NAME: ${SCRIPT_NAME:-}
      COYOTE3_NGINX_FRONTEND_UPSTREAM: http://frontend:3000
      COYOTE3_NGINX_API_UPSTREAM: http://api:8001
      COYOTE3_NGINX_DOCS_UPSTREAM: http://docs:8080
      COYOTE3_NGINX_PUBLIC_SCHEME: ${COYOTE3_NGINX_PUBLIC_SCHEME:-http}
    volumes:
    - ../compose/nginx/render-config.sh:/etc/nginx/render-config.sh:ro
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
      docs:
        condition: service_started
volumes:
  frontend_node_modules:
  redis-data:
networks:
  app:
    name: ${COYOTE3_APP_NETWORK:?COYOTE3_APP_NETWORK is required}
    external: true
