[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coyote-relay"
version = "1.0.0"
description = "Coyote Relay: pipeline submission tools, API integration and durable ingestion workers"
requires-python = ">=3.12"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt", "COPYRIGHT.txt", "NOTICE.txt"]
authors = [{ name = "Ram Nanduri" }]
dependencies = ["coyote-core==4.0.0", "httpx==0.28.1", "pydantic==2.14.3", "PyYAML==6.0.3"]

[project.urls]
Repository = "https://github.com/SMD-Bioinformatics-Lund/coyote3"
Issues = "https://github.com/SMD-Bioinformatics-Lund/coyote3/issues"

[project.optional-dependencies]
api = ["coyote-server==1.0.0"]
worker = ["coyote-server==1.0.0"]
test = ["pytest==9.0.3", "pytest-cov==7.1.0", "mongomock==4.3.0", "pip==26.2.1", "setuptools==84.2.1", "wheel==0.48.0"]

[project.scripts]
coyote-relay-submit = "coyote_relay.submit:main"
coyote-relay-validate = "coyote_relay.validate:main"
coyote-relay-login = "coyote_relay.login:main"
coyote-relay-worker = "coyote_relay.worker:main"

[project.entry-points."coyote.api.routers"]
relay = "coyote_relay.api:routers"

[tool.coyote4.attribution]
contributors = ["Sailendra Pradhananga", "Viktor Henmyr"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["coyote_relay", "coyote_relay.*"]

[tool.setuptools.package-dir]
"" = "."
coyote_relay = "src/coyote_relay"

[tool.setuptools.cmdclass]
build_py = "relay_build.CleanRelayBuildPy"

[tool.setuptools.package-data]
coyote_relay = ["py.typed", "assets/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
  "smoke: fast synthetic checks without external services or artifact builds",
  "unit: isolated behavior with synthetic fixtures",
  "integration: explicitly configured service integration",
  "contract: schema and architecture contracts",
]

[tool.coverage.run]
branch = true
source = ["coyote_relay"]
data_file = ".coverage"

[tool.coverage.report]
fail_under = 75
show_missing = true
precision = 2
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"
