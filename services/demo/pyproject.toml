[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coyote-demo"
version = "1.0.0"
description = "Synthetic Coyote datasets and guarded demonstration installation"
requires-python = ">=3.12"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt", "COPYRIGHT.txt", "NOTICE.txt"]
authors = [{ name = "Ram Nanduri" }]
dependencies = ["coyote-core==4.0.0"]

[project.optional-dependencies]
api = ["coyote-server==1.0.0"]
worker = ["coyote-server==1.0.0", "coyote-relay==1.0.0"]
test = ["pytest==9.0.3", "pytest-cov==7.1.0", "mongomock==4.3.0"]

[project.scripts]
coyote-demo-install = "coyote_demo.cli:main"

[project.entry-points."coyote.api.routers"]
demo = "coyote_demo.api:routers"

[project.entry-points."coyote.runtime.validators"]
demo = "coyote_demo.deployment:runtime_validator"

[tool.coyote4.attribution]
contributors = ["Sailendra Pradhananga", "Viktor Henmyr"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["coyote_demo", "coyote_demo.*"]

[tool.setuptools.package-dir]
"" = "."
coyote_demo = "src/coyote_demo"

[tool.setuptools.cmdclass]
build_py = "demo_build.CleanDemoBuildPy"

[tool.setuptools.package-data]
coyote_demo = ["py.typed", "data/**/*", "data/*.ndjson", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
  "smoke: fast synthetic checks without external services or artifact builds",
  "unit: isolated behavior with synthetic fixtures",
  "integration: explicitly configured service integration",
  "contract: schema and architecture contracts",
]

[tool.coverage.run]
branch = true
source = ["coyote_demo"]
data_file = ".coverage"

[tool.coverage.report]
fail_under = 75
show_missing = true
precision = 2
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"
