[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coyote-ingest"
version = "1.0.0"
description = "Coyote ingestion submission tools and durable worker service"
requires-python = ">=3.12"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt", "COPYRIGHT.txt", "NOTICE.txt"]
authors = [{ name = "Ram Nanduri" }]
dependencies = ["coyote-core==4.0.0", "coyote-pyclient==1.0.0"]

[project.optional-dependencies]
worker = ["coyote-server==1.0.0"]
test = ["pytest==9.0.3", "pytest-cov==7.1.0", "mongomock==4.3.0"]

[project.scripts]
coyote-ingest-submit = "coyote_ingest.submit:main"
coyote-ingest-validate = "coyote_ingest.validate:main"
coyote-ingest-login = "coyote_ingest.login:main"
coyote-ingest-worker = "coyote_ingest.worker:main"

[tool.coyote4.attribution]
contributors = ["Sailendra Pradhananga", "Viktor Henmyr"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["coyote_ingest", "coyote_ingest.*"]

[tool.setuptools.cmdclass]
build_py = "ingest_build.CleanIngestBuildPy"

[tool.setuptools.package-data]
coyote_ingest = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
  "smoke: fast synthetic checks without external services or artifact builds",
  "unit: isolated behavior with synthetic fixtures",
  "integration: explicitly configured service integration",
  "contract: schema and architecture contracts",
]

[tool.coverage.run]
branch = true
source = ["coyote_ingest"]
data_file = ".coverage"

[tool.coverage.report]
fail_under = 75
show_missing = true
precision = 2
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"
