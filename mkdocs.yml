site_name: Coyote3 Documentation
site_description: Coyote3 system, engineering, operations, and user documentation
docs_dir: docs
site_dir: site
exclude_docs: |
  /overrides/
  /hooks/
  /reading-paths.yml
repo_name: Coyote3
hooks:
  - docs/hooks/version.py
  - docs/hooks/callouts.py
  - docs/hooks/reading.py

theme:
  name: readthedocs
  custom_dir: docs/overrides

extra:
  environment: !ENV [ENV_NAME, ""]
  clinical_reference:
    - title: Samples and review
      path: user-guide/sample-management/
    - title: Set up an assay
      path: administration/assay-setup/
    - title: Assay configuration and prerequisites
      path: administration/clinical-configuration-resources/
    - title: Gene lists
      path: user-guide/gene-lists-and-assay-context/
    - title: Query defaults and finding selection
      path: administration/query-rules/#application-base-queries-by-analysis
    - title: Reporting rules
      path: reference/clinical-reporting-rules/
    - title: Report preview and save
      path: user-guide/application-guide/#reports
    - title: Classifications and comments
      path: user-guide/application-guide/#comments-and-annotations
    - title: Assay groups
      path: administration/assay-groups/
    - title: Diagnoses
      path: administration/assay-diagnoses/
    - title: Coverage review
      path: user-guide/coverage-review/

extra_javascript:
  - javascripts/footer-year.js

markdown_extensions:
  - toc:
      permalink: true
  - fenced_code
  - tables
  - sane_lists
  - attr_list
  - md_in_html

validation:
  links:
    anchors: warn

