site_name: Coyote4 Documentation
site_description: Coyote4 system, engineering, operations, and user documentation
docs_dir: docs
site_dir: site
exclude_docs: |
  /overrides/
  /hooks/
repo_name: coyote3
hooks:
  - docs/hooks/packages.py
  - docs/hooks/version.py
  - docs/hooks/callouts.py

theme:
  name: readthedocs
  custom_dir: docs/overrides
  titles_only: false

extra:
  environment: !ENV [ENV_NAME, ""]

extra_javascript:
  - javascripts/footer-year.js

markdown_extensions:
  - toc:
      permalink: true
  - fenced_code
  - tables
  - sane_lists
  - attr_list
  - md_in_html

validation:
  links:
    anchors: warn

