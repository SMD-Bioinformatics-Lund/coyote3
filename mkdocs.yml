site_name: Coyote3 Documentation
site_description: Coyote3 system, engineering, operations, and user documentation
docs_dir: docs
site_dir: site
repo_name: Coyote3
hooks:
  - docs/hooks/version.py
  - docs/hooks/callouts.py

theme:
  name: readthedocs
  custom_dir: docs/overrides

extra:
  environment: !ENV [ENV_NAME, ""]
  clinical_reference:
    - title: Samples and review
      path: user-guide/sample-management/
    - title: Assays · ASP
      path: administration/administration-guide/#assays-asp
    - title: Configurations · ASPC
      path: administration/administration-guide/#assay-configurations-aspc
    - title: Gene lists · ISGL
      path: user-guide/gene-lists-and-assay-context/
    - title: Clinical rules
      path: reference/clinical-reporting-rules/
    - title: Report preview and save
      path: user-guide/application-guide/#reports
    - title: Classifications and comments
      path: user-guide/application-guide/#comments-and-annotations
    - title: Assay groups
      path: administration/assay-groups/
    - title: Subpanels
      path: administration/assay-subpanels/
    - title: Coverage review
      path: user-guide/coverage-review/

extra_javascript:
  - javascripts/footer-year.js

markdown_extensions:
  - toc:
      permalink: true
  - fenced_code
  - tables
  - sane_lists
  - attr_list

nav:
  - Home: README.md
  - Getting started:
      - Section guide: getting-started/README.md
      - "Quickstart: Run Coyote3 Locally": getting-started/local-quickstart.md
      - "Developer environment setup": getting-started/developer-environment.md
