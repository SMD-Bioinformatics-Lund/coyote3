[pytest]
testpaths = tests
norecursedirs = tests_internal .git .venv build dist
addopts = -ra --strict-markers --strict-config
asyncio_mode = auto
markers =
    unit: unit tests for core and infra layers
    api: FastAPI route and API-layer tests
    web: Flask UI tests
    contract: architecture and boundary contract tests
filterwarnings =
    ignore:tagMap is deprecated\. Please use TAG_MAP instead\.:DeprecationWarning:ldap3\.utils\.asn1
    ignore:typeMap is deprecated\. Please use TYPE_MAP instead\.:DeprecationWarning:ldap3\.utils\.asn1
