[pytest]
testpaths = tests core/tests api/tests adapters/mongo/tests services/relay/tests services/demo/tests
norecursedirs = tests/load .git .venv* node_modules build dist site .design
addopts = -ra --strict-markers --strict-config --import-mode=importlib
pythonpath = . core/tests api/tests adapters/mongo/tests services/relay/tests services/demo/tests
asyncio_mode = auto
markers =
    smoke: fast synthetic checks without external services or artifact builds
    unit: isolated package and application unit tests using synthetic fixtures
    api: FastAPI HTTP, authentication and host-boundary tests
    client: application integration with the independent HTTP client
    integration: cross-layer and opt-in configured-service integration tests
    contract: architecture, schema and cross-layer contract tests
filterwarnings =
    ignore:tagMap is deprecated\. Please use TAG_MAP instead\.:DeprecationWarning:ldap3\.utils\.asn1
    ignore:typeMap is deprecated\. Please use TYPE_MAP instead\.:DeprecationWarning:ldap3\.utils\.asn1
