name: release-candidate

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ENV_NAME: testing
  SECRET_KEY: synthetic-ci-secret-not-for-deployment
  PYTHONPATH: .
  UV_CACHE_DIR: .cache/uv
  PIP_CACHE_DIR: .cache/pip

jobs:
  backend:
    name: Candidate backend and distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test tools on the disposable runner
        run: |
          curl -fsSL https://pgp.mongodb.com/server-8.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse' | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org-server nginx libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          python -m pip install uv==0.6.16
          uv sync --frozen --all-packages --group test
          npm --prefix frontend ci --no-audit --no-fund
          docker pull mongo:8.2
          docker pull nginx:1.27-alpine
          mkdir -p .cache/release-candidate/tmp
      - name: Validate contracts, types and release metadata
        run: |
          .venv/bin/python -m scripts.release.check_release
          .venv/bin/python -m mypy
          bash scripts/quality/check_contract_integrity.sh
      - name: Build the wheels that will be tested and retained
        run: |
          .venv/bin/python -m scripts.release.build_sdk --no-build-isolation --output-dir .cache/release-candidate/wheels
      - name: Clinical regressions, installed wheels and disposable database failures
        run: |
          export TMPDIR="$PWD/.cache/release-candidate/tmp"
          export COYOTE4_TEST_WHEELS="$PWD/.cache/release-candidate/wheels"
          .venv/bin/python scripts/quality/run_transaction_tests.py -- -q \
            core/tests api/tests adapters/mongo/tests services/relay/tests services/demo/tests \
            tests/integration tests/unit tests/smoke --no-cov \
            --junitxml=.cache/release-candidate/backend.xml
          .venv/bin/python -m scripts.release.check_candidate backend --commit "$GITHUB_SHA" \
            --junit .cache/release-candidate/backend.xml --wheels .cache/release-candidate/wheels \
            --output .cache/release-candidate/backend.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-backend-${{ github.sha }}
          path: |
            .cache/release-candidate/backend.xml
            .cache/release-candidate/backend.json
            .cache/release-candidate/wheels/
          if-no-files-found: error
          retention-days: 30

  browser:
    name: Candidate browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked application and browser tools
        run: |
          python -m pip install uv==0.6.16
          uv sync --frozen --all-packages --group test
          npm --prefix frontend ci --no-audit --no-fund
          cd frontend
          npx playwright install --with-deps chromium
      - name: Frontend regression and browser fixture checks
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run test:unit
          npm --prefix frontend run build:verified
          npm --prefix frontend run test:e2e
      - name: Test a new synthetic stack and retain candidate evidence
        run: |
          bash install.sh test-browser --output .cache/release-candidate/browser
          .venv/bin/python -m scripts.release.check_candidate browser --commit "$GITHUB_SHA" \
            --browser-directory .cache/release-candidate/browser \
            --output .cache/release-candidate/browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-browser-${{ github.sha }}
          path: |
            .cache/release-candidate/browser.json
            .cache/release-candidate/browser/run.json
            .cache/release-candidate/browser/browser-results.json
            .cache/release-candidate/browser/artifacts/
          if-no-files-found: error
          retention-days: 30

  acceptance:
    name: Release candidate acceptance
    if: always()
    needs: [backend, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to run successfully
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$BROWSER_RESULT" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*-${{ github.sha }}
          path: .cache/release-candidate/evidence
          merge-multiple: true
      - name: Verify evidence belongs to the exact candidate
        run: |
          python -m scripts.release.check_candidate gate --commit "$GITHUB_SHA" \
            --evidence .cache/release-candidate/evidence/backend.json .cache/release-candidate/evidence/browser.json \
            --output .cache/release-candidate/acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-acceptance-${{ github.sha }}
          path: .cache/release-candidate/acceptance.json
          if-no-files-found: error
          retention-days: 30
