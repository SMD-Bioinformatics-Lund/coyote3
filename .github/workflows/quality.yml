name: quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      TESTING: "1"
      DEVELOPMENT: "0"
      COYOTE3_FERNET_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SECRET_KEY: ci-test-secret-key
      INTERNAL_API_TOKEN: ci-test-internal-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Sensitive data guard
        run: python scripts/check_staged_sensitive_data.py --all-files

      - name: Ruff check
        run: PYTHONPATH=. ruff check api tests scripts

      - name: Ruff format check
        run: PYTHONPATH=. ruff format --check api tests scripts

      - name: Strict type check
        run: PYTHONPATH=. mypy

      - name: Full test suite and unified coverage report
        run: >-
          PYTHONPATH=. pytest -q
          --cov=api
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Clinical family coverage gates
        run: PYTHON_BIN="$(command -v python)" PYTHONPATH=. bash scripts/run_family_coverage_gates.sh

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: warn

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install documentation lint tooling
        run: npm ci

      - name: Lint repository Markdown
        run: npm run docs:lint

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint, unit coverage, and production build
        working-directory: frontend
        run: |
          npm run lint
          npm run test:coverage
          npm run build

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn

      - name: Frontend browser route checks
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
