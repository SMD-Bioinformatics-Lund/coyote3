name: quality

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ENV_NAME: testing
      SECRET_KEY: synthetic-ci-secret-not-for-deployment
      PYTHONPATH: .
      UV_CACHE_DIR: .cache/uv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-3.14.7-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-3.14.7-
      - name: Install locked workspace
        run: |
          python -m pip install uv==0.6.16
          uv sync --frozen --all-packages --group test
      - name: Check Python, release metadata and sensitive files
        run: |
          .venv/bin/python -m ruff check core api adapters clients services scripts tests
          .venv/bin/python scripts/release/check_release.py
          .venv/bin/python scripts/quality/check_staged_sensitive_data.py --all-files
      - name: Package and application smoke tests
        run: |
          bash scripts/quality/run_package_tests.sh all --smoke
          .venv/bin/python -m pytest -q tests/smoke --no-cov
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend smoke tests
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend run test:smoke
