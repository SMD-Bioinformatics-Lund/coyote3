name: quality

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENV_NAME: test
      TESTING: "1"
      SECRET_KEY: ci-test-secret-key
      INTERNAL_API_TOKEN: ci-test-internal-token
      COYOTE3_DB: coyote3_contract_test
      IDENTITY_DB: coyote3_identity_contract_test
      KNOWLEDGEBASE_DB: coyote3_kb_contract_test
      BAM_DB: coyote3_bam_contract_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Install API schema dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --ignore-scripts
      - name: Verify frontend contracts against the canonical API and compile the UI
        env:
          PYTHON_BIN: python
        run: npm --prefix frontend run build:verified

  python-client:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.14.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install only the independent client
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/coyote3-client ./clients/python
          python -m pip install /tmp/coyote3-client/coyote3_client-*.whl pytest==9.0.3 pytest-asyncio==1.3.0 ruff==0.15.10 mypy==1.20.1
      - name: Verify isolated client imports and behavior
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('coyote3') is None; assert importlib.util.find_spec('fastapi') is None"
          python -m pytest -q clients/python/tests
          ruff check clients/python
          ruff format --check clients/python
          mypy --follow-imports=silent --ignore-missing-imports clients/python/src/coyote3_client
      - uses: actions/upload-artifact@v4
        with:
          name: coyote3-client-${{ matrix.python-version }}
          path: /tmp/coyote3-client/

  mongo-transactions:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTING: "1"
      DEVELOPMENT: "0"
      SECRET_KEY: ci-test-secret-key
      INTERNAL_API_TOKEN: ci-test-internal-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Install transaction test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e . -e clients/python
      - name: Start isolated disposable replica set
        run: |
          for port in 27017 27018; do
            docker run -d --name "transaction-mongo-$port" -p "127.0.0.1:$port:$port" \
              mongo:7.0.41 --port "$port" --replSet "ci-rs-$port" --bind_ip_all
            for attempt in $(seq 1 60); do
              if docker exec "transaction-mongo-$port" mongosh --port "$port" --quiet \
                --eval 'db.adminCommand({ping:1})'; then
                break
              fi
              sleep 1
            done
            docker exec "transaction-mongo-$port" mongosh --port "$port" --quiet --eval \
              "rs.initiate({_id:'ci-rs-$port',members:[{_id:0,host:'localhost:$port'}]})"
            ready=false
            for attempt in $(seq 1 60); do
              if docker exec "transaction-mongo-$port" mongosh --port "$port" --quiet --eval \
                'if (!db.hello().isWritablePrimary) quit(1)'; then
                ready=true
                break
              fi
              sleep 1
            done
            test "$ready" = true
          done
      - name: Require real transaction and recovery coverage
        run: |
          uri='mongodb://localhost:27017/?replicaSet=ci-rs-27017'
          export AUDIT_TEST_DEST_URI='mongodb://localhost:27018/?replicaSet=ci-rs-27018'
          export MONGO_TOPOLOGY_TEST_KB_URI="$AUDIT_TEST_DEST_URI"
          export AUDIT_TEST_MONGO_URI="$uri" LIFECYCLE_TEST_MONGO_URI="$uri"
          export REPORT_TEST_MONGO_URI="$uri" QUERY_RULE_TEST_MONGO_URI="$uri"
          export ASSAY_SETUP_TEST_MONGO_URI="$uri" CATALOG_TEST_MONGO_URI="$uri"
          export NOTIFICATION_TEST_MONGO_URI="$uri" MONGO_TOPOLOGY_TEST_URI="$uri"
          export BOOTSTRAP_TEST_MONGO_URI="$uri" CLINICAL_RULE_TEST_MONGO_URI="$uri"
          PYTHONPATH=. python -m pytest --no-cov -q --junitxml=/tmp/transactions.xml \
            tests/integration/test_audit_spool_delivery.py \
            tests/integration/test_audit_outbox.py \
            tests/integration/test_sample_data_lifecycle.py \
            tests/integration/test_report_transactions.py \
            tests/integration/test_query_rule_transactions.py \
            tests/integration/test_assay_setup_transactions.py \
            tests/integration/test_public_catalog_transactions.py \
            tests/integration/test_notification_email_delivery.py \
            tests/integration/test_mongo_service_topology.py \
            tests/integration/test_initial_administrators.py \
            tests/integration/test_clinical_rule_transactions.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/transactions.xml').getroot()
          assert list(root.iter('testcase')), 'No transaction tests collected'
          assert not list(root.iter('skipped')), 'Required transaction coverage was skipped'
          PY
      - name: Remove disposable replica set
        if: always()
        run: docker rm -f transaction-mongo-27017 transaction-mongo-27018

  loadtest-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: requirements-load.txt
      - name: Install standalone load generator
        run: python -m pip install -r requirements-load.txt
      - name: Exercise load scenarios against synthetic HTTP service
        run: python tests/load/smoke_test.py

  python-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TESTING: "1"
      DEVELOPMENT: "0"
      SECRET_KEY: ci-test-secret-key
      INTERNAL_API_TOKEN: ci-test-internal-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Install native reporting libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - name: Install runtime test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/release/build_sdk.py --output-dir /tmp/coyote3-sdk
          python scripts/release/check_release.py \
            --production \
            --wheel /tmp/coyote3-sdk/coyote3-*.whl \
            --output /tmp/coyote3-sdk/release-record.json
          python -m pip install --no-deps /tmp/coyote3-sdk/coyote3-*.whl ./clients/python
      - name: Test API runtime
        run: PYTHONPATH=. python -m pytest -q tests/unit tests/api tests/integration --no-cov
      - name: Retain tested SDK artifact and release record
        uses: actions/upload-artifact@v4
        with:
          name: tested-coyote3-sdk
          path: /tmp/coyote3-sdk/

  lint-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TESTING: "1"
      DEVELOPMENT: "0"
      SECRET_KEY: ci-test-secret-key
      INTERNAL_API_TOKEN: ci-test-internal-token
      PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine validation scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          backend=false
          frontend=false
          docs=false
          label_only=false

          if [[ "$EVENT_NAME" == "pull_request" && \
                ( "$EVENT_ACTION" == "labeled" || "$EVENT_ACTION" == "unlabeled" ) ]]; then
            label_only=true
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            backend=true
            frontend=true
            docs=true
            git ls-files > /tmp/coyote3_changed_files.txt
          else
            base_sha="$PUSH_BASE_SHA"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base_sha="$PR_BASE_SHA"
            fi
            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || \
               ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              base_sha="$(git rev-parse HEAD^)"
            fi
            git diff --name-only "$base_sha" "$GITHUB_SHA" > /tmp/coyote3_changed_files.txt
          fi

          if [[ "$label_only" != "true" ]]; then
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/*)
                  backend=true
                  frontend=true
                  docs=true
                  ;;
                release.toml|api/version.py|config/*)
                  backend=true
                  frontend=true
                  docs=true
                  ;;
                src/coyote3/contracts/*|api/interfaces/http/*)
                  backend=true
                  frontend=true
                  ;;
                deploy/*|docker/*)
                  backend=true
                  frontend=true
                  docs=true
                  ;;
                scripts/docs/*|tests/docs/*|.markdownlint.json)
                  backend=true
                  docs=true
                  ;;
                src/*|api/*|clients/*|build_support.py|MANIFEST.in|tests/*|scripts/*|clinical_reporting_rules/*|demo_data/*|pyproject.toml|requirements*.txt|.coveragerc)
                  backend=true
                  ;;
                frontend/*)
                  frontend=true
                  ;;
                *.md|docs/*|mkdocs.yml|package.json|package-lock.json)
                  docs=true
                  ;;
              esac
            done < /tmp/coyote3_changed_files.txt
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          cat /tmp/coyote3_changed_files.txt
          echo "Validation scope: backend=$backend frontend=$frontend docs=$docs"

      - name: Sensitive data guard
        run: python3 scripts/quality/check_staged_sensitive_data.py --all-files

      - name: Require changelog entry
        if: github.event_name == 'pull_request' && !contains(env.PR_LABELS, 'skip-changelog-update')
        run: |
          if ! grep -Fxq "CHANGELOG.md" /tmp/coyote3_changed_files.txt; then
            echo "CHANGELOG.md must be updated for this pull request." >&2
            echo "Apply the skip-changelog-update label only for changes that have no release impact." >&2
            exit 1
          fi

      - name: Setup Python
        if: steps.scope.outputs.backend == 'true' || steps.scope.outputs.docs == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-docs.txt

      - name: Install backend quality dependencies
        if: steps.scope.outputs.backend == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --no-deps -e . -e clients/python

      - name: Install documentation dependencies
        if: steps.scope.outputs.docs == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Ruff check
        if: steps.scope.outputs.backend == 'true'
        run: PYTHONPATH=. ruff check src api tests scripts

      - name: Ruff format check
        if: steps.scope.outputs.backend == 'true'
        run: PYTHONPATH=. ruff format --check src api tests scripts

      - name: Strict type check
        if: steps.scope.outputs.backend == 'true'
        run: PYTHONPATH=. mypy

      - name: Audit Python runtime dependencies
        if: steps.scope.outputs.backend == 'true'
        # Dependency policy: docs/development/dependency-security.md
        run: pip-audit -r requirements.txt

      - name: Full backend tests and unified coverage
        if: steps.scope.outputs.backend == 'true'
        run: >-
          PYTHONPATH=. pytest -q tests/unit tests/api tests/integration
          --cov=api --cov=coyote3
          --cov-config=.coveragerc
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Clinical family coverage gates
        if: steps.scope.outputs.backend == 'true'
        run: >-
          PYTHON_BIN="$(command -v python)" PYTHONPATH=.
          bash scripts/quality/run_family_coverage_gates.sh --from-existing

      - name: Contract and repository checks
        if: steps.scope.outputs.backend == 'true'
        run: PYTHON_BIN="$(command -v python)" bash scripts/quality/check_contract_integrity.sh

      - name: Upload backend coverage report
        if: always() && steps.scope.outputs.backend == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Setup Node
        if: steps.scope.outputs.frontend == 'true' || steps.scope.outputs.docs == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install documentation lint tooling
        if: steps.scope.outputs.docs == 'true'
        run: npm ci --ignore-scripts

      - name: Lint repository Markdown
        if: steps.scope.outputs.docs == 'true'
        run: npm run docs:lint

      - name: Check Markdown lint runner and math rendering
        if: steps.scope.outputs.docs == 'true'
        run: npm run docs:test

      - name: Validate documentation links
        if: steps.scope.outputs.docs == 'true' && steps.scope.outputs.backend != 'true'
        run: python scripts/docs/check_markdown_links.py

      - name: Build documentation in strict mode
        if: steps.scope.outputs.docs == 'true'
        run: python -m mkdocs build --strict --site-dir /tmp/coyote3-docs-ci

      - name: Install frontend dependencies
        if: steps.scope.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Audit frontend runtime and build dependencies
        if: steps.scope.outputs.frontend == 'true'
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Frontend lint, unit coverage, and production build
        if: steps.scope.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm run lint
          npm run test:coverage
          npm run build

      - name: Cache Playwright browser
        if: steps.scope.outputs.frontend == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser and system dependencies
        if: steps.scope.outputs.frontend == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.scope.outputs.frontend == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Frontend browser route checks
        if: steps.scope.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload frontend coverage report
        if: always() && steps.scope.outputs.frontend == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 7

  container-scan:
    needs: python-runtime
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'security-scan'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the SDK wheel verified by runtime tests
        uses: actions/download-artifact@v4
        with:
          name: tested-coyote3-sdk
          path: /tmp/coyote3-sdk

      - name: Build API image for scanning
        run: >-
          docker build -f docker/Dockerfile --target coyote3_api
          --build-context sdk_artifact=/tmp/coyote3-sdk
          --build-arg GIT_COMMIT=${{ github.sha }} -t coyote3-api:scan .

      - name: Scan API image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: coyote3-api:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
