name: bootstrap-and-ingest-check

on:
  workflow_dispatch:
  schedule:
    # Monthly full-stack verification keeps runner use predictable for the
    # repository while still exercising bootstrap and ingest outside PR CI.
    - cron: "17 3 1 * *"

permissions:
  contents: read

concurrency:
  group: bootstrap-and-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COYOTE3_DB: coyote3_ci
      MONGO_ROOT_USERNAME: coyote3_root
      MONGO_ROOT_PASSWORD: ci-root-password
      MONGO_APP_USER: coyote3_app
      MONGO_APP_PASSWORD: ci-app-password
      MONGO_URI: mongodb://coyote3_app:ci-app-password@coyote3_stage_mongo:27017/coyote3_ci?authSource=coyote3_ci
      COYOTE3_PORT: "8005"
      SCRIPT_NAME: /coyote3_ci
      ADMIN_USERNAME: coyote3.admin
      ADMIN_EMAIL: admin@center.local
      ADMIN_PASSWORD: ci-admin-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare disposable storage and stage environment
        run: |
          mkdir -p \
            "$RUNNER_TEMP/coyote3/data" \
            "$RUNNER_TEMP/coyote3/logs" \
            "$RUNNER_TEMP/coyote3/mongo-data" \
            "$RUNNER_TEMP/coyote3/mongo-backups"
          cat > .coyote3_stage_env <<EOF
          ENV_NAME=staging
          COYOTE3_DB=${COYOTE3_DB}
          BAM_DB=BAM_Service
          ORGANIZATION_NAME=Coyote3 CI
          LOCAL_TIME_ZONE=UTC
          SECRET_KEY=ci-test-secret-key
          INTERNAL_API_TOKEN=ci-test-internal-token
          API_SESSION_SALT=ci-stage-session-salt
          PASSWORD_TOKEN_SALT=ci-stage-password-token-salt
          COYOTE3_PORT=${COYOTE3_PORT}
          SCRIPT_NAME=${SCRIPT_NAME}
          PUBLIC_BASE_URL=http://localhost:${COYOTE3_PORT}
          CORS_ORIGINS=http://localhost:${COYOTE3_PORT}
          MONGO_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
          MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
          MONGO_APP_USER=${MONGO_APP_USER}
          MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD}
          MONGO_URI=${MONGO_URI}
          COYOTE3_DATA_HOST_ROOT=${RUNNER_TEMP}/coyote3/data
          COYOTE3_LOGS_HOST_ROOT=${RUNNER_TEMP}/coyote3/logs
          COYOTE3_MONGO_DATA_HOST_ROOT=${RUNNER_TEMP}/coyote3/mongo-data
          COYOTE3_MONGO_BACKUP_HOST_ROOT=${RUNNER_TEMP}/coyote3/mongo-backups
          CACHE_ENABLED=1
          CACHE_REQUIRED=1
          API_WORKERS=1
          SESSION_COOKIE_SECURE=0
          API_SESSION_COOKIE_NAME=coyote3_ci_api_session
          AUTHENTICATION_PROVIDERS=local
          COYOTE3_INGEST_WATCH_ENABLED=0
          CELERY_WORKER_CONCURRENCY=1
          EOF

      - name: Start stage stack with disposable MongoDB
        run: |
          ./scripts/compose-with-version.sh \
            --env-file .coyote3_stage_env \
            -f deploy/compose/docker-compose.stage.yml \
            --with-mongo \
            up -d --build

      - name: Wait for proxied API health
        run: |
          health_url="http://localhost:${COYOTE3_PORT}${SCRIPT_NAME}/api/v1/health"
          for _ in $(seq 1 60); do
            if curl -fsS "$health_url" >/dev/null; then
              echo "API is healthy through the public proxy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time: $health_url" >&2
          exit 1

      - name: Create first bootstrap superuser
        run: |
          docker compose \
            --env-file .coyote3_stage_env \
            -f deploy/compose/docker-compose.stage.yml \
            --profile with-mongo \
            exec -T coyote3_stage_api \
            python scripts/bootstrap_local_admin.py \
              --mongo-uri "${MONGO_URI}" \
              --db "${COYOTE3_DB}" \
              --username "${ADMIN_USERNAME}" \
              --email "${ADMIN_EMAIL}" \
              --password "${ADMIN_PASSWORD}" \
              --role-id superuser \
              --assay-group hematology \
              --assay hema_gmsv1

      - name: Seed baseline collections
        run: |
          docker compose \
            --env-file .coyote3_stage_env \
            -f deploy/compose/docker-compose.stage.yml \
            --profile with-mongo \
            exec -T coyote3_stage_api \
            scripts/bootstrap_center_collections.sh \
              --api-base-url http://127.0.0.1:8001 \
              --username "${ADMIN_USERNAME}" \
              --password "${ADMIN_PASSWORD}" \
              --seed-file api/config/bootstrap/demo_center \
              --with-optional \
              --skip-existing

      - name: Run sample ingest check
        run: |
          docker compose \
            --env-file .coyote3_stage_env \
            -f deploy/compose/docker-compose.stage.yml \
            --profile with-mongo \
            exec -T coyote3_stage_api \
            scripts/center_check.sh \
              --api-base-url http://127.0.0.1:8001 \
              --username "${ADMIN_USERNAME}" \
              --password "${ADMIN_PASSWORD}" \
              --yaml-file demo_data/ingest/generic_case_control.yaml

      - name: Verify composed sample workflow
        run: |
          auth_json="$(docker compose \
            --env-file .coyote3_stage_env \
            -f deploy/compose/docker-compose.stage.yml \
            --profile with-mongo \
            exec -T coyote3_stage_api \
            python scripts/api_login.py \
              --base-url http://127.0.0.1:8001 \
              --mode password \
              --username "${ADMIN_USERNAME}" \
              --password "${ADMIN_PASSWORD}" \
              --print-token)"
          bearer_token="$(python3 -c \
            'import json, sys; print(json.loads(sys.argv[1])["session_token"])' \
            "$auth_json")"
          docker compose \
            --env-file .coyote3_stage_env \
            -f deploy/compose/docker-compose.stage.yml \
            --profile with-mongo \
            exec -T coyote3_stage_api \
            python scripts/verify_composed_workflow.py \
              --api-base-url http://127.0.0.1:8001 \
              --bearer-token "$bearer_token" \
              --sample-name seed_case

      - name: Rehearse disposable database backup and restore
        run: |
          mongo_container="$(docker compose \
            --env-file .coyote3_stage_env \
            -f deploy/compose/docker-compose.stage.yml \
            --profile with-mongo \
            ps -q coyote3_stage_mongo)"
          mongo_network="$(docker inspect \
            --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' \
            "$mongo_container")"
          backup_dir="${RUNNER_TEMP}/coyote3/mongo-backups"

          ./scripts/mongo_backup_archive.sh \
            --mongo-uri "${MONGO_URI}" \
            --db "${COYOTE3_DB}" \
            --out-dir "$backup_dir" \
            --label ci-rehearsal \
            --docker-network "$mongo_network"

          archive="$(find "$backup_dir" -maxdepth 1 -name '*.archive.gz' -print -quit)"
          test -n "$archive"
          ./scripts/mongo_restore_archive.sh \
            --mongo-uri "${MONGO_URI}" \
            --db "${COYOTE3_DB}" \
            --archive "$archive" \
            --drop \
            --confirm RESTORE_PATIENT_DATA \
            --docker-network "$mongo_network"

      - name: Verify sample workflow after restore
        run: |
          auth_json="$(docker compose \
            --env-file .coyote3_stage_env \
            -f deploy/compose/docker-compose.stage.yml \
            --profile with-mongo \
            exec -T coyote3_stage_api \
            python scripts/api_login.py \
              --base-url http://127.0.0.1:8001 \
              --mode password \
              --username "${ADMIN_USERNAME}" \
              --password "${ADMIN_PASSWORD}" \
              --print-token)"
          bearer_token="$(python3 -c \
            'import json, sys; print(json.loads(sys.argv[1])["session_token"])' \
            "$auth_json")"
          docker compose \
            --env-file .coyote3_stage_env \
            -f deploy/compose/docker-compose.stage.yml \
            --profile with-mongo \
            exec -T coyote3_stage_api \
            python scripts/verify_composed_workflow.py \
              --api-base-url http://127.0.0.1:8001 \
              --bearer-token "$bearer_token" \
              --sample-name seed_case

      - name: Capture logs and stop stack
        if: always()
        run: |
          docker compose \
            --env-file .coyote3_stage_env \
            -f deploy/compose/docker-compose.stage.yml \
            --profile with-mongo \
            logs --no-color > bootstrap_and_ingest_logs.txt 2>&1 || true
          docker compose \
            --env-file .coyote3_stage_env \
            -f deploy/compose/docker-compose.stage.yml \
            --profile with-mongo \
            down -v || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-and-ingest-failure-logs
          path: bootstrap_and_ingest_logs.txt
          if-no-files-found: warn
          retention-days: 3
